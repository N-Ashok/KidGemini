      if (currentMusic) { try { currentMusic.stop(); } catch (e2) {} currentMusic = null; }
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        var b = trimBounds(buf);
        src.loop = true;
        src.loopStart = b.start;
        src.loopEnd = b.end;
        var gain = context().createGain();
        gain.gain.value = 0.5;
        src.connect(gain);
        gain.connect(context().destination);
        src.start(0, b.start);
        currentMusic = src;
        handle.stop = function () { try { src.stop(); } catch (e3) {} if (currentMusic === src) currentMusic = null; };
      });
    } catch (e) { /* silent */ }
    return handle;
  };

                el.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    if (action.startsWith('move')) {
                        touchState[action] = true;

                    if (action.startsWith('move')) {
                        touchState[action] = false;
                    }

                el.addEventListener('pointerleave', (e) => {

            // Clear existing world
            while(worldObjects.children.length > 0){

                new Mesh(new BoxGeometry(1, 10, 200), wallMaterial), // East

            const numPlatforms = 25; // At least 20
            let lastPlatformPos = new Vector3(0, 0, 0);

            createPlatform(0, 0, 0, 5, 0.5, 5, platformMaterial);

            for (let i = 0; i < numPlatforms; i++) {

                    x = Math.random() * 80 - 40;
                    z = Math.random() * 80 - 40;
                    y = Math.random() * 5 + 0.5; // Random height between 0.5 and 5.5
                } while (new Vector3(x,y,z).distanceTo(lastPlatformPos) < 5); // Ensure some distance

        class Enemy {
            constructor(mesh, health, patrolPath, moveSpeed, type, scale, bboxSize, bboxOffset) {
                this.mesh = mesh;
                this.health = health;
                this.maxHealth = health;
                this.patrolPath = patrolPath;
                this.patrolIndex = 0;
                this.moveSpeed = moveSpeed;
                this.type = type;
                this.isDead = false;
                this.deathTimer = 0;
                this.scale = scale; // Store scale for bbox adjustment
                this.bbox = new Box3();
                this.bboxSize = bboxSize.clone();
                this.bboxOffset = bboxOffset.clone();
                this.updateBBox();

                this.mixer = null;
                if (mesh.animations && mesh.animations.length > 0) {
                    this.mixer = new AnimationMixer(mesh);
                    const walkClip = mesh.animations.find(a => /walk|run/i.test(a.name));
                    if (walkClip) {
                        this.mixer.clipAction(walkClip).play();
                    } else {
                        this.mixer.clipAction(mesh.animations[0]).play(); // Fallback to first animation
                    }
                }
            }

            updateBBox() {
                // Adjust bbox to be relative to the mesh's current position and scale
                // Assumes bboxSize is the 'unscaled' size and bboxOffset is 'unscaled' offset
                const scaledSize = this.bboxSize.clone().multiplyScalar(this.scale);
                this.bbox.min.copy(this.mesh.position).add(this.bboxOffset.clone().multiplyScalar(this.scale)).sub(scaledSize.clone().multiplyScalar(0.5));
                this.bbox.max.copy(this.mesh.position).add(this.bboxOffset.clone().multiplyScalar(this.scale)).add(scaledSize.clone().multiplyScalar(0.5));
            }

            takeDamage(amount) {
                this.health -= amount;
                playSound('hit');
                if (this.health <= 0 && !this.isDead) {
                    this.isDead = true;
                    this.deathTimer = 1.5; // Enemy vanishes after 1.5 seconds
                    this.mesh.material = new MeshStandardMaterial({ color: 0x888888, transparent: true, opacity: 0.5 }); // Gray out
                    // Drop collectible
                    createCollectible('coin', this.mesh.position.x, this.mesh.position.y + 0.5, this.mesh.position.z);
                    playSound('drop');
                }
            }

            update(delta) {
                if (this.isDead) {
                    this.deathTimer -= delta;
                    if (this.deathTimer <= 0) {
                        worldObjects.remove(this.mesh);
                        return true; // Mark for removal from enemies array
                    }
                    this.mesh.position.y -= delta * 0.5; // Sink
                    this.mesh.rotation.y += delta * 2; // Spin
                    if (this.mesh.material.opacity) {
                        this.mesh.material.opacity -= delta * 0.5;
                    }
                    return false;
                }

                if (this.mixer) {
                    this.mixer.update(delta);
                }

                if (this.patrolPath.length > 1) {
                    const target = this.patrolPath[this.patrolIndex];
                    const direction = new Vector3().subVectors(target, this.mesh.position).normalize();
                    this.mesh.position.add(direction.multiplyScalar(this.moveSpeed * delta));

                    // Face the direction of movement
                    const angle = Math.atan2(direction.x, direction.z);
                    this.mesh.rotation.y = angle;

                    if (this.mesh.position.distanceTo(target) < 0.5) {
                        this.patrolIndex = (this.patrolIndex + 1) % this.patrolPath.length;
                        // Generate a new random point for next patrol target
                        const newTarget = new Vector3(
                            this.patrolPath[0].x + (Math.random() * 10 - 5),
                            this.patrolPath[0].y + (Math.random() * 2 - 1),
                            this.patrolPath[0].z + (Math.random() * 10 - 5)
                        );
                        this.patrolPath[this.patrolIndex] = newTarget;
                    }
                }
                this.updateBBox();
                return false;
            }
        }

        // --- COMBAT SYSTEM ---
        function performPlayerAttack() {
            const currentWeapon = game.weapons[game.playerWeapons[game.activeWeaponIndex]];
            const playerForward = new Vector3();
            player.getWorldDirection(playerForward);
            playerForward.negate(); // Player is facing -Z, so negate to get forward

            const attackOrigin = player.position.clone().add(new Vector3(0, 1.5, 0)); // Attack from player chest height

            switch (currentWeapon.name) {
                case "Sword":
                    // Melee attack: check for enemies in a cone/sphere in front of player
                    enemies.forEach(enemy => {
                        if (enemy.isDead) return;
                        const enemyPos = enemy.mesh.position;
                        const distance = attackOrigin.distanceTo(enemyPos);
                        if (distance < 2) { // Within melee range
                            enemy.takeDamage(1);
                        }
                    });
                    break;
                case "Boomerang":
                    createProjectile('boomerang', attackOrigin, playerForward);
                    break;
                case "Bouncy Ball":
                    createProjectile('bouncyball', attackOrigin, playerForward);
                    break;
            }
        }

        function createProjectile(type, startPos, direction) {
            let projectileMesh;
            let speed = 20;
            let damage = 1;
            let lifetime = 2; // seconds
            let bboxSize = new Vector3(0.5, 0.5, 0.5);

            switch (type) {
                case 'boomerang':
                    // Using ConeGeometry as a placeholder for a boomerang shape
                    projectileMesh = new Mesh(new ConeGeometry(0.3, 1, 4), new MeshStandardMaterial({ color: 0xFF5722 }));
                    projectileMesh.rotation.x = Math.PI / 2; // Make it point forward
                    speed = 15;
                    lifetime = 1.5;
                    bboxSize.set(0.5, 0.5, 1);
                    break;
                case 'bouncyball':
                    projectileMesh = new Mesh(new SphereGeometry(0.5), new MeshStandardMaterial({ color: 0x03A9F4 }));
                    speed = 25;
                    lifetime = 3;
                    bboxSize.set(1, 1, 1);
                    break;
            }
            projectileMesh.position.copy(startPos);
            projectileMesh.userData = {
                type: 'projectile',
                velocity: direction.multiplyScalar(speed),
                damage: damage,
                lifetime: lifetime,
                bbox: new Box3(),
                bboxSize: bboxSize,
                bounceCount: type === 'bouncyball' ? 3 : 0, // Bouncy balls can bounce
            };
            projectileMesh.userData.bbox.setFromCenterAndSize(projectileMesh.position, projectileMesh.userData.bboxSize);
            projectiles.push(projectileMesh);
            worldObjects.add(projectileMesh);
            playSound('explosion'); // Projectile launch sound
        }


        // --- GAME LOOP ---
        function animate() {
            if (!on) return;
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05); // Cap delta to prevent teleportation on lag spikes

            if (game.state === 'playing') {
                // --- TIMER ---
                game.timeLeft -= delta;
                updateTimerUI();
                if (game.timeLeft <= 0) {
                    endGame('lose', "Time's Up!");
                    return;
                }

                // --- PLAYER PHYSICS & MOVEMENT ---
                if (player) {
                    playerDirection.set(0, 0, 0);
                    let isMoving = false;

                    const forwardVector = new Vector3(0, 0, -1).applyQuaternion(player.quaternion);
                    const rightVector = new Vector3(1, 0, 0).applyQuaternion(player.quaternion);

                    if (keyboardState['w'] || touchState.forward) {
                        playerDirection.add(forwardVector);
                        isMoving = true;
                    }
                    if (keyboardState['s'] || touchState.backward) {
                        playerDirection.sub(forwardVector);
                        isMoving = true;
                    }
                    if (keyboardState['a'] || touchState.left) {
                        playerDirection.sub(rightVector);
                        isMoving = true;
                    }
                    if (keyboardState['d'] || touchState.right) {
                        playerDirection.add(rightVector);
                        isMoving = true;
                    }
                    playerDirection.normalize();

                    const currentSpeed = playerSpeed * delta;
                    player.position.x += playerDirection.x * currentSpeed;
                    player.position.z += playerDirection.z * currentSpeed;

                    // Apply gravity
                    velocityY += gravity * delta;
                    player.position.y += velocityY * delta;

                    // Collision detection with platforms
                    let collidedWithGround = false;
                    const playerBBox = new Box3().setFromObject(player);
                    // Adjust playerBBox to be more accurate to player feet
                    const playerFeetOffset = new Vector3(0, -1.0, 0); // Approx. offset from model center to feet
                    playerBBox.min.add(playerFeetOffset);
                    playerBBox.max.add(playerFeetOffset);
                    playerBBox.min.x = player.position.x - 0.5; // Narrower for character
                    playerBBox.max.x = player.position.x + 0.5;
                    playerBBox.min.z = player.position.z - 0.5;
                    playerBBox.max.z = player.position.z + 0.5;


                    platforms.forEach(p => {
                        const platformBBox = p.bbox;
                        if (playerBBox.intersectsBox(platformBBox)) {
                            // Simple collision response: if falling and hit top, stop fall
                            if (velocityY < 0 && player.position.y + playerFeetOffset.y > platformBBox.max.y - 0.5) { // Check if player is above platform
                                player.position.y = platformBBox.max.y - playerFeetOffset.y;
                                velocityY = 0;
                                grounded = true;
                                collidedWithGround = true;
                            }
                            // If player moves into side of platform, push out slightly
                            if (player.position.y + playerFeetOffset.y < platformBBox.max.y - 0.2) { // If player is mostly at platform level
                                // Push player out of the platform
                                const playerCenter = playerBBox.getCenter(new Vector3());
                                const platformCenter = platformBBox.getCenter(new Vector3());
                                const penetration = new Vector3();
                                // This is a very simplified push-out. A more robust solution would be needed for complex collisions.
                                if (Math.abs(playerCenter.x - platformCenter.x) > Math.abs(playerCenter.z - platformCenter.z)) {
                                    penetration.x = playerCenter.x > platformCenter.x ? (platformBBox.max.x - playerBBox.min.x) : (platformBBox.min.x - playerBBox.max.x);
                                    player.position.x += penetration.x;
                                } else {
                                    penetration.z = playerCenter.z > platformCenter.z ? (platformBBox.max.z - playerBBox.min.z) : (platformBBox.min.z - playerBBox.max.z);
                                    player.position.z += penetration.z;
                                }
                            }
                        }
                    });

                    // If not collided with any platform, not grounded
                    if (!collidedWithGround) {
                        grounded = false;
                    }

                    // Reset canJump if grounded
                    if (grounded && !keyboardState[' ']) {
                        canJump = true;
                    }

                    // If space key pressed and canJump
                    if (keyboardState[' '] && canJump) {
                        handleJump();
                    }

                    // Update player animation mixer
                    if (playerMixer) {
                        playerMixer.update(delta);
                        if (isMoving && !game.isAttacking) {
                            playAnimation('sprint');
                        } else if (!isMoving && !game.isAttacking) {
                            playAnimation('idle');
                        }
                    }

                    // Camera follow
                    camera.position.copy(player.position);
                    camera.position.y += 2; // Camera slightly above player head
                    camera.position.z += 3; // Offset behind player
                    camera.lookAt(player.position.x, player.position.y + 1, player.position.z); // Look at player's head

                    // Attach camera to player group and update rotation separately
                    player.add(camera);
                    updateCameraRotation();
                }

                // --- MOVING PLATFORMS ---
                platforms.forEach(p => {
                    if (p.mesh.userData.isMoving) {
                        const { startPos, moveType, range, speed } = p.mesh.userData;
                        const time = clock.getElapsedTime() * speed;
                        if (moveType === 'horizontal') {
                            p.mesh.position.x = startPos.x + Math.sin(time) * range;
                        } else if (moveType === 'vertical') {
                            p.mesh.position.y = startPos.y + Math.sin(time) * range * 0.5; // Vertical range typically smaller
                        }
                        p.bbox.setFromObject(p.mesh); // Update bounding box for moving platform
                    }
                });

                // --- ENEMIES ---
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const enemy = enemies[i];
                    if (enemy.update(delta)) {
                        enemies.splice(i, 1);
                    }
                }

                // --- COLLECTIBLES ---
                for (let i = collectibles.length - 1; i >= 0; i--) {
                    const collectible = collectibles[i];
                    if (!collectible.parent) { // If already removed from scene
                         collectibles.splice(i, 1);
                         continue;
                    }
                    collectible.rotation.y += collectible.userData.spinSpeed * delta;
                    // Check for player collision with collectible
                    if (player && playerBBox.intersectsBox(new Box3().setFromObject(collectible))) {
                        collectible.userData.callback();
                        worldObjects.remove(collectible);
                        collectibles.splice(i, 1);
                    }
                }

                // --- PROJECTILES ---
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const projectile = projectiles[i];
                    if (!projectile.parent) { // If already removed from scene
                        projectiles.splice(i, 1);
                        continue;
                    }
                    projectile.position.add(projectile.userData.velocity.clone().multiplyScalar(delta));
                    projectile.userData.lifetime -= delta;
                    projectile.userData.bbox.setFromCenterAndSize(projectile.position, projectile.userData.bboxSize);

                    // Projectile collisions with enemies
                    let hitEnemy = false;
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        if (enemy.isDead) continue;
                        if (projectile.userData.bbox.intersectsBox(enemy.bbox)) {
                            enemy.takeDamage(projectile.userData.damage);
                            hitEnemy = true;
                            break;
                        }
                    }

                    // Projectile collisions with walls/platforms (for bouncy balls)
                    let bounced = false;
                    if (projectile.userData.bounceCount > 0) {
                        // Check ground collision
                        if (projectile.userData.bbox.intersectsBox(ground.geometry.boundingBox || new Box3().setFromObject(ground))) {
                            projectile.position.y = ground.position.y + ground.geometry.parameters.height + projectile.userData.bboxSize.y * 0.5;
                            projectile.userData.velocity.y *= -0.7; // Bounce off ground
                            projectile.userData.bounceCount--;
                            bounced = true;
                            playSound('drop');
                        }
                        // Check platform collisions
                        platforms.forEach(p => {
                            if (projectile.userData.bbox.intersectsBox(p.bbox)) {
                                // Simple bounce logic, not full physics
                                const projCenter = projectile.userData.bbox.getCenter(new Vector3());
                                const platformCenter = p.bbox.getCenter(new Vector3());
                                const normal = new Vector3();
                                if (projCenter.y > platformCenter.y && projectile.userData.velocity.y < 0) { // Hit top
                                    normal.set(0, 1, 0);
                                } else if (projCenter.y < platformCenter.y && projectile.userData.velocity.y > 0) { // Hit bottom
                                    normal.set(0, -1, 0);
                                } else if (Math.abs(projCenter.x - platformCenter.x) > Math.abs(projCenter.z - platformCenter.z)) { // Hit side X
                                    normal.set(projCenter.x > platformCenter.x ? 1 : -1, 0, 0);
                                } else { // Hit side Z
                                    normal.set(0, 0, projCenter.z > platformCenter.z ? 1 : -1);
                                }
                                projectile.userData.velocity.reflect(normal).multiplyScalar(0.7); // Reflect and lose energy
                                projectile.userData.bounceCount--;
                                bounced = true;
                                playSound('drop');
                            }
                        });
                    }

                    if (projectile.userData.lifetime <= 0 || hitEnemy || (type === 'boomerang' && !bounced && projectile.userData.bbox.min.y < -5)) {
                        worldObjects.remove(projectile);
                        projectiles.splice(i, 1);
                    }
                }

                // --- PLAYER HEALTH & COLLISIONS ---
                // Enemy collision (if player touches enemy)
                enemies.forEach(enemy => {
                    if (enemy.isDead) return;
                    if (player && playerBBox.intersectsBox(enemy.bbox)) {
                        takeDamage(1); // Player takes damage
                        // Push player back
                        const pushBack = new Vector3().subVectors(player.position, enemy.mesh.position).normalize().multiplyScalar(1);
                        player.position.add(pushBack);
                        // Prevent rapid damage from same enemy
                        enemy.isDamaging = true;
                        setTimeout(() => enemy.isDamaging = false, 1000);
                    }
                });

                // --- WIN / LOSE CONDITIONS ---
                // Check win condition (exit portal)
                if (player && exitPortal) {
                    const portalBBox = new Box3().setFromObject(exitPortal);
                    if (playerBBox.intersectsBox(portalBBox)) {
                        endGame('win', "You Reached the Portal!");
                    }
                }

                // Ensure player doesn't fall off the world
                if (player.position.y < -10) {
                    takeDamage(game.playerHealth); // Instant defeat for falling
                }
            }

            renderer.render(scene, camera);
        }

        // --- GAME FLOW ---
        function startGame() {
            game.state = 'playing';
            game.playerHealth = game.maxPlayerHealth;
            game.starsCollected = 0;
            game.timeLeft = 300;
            game.gameStartTime = clock.getElapsedTime(); // Mark start time for initial safety buffer

            updateHealthUI();
            updateStarsUI();
            updateTimerUI();
            setCurrentWeaponUI();
            mobileControls.classList.add('in-game'); // Enable mobile controls

            // Generate the chosen world
            generateWorld();

            // Load selected character
            loadModel(game.selectedCharacter).then(model => {
                if (model) {
                    player = model;
                    player.position.set(0, 1, 0); // Start position
                    player.scale.set(0.8, 0.8, 0.8);
                    worldObjects.add(player);

                    // Set up animations
                    playerMixer = new AnimationMixer(player);
                    player.animations.forEach(clip => {
                        const name = clip.name.toLowerCase();
                        if (name.includes('idle')) playerAnimations.idle = clip;
                        if (name.includes('run') || name.includes('sprint')) playerAnimations.sprint = clip;
                        if (name.includes('attack') || name.includes('interact')) playerAnimations.attack = clip;
                        // Add more if available and needed
                    });
                    playIdleAnimation(); // Start with idle animation

                    // Position camera correctly
                    player.add(camera);
                    camera.position.set(0, 2, 3); // Relative to player
                    camera.lookAt(0, 1, 0); // Look at player's head relative to player
                    updateCameraRotation(); // Initial camera setup
                } else {
                    // Fallback player if model fails to load
                    player = new Mesh(new CapsuleGeometry(0.5, 1.5, 4, 8), new MeshStandardMaterial({ color: 0x00ff00 }));
                    player.position.set(0, 1, 0);
                    worldObjects.add(player);
                    playerMixer = null; // No animations for fallback
                    player.add(camera);
                    camera.position.set(0, 2, 3);
                    camera.lookAt(0, 1, 0);
                    updateCameraRotation();
                }
                grounded = false; // Player spawns in air usually
                velocityY = 0; // Start with no velocity
            });

            playMusic('bg_loop_playful'); // Start background music
            animate(); // Start the game loop
        }

        function playIdleAnimation() {
            if (playerMixer && playerAnimations.idle) {
                const action = playerMixer.clipAction(playerAnimations.idle);
                action.setLoop(2200, Infinity); // Loop indefinitely
                action.reset().play();
            }
        }

        function playAnimation(name) {
            if (playerMixer && playerAnimations[name]) {
                const currentAction = playerMixer._actions.find(action => action.isRunning());
                const nextAction = playerMixer.clipAction(playerAnimations[name]);

                if (currentAction && currentAction !== nextAction) {
                    currentAction.fadeOut(0.2);
                    nextAction.reset().fadeIn(0.2).play();
                } else if (!currentAction) {
                    nextAction.reset().fadeIn(0.2).play();
                }
            }
        }


        function takeDamage(amount) {
            if (game.state !== 'playing') return;
            const now = clock.getElapsedTime();
            if (now - game.gameStartTime < 3) { // Invulnerability for first 3 seconds
                return;
            }
            if (player.userData.invincibleUntil > now) { // Invincibility after being hit
                return;
            }

            game.playerHealth -= amount;
            playSound('hit');
            updateHealthUI();
            player.userData.invincibleUntil = now + 1.5; // 1.5 seconds invincibility

            // Flash player to indicate damage
            const originalColor = player.material ? player.material.color.getHex() : 0x00ff00;
            if (player.material) player.material.color.set(0xff0000);
            setTimeout(() => {
                if (player && player.material) player.material.color.set(originalColor);
            }, 200);

            if (game.playerHealth <= 0) {
                endGame('lose', "Game Over!");
            }
        }

        function endGame(outcome, message) {
            game.state = outcome === 'win' ? 'win' : 'gameover';
            showGameMessage(message, 0); // Show indefinitely

            // Stop music and play relevant jingle
            stopAllMusic();
            if (outcome === 'win') {
                playSound('win');
            } else {
                playSound('game_over');
            }

            // Hide mobile controls
            mobileControls.classList.remove('in-game');
        }

        // Initially render to show selection screen
        renderer.render(scene, camera);
        // Start animation loop only after game starts
        // requestAnimationFrame(animate); // This will be called by startGame()
    </script>

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #87ceeb; /* Sky blue */
        }
        #scene {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* --- UI AND HUD --- */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            color: white;
            font-family: 'Comic Sans MS', 'Chalkduster', 'Marker Felt', sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #score { /* Required for high score tracking */
            font-size: 24px;
            font-weight: bold;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3em;
            font-weight: bold;
            color: white;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            pointer-events: none; /* Let clicks pass through */
        }
        /* --- ON-SCREEN CONTROLS --- */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            pointer-events: none; /* Let container handle events */
        }
        .control-cluster {
            display: grid;
            grid-template-areas: ". up ." "left . right" ". down .";
            gap: 8px;
            pointer-events: auto; /* Buttons are interactive */
        }
        .control-button {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            text-shadow: 1px 1px 2px #000;
            user-select: none;
        }
        #up-button { grid-area: up; }
        #left-button { grid-area: left; }
        #right-button { grid-area: right; }
        #down-button { grid-area: down; }
        #jump-button { width: 80px; height: 80px; background-color: rgba(96, 255, 96, 0.5); }
        #attack-button { width: 80px; height: 80px; background-color: rgba(255, 96, 96, 0.5); }
        .control-button.active {
            transform: scale(0.9);
            background-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    
    
    
    

    <canvas id="scene"></canvas>

    <!-- UI AND HUD -->
    <div id="hud">
        <div id="score">Opponents Left: 3</div>
    </div>
    <div id="message"></div>

    <!-- ON-SCREEN CONTROLS -->
    <div id="controls">
        <div class="control-cluster">
            <div id="up-button" class="control-button">▲</div>
            <div id="left-button" class="control-button">◀</div>
            <div id="right-button" class="control-button">▶</div>
            <div id="down-button" class="control-button">▼</div>
        </div>
        <div style="display: flex; gap: 20px; pointer-events: auto;">
             <div id="attack-button" class="control-button">⚔️</div>
             <div id="jump-button" class="control-button">🚀</div>
        </div>
    </div>

    <script type="module">
        // --- IMPORTS ---
        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, ConeGeometry, CylinderGeometry, PlaneGeometry, TorusGeometry, CapsuleGeometry, RingGeometry, Shape, ShapeGeometry, Doubleside, MeshStandardMaterial, MeshBasicMaterial, Mesh, AmbientLight, DirectionalLight, PointLight, HemisphereLight, AnimationMixer, Quaternion, Euler, Matrix4, Vector2, MathUtils, Raycaster, InstancedMesh } from "three";
        import { World, Body, Vec3, Box, Sphere, Plane, Cylinder, Quaternion as CQuaternion, Material, ContactMaterial } from "cannon-es";

        // --- GAME STATE & SETUP ---
        let on = true;
        const keys = { w: false, a: false, s: false, d: false, space: false, attack: false };
        let gameOver = false;
        let lastFrameTime = 0;
        const scoreElement = document.getElementById('score');
        const messageElement = document.getElementById('message');

        const scene = new Scene();
        scene.fog = new Fog(0x87ceeb, 50, 150);
        
        const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 20);
        
        const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const clock = new Clock();

        const characters = [];
        let player;

        // --- LIGHTING ---
        const ambientLight = new AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const directionalLight = new DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(10, 20, 5);
        scene.add(directionalLight);

        // --- PHYSICS WORLD ---
        const world = new World({ gravity: new Vec3(0, -20, 0) });
        const groundMaterial = new Material("ground");
        const playerMaterial = new Material("player");
        const contactMaterial = new ContactMaterial(groundMaterial, playerMaterial, { friction: 0.1, restitution: 0.2 });
        world.addContactMaterial(contactMaterial);

        // --- PLATFORM CREATION ---
        const platformGeometry = new BoxGeometry(1, 1, 1);
        const platformMaterial = new MeshStandardMaterial({ color: 0x88cc88 });

        const platformLayout = [
            // Main platform
            { x: 0, y: 0, z: 0, sx: 10, sy: 2, sz: 10 },
            // Bridges and islands
            { x: 10, y: -0.5, z: 0, sx: 6, sy: 1, sz: 2 },
            { x: 15, y: -0.5, z: 0, sx: 6, sy: 2, sz: 6 },
            { x: 0, y: -0.5, z: 10, sx: 2, sy: 1, sz: 6 },
            { x: 0, y: -0.5, z: 15, sx: 6, sy: 2, sz: 6 },
            { x: -10, y: -0.5, z: 0, sx: 6, sy: 1, sz: 2 },
            { x: -15, y: -0.5, z: 0, sx: 6, sy: 2, sz: 6 },
            // Upper level
            { x: 0, y: 5, z: -10, sx: 8, sy: 1, sz: 8 },
            { x: 0, y: 2.5, z: -6, sx: 2, sy: 5, sz: 2 }, // Ramp
        ];

        platformLayout.forEach(p => {
            const mesh = new Mesh(new BoxGeometry(p.sx, p.sy, p.sz), platformMaterial);
            mesh.position.set(p.x, p.y - p.sy / 2, p.z);
            scene.add(mesh);

            const body = new Body({
                mass: 0, // static
                shape: new Box(new Vec3(p.sx / 2, p.sy / 2, p.sz / 2)),
                position: new Vec3(p.x, p.y - p.sy / 2, p.z),
                material: groundMaterial
            });
            world.addBody(body);
        });

        // --- CHARACTER CLASS ---
        class Character {
            constructor(modelName, startPos, isPlayer = false) {
                this.isPlayer = isPlayer;
                this.modelName = modelName;
                this.startPos = new Vector3().copy(startPos);
                this.mesh = null;
                this.mixer = null;
                this.animations = {};
                this.action = 'idle';
                this.canJump = true;
                this.isGrounded = false;
                this.attackCooldown = 0;
                this.aiState = 'idle';
                this.aiTimer = 2; // Change state every 2 seconds
                this.bat = null;

                const shape = new Sphere(1); // Simplified collision shape
                this.body = new Body({
                    mass: 70,
                    position: new Vec3(startPos.x, startPos.y, startPos.z),
                    shape: shape,
                    material: playerMaterial,
                    fixedRotation: true,
                    linearDamping: 0.5
                });
                world.addBody(this.body);

                this.body.addEventListener("collide", (event) => {
                    const contactNormal = new Vec3();
                    event.contact.ni.negate(contactNormal);
                    if (contactNormal.y > 0.5) {
                        this.isGrounded = true;
                        this.canJump = true;
                    }
                });

                this.loadModels();
            }

            loadModels() {
                loadModel(this.modelName).then(model => {
                    if (!model) return;
                    this.mesh = model;
                    this.mesh.scale.set(1.2, 1.2, 1.2);
                    scene.add(this.mesh);

                    this.mixer = new AnimationMixer(this.mesh);
                    model.animations.forEach(clip => {
                        const name = clip.name.toLowerCase();
                        if (name.includes('sprint') || name.includes('run')) this.animations['run'] = this.mixer.clipAction(clip);
                        if (name.includes('idle')) this.animations['idle'] = this.mixer.clipAction(clip);
                        if (name.includes('emote-yes')) this.animations['attack'] = this.mixer.clipAction(clip);
                    });
                    this.setAnimation('idle');
                });

                loadModel('cricket_bat').then(batModel => {
                    if (!batModel) return;
                    this.bat = batModel;
                    this.bat.scale.set(15, 15, 15);
                    const arm = this.mesh?.getObjectByName("arm-right") || this.mesh;
                    if(arm) {
                        arm.add(this.bat);
                        this.bat.position.set(0.05, 0.05, 0.05);
                        this.bat.rotation.set(Math.PI / 2, 0, 0);
                    }
                });
            }

            setAnimation(name) {
                if (this.action === name || !this.mixer || !this.animations[name]) return;
                const currentAction = this.animations[this.action];
                const newAction = this.animations[name];
                
                if (currentAction) currentAction.fadeOut(0.2);
                newAction.reset().fadeIn(0.2).play();
                
                this.action = name;
            }
            
            attack() {
                if (this.attackCooldown <= 0 && this.mesh) {
                    playSound("hit");
                    this.attackCooldown = 1.0; // 1 second cooldown
                    if (this.animations['attack']) {
                        const attackAction = this.animations['attack'];
                        attackAction.reset().setLoop(1, 1).play();
                        if (this.action !== 'attack') {
                             this.animations[this.action]?.crossFadeTo(attackAction, 0.1, true);
                        }
                    }
                    
                    const attackPos = this.body.position;
                    const forward = new Vector3(0, 0, -1).applyQuaternion(this.mesh.quaternion);
                    
                    characters.forEach(other => {
                        if (other === this || !other.body) return;
                        const dist = attackPos.distanceTo(other.body.position);
                        if (dist < 3.0) {
                            const direction = new Vec3().copy(other.body.position).vsub(attackPos).unit();
                            // Check if other is in front
                            const dot = direction.dot(new Vec3(forward.x, forward.y, forward.z));
                            if (dot > 0.5) { // In a 90 degree cone in front
                                const impulse = direction.scale(1500); // More oomph!
                                other.body.applyImpulse(impulse);
                            }
                        }
                    });
                }
            }

            update(delta) {
                if (!this.mesh) return;

                // Sync mesh to physics body
                this.mesh.position.copy(this.body.position);
                this.mesh.position.y -= 1; // Center model over sphere body

                if (this.isPlayer) {
                    this.updatePlayer(delta);
                } else {
                    this.updateAI(delta);
                }
                
                if (this.mixer) this.mixer.update(delta);
                if (this.attackCooldown > 0) this.attackCooldown -= delta;

                // Check for falling off
                if (this.mesh.position.y < -20) {
                    this.destroy();
                }
            }
            
            updatePlayer(delta) {
                const moveSpeed = 10;
                const moveDirection = new Vector3();
                if (keys.w) moveDirection.z -= 1;
                if (keys.s) moveDirection.z += 1;
                if (keys.a) moveDirection.x -= 1;
                if (keys.d) moveDirection.x += 1;

                if (moveDirection.lengthSq() > 0) {
                    moveDirection.normalize();
                    const angle = Math.atan2(moveDirection.x, moveDirection.z);
                    this.mesh.quaternion.slerp(new Quaternion().setFromAxisAngle(new Vector3(0, 1, 0), angle), 0.2);

                    const velocity = new Vec3(moveDirection.x * moveSpeed, this.body.velocity.y, moveDirection.z * moveSpeed);
                    this.body.velocity.copy(velocity);
                    this.setAnimation('run');
                } else {
                    this.setAnimation('idle');
                }
                
                if (keys.space && this.canJump && this.isGrounded) {
                    playSound("jump");
                    this.body.velocity.y = 10;
                    this.canJump = false;
                    this.isGrounded = false;
                }
                
                if (keys.attack) {
                    this.attack();
                }
            }

            updateAI(delta) {
                this.aiTimer -= delta;
                if (this.aiTimer <= 0) {
                    this.aiTimer = Math.random() * 2 + 1; // 1-3 seconds
                    const states = ['idle', 'wander', 'chase', 'attack'];
                    const rand = Math.random();
                    if (rand < 0.3) this.aiState = 'idle';
                    else if (rand < 0.7) this.aiState = 'wander';
                    else if (rand < 0.9) this.aiState = 'chase';
                    else this.aiState = 'attack';
                }

                let target = null;
                if (this.aiState === 'chase' || this.aiState === 'attack') {
                     target = player.body.position;
                }
                
                if (target) {
                    const direction = new Vec3().copy(target).vsub(this.body.position);
                    const distance = direction.length();
                    direction.normalize();
                    
                    if (distance > 2) { // chase
                        this.setAnimation('run');
                        const angle = Math.atan2(direction.x, direction.z);
                        this.mesh.quaternion.slerp(new Quaternion().setFromAxisAngle(new Vector3(0, 1, 0), angle), 0.1);
                        this.body.velocity.x = direction.x * 7;
                        this.body.velocity.z = direction.z * 7;
                    } else if (this.aiState === 'attack') { // attack
                        this.setAnimation('idle');
                        const angle = Math.atan2(direction.x, direction.z);
                        this.mesh.quaternion.slerp(new Quaternion().setFromAxisAngle(new Vector3(0, 1, 0), angle), 0.1);
                        this.attack();
                    } else { // too close, idle
                         this.setAnimation('idle');
                    }
                } else { // wander or idle
                     if (this.aiState === 'wander') {
                         if (this.body.velocity.length() < 1) { // pick new direction
                             const angle = Math.random() * Math.PI * 2;
                             this.body.velocity.x = Math.sin(angle) * 5;
                             this.body.velocity.z = Math.cos(angle) * 5;
                         }
                         const angle = Math.atan2(this.body.velocity.x, this.body.velocity.z);
                         this.mesh.quaternion.slerp(new Quaternion().setFromAxisAngle(new Vector3(0, 1, 0), angle), 0.1);
                         this.setAnimation('run');
                     } else {
                         this.setAnimation('idle');
                     }
                }
            }

            destroy() {
                if (this.mesh) {
                    scene.remove(this.mesh);
                    this.mesh = null;
                }
                if (this.body) {
                    world.removeBody(this.body);
                    this.body = null;
                }
                const index = characters.indexOf(this);
                if (index > -1) {
                    characters.splice(index, 1);
                }
                updateScore();
            }
        }
        
        // --- CHARACTER INITIALIZATION ---
        function setupCharacters() {
            player = new Character('footballer', new Vector3(0, 5, 5), true);
            characters.push(player);
            characters.push(new Character('footballer_blue', new Vector3(5, 5, -5)));
            characters.push(new Character('mascot', new Vector3(-5, 5, -5)));
            characters.push(new Character('footballer_blue', new Vector3(0, 10, -12))); // On upper platform
        }
        setupCharacters();
        playMusic("bg_loop_playful");

        // --- GAME LOGIC & LOOP ---
        function updateScore() {
            const opponentsLeft = characters.length - 1;
            scoreElement.innerText = `Opponents Left: ${opponentsLeft}`;
            if (opponentsLeft <= 0 && !gameOver) {
                gameOver = true;
                messageElement.innerText = 'You Win!';
                playSound("jingle_win");
            }
        }

        function checkGameOver() {
            if (!characters.includes(player) && !gameOver) {
                gameOver = true;
                messageElement.innerText = 'Game Over';
                playSound("game_over");
            }
        }
        
        // --- CONTROLS ---
        function handleKeyDown(e) {
            e.preventDefault();
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
            if (e.key === ' ') keys.space = true;
            if (e.key === 'f') keys.attack = true;
        }
        function handleKeyUp(e) {
            e.preventDefault();
            if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
            if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
            if (e.key === ' ') keys.space = false;
            if (e.key === 'f') keys.attack = false;
        }
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        function setupButton(buttonId, keyName) {
            const button = document.getElementById(buttonId);
            const press = (e) => { e.preventDefault(); keys[keyName] = true; button.classList.add('active'); };
            const release = (e) => { e.preventDefault(); keys[keyName] = false; button.classList.remove('active'); };
            button.addEventListener('pointerdown', press);
            button.addEventListener('pointerup', release);
            button.addEventListener('pointerleave', release);
            button.addEventListener('touchstart', press, { passive: false });
            button.addEventListener('touchend', release);
        }
        setupButton('up-button', 'w');
        setupButton('down-button', 's');
        setupButton('left-button', 'a');
        setupButton('right-button', 'd');
        setupButton('jump-button', 'space');
        setupButton('attack-button', 'attack');

        // --- RESIZING ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);
        onWindowResize();

        // --- PAUSE/RESUME ON TAB VISIBILITY ---
        const setOn = (v) => { 
            if (v === on) return; on = v;
            if (v) { clock.getDelta(); requestAnimationFrame(animate); }
        };
        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        window.addEventListener('blur', () => setOn(false));
        window.addEventListener('focus', () => setOn(true));

        // --- MAIN LOOP ---
        function animate(now) {
            if (!on) return;
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.05);

            if (!gameOver) {
                world.step(1/60, delta, 3);
                
                for (let i = characters.length - 1; i >= 0; i--) {
                    characters[i].isGrounded = false; // Reset grounded state each frame
                }

                characters.forEach(char => char.update(delta));
                
                checkGameOver();
            }

            if (player && player.body) {
                camera.position.lerp(player.body.position.clone().add(new Vec3(0, 10, 15)), 0.05);
                camera.lookAt(player.body.position.clone().add(new Vec3(0, 2, 0)));
            }

            renderer.render(scene, camera);
        }

        // --- START GAME ---
        animate();
    </script>
</body>
</html>

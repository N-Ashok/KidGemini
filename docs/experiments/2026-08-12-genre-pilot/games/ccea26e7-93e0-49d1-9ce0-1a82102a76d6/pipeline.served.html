            const groundMaterial = new MeshStandardMaterial({ color: 0x6B8E23, flatShading: true }); // Olive green for grass
            const ground = new Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1; // Slightly below 0 to avoid z-fighting with runways
            scene.add(ground);

            const groundBody = new Body({ mass: 0 });
            groundBody.addShape(new Plane());
            groundBody.quaternion.setFromAxisAngle(new Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            // Runways
            const runwayMaterial = new MeshStandardMaterial({ color: 0x333333, flatShading: true }); // Dark grey
            airportConfig.runways.forEach(r => {
                const runwayGeometry = new BoxGeometry(r.length, 0.1, r.width);
                const runwayMesh = new Mesh(runwayGeometry, runwayMaterial);
                runwayMesh.position.copy(r.position);
                runwayMesh.rotation.y = r.rotationY;
                scene.add(runwayMesh);
                runwayMeshes.push(runwayMesh);

                const runwayBody = new Body({ mass: 0 });
                runwayBody.addShape(new Box(new Vec3(r.length / 2, 0.05, r.width / 2)));
                runwayBody.position.copy(r.position);
                runwayBody.quaternion.setFromAxisAngle(UP_VECTOR, r.rotationY);
                world.addBody(runwayBody);
            });

            // Taxiways
            const taxiwayMaterial = new MeshStandardMaterial({ color: 0x555555, flatShading: true }); // Lighter grey
            airportConfig.taxiways.forEach(t => {
                const length = t.start.distanceTo(t.end);
                const center = t.start.clone().lerp(t.end, 0.5);
                const angle = Math.atan2(t.end.x - t.start.x, t.end.z - t.start.z);

                const taxiwayGeometry = new BoxGeometry(t.width, 0.1, length);
                const taxiwayMesh = new Mesh(taxiwayGeometry, taxiwayMaterial);
                taxiwayMesh.position.set(center.x, center.y, center.z);
                taxiwayMesh.rotation.y = angle; // Rotate to connect start and end
                scene.add(taxiwayMesh);
                taxiwayMeshes.push(taxiwayMesh);

                const taxiwayBody = new Body({ mass: 0 });
                taxiwayBody.addShape(new Box(new Vec3(t.width / 2, 0.05, length / 2)));
                taxiwayBody.position.copy(taxiwayMesh.position);
                taxiwayBody.quaternion.setFromAxisAngle(UP_VECTOR, taxiwayMesh.rotation.y);
                world.addBody(taxiwayBody);
            });

            // Terminal
            loadModel("grandstand").then(model => {
                if (model) {
                    model.position.copy(airportConfig.terminal.position);
                    model.scale.set(0.5, 0.5, 0.5); // Adjust scale to fit
                    scene.add(model);
                } else {
                    const terminalGeometry = new BoxGeometry(airportConfig.terminal.size.x, airportConfig.terminal.size.y, airportConfig.terminal.size.z);
                    const terminalMaterial = new MeshStandardMaterial({ color: 0xD3D3D3 }); // Light grey
                    const terminalMesh = new Mesh(terminalGeometry, terminalMaterial);
                    terminalMesh.position.copy(airportConfig.terminal.position);
                    scene.add(terminalMesh);
                }
            });

            // Hangars
            airportConfig.hangars.forEach(h => {
                const hangarGeometry = new BoxGeometry(h.size.x, h.size.y, h.size.z);
                const hangarMaterial = new MeshStandardMaterial({ color: 0xA9A9A9 }); // Grey
                const hangarMesh = new Mesh(hangarGeometry, hangarMaterial);
                hangarMesh.position.copy(h.position);
                scene.add(hangarMesh);
            });

            // Control Tower
            loadModel("tower").then(model => {
                if (model) {
                    model.position.set(airportConfig.controlTower.position.x, 0, airportConfig.controlTower.position.z);
                    model.scale.set(0.5, 0.5, 0.5); // Adjust scale
                    scene.add(model);
                } else {
                    const towerBase = new BoxGeometry(20, airportConfig.controlTower.height * 0.8, 20);
                    const towerTop = new SphereGeometry(15, 16, 8);
                    const towerMaterial = new MeshStandardMaterial({ color: 0x778899 });
                    const towerMeshBase = new Mesh(towerBase, towerMaterial);
                    const towerMeshTop = new Mesh(towerTop, towerMaterial);
                    towerMeshBase.position.set(airportConfig.controlTower.position.x, airportConfig.controlTower.height * 0.4, airportConfig.controlTower.position.z);
                    towerMeshTop.position.set(airportConfig.controlTower.position.x, airportConfig.controlTower.height * 0.8 + 10, airportConfig.controlTower.position.z);
                    scene.add(towerMeshBase);
                    scene.add(towerMeshTop);
                }
            });
        }

        // Helper to create simple landing gear
        function createLandingGear(parentMesh) {
            const gearMaterial = new MeshStandardMaterial({ color: 0x888888 });
            const wheelMaterial = new MeshStandardMaterial({ color: 0x000000 });

            const gearGroup = new Group();
            parentMesh.add(gearGroup); // Attach gear to the plane

            const mainGearLeft = new CylinderGeometry(0.3, 0.3, 2, 8);
            const mainWheelLeft = new CylinderGeometry(0.5, 0.5, 0.3, 16);
            const mgL = new Mesh(mainGearLeft, gearMaterial);
            const mwL = new Mesh(mainWheelLeft, wheelMaterial);
            mgL.position.set(-2, -1.5, 0);
            mwL.position.set(-2, -2.5, 0);
            mwL.rotation.x = Math.PI / 2;
            gearGroup.add(mgL, mwL);

            const mainGearRight = new CylinderGeometry(0.3, 0.3, 2, 8);
            const mainWheelRight = new CylinderGeometry(0.5, 0.5, 0.3, 16);
            const mgR = new Mesh(mainGearRight, gearMaterial);
            const mwR = new Mesh(mainWheelRight, wheelMaterial);
            mgR.position.set(2, -1.5, 0);
            mwR.position.set(2, -2.5, 0);
            mwR.rotation.x = Math.PI / 2;
            gearGroup.add(mgR, mwR);

            const noseGear = new CylinderGeometry(0.2, 0.2, 1.5, 8);
            const noseWheel = new CylinderGeometry(0.4, 0.4, 0.3, 16);
            const ng = new Mesh(noseGear, gearMaterial);
            const nw = new Mesh(noseWheel, wheelMaterial);
            ng.position.set(0, -1, 4);
            nw.position.set(0, -1.7, 4);
            nw.rotation.x = Math.PI / 2;
            gearGroup.add(ng, nw);

            return [gearGroup]; // Return the group that contains all gear meshes
        }

        // Helper to create simple flaps
        function createFlaps(parentMesh) {
            const flapMaterial = new MeshStandardMaterial({ color: 0x666666, side: DoubleSide });

            const leftFlap = new BoxGeometry(0.5, 0.1, 2);
            const rightFlap = new BoxGeometry(0.5, 0.1, 2);

            const lfMesh = new Mesh(leftFlap, flapMaterial);
            lfMesh.position.set(-3, 0, -2); // Relative to plane body
            lfMesh.rotation.y = Math.PI / 8; // Slight initial angle
            lfMesh.visible = false; // Hidden when up

            const rfMesh = new Mesh(rightFlap, flapMaterial);
            rfMesh.position.set(3, 0, -2);
            rfMesh.rotation.y = -Math.PI / 8;
            rfMesh.visible = false;

            parentMesh.add(lfMesh, rfMesh);
            return [lfMesh, rfMesh];
        }

        // --- TAXIWAY GUIDANCE VISUAL ---
        function drawTaxiGuidance(path) {
            if (currentGuidanceLine) {
                scene.remove(currentGuidanceLine);
                currentGuidanceLine.geometry.dispose();
                currentGuidanceLine.material.dispose();
            }

            if (path.length < 2) return;

            const points = [];
            path.forEach(p => points.push(p.clone().add(new Vector3(0, 0.2, 0)))); // Slightly above ground
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0x00FF00, linewidth: 5 }); // Green glowing line
            currentGuidanceLine = new THREE.Line(geometry, material);
            scene.add(currentGuidanceLine);
        }

        function clearTaxiGuidance() {
            if (currentGuidanceLine) {
                scene.remove(currentGuidanceLine);
                currentGuidanceLine.geometry.dispose();
                currentGuidanceLine.material.dispose();
                currentGuidanceLine = null;
            }
        }

        // --- ATC SYSTEM ---
        function showATCMessage(message, duration = 5000) {
            atcMessageDiv.textContent = message;
            atcMessageDiv.style.display = 'block';
            atcMessageSaid = true;
            atcLastInstructionTime = Date.now();
            clearTimeout(atcMessageTimeout);
            atcMessageTimeout = setTimeout(() => {
                atcMessageDiv.style.display = 'none';
            }, duration);
            speak(message);
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.volume = 0.8;
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                speechSynthesis.speak(utterance);
            } else {
                console.warn("Speech synthesis not supported in this browser.");
            }
        }

        function checkATCCompliance(delta) {
            if (!currentATCMissionInstruction || atcMessageDiv.style.display === 'none') { // Only check if an instruction was given and is not on display
                // The instruction was given but player didn't look at it or it timed out
                // We need a proper way to check if an instruction is currently "active" for compliance.
                // For simplicity, let's say if the mission objective hasn't changed and enough time passed, it's a fail.
            }
            if (atcMessageSaid && (Date.now() - atcLastInstructionTime > ATC_INSTRUCTION_GRACE_PERIOD)) {
                // If player hasn't progressed mission and message has timed out, consider it a fail
                const currentMission = missions[currentMissionIndex];
                let complianceMet = false;
                // Add specific checks for each mission type
                if (currentMission.objective.type === "reachRunwayStart") {
                    const runwayStartPos = airportConfig.runways.find(r => r.id === currentMission.objective.runwayId).startPoint;
                    if (playerMesh.position.distanceTo(runwayStartPos) < 50) {
                        complianceMet = true; // Player is at runway start
                    }
                } else if (currentMission.objective.type === "takeoffAndClimb") {
                    if (playerState.altitude > currentMission.objective.altitude * 0.5) { // Check half way to altitude
                        complianceMet = true;
                    }
                }
                // ... add other mission types ...

                if (!complianceMet) {
                    atcInstructionFails++;
                    atcMessageSaid = false; // Reset for next check
                    console.log("ATC compliance failed! Fails:", atcInstructionFails);
                    if (atcInstructionFails >= MAX_ATC_FAILS) {
                        endGame("atc_fail");
                    } else {
                        showATCMessage("Player, please follow instructions. Repeat last instruction.", 3000);
                        // Re-issue current mission instruction
                        setTimeout(() => {
                            startMission(currentMissionIndex);
                        }, 3000);
                    }
                } else {
                    atcMessageSaid = false; // Player complied, reset
                }
            }
        }

        // --- GAME OVER / WIN ---
        function endGame(reason) {
            if (gameOver) return;
            gameOver = true;
            playSound("game_over");
            switch (reason) {
                case "crash":
                    gameOverMessage.textContent = "CRASH! Game Over! Careful out there!";
                    playSound("explosion");
                    break;
                case "atc_fail":
                    gameOverMessage.textContent = "ATC Instructions Failed! Game Over!";
                    break;
                case "win":
                    gameOverMessage.textContent = "Congratulations Pilot! You completed all missions!";
                    playSound("win");
                    break;
                default:
                    gameOverMessage.textContent = "Game Over!";
            }
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            gameOver = false;
            score = 0;
            currentMissionIndex = 0;
            atcInstructionFails = 0;
            scoreValueDisplay.textContent = score;
            gameOverScreen.style.display = 'none';
            playerState.speed = 0;
            playerState.throttle = 0;
            playerState.groundSteering = 0;
            playerState.yawControl = 0;
            playerState.isGrounded = true;
            playerState.isGearDown = true;
            playerState.flapsState = 0;
            playerState.isBraking = false;

            // Reset player body physics
            playerBody.velocity.set(0, 0, 0);
            playerBody.angularVelocity.set(0, 0, 0);
            playerBody.quaternion.set(0, 0, 0, 1); // Reset rotation

            // Update UI elements
            throttleSlider.value = 0;
            steeringSlider.value = 0;
            updateLandingGearVisuals();
            updateFlapsVisuals();

            // Clear any active guidance
            clearTaxiGuidance();
            currentATCMissionInstruction = null;
            atcMessageDiv.style.display = 'none';

            // Reset AI planes
            aiAircraft.forEach((ai, i) => {
                ai.body.position.copy(AI_SPAWN_POINTS[i]);
                ai.body.velocity.set(0, 0, 0);
                ai.body.angularVelocity.set(0, 0, 0);
                ai.body.quaternion.set(0, 0, 0, 1);
                ai.state = {
                    speed: 0, throttle: 0, heading: 0, isGrounded: true, isGearDown: true,
                    flapsState: 0, altitude: 0, targetPath: null, pathIndex: 0, state: "taxi"
                };
            });

            startMission(0); // Start the first mission
        }

        restartButton.addEventListener('pointerdown', (event) => {
            event.preventDefault(); // Prevent default touch behavior
            playSound("click");
            resetGame();
        });

        // --- MISSION MANAGEMENT ---
        function startMission(index) {
            if (index >= missions.length) {
                endGame("win");
                return;
            }
            currentMissionIndex = index;
            atcInstructionFails = 0; // Reset fails for new mission
            atcFailsDisplay.textContent = `${atcInstructionFails}/${MAX_ATC_FAILS}`;

            const mission = missions[currentMissionIndex];
            playerBody.position.copy(mission.startPosition);
            playerBody.quaternion.setFromAxisAngle(UP_VECTOR, mission.startRotationY);

            // Ensure player is grounded and gear is down at start of mission
            playerState.isGrounded = true;
            playerState.isGearDown = true;
            playerState.flapsState = 0;
            playerState.speed = 0;
            playerState.throttle = 0;
            throttleSlider.value = 0;

            updateLandingGearVisuals();
            updateFlapsVisuals();

            let atcText = "";
            if (typeof mission.instruction === 'function') {
                atcText = mission.instruction(...mission.instructionArgs);
            } else {
                atcText = ATC_MESSAGES[mission.instruction];
            }
            currentATCMissionInstruction = mission.instruction;
            showATCMessage(atcText);

            if (mission.objective.type === "reachRunwayStart") {
                const targetRunwayId = mission.objective.runwayId;
                const path = findTaxiPath(mission.startPosition, targetRunwayId + "_start");
                drawTaxiGuidance(path);
            } else {
                clearTaxiGuidance();
            }
            console.log("Mission Started:", mission.name);
        }

        function completeMission() {
            playSound("coin_pickup"); // Indicate success
            score += 100;
            scoreValueDisplay.textContent = score;
            showATCMessage(ATC_MESSAGES.missionComplete, 3000);
            clearTaxiGuidance();
            currentATCMissionInstruction = null;
            setTimeout(() => {
                startMission(currentMissionIndex + 1);
            }, 3500); // Small delay before next mission
        }

        function checkMissionObjective() {
            if (gameOver) return;
            const mission = missions[currentMissionIndex];
            if (!mission) return; // Should not happen

            const playerPos = playerBody.position;
            const playerRot = new THREE.Euler().setFromQuaternion(new THREE.Quaternion(playerBody.quaternion.x, playerBody.quaternion.y, playerBody.quaternion.z, playerBody.quaternion.w), 'YXZ');
            const playerHeadingDegrees = radiansToDegrees(playerRot.y < 0 ? playerRot.y + 2 * Math.PI : playerRot.y); // 0-360

            switch (mission.objective.type) {
                case "reachRunwayStart":
                    const runwayStartPos = airportConfig.runways.find(r => r.id === mission.objective.runwayId).startPoint;
                    if (playerPos.distanceTo(runwayStartPos) < 20) { // Within 20 meters
                        completeMission();
                    }
                    break;
                case "takeoffAndClimb":
                    if (playerState.airSpeed > playerState.takeoffSpeedThreshold * 1.2 && playerState.altitude > mission.objective.altitude * 0.9) {
                        completeMission();
                    }
                    break;
                case "reachAltitudeAndHeading":
                    // Check if player is near target altitude
                    const altAchieved = Math.abs(playerState.altitude - mission.objective.altitude) < 50;
                    // Check if player is near target heading
                    const headingDiff = Math.abs(playerHeadingDegrees - mission.objective.heading);
                    const headingAchieved = Math.min(headingDiff, 360 - headingDiff) < 10; // Within 10 degrees
                    if (altAchieved && headingAchieved) {
                        // For a duration based objective, start a timer or check cumulative time
                        // For simplicity, just check once for now
                        completeMission();
                    }
                    break;
                case "landSuccessfully":
                    // A complex objective: must be on runway, speed low, gear down, flaps down
                    const targetRunway = airportConfig.runways.find(r => r.id === mission.objective.runwayId);
                    if (targetRunway && playerState.isGrounded && playerPos.distanceTo(targetRunway.position) < targetRunway.length / 2 - 20) {
                        if (playerState.airSpeed < playerState.landingSpeedThreshold && playerState.isGearDown && playerState.flapsState === 2) {
                            completeMission();
                        }
                    }
                    break;
            }
        }

        // --- PLAYER CONTROLS ---
        // Throttle
        throttleSlider.addEventListener('input', () => {
            playerState.throttle = parseInt(throttleSlider.value);
        });

        // Steering (ground)
        steeringSlider.addEventListener('input', () => {
            playerState.groundSteering = parseFloat(steeringSlider.value);
        });
        steeringSlider.addEventListener('pointerup', () => { // Reset after release
            playerState.groundSteering = 0;
            steeringSlider.value = 0;
        });
        steeringSlider.addEventListener('touchend', () => { // Reset after release
            playerState.groundSteering = 0;
            steeringSlider.value = 0;
        });

        // Gear Toggle
        gearToggleButton.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            if (!gameOver) {
                playerState.isGearDown = !playerState.isGearDown;
                playSound("pop");
                updateLandingGearVisuals();
            }
        });

        function updateLandingGearVisuals() {
            if (playerLandingGearMeshes.length > 0) {
                playerLandingGearMeshes.forEach(mesh => {
                    mesh.visible = playerState.isGearDown;
                });
            }
            gearToggleButton.textContent = playerState.isGearDown ? 'GEAR UP' : 'GEAR DOWN';
            gearToggleButton.classList.toggle('active', playerState.isGearDown);
        }

        // Flaps Toggle
        flapsToggleButton.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            if (!gameOver) {
                playerState.flapsState = (playerState.flapsState + 1) % 3; // 0 -> 1 -> 2 -> 0
                playSound("pop");
                updateFlapsVisuals();
            }
        });

        function updateFlapsVisuals() {
            if (playerFlapMeshes.length > 0) {
                // Adjust rotation for flap deployment
                playerFlapMeshes[0].rotation.z = -playerState.flapsState * Math.PI / 6; // Left flap
                playerFlapMeshes[1].rotation.z = playerState.flapsState * Math.PI / 6;  // Right flap
                playerFlapMeshes.forEach(mesh => {
                    mesh.visible = playerState.flapsState > 0;
                });
            }
            flapsToggleButton.textContent = ['FLAPS UP', 'FLAPS HALF', 'FLAPS FULL'][playerState.flapsState];
            flapsToggleButton.classList.toggle('active', playerState.flapsState > 0);
        }

        // Brake Button
        brakeButton.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            if (!gameOver) {
                playerState.isBraking = true;
                brakeButton.classList.add('active');
            }
        });
        brakeButton.addEventListener('pointerup', (event) => {
            event.preventDefault();
            if (!gameOver) {
                playerState.isBraking = false;
                brakeButton.classList.remove('active');
            }
        });
        brakeButton.addEventListener('touchstart', (event) => {
            event.preventDefault();
            if (!gameOver) {
                playerState.isBraking = true;
                brakeButton.classList.add('active');
            }
        }, { passive: false });
        brakeButton.addEventListener('touchend', (event) => {
            event.preventDefault();
            if (!gameOver) {
                playerState.isBraking = false;
                brakeButton.classList.remove('active');
            }
        }, { passive: false });

        // Yaw Control (Air)
        yawLeftButton.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            if (!gameOver) playerState.yawControl = -1;
            yawLeftButton.classList.add('active');
        });
        yawLeftButton.addEventListener('pointerup', (event) => {
            event.preventDefault();
            playerState.yawControl = 0;
            yawLeftButton.classList.remove('active');
        });
        yawLeftButton.addEventListener('touchstart', (event) => {
            event.preventDefault();
            if (!gameOver) playerState.yawControl = -1;
            yawLeftButton.classList.add('active');
        }, { passive: false });
        yawLeftButton.addEventListener('touchend', (event) => {
            event.preventDefault();
            playerState.yawControl = 0;
            yawLeftButton.classList.remove('active');
        }, { passive: false });

        yawRightButton.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            if (!gameOver) playerState.yawControl = 1;
            yawRightButton.classList.add('active');
        });
        yawRightButton.addEventListener('pointerup', (event) => {
            event.preventDefault();
            playerState.yawControl = 0;
            yawRightButton.classList.remove('active');
        });
        yawRightButton.addEventListener('touchstart', (event) => {
            event.preventDefault();
            if (!gameOver) playerState.yawControl = 1;
            yawRightButton.classList.add('active');
        }, { passive: false });
        yawRightButton.addEventListener('touchend', (event) => {
            event.preventDefault();
            playerState.yawControl = 0;
            yawRightButton.classList.remove('active');
        }, { passive: false });


        // Camera Toggle
        cameraToggleButton.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            if (!gameOver) {
                currentCamera = (currentCamera === cockpitCamera) ? thirdPersonCamera : cockpitCamera;
                cameraToggleButton.textContent = (currentCamera === cockpitCamera) ? '3RD PERSON' : 'COCKPIT';
            }
        });

        // Keyboard Controls
        window.addEventListener('keydown', (event) => {
            if (gameOver) return;
            event.preventDefault(); // Prevent scrolling for arrow keys
            switch (event.key) {
                case 'ArrowUp':
                case 'w':
                    playerState.throttle = Math.min(100, playerState.throttle + 5);
                    throttleSlider.value = playerState.throttle;
                    break;
                case 'ArrowDown':
                case 's':
                    playerState.throttle = Math.max(0, playerState.throttle - 5);
                    throttleSlider.value = playerState.throttle;
                    break;
                case 'ArrowLeft':
                case 'a':
                    playerState.groundSteering = -1;
                    steeringSlider.value = -1;
                    break;
                case 'ArrowRight':
                case 'd':
                    playerState.groundSteering = 1;
                    steeringSlider.value = 1;
                    break;
                case 'g': // Gear
                    playerState.isGearDown = !playerState.isGearDown;
                    playSound("pop");
                    updateLandingGearVisuals();
                    break;
                case 'f': // Flaps
                    playerState.flapsState = (playerState.flapsState + 1) % 3;
                    playSound("pop");
                    updateFlapsVisuals();
                    break;
                case 'b': // Brake
                    playerState.isBraking = true;
                    brakeButton.classList.add('active');
                    break;
                case 'q': // Yaw left
                    playerState.yawControl = -1;
                    yawLeftButton.classList.add('active');
                    break;
                case 'e': // Yaw right
                    playerState.yawControl = 1;
                    yawRightButton.classList.add('active');
                    break;
                case 'c': // Change camera
                    currentCamera = (currentCamera === cockpitCamera) ? thirdPersonCamera : cockpitCamera;
                    cameraToggleButton.textContent = (currentCamera === cockpitCamera) ? '3RD PERSON' : 'COCKPIT';
                    break;
            }
        });

        window.addEventListener('keyup', (event) => {
            if (gameOver) return;
            switch (event.key) {
                case 'ArrowLeft':
                case 'a':
                case 'ArrowRight':
                case 'd':
                    playerState.groundSteering = 0;
                    steeringSlider.value = 0;
                    break;
                case 'b': // Brake
                    playerState.isBraking = false;
                    brakeButton.classList.remove('active');
                    break;
                case 'q':
                    playerState.yawControl = 0;
                    yawLeftButton.classList.remove('active');
                    break;
                case 'e':
                    playerState.yawControl = 0;
                    yawRightButton.classList.remove('active');
                    break;
            }
        });

        // --- GAME LOOP ---
        let lastTime = 0;
        const FIXED_FPS = 60;
        const FRAME_DURATION = 1000 / FIXED_FPS; // ms
        function animate(now) {
            if (!on || gameOver) {
                requestAnimationFrame(animate);
                return;
            }

            if (!lastTime) lastTime = now;
            const deltaTimeMs = now - lastTime;

            if (deltaTimeMs < FRAME_DURATION) {
                requestAnimationFrame(animate);
                return;
            }

            const delta = Math.min(deltaTimeMs / 1000, 0.05); // Cap delta to prevent large jumps
            lastTime = now;

            // Physics step
            world.step(1 / FIXED_FPS, delta, 3);

            // --- PLAYER MOVEMENT ---
            if (playerMesh && playerBody) {
                // Check if grounded (simple check for now: near Y=0)
                playerState.isGrounded = playerBody.position.y < 0.5 && playerBody.velocity.y < 0.1;

                // Apply throttle force
                const forwardVector = new Vec3();
                playerBody.quaternion.vmult(new Vec3(0, 0, 1), forwardVector); // Forward is +Z in model space
                const throttleForce = (playerState.throttle / 100) * AIRCRAFT_MAX_THROTTLE_FORCE;
                playerBody.applyForce(forwardVector.scale(throttleForce), playerBody.position);

                // Braking
                if (playerState.isBraking && playerState.isGrounded) {
                    const brakeForce = playerBody.velocity.clone().scale(-500 * delta); // Strong friction
                    playerBody.applyForce(brakeForce, playerBody.position);
                }

                // Air friction / Drag (always present)
                playerBody.velocity.scale(1 - AIRCRAFT_AIR_FRICTION_COEFF * delta);

                // Ground Friction (if grounded and not flying)
                if (playerState.isGrounded && playerState.airSpeed < playerState.takeoffSpeedThreshold) {
                    playerBody.velocity.x *= (1 - AIRCRAFT_GROUND_FRICTION_COEFF * delta);
                    playerBody.velocity.z *= (1 - AIRCRAFT_GROUND_FRICTION_COEFF * delta);
                }

                // Ground Steering
                if (playerState.isGrounded && playerState.airSpeed < playerState.takeoffSpeedThreshold * 1.5) { // Only steer on ground below takeoff speed
                    const currentAngularVelocityY = playerBody.angularVelocity.y;
                    const desiredAngularVelocityY = playerState.groundSteering * AIRCRAFT_STEER_RATE * (playerState.airSpeed / toKnots(AI_TAXI_SPEED + 5)); // Steer slower when speed is lower
                    playerBody.angularVelocity.y = MathUtils.lerp(currentAngularVelocityY, desiredAngularVelocityY, 0.1);
                } else if (!playerState.isGrounded && playerState.airSpeed > 10) { // Air Yaw control
                    const currentAngularVelocityY = playerBody.angularVelocity.y;
                    const desiredAngularVelocityY = playerState.yawControl * AIRCRAFT_YAW_RATE;
                    playerBody.angularVelocity.y = MathUtils.lerp(currentAngularVelocityY, desiredAngularVelocityY, 0.1);
                } else {
                    playerBody.angularVelocity.y = 0; // Stop turning if not actively steering/yawing
                }

                // Simplified Lift (only when flying)
                if (!playerState.isGrounded && playerState.airSpeed > 10) {
                    const liftForce = AIRCRAFT_LIFT_COEFF * playerState.airSpeed * playerState.airSpeed; // Lift increases with square of speed
                    // Flaps increase lift and drag
                    const flapEffect = playerState.flapsState * 0.2; // 0%, 20%, 40% additional lift/drag
                    playerBody.applyForce(new Vec3(0, liftForce + flapEffect * liftForce, 0), playerBody.position);
                    playerBody.velocity.scale(1 - AIRCRAFT_DRAG_COEFF * (1 + flapEffect) * delta); // Flaps increase drag
                }

                // Update player mesh position and rotation from physics body
                playerMesh.position.copy(playerBody.position);
                playerMesh.quaternion.copy(playerBody.quaternion);
            }

            // --- AI PLANE MOVEMENT ---
            aiAircraft.forEach(ai => {
                const aiMesh = ai.mesh;
                const aiBody = ai.body;
                const aiState = ai.state;

                if (!aiMesh || !aiBody) return; // Model might not be loaded yet

                // Grounding check for AI
                aiState.isGrounded = aiBody.position.y < 0.5 && aiBody.velocity.y < 0.1;

                // Update AI pathfinding
                if (aiState.targetPath && aiState.pathIndex < aiState.targetPath.length) {
                    const targetPoint = aiState.targetPath[aiState.pathIndex];
                    const distToTarget = aiBody.position.distanceTo(targetPoint);

                    if (distToTarget < 10) { // Reached current path point
                        aiState.pathIndex++;
                        if (aiState.pathIndex >= aiState.targetPath.length) {
                            aiState.targetPath = null; // Path complete
                            aiState.speed = 0;
                            console.log("AI plane reached destination.");
                        }
                    } else {
                        // Move towards target point
                        const direction = new Vec3().copy(targetPoint).vsub(aiBody.position).normalize();
                        aiBody.velocity.x = MathUtils.lerp(aiBody.velocity.x, direction.x * AI_TAXI_SPEED, 0.05);
                        aiBody.velocity.z = MathUtils.lerp(aiBody.velocity.z, direction.z * AI_TAXI_SPEED, 0.05);

                        // Orient towards target
                        const targetHeading = Math.atan2(direction.x, direction.z);
                        const currentHeading = new THREE.Euler().setFromQuaternion(aiBody.quaternion, 'YXZ').y;
                        let angleDiff = targetHeading - currentHeading;
                        if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
                        if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
                        aiBody.angularVelocity.y = MathUtils.lerp(aiBody.angularVelocity.y, angleDiff * 0.5, 0.1); // Adjust turn rate
                    }
                } else {
                    // If no path, keep it still for now
                    aiBody.velocity.set(0, 0, 0);
                    aiBody.angularVelocity.set(0,0,0);
                }

                // Apply AI's physics updates
                aiBody.velocity.scale(1 - AIRCRAFT_AIR_FRICTION_COEFF * delta);
                if (aiState.isGrounded) {
                    aiBody.velocity.x *= (1 - AIRCRAFT_GROUND_FRICTION_COEFF * delta);
                    aiBody.velocity.z *= (1 - AIRCRAFT_GROUND_FRICTION_COEFF * delta);
                }

                aiMesh.position.copy(aiBody.position);
                aiMesh.quaternion.copy(aiBody.quaternion);
            });


            // --- CRASH DETECTION ---
            if (!gameOver) {
                // Crash: excessive pitch/roll on ground/landing
                const MAX_TILT_DEGREES = 30;
                if ((playerState.isGrounded || playerState.altitude < 50) && (Math.abs(playerState.pitch) > MAX_TILT_DEGREES || Math.abs(playerState.roll) > MAX_TILT_DEGREES)) {
                    endGame("crash");
                }

                // Crash: off-runway for too long (need to define runway surfaces properly)
                // For now, simple check if too far from any runway center
                let onRunway = false;
                for (const runway of airportConfig.runways) {
                    const runwayCenter = runway.position;
                    const distToCenter = new Vector3(playerMesh.position.x, 0, playerMesh.position.z).distanceTo(runwayCenter);
                    if (distToCenter < runway.length / 2 + 10 && Math.abs(playerMesh.position.y) < 2) { // Within runway bounds and near ground
                        onRunway = true;
                        break;
                    }
                }
                // Need a timer for this condition, skipped for now to keep this short.
                // For now, if player collides with ground/objects at high speed, assume crash

                // Check for crash if player position drops significantly below ground
                if (playerBody.position.y < -5) { // Fell through ground
                    endGame("crash");
                }
            }


            // --- UI UPDATES ---
            updateHUD();
            checkMissionObjective();
            checkATCCompliance(delta);

            // Render the scene
            renderer.render(scene, currentCamera);

            requestAnimationFrame(animate);
        }

        // Initialize the game
        init();
    </script>

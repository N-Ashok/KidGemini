      chip.id = "ar-credits";
      chip.style.cssText = "position:fixed;left:8px;bottom:8px;z-index:99999;font:11px/1.4 system-ui,sans-serif;";
      var btn = document.createElement("button");
      btn.textContent = "\uD83C\uDFA8 art";
      btn.setAttribute("aria-label", "Art credits");
      btn.style.cssText = "border:0;border-radius:10px;padding:3px 8px;background:rgba(0,0,0,.45);color:#fff;cursor:pointer;font:inherit;";
      var panel = document.createElement("div");
      panel.style.cssText = "display:none;margin-top:4px;background:rgba(0,0,0,.75);color:#fff;border-radius:8px;padding:6px 10px;max-width:75vw;";
      for (var i = 0; i < credits.length; i++) {
        var c = credits[i], row = document.createElement("div");
        var a = document.createElement("a");
        a.href = c.sourceUrl; a.target = "_blank"; a.rel = "noopener";
        a.style.cssText = "color:#9cf;text-decoration:underline;";
        a.textContent = "\"" + c.name.replace(/_/g, " ") + "\" by " + c.author;
        row.appendChild(a);
        row.appendChild(document.createTextNode(" (CC BY 3.0)"));
        panel.appendChild(row);
      }
      btn.addEventListener("click", function () {
        panel.style.display = panel.style.display === "none" ? "block" : "none";
      });
      chip.appendChild(btn); chip.appendChild(panel);
      document.body.appendChild(chip);
    } catch (e) { /* credits must never break a game */ }
  }
  if (document.body) mount();
  else addEventListener("DOMContentLoaded", mount);
})();
</script>
  <title>3D Aeroplane Adventure</title>
  <style>

<body>




<canvas id="scene"></canvas>

<!-- UI & HUD -->
<div id="ui">
  <div id="info-panel">
    <div id="score">Speed: 0 km/h</div>
    <div id="message">Take off from the runway!</div>
  </div>
  
  <!-- ON-SCREEN CONTROLS -->
  <div id="controls">
    <div class="button-cluster left">
      <div id="gear-button" class="button">Landing<br>Gear</div>
      <div class="throttle-buttons">
          <div id="throttle-up" class="button">+</div>
          <div id="throttle-down" class="button">-</div>
      </div>
    </div>
    <div class="button-cluster right">
      <div id="joy-up" class="joy-button button">▲</div>
      <div id="joy-down" class="joy-button button">▼</div>
      <div id="joy-left" class="joy-button button">◀</div>
      <div id="joy-right" class="joy-button button">▶</div>
    </div>
  </div>
</div>

<!-- GAME OVER SCREEN -->
<div id="game-over-screen">
    <h1 id="end-title">Great Landing!</h1>
    <p id="end-message">You are a master pilot!</p>
    <button id="restart-button">Play Again</button>
</div>

<script type="module">
  // --- THREE.JS IMPORTS ---
  import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, CylinderGeometry, PlaneGeometry, DoubleSide, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight, Quaternion, Euler, MathUtils } from "three";
  
  // --- GAME STATE & SETUP ---
  const scene = new Scene();
  const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
  const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  scene.background = new Color(0x87CEEB);
  scene.fog = new Fog(0x87CEEB, 500, 1500);

  const clock = new Clock();
  let player, playerCollisionBox;
  let landingGearDown = true;
  let wheels = new Group();
  let gameOver = false;

  const scoreEl = document.getElementById('score');
  const messageEl = document.getElementById('message');
  
  let on = true;
  const setOn = (v) => { 
    if (v === on) return; 
    on = v;
    if (v) { 
      clock.getDelta(); // Reset delta on resume
      requestAnimationFrame(animate); 
    }
  };
  document.addEventListener('visibilitychange', () => setOn(!document.hidden));
  window.addEventListener('blur', () => setOn(false));
  window.addEventListener('focus', () => setOn(true));

  // --- LIGHTS ---
  const ambientLight = new AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);
  const dirLight = new DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(100, 100, 50);
  scene.add(dirLight);

  // --- GROUND & AIRPORT ---
  const ground = new Mesh(
    new PlaneGeometry(5000, 5000),
    new MeshStandardMaterial({ color: 0x3d85c6 }) // Water blue
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.5;
  scene.add(ground);

  const runway = new Mesh(
    new PlaneGeometry(40, 500),
    new MeshStandardMaterial({ color: 0x444444 })
  );
  runway.rotation.x = -Math.PI / 2;
  scene.add(runway);

  // --- PLAYER AEROPLANE ---
  const playerState = {
    speed: 0, // In abstract units
    maxSpeed: 250,
    minSpeed: 0,
    acceleration: 50,
    pitchSpeed: 0,
    rollSpeed: 0,
    yawSpeed: 0,
    turnRate: 1, // radians per second
    lift: 15,
  };
  
  function createPlaceholderPlayer() {
    const placeholder = new Mesh(
        new BoxGeometry(10, 2, 10),
        new MeshStandardMaterial({ color: 0xff0000, visible: false })
    );
    placeholder.position.set(0, 2, 220);
    return placeholder;
  }
  
  player = createPlaceholderPlayer();
  scene.add(player);
  playerCollisionBox = new Box3().setFromObject(player);
  
  // --- LANDING GEAR ---
  function createWheels() {
    const wheelGeo = new CylinderGeometry(0.5, 0.5, 0.5, 16);
    const wheelMat = new MeshStandardMaterial({ color: 0x222222 });
    const strutGeo = new CylinderGeometry(0.1, 0.1, 1, 8);
    const strutMat = new MeshStandardMaterial({ color: 0xaaaaaa });

    // Front wheel
    const frontWheel = new Mesh(wheelGeo, wheelMat);
    frontWheel.rotation.x = Math.PI / 2;
    const frontStrut = new Mesh(strutGeo, strutMat);
    frontStrut.position.set(0, -0.5, 4);
    frontStrut.add(frontWheel);
    wheels.add(frontStrut);
    
    // Back wheels
    for(let i = -1; i <= 1; i += 2) {
        const backWheel = new Mesh(wheelGeo, wheelMat);
        backWheel.rotation.x = Math.PI / 2;
        const backStrut = new Mesh(strutGeo, strutMat);
        backStrut.position.set(2 * i, -0.5, -2);
        backStrut.add(backWheel);
        wheels.add(backStrut);
    }
    player.add(wheels);
  }
  createWheels();
  
  // --- MODEL LOADING ---
  loadModel("airplane").then(model => {
    if (model) {
      scene.remove(player); // remove placeholder
      player = model;
      player.scale.set(3, 3, 3);
      player.position.set(0, 2, 220); // Start at the end of the runway
      player.rotation.y = Math.PI; // Face down the runway
      scene.add(player);
      player.add(wheels); // Re-attach wheels to the new model
      playerCollisionBox = new Box3().setFromObject(player);
    }
  });

  loadModel("radar").then(model => {
      if(model) {
        model.scale.set(5, 5, 5);
        model.position.set(30, 0, 100);
        scene.add(model);
      }
  });

  const buildingTypes = ["house", "shop", "office_building"];
  for (let i = 0; i < 20; i++) {
    const type = buildingTypes[Math.floor(Math.random() * buildingTypes.length)];
    loadModel(type).then(model => {
      if(model) {
        model.scale.set(8,8,8);
        const angle = Math.random() * Math.PI * 2;
        const radius = 200 + Math.random() * 300;
        model.position.set(Math.sin(angle) * radius, 0, Math.cos(angle) * radius);
        model.rotation.y = Math.random() * Math.PI * 2;
        scene.add(model);
      }
    });
  }

  // --- CONTROLS ---
  const keys = {};
  document.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
    }
  });
  document.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  function handlePointer(selector, callback) {
    const el = document.querySelector(selector);
    let interval;
    const start = (e) => {
      e.preventDefault();
      playSound('click');
      if (interval) clearInterval(interval);
      interval = setInterval(callback, 20);
    };
    const end = (e) => {
      e.preventDefault();
      clearInterval(interval);
    };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointerleave', end);
  }

  handlePointer('#throttle-up', () => keys['ShiftLeft'] = true);
  handlePointer('#throttle-down', () => keys['ControlLeft'] = true);
  handlePointer('#joy-up', () => keys['ArrowDown'] = true); // Inverted controls
  handlePointer('#joy-down', () => keys['ArrowUp'] = true); // Inverted controls
  handlePointer('#joy-left', () => keys['ArrowLeft'] = true);
  handlePointer('#joy-right', () => keys['ArrowRight'] = true);
  
  document.getElementById('gear-button').addEventListener('pointerdown', () => {
    playSound('click');
    toggleLandingGear();
  });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'KeyG') toggleLandingGear();
  });

  // --- PLAYER MOVEMENT ---
  function updatePlayer(delta) {
    if (gameOver) return;
    
    // Throttle
    if (keys['ShiftLeft'] || keys['KeyW']) playerState.speed += playerState.acceleration * delta;
    if (keys['ControlLeft'] || keys['KeyS']) playerState.speed -= playerState.acceleration * delta;
    playerState.speed = Math.max(playerState.minSpeed, Math.min(playerState.speed, playerState.maxSpeed));

    // Pitch (Up/Down) - inverted
    if (keys['ArrowDown'] || keys['KeyI']) playerState.pitchSpeed = MathUtils.lerp(playerState.pitchSpeed, -playerState.turnRate, 2 * delta);
    else if (keys['ArrowUp'] || keys['KeyK']) playerState.pitchSpeed = MathUtils.lerp(playerState.pitchSpeed, playerState.turnRate, 2 * delta);
    else playerState.pitchSpeed = MathUtils.lerp(playerState.pitchSpeed, 0, 4 * delta);
    
    // Roll (Left/Right)
    if (keys['ArrowLeft'] || keys['KeyA']) playerState.rollSpeed = MathUtils.lerp(playerState.rollSpeed, playerState.turnRate, 2 * delta);
    else if (keys['ArrowRight'] || keys['KeyD']) playerState.rollSpeed = MathUtils.lerp(playerState.rollSpeed, -playerState.turnRate, 2 * delta);
    else playerState.rollSpeed = MathUtils.lerp(playerState.rollSpeed, 0, 4 * delta);
    
    // Yaw (less sensitive turning)
    if (keys['KeyQ']) playerState.yawSpeed = MathUtils.lerp(playerState.yawSpeed, playerState.turnRate * 0.5, 2 * delta);
    else if (keys['KeyE']) playerState.yawSpeed = MathUtils.lerp(playerState.yawSpeed, -playerState.turnRate * 0.5, 2 * delta);
    else playerState.yawSpeed = MathUtils.lerp(playerState.yawSpeed, 0, 4 * delta);

    const speedRatio = playerState.speed / playerState.maxSpeed;
    const turnFactor = Math.max(0.1, speedRatio);

    const q = new Quaternion();
    q.setFromAxisAngle(new Vector3(1, 0, 0), playerState.pitchSpeed * delta * turnFactor);
    player.quaternion.multiply(q);
    q.setFromAxisAngle(new Vector3(0, 0, 1), playerState.rollSpeed * delta * turnFactor);
    player.quaternion.multiply(q);
    q.setFromAxisAngle(new Vector3(0, 1, 0), playerState.yawSpeed * delta * turnFactor);
    player.quaternion.multiply(q);

    // Gravity and Lift
    let gravity = 9.8;
    const forwardVec = new Vector3(0, 0, 1).applyQuaternion(player.quaternion);
    const upVec = new Vector3(0, 1, 0).applyQuaternion(player.quaternion);

    let liftForce = speedRatio * playerState.lift * Math.max(0, upVec.y);
    player.position.y += (liftForce - gravity) * delta;

    // Forward Movement
    const moveVec = new Vector3(0, 0, 1).applyQuaternion(player.quaternion);
    player.position.add(moveVec.multiplyScalar(playerState.speed * delta));

    // Collision Detection
    const grounded = player.position.y <= 0;
    if (grounded) {
        player.position.y = 0;

        const crashSpeed = 80;
        const landingSpeed = 50;

        if (speedRatio * playerState.maxSpeed > crashSpeed || !landingGearDown) {
            endGame(false, "You crashed! Try to land slower with your gear down.");
        } else if (speedRatio * playerState.maxSpeed < landingSpeed && landingGearDown) {
            playerState.speed *= 0.95; // Apply brakes
            if (playerState.speed < 1) {
                playerState.speed = 0;
                endGame(true, "Perfect landing! You're a pro pilot!");
            }
        }
    }
    
    // Reset keys for single-press actions
    keys['ShiftLeft'] = keys['ControlLeft'] = keys['ArrowUp'] = keys['ArrowDown'] = keys['ArrowLeft'] = keys['ArrowRight'] = false;
  }
  
  // --- LANDING GEAR LOGIC ---
  function toggleLandingGear() {
    if (gameOver) return;
    landingGearDown = !landingGearDown;
    messageEl.textContent = `Landing Gear ${landingGearDown ? 'DOWN' : 'UP'}`;
    document.getElementById('gear-button').style.backgroundColor = landingGearDown ? 'rgba(0, 200, 80, 0.7)' : 'rgba(200, 80, 0, 0.7)';
  }

  // --- CAMERA ---
  function updateCamera() {
    const idealOffset = new Vector3(0, 5, -20);
    idealOffset.applyQuaternion(player.quaternion);
    idealOffset.add(player.position);

    camera.position.lerp(idealOffset, 0.05);
    camera.lookAt(player.position.x, player.position.y + 2, player.position.z);
  }

  // --- SCORING & UI ---
  function updateUI() {
    if (gameOver) return;
    const displaySpeed = Math.round((playerState.speed / playerState.maxSpeed) * 500);
    scoreEl.textContent = `Speed: ${displaySpeed} km/h`;

    if(displaySpeed > 450) playSound('whoosh');

    let landingAltitude = 50;
    if (player.position.y < landingAltitude && player.position.y > 1 && !landingGearDown) {
        messageEl.textContent = 'Lower landing gear for landing!';
        messageEl.style.color = 'yellow';
    } else if (messageEl.textContent.startsWith('Lower')) {
        messageEl.textContent = '';
        messageEl.style.color = 'white';
    }
  }
  
  // --- GAME OVER & RESTART ---
  function endGame(win, message) {
    if (gameOver) return;
    gameOver = true;
    
    const screen = document.getElementById('game-over-screen');
    document.getElementById('end-title').textContent = win ? "Great Landing!" : "Game Over";
    document.getElementById('end-message').textContent = message;
    screen.style.display = 'flex';

    if (win) {
        playSound('win');
    } else {
        playSound('game_over');
    }
  }
  
  document.getElementById('restart-button').addEventListener('click', () => {
      window.location.reload();
  });

  // --- RESPONSIVE RESIZE ---
  function onWindowResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onWindowResize);
  
  // --- RENDER LOOP ---
  function animate() {
    if (!on) return;
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    
    updatePlayer(delta);
    updateCamera();
    updateUI();
    
    // Landing gear animation
    wheels.position.y = MathUtils.lerp(wheels.position.y, landingGearDown ? 0 : 1.5, 5 * delta);

    renderer.render(scene, camera);
  }
  
  // --- START GAME ---
  onWindowResize();
  playMusic('bg_loop_dreamy');
  animate();

</script>
</body>

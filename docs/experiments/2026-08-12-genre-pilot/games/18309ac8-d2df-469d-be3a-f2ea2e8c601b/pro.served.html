            overflow: hidden;
            background-color: #111;
            color: white;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
        }

        /* --- GAME CANVAS --- */
        #scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- ON-SCREEN UI --- */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Let clicks pass through to the game */
        }
        
        #top-bar {
            padding: 15px;
            text-align: center;
        }
        
        #score {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 5px black, 0 0 10px black;
        }
        
        #instructions {
            font-size: 1rem;
            opacity: 0.8;
            margin-top: 5px;
            text-shadow: 0 0 5px black;
        }
        
        #controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding: 10px;
            padding-bottom: max(12px, env(safe-area-inset-bottom)); /* Safe area for phone notches */
            box-sizing: border-box;
            pointer-events: auto; /* Buttons are clickable */
        }

        /* --- CONTROL BUTTONS --- */
        .control-button {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: bold;
            user-select: none; /* Prevent text selection on hold */
            -webkit-user-select: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .control-button.large {
            width: 100px;
            height: 100px;
            font-size: 1.5rem;
        }

        .d-pad {
            display: grid;
            grid-template-areas: ". up ." "left . right" ". down .";
            gap: 10px;
            width: 200px;
            height: 200px;
        }

        .d-pad .control-button { width: 60px; height: 60px; font-size: 2rem; }
        #up-btn { grid-area: up; }
        #left-btn { grid-area: left; }
        #right-btn { grid-area: right; }
        #down-btn { grid-area: down; }
    </style>
</head>
<body>
    
    
    

    <!-- GAME CANVAS -->
    <canvas id="scene"></canvas>

    <!-- ON-SCREEN UI -->
    <div id="ui">
        <div id="top-bar">
            <!-- SCORING -->
            <div id="score">0</div>
            <div id="instructions">Move with Arrow Keys/WASD. Tap buttons on screen to move & teleport!</div>
        </div>
        
        <!-- ON-SCREEN CONTROLS -->
        <div id="controls">
            <div class="d-pad">
                <div id="up-btn" class="control-button">▲</div>
                <div id="left-btn" class="control-button">◀</div>
                <div id="right-btn" class="control-button">▶</div>
                <div id="down-btn" class="control-button">▼</div>
            </div>
            <div id="teleport-btn" class="control-button large">Zap!</div>
        </div>
    </div>

    <script type="module">
        // --- 3D ENGINE IMPORTS ---
        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, Euler, Matrix4, MathUtils, SphereGeometry, MeshBasicMaterial, IcosahedronGeometry, TorusGeometry } from "three";

        // --- GAME WORLD SETUP ---
        const scene = new Scene();
        scene.background = new Color(0x1a0530); // Deep purple sky
        scene.fog = new Fog(scene.background, 20, 100);

        const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const clock = new Clock();

        // --- LIGHTING ---
        const ambientLight = new AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // --- GROUND & SCENERY ---
        const ground = new Group();
        const groundMaterial = new MeshBasicMaterial({ color: 0x330867 });
        for (let i = 0; i < 20; i++) {
            const tile = new Mesh(new IcosahedronGeometry(MathUtils.randFloat(5, 20), 0), groundMaterial);
            tile.position.set(
                MathUtils.randFloatSpread(150),
                MathUtils.randFloat(-40, -10),
                MathUtils.randFloatSpread(150)
            );
            tile.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            ground.add(tile);
        }
        scene.add(ground);

        // --- PLAYER SETUP ---
        let player = new Group(); // Placeholder group
        player.position.set(0, 1, 0);
        scene.add(player);
        
        let playerModel = null;
        let playerMixer = null;
        const playerSpeed = 10;
        const playerVelocity = new Vector3();

        const playerBody = new Mesh(new SphereGeometry(1, 8, 8)); // Invisible collision shape
        player.add(playerBody);

        // --- PLAYER MODEL LOADING ---
        // We'll use the Ninja as a stand-in for Spider-Man!
        loadModel("ninja").then(model => {
            if (model) {
                player.remove(playerBody); // Remove simple shape
                playerModel = model;
                playerModel.scale.set(1.5, 1.5, 1.5);
                playerModel.traverse(child => {
                    if (child.isMesh) {
                        child.material.color.set(0xff0000); // Make him red!
                        child.material.metalness = 0.2;
                        child.material.roughness = 0.8;
                    }
                });
                player.add(playerModel);
                playerMixer = new AnimationMixer(playerModel);
                // Start with idle, switch to run when moving
                const idleClip = playerModel.animations.find(a => /idle/i.test(a.name));
                if (idleClip) playerMixer.clipAction(idleClip).play();
            }
        });

        // --- ENEMY SETUP ---
        let enemies = [];
        const enemyModels = ["zombie", "businessman", "police_officer", "soldier"];
        let score = 0;
        const scoreElement = document.getElementById('score');

        function spawnEnemy() {
            if (enemies.length >= 15) return; // Max enemies on screen
            
            const enemy = {
                object: new Group(),
                model: null,
                mixer: null,
                speed: MathUtils.randFloat(2, 4 + score * 0.1),
                isHit: false,
                hitTimer: 0,
                collider: new Box3()
            };

            const angle = Math.random() * Math.PI * 2;
            const radius = MathUtils.randFloat(30, 50);
            enemy.object.position.set(
                player.position.x + Math.sin(angle) * radius,
                1,
                player.position.z + Math.cos(angle) * radius
            );
            
            // Temporary shape while model loads
            const placeholder = new Mesh(new SphereGeometry(1), new MeshBasicMaterial({color: 0x00ff00, wireframe: true}));
            enemy.object.add(placeholder);

            scene.add(enemy.object);
            enemies.push(enemy);

            const modelName = enemyModels[Math.floor(Math.random() * enemyModels.length)];
            loadModel(modelName).then(model => {
                if(model && enemy.object.parent) { // Check if still in scene
                    enemy.object.remove(placeholder);
                    enemy.model = model;
                    enemy.model.scale.set(1.5, 1.5, 1.5);
                    enemy.object.add(enemy.model);
                    enemy.mixer = new AnimationMixer(enemy.model);
                    const runClip = enemy.model.animations.find(a => /run|sprint/i.test(a.name)) || enemy.model.animations[0];
                    if (runClip) enemy.mixer.clipAction(runClip).play();
                }
            });
        }

        // --- CONTROLS ---
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
        });
        document.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function handlePointer(elementId, keyCodes) {
            const button = document.getElementById(elementId);
            const press = (e) => { e.preventDefault(); keyCodes.forEach(k => keys[k] = true); };
            const release = (e) => { e.preventDefault(); keyCodes.forEach(k => keys[k] = false); };
            button.addEventListener('pointerdown', press);
            button.addEventListener('pointerup', release);
            button.addEventListener('pointerleave', release);
            button.addEventListener('touchstart', press, { passive: false });
            button.addEventListener('touchend', release);
            button.addEventListener('touchcancel', release);
        }

        handlePointer('up-btn', ['ArrowUp', 'KeyW']);
        handlePointer('down-btn', ['ArrowDown', 'KeyS']);
        handlePointer('left-btn', ['ArrowLeft', 'KeyA']);
        handlePointer('right-btn', ['ArrowRight', 'KeyD']);
        handlePointer('teleport-btn', ['Space']);
        
        // --- TELEPORT POWER ---
        const teleportCooldown = 1.0;
        let teleportTimer = 0;
        const teleportParticles = [];

        function doTeleport() {
            if (teleportTimer > 0) return;
            teleportTimer = teleportCooldown;
            playSound("laser");
            
            // Create a flash effect
            const flash = new Mesh(
                new IcosahedronGeometry(2, 2),
                new MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.8 })
            );
            flash.position.copy(player.position);
            scene.add(flash);
            teleportParticles.push({mesh: flash, timer: 0.2});

            // Find nearest enemy to teleport to
            let nearestEnemy = null;
            let minDistance = Infinity;
            
            enemies.forEach(enemy => {
                if (!enemy.isHit) {
                    const dist = player.position.distanceTo(enemy.object.position);
                    if (dist < minDistance) {
                        minDistance = dist;
                        nearestEnemy = enemy;
                    }
                }
            });

            if (nearestEnemy) {
                // Zap! Teleport behind the enemy
                const dir = new Vector3().subVectors(player.position, nearestEnemy.object.position).normalize();
                player.position.copy(nearestEnemy.object.position).add(dir.multiplyScalar(2));

                // Hit the enemy!
                nearestEnemy.isHit = true;
                nearestEnemy.hitTimer = 1.0;
                playSound("explosion");
                score++;
                scoreElement.textContent = score;

                // Make a little "win" jingle every 10 points
                if (score % 10 === 0) playSound("win");
            } else {
                // No enemies? Just jump forward
                const forward = new Vector3(0, 0, -1).applyQuaternion(player.quaternion);
                player.position.add(forward.multiplyScalar(15));
            }
        }
        
        // --- GAME LOOP & UPDATES ---
        let spawnTimer = 3; // First enemy after 3 seconds
        let on = true; // For pausing when tab is hidden

        function animate() {
            if (!on) return;

            const delta = Math.min(clock.getDelta(), 0.05); // Cap delta to prevent huge jumps

            // --- Player Movement ---
            playerVelocity.set(0, 0, 0);
            if (keys.ArrowUp || keys.KeyW) playerVelocity.z = -1;
            if (keys.ArrowDown || keys.KeyS) playerVelocity.z = 1;
            if (keys.ArrowLeft || keys.KeyA) playerVelocity.x = -1;
            if (keys.ArrowRight || keys.KeyD) playerVelocity.x = 1;

            const isMoving = playerVelocity.length() > 0.1;
            
            if (isMoving) {
                playerVelocity.normalize().multiplyScalar(playerSpeed * delta);
                player.position.add(playerVelocity);

                // Rotate player to face movement direction
                const targetAngle = Math.atan2(playerVelocity.x, playerVelocity.z);
                const targetQuaternion = new Quaternion().setFromEuler(new Euler(0, targetAngle, 0));
                player.quaternion.slerp(targetQuaternion, 0.2);

                // Switch to run animation
                if (playerMixer && playerModel) {
                    const runClip = playerModel.animations.find(a => /sprint|run/i.test(a.name));
                    const idleClip = playerModel.animations.find(a => /idle/i.test(a.name));
                    if (runClip && idleClip) {
                        playerMixer.clipAction(idleClip).fadeOut(0.2);
                        playerMixer.clipAction(runClip).fadeIn(0.2).play();
                    }
                }
            } else {
                 // Switch to idle animation
                if (playerMixer && playerModel) {
                    const runClip = playerModel.animations.find(a => /sprint|run/i.test(a.name));
                    const idleClip = playerModel.animations.find(a => /idle/i.test(a.name));
                    if (runClip && idleClip) {
                        playerMixer.clipAction(runClip).fadeOut(0.2);
                        playerMixer.clipAction(idleClip).fadeIn(0.2).play();
                    }
                }
            }

            // --- Player Powers ---
            if (teleportTimer > 0) teleportTimer -= delta;
            if (keys.Space) doTeleport();

            // --- Enemy Spawning & Logic ---
            spawnTimer -= delta;
            if (spawnTimer <= 0) {
                spawnEnemy();
                spawnTimer = Math.max(1, 5 - score * 0.1); // Spawn faster as score increases
            }

            enemies.forEach((enemy, index) => {
                if (enemy.isHit) {
                    enemy.hitTimer -= delta;
                    if (enemy.hitTimer <= 0) {
                        // Remove from scene and array
                        scene.remove(enemy.object);
                        enemies.splice(index, 1);
                    } else {
                        // Fun "poof" animation
                        const s = enemy.hitTimer * 2; // Scale from 2 down to 0
                        enemy.object.scale.set(s,s,s);
                        enemy.object.position.y += delta * 5; // Float up
                        enemy.object.rotation.y += delta * 10;
                    }
                } else {
                    // Move towards player
                    const direction = new Vector3().subVectors(player.position, enemy.object.position).normalize();
                    enemy.object.position.add(direction.multiplyScalar(enemy.speed * delta));
                    enemy.object.lookAt(player.position);
                }
                
                // Update enemy animation
                if(enemy.mixer) enemy.mixer.update(delta);
            });
            
            // --- Update Effects & Animations ---
            teleportParticles.forEach((p, i) => {
                p.timer -= delta;
                if(p.timer <= 0) {
                    scene.remove(p.mesh);
                    teleportParticles.splice(i, 1);
                } else {
                    p.mesh.scale.multiplyScalar(1 - delta * 5);
                }
            });
            
            if (playerMixer) playerMixer.update(delta);

            // --- Camera Follow ---
            const cameraOffset = new Vector3(0, 12, 15);
            camera.position.lerp(player.position.clone().add(cameraOffset), 0.05);
            camera.lookAt(player.position);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // --- RESIZE HANDLING ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);
        
        // --- PAUSE ON UNFOCUSED ---
        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        window.addEventListener('blur', () => setOn(false));
        window.addEventListener('focus', () => setOn(true));
        function setOn(v) {
            if (v === on) return;
            on = v;
            if (v) {
                clock.getDelta(); // Clear delta on resume
                requestAnimationFrame(animate);
                playMusic("bg_loop_upbeat");
            }
        }

        // --- START GAME ---
        onWindowResize();
        playMusic("bg_loop_upbeat"); // Start the action music!
        animate();
    </script>
</body>
</html>

        var scl = (transform && transform.scale) || {};
        var rot = (transform && transform.rotation) || {};
        __arPos.set(pos.x || 0, pos.y || 0, pos.z || 0);
        __arEuler.set(rot.x || 0, rot.y || 0, rot.z || 0);
        __arQuat.setFromEuler(__arEuler);
        __arScale.set(scl.x != null ? scl.x : 1, scl.y != null ? scl.y : 1, scl.z != null ? scl.z : 1);
        matrix.compose(__arPos, __arQuat, __arScale);
        for (var m = 0; m < meshes.length; m++) {
          meshes[m].setMatrixAt(i, matrix);
          meshes[m].instanceMatrix.needsUpdate = true;
        }
      },
      boundsAt: function (i) {
        if (!parts.length) return new Box3();
        meshes[0].getMatrixAt(i, matrix);
        box.copy(parts[0].geometry.boundingBox).applyMatrix4(matrix);
        return box;
      },
    };
  } catch (e) {
    console.warn("[ariantra] loadModelBatch failed:", name, e);
    return null;
  }
};

(function () {
  var ctx = null, buffers = {}, currentMusic = null;
  function context() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      var resume = function () { if (ctx.state === "suspended") ctx.resume(); };
      addEventListener("pointerdown", resume, true);
      addEventListener("keydown", resume, true);
    }
    return ctx;
  }
  function load(name) {
    var url = (window.AR_ASSETS || {})[name];
    if (!url) { console.warn("[ariantra] unknown sound:", name); return Promise.resolve(null); }
    if (!buffers[name]) {
      buffers[name] = fetch(url)
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) {
          return new Promise(function (res, rej) { context().decodeAudioData(ab, res, rej); });
        })
        .catch(function (e) { console.warn("[ariantra] sound failed:", name, e); return null; });
    }
    return buffers[name];
  }
  function trimBounds(buf) {
    var d = buf.getChannelData(0), t = 0.001, s = 0, e = d.length - 1;
    while (s < e && Math.abs(d[s]) < t) s++;
    while (e > s && Math.abs(d[e]) < t) e--;
    return { start: s / buf.sampleRate, end: (e + 1) / buf.sampleRate };
  }
  window.playSound = function (name) {
    try {
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        src.connect(context().destination);
        src.start();
      });
    } catch (e) { /* a silent effect, never a broken game */ }
  };
  window.playMusic = function (name) {
    var handle = { stop: function () {} };
    try {
      if (currentMusic) { try { currentMusic.stop(); } catch (e2) {} currentMusic = null; }
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        var b = trimBounds(buf);
        src.loop = true;
        src.loopStart = b.start;
        src.loopEnd = b.end;
        var gain = context().createGain();
        gain.gain.value = 0.5;
        src.connect(gain);
        gain.connect(context().destination);
        src.start(0, b.start);
        currentMusic = src;
        handle.stop = function () { try { src.stop(); } catch (e3) {} if (currentMusic === src) currentMusic = null; };
      });
    } catch (e) { /* silent */ }
    return handle;
  };
})();
</script>
    <title>3D Kart Racer</title>
    <style>
        /* --- BASIC SETUP --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh; /* Use dynamic height for mobile */
            overflow: hidden;
            background-color: #7ab8f0; /* Bright sky blue */
        }
        #scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- INFO AND SCORING --- */
        .hud {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: 'Arial', sans-serif;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            pointer-events: none; /* Let clicks pass through */
        }
        #score { /* This will be a dummy element for platform score tracking */
            display: none;
        }
        #winnerText {
            font-size: 4vw;
            color: yellow;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* --- ON-SCREEN CONTROLS --- */
        .controls {
            position: absolute;
            bottom: 0;
            width: 50%;
            height: 30%;
            pointer-events: none; /* Main container is transparent to clicks */
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .controls.player1 {
            left: 0;
        }
        .controls.player2 {
            right: 0;
        }

        .control-button {
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: all; /* Buttons are clickable */
            width: 60px;
            height: 60px;
            margin: 10px;
            /* Add padding for the safe area on iPhones */
            padding-bottom: max(0px, env(safe-area-inset-bottom));
        }
        .control-cluster {
            display: flex;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        /* Style the gas/brake pedals differently */
        #p1_gas, #p2_gas {
            background-color: rgba(46, 204, 113, 0.6);
        }
        #p1_brake, #p2_brake {
            background-color: rgba(231, 76, 60, 0.6);
        }
    </style>
</head>
<body>
    
    
    

    <!-- SCENE CANVAS -->
    <canvas id="scene"></canvas>

    <!-- SCORE AND HUD -->
    <div id="score">0</div>
    <div class="hud">
        <div id="infoText">P1: W/A/S/D &nbsp;&nbsp;&nbsp; P2: Arrow Keys</div>
        <div id="winnerText"></div>
    </div>

    <!-- PLAYER 1 CONTROLS -->
    <div class="controls player1">
        <div class="control-cluster">
            <button id="p1_left" class="control-button">&#11013;</button>
            <button id="p1_right" class="control-button">&#10145;</button>
        </div>
        <div class="control-cluster">
            <button id="p1_brake" class="control-button">&#9660;</button>
            <button id="p1_gas" class="control-button">&#9650;</button>
        </div>
    </div>

    <!-- PLAYER 2 CONTROLS -->
    <div class="controls player2">
        <div class="control-cluster">
            <button id="p2_left" class="control-button">&#11013;</button>
            <button id="p2_right" class="control-button">&#10145;</button>
        </div>
        <div class="control-cluster">
            <button id="p2_brake" class="control-button">&#9660;</button>
            <button id="p2_gas" class="control-button">&#9650;</button>
        </div>
    </div>

    <script type="module">
        // --- IMPORTS AND SETUP ---
        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, PlaneGeometry, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight, Quaternion, Matrix4, Raycaster, Vector2 } from "three";

        const scene = new Scene();
        scene.background = new Color(0x87CEEB); // Sky blue
        scene.fog = new Fog(0x87CEEB, 100, 250);

        const clock = new Clock();
        const infoText = document.getElementById('infoText');
        const winnerText = document.getElementById('winnerText');

        const renderer = new WebGLRenderer({
            canvas: document.getElementById('scene'),
            antialias: true,
            preserveDrawingBuffer: true
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setScissorTest(true); // Enable splitting the screen

        // --- CAMERAS (ONE FOR EACH PLAYER) ---
        const cameras = [
            new PerspectiveCamera(75, window.innerWidth / 2 / window.innerHeight, 0.1, 500),
            new PerspectiveCamera(75, window.innerWidth / 2 / window.innerHeight, 0.1, 500)
        ];

        // --- LIGHTING ---
        const ambientLight = new AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(20, 50, 30);
        scene.add(directionalLight);
        
        // --- GROUND ---
        const groundGeo = new PlaneGeometry(500, 500);
        const groundMat = new MeshStandardMaterial({ color: 0x559033, roughness: 1 });
        const ground = new Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        scene.add(ground);

        // --- GAME CONSTANTS ---
        const LAPS_TO_WIN = 3;
        const MAX_SPEED = 30.0;
        const ACCELERATION = 20.0;
        const BRAKE_FORCE = 40.0;
        const DRAG = 0.985;
        const TURN_RATE = 2.0;

        // --- PLAYER SETUP ---
        const players = [];
        const playerColors = [0xff0000, 0x0000ff]; // Red and Blue

        function createPlayer(id, startPos, startAngle) {
            const player = new Group();
            player.position.copy(startPos);
            player.rotation.y = startAngle;
            scene.add(player);

            const placeholder = new Mesh(new BoxGeometry(1.5, 1, 3), new MeshStandardMaterial({ color: playerColors[id] }));
            player.add(placeholder);

            loadModel("race_kart").then(model => {
                if (model) {
                    player.remove(placeholder);
                    model.traverse(child => {
                        if (child.isMesh && child.material.name.includes("Body")) {
                            child.material = child.material.clone();
                            child.material.color.set(playerColors[id]);
                        }
                    });
                    const modelScale = 0.8;
                    model.scale.set(modelScale, modelScale, modelScale);
                    player.add(model);
                }
            });

            return {
                id: id,
                object: player,
                speed: 0,
                heading: startAngle,
                lap: 0,
                nextCheckpoint: 0,
                controls: { forward: false, backward: false, left: false, right: false },
                finished: false
            };
        }

        players.push(createPlayer(0, new Vector3(-2, 0, 5), Math.PI));
        players.push(createPlayer(1, new Vector3(2, 0, 5), Math.PI));

        // --- TRACK LAYOUT ---
        const track = new Group();
        scene.add(track);
        const checkpoints = [];

        async function buildTrack() {
            const TILE_SIZE = 10;
            const layout = [
                " S ",
                " C ",
                " | ",
                " L ",
                "---",
                "J  "
            ];

            const tileMap = {
                '-': { name: 'race_track_straight', angle: Math.PI / 2 },
                '|': { name: 'race_track_straight', angle: 0 },
                'C': { name: 'race_track_corner', angle: Math.PI / 2 },
                'L': { name: 'race_track_corner', angle: Math.PI },
                'J': { name: 'race_track_corner', angle: -Math.PI / 2 },
                '7': { name: 'race_track_corner', angle: 0 },
                'S': { name: 'race_track_straight', angle: 0 } // Start/Finish
            };
            
            const [roadStraight, roadCorner, cone, garage, stand] = await Promise.all([
                loadModelBatch("race_track_straight", 20),
                loadModelBatch("race_track_corner", 20),
                loadModelBatch("traffic_cone", 20),
                loadModel("pit_garage"),
                loadModel("grandstand")
            ]);
            
            const models = { 'race_track_straight': roadStraight, 'race_track_corner': roadCorner };
            let straightCount = 0;
            let cornerCount = 0;

            for (let r = 0; r < layout.length; r++) {
                for (let c = 0; c < layout[r].length; c++) {
                    const char = layout[r][c];
                    const tileInfo = tileMap[char];
                    if (tileInfo) {
                        const x = (c - 1) * TILE_SIZE;
                        const z = r * TILE_SIZE;
                        const modelBatch = models[tileInfo.name];

                        if (modelBatch) {
                            let index;
                            if (tileInfo.name === 'race_track_straight') {
                                index = straightCount++;
                            } else {
                                index = cornerCount++;
                            }
                            if (index < modelBatch.count) {
                                modelBatch.setInstance(index, { 
                                    position: { x, y: 0, z }, 
                                    rotation: { x: 0, y: tileInfo.angle, z: 0 }
                                });
                            }
                        }
                        
                        // Add checkpoints
                        if (char === 'S') checkpoints.push({ x: x, z: z, size: TILE_SIZE, crossed: [false, false] });
                        if (char === 'L') checkpoints.push({ x: x, z: z, size: TILE_SIZE, crossed: [false, false] });
                        if (char === '-') checkpoints.push({ x: x, z: z, size: TILE_SIZE, crossed: [false, false] });
                    }
                }
            }
            if (roadStraight) scene.add(roadStraight.mesh);
            if(roadCorner) scene.add(roadCorner.mesh);

            // Scenery
            if (cone) {
                cone.setInstance(0, { position: { x: 5, y: 0, z: -2 } });
                cone.setInstance(1, { position: { x: 5, y: 0, z: 2 } });
                scene.add(cone.mesh);
            }
            if (garage) {
                garage.scale.setScalar(5);
                garage.position.set(20, 0, 5);
                scene.add(garage);
            }
            if (stand) {
                stand.scale.setScalar(6);
                stand.position.set(-25, 0, 25);
                stand.rotation.y = Math.PI / 2;
                scene.add(stand);
            }
        }
        buildTrack();

        // --- CONTROLS ---
        const keyState = {};
        window.addEventListener('keydown', (e) => {
            keyState[e.code] = true;
            // Prevent page scroll
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.key)) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => { keyState[e.code] = false; });

        function setupButton(id, playerIndex, control) {
            const button = document.getElementById(id);
            const handler = (e) => {
                e.preventDefault();
                players[playerIndex].controls[control] = (e.type === 'pointerdown' || e.type === 'touchstart');
            };
            button.addEventListener('pointerdown', handler);
            button.addEventListener('pointerup', handler);
            button.addEventListener('pointerleave', handler);
            button.addEventListener('touchstart', handler, { passive: false });
            button.addEventListener('touchend', handler);
        }

        setupButton('p1_gas', 0, 'forward');
        setupButton('p1_brake', 0, 'backward');
        setupButton('p1_left', 0, 'left');
        setupButton('p1_right', 0, 'right');
        setupButton('p2_gas', 1, 'forward');
        setupButton('p2_brake', 1, 'backward');
        setupButton('p2_left', 1, 'left');
        setupButton('p2_right', 1, 'right');
        
        // --- GAME LOOP ---
        let gameRunning = true;
        let on = true;
        const setOn = (v) => { if (v === on) return; on = v;
           if (v) { clock.getDelta(); requestAnimationFrame(animate); }
        };
        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        window.addEventListener('blur', () => setOn(false));
        window.addEventListener('focus', () => setOn(true));

        function updatePlayerControls() {
            // Player 1 (W/A/S/D)
            players[0].controls.forward = players[0].controls.forward || keyState['KeyW'];
            players[0].controls.backward = players[0].controls.backward || keyState['KeyS'];
            players[0].controls.left = players[0].controls.left || keyState['KeyA'];
            players[0].controls.right = players[0].controls.right || keyState['KeyD'];
            // Player 2 (Arrow Keys)
            players[1].controls.forward = players[1].controls.forward || keyState['ArrowUp'];
            players[1].controls.backward = players[1].controls.backward || keyState['ArrowDown'];
            players[1].controls.left = players[1].controls.left || keyState['ArrowLeft'];
            players[1].controls.right = players[1].controls.right || keyState['ArrowRight'];
        }
        
        // --- PLAYER MOVEMENT ---
        function updatePlayers(delta) {
            players.forEach(p => {
                if (p.finished) {
                    p.speed *= DRAG; // Slow down if finished
                } else {
                    if (p.controls.forward) p.speed += ACCELERATION * delta;
                    if (p.controls.backward) p.speed -= BRAKE_FORCE * delta;
                }
                
                p.speed *= DRAG;
                p.speed = Math.max(-MAX_SPEED / 2, Math.min(MAX_SPEED, p.speed));

                if (Math.abs(p.speed) > 0.1) {
                    const turnFactor = Math.min(1, Math.abs(p.speed) / (MAX_SPEED * 0.5));
                    if (p.controls.left) p.heading += TURN_RATE * turnFactor * delta;
                    if (p.controls.right) p.heading -= TURN_RATE * turnFactor * delta;
                }

                p.object.position.x += Math.sin(p.heading) * p.speed * delta;
                p.object.position.z += Math.cos(p.heading) * p.speed * delta;
                p.object.rotation.y = p.heading;

                // Reset controls for next frame (touch controls manage their own state)
                p.controls.forward = p.controls.backward = p.controls.left = p.controls.right = false;
            });
        }

        // --- COLLISION AND LAP LOGIC ---
        function checkCollisions() {
            // Player vs Player
            const p1 = players[0].object.position;
            const p2 = players[1].object.position;
            const distance = p1.distanceTo(p2);
            if (distance < 2.5) {
                playSound('hit');
                const overlap = 2.5 - distance;
                const pushback = p1.clone().sub(p2).normalize().multiplyScalar(overlap / 2);
                p1.add(pushback);
                p2.sub(pushback);

                // Swap some momentum
                const tempSpeed = players[0].speed;
                players[0].speed = (players[0].speed * 0.5) + (players[1].speed * 0.5);
                players[1].speed = (players[1].speed * 0.5) + (tempSpeed * 0.5);
            }
            
            // Player vs Checkpoints
            players.forEach(p => {
                if (p.finished) return;
                const checkpoint = checkpoints[p.nextCheckpoint];
                if (!checkpoint) return;

                const pPos = p.object.position;
                if (Math.abs(pPos.x - checkpoint.x) < checkpoint.size / 2 && Math.abs(pPos.z - checkpoint.z) < checkpoint.size / 2) {
                    p.nextCheckpoint++;
                    if (p.nextCheckpoint === 1 && p.lap > 0) { // Crossed start line
                        playSound('whoosh');
                    }
                    if (p.nextCheckpoint >= checkpoints.length) {
                        p.nextCheckpoint = 0;
                        p.lap++;
                        if (p.lap > LAPS_TO_WIN) {
                            p.lap = LAPS_TO_WIN;
                            p.finished = true;
                            gameRunning = false;
                            playSound("jingle_win");
                            winnerText.textContent = `PLAYER ${p.id + 1} WINS!`;
                            document.getElementById('score').textContent = p.id; // Report winner for platform
                        }
                    }
                }
            });
        }

        // --- RESIZE HANDLING ---
        function onWindowResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            cameras.forEach(cam => {
                cam.aspect = (w / 2) / h;
                cam.updateProjectionMatrix();
            });
        }
        window.addEventListener('resize', onWindowResize);
        onWindowResize();

        playMusic("bg_loop_playful");

        // --- MAIN RENDER LOOP ---
        function animate() {
            if (!on) return;
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            delta = Math.min(delta, 0.05); // Prevent huge jumps
            
            if (gameRunning) {
                updatePlayerControls();
                updatePlayers(delta);
                checkCollisions();
            } else {
                // If game over, just let cars coast to a stop
                 updatePlayers(delta);
            }

            // Update HUD
            infoText.textContent = `P1 Lap: ${players[0].lap}/${LAPS_TO_WIN}  |  P2 Lap: ${players[1].lap}/${LAPS_TO_WIN}`;

            // Render both player views
            const w = window.innerWidth;
            const h = window.innerHeight;

            // Player 1 (Left side)
            renderer.setScissor(0, 0, w / 2, h);
            renderer.setViewport(0, 0, w / 2, h);
            cameras[0].position.copy(players[0].object.position).add(new Vector3(0, 6, -12).applyQuaternion(players[0].object.quaternion));
            cameras[0].lookAt(players[0].object.position.clone().add(new Vector3(0, 2, 0)));
            renderer.render(scene, cameras[0]);

            // Player 2 (Right side)
            renderer.setScissor(w / 2, 0, w / 2, h);
            renderer.setViewport(w / 2, 0, w / 2, h);
            cameras[1].position.copy(players[1].object.position).add(new Vector3(0, 6, -12).applyQuaternion(players[1].object.quaternion));
            cameras[1].lookAt(players[1].object.position.clone().add(new Vector3(0, 2, 0)));
            renderer.render(scene, cameras[1]);
        }

        animate();
    </script>

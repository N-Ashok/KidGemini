            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh; /* Use dynamic height for mobile */
            overflow: hidden;
            background-color: #333;
            color: white;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        /* --- GAME CANVAS --- */
        #scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- UI & OVERLAYS --- */
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to the canvas */
            box-sizing: border-box;
            padding: 12px;
        }

        /* --- SCORE & INSTRUCTIONS --- */
        .top-ui {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        #score {
            font-size: 2.5em;
            font-weight: bold;
            color: #FFD700;
        }
        
        #instructions, #request-text {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        #instructions {
             font-size: 1.2em;
        }
        
        #request-text {
            font-size: 1.5em;
            color: #87CEEB;
            margin-top: 20px;
            visibility: hidden; /* Hide until there's a request */
        }
        
        /* --- ON-SCREEN CONTROLS --- */
        .controls {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            pointer-events: all; /* Make buttons clickable */
            padding-bottom: max(12px, env(safe-area-inset-bottom)); /* Safe area for phone notches */
        }

        .controls button {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid white;
            background-color: rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            user-select: none; /* Prevent text selection on hold */
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    
    
    
    <canvas id="scene"></canvas>

    <!-- UI ELEMENTS -->
    <div class="ui-container">
        <div class="top-ui">
            <div id="instructions">
                Use WASD/Arrows to move.<br/>Bring the pet to the customer!
            </div>
            <div id="score">0</div>
        </div>
        
        <div id="request-text">I would like a pet!</div>

        <!-- ON-SCREEN CONTROLS -->
        <div class="controls">
            <button id="btn-left">←</button>
            <button id="btn-fwd">↑</button>
            <button id="btn-right">→</button>
        </div>
    </div>

    <script type="module">
        // --- IMPORTS ---
        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, PlaneGeometry, MeshStandardMaterial, MeshBasicMaterial, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, Euler, MathUtils } from "three";

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, clock;
        let player, playerMixer;
        let customer;
        let controls = { forward: false, backward: false, left: false, right: false };
        let playerVelocity = new Vector3();
        const playerSpeed = 4;
        const turnSpeed = Math.PI * 0.8;
        
        let pets = [];
        let carriedPet = null;
        let currentRequest = null;
        
        let score = 0;
        const scoreElement = document.getElementById('score');
        const requestElement = document.getElementById('request-text');
        
        const petTypes = ["cat", "dog", "bird", "fish", "snake", "frog", "chicken", "bee"];
        let nextCustomerTime = 3; // First customer appears after 3 seconds

        // --- INITIALIZATION ---
        function init() {
            // Scene Setup
            scene = new Scene();
            scene.background = new Color(0x87CEEB);
            scene.fog = new Fog(0x87CEEB, 20, 50);

            // Camera
            camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 12);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            // Lighting
            scene.add(new AmbientLight(0xffffff, 0.8));
            const dirLight = new DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 10, 7.5);
            scene.add(dirLight);

            // Clock
            clock = new Clock();
            
            // Start Music
            playMusic("bg_loop_playful");

            // --- BUILD THE WORLD ---
            buildStore();
            createPlayer();
            spawnPets();

            // --- RESPONSIVE SIZING ---
            handleResize();
            window.addEventListener('resize', handleResize);
            
            // --- SET UP CONTROLS ---
            setupControls();

            // --- START GAME LOOP ---
            animate();
        }

        // --- WORLD BUILDING ---
        function buildStore() {
            // Floor
            const floorMat = new MeshStandardMaterial({ color: 0x98FB98 });
            const floor = new Mesh(new PlaneGeometry(30, 30), floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Walls
            const wallMat = new MeshStandardMaterial({ color: 0xF5DEB3 });
            const wallHeight = 5;
            const wallThickness = 0.5;

            const wall1 = new Mesh(new BoxGeometry(30, wallHeight, wallThickness), wallMat);
            wall1.position.set(0, wallHeight / 2, -15);
            scene.add(wall1);

            const wall2 = new Mesh(new BoxGeometry(30, wallHeight, wallThickness), wallMat);
            wall2.position.set(0, wallHeight / 2, 15);
            scene.add(wall2);
            
            const wall3 = new Mesh(new BoxGeometry(wallThickness, wallHeight, 30), wallMat);
            wall3.position.set(-15, wallHeight / 2, 0);
            scene.add(wall3);

            const wall4 = new Mesh(new BoxGeometry(wallThickness, wallHeight, 30), wallMat);
            wall4.position.set(15, wallHeight / 2, 0);
            scene.add(wall4);

            // Counter
            const counterMat = new MeshStandardMaterial({ color: 0x8B4513 });
            const counter = new Mesh(new BoxGeometry(10, 1, 1), counterMat);
            counter.position.set(0, 0.5, 12);
            scene.add(counter);
        }
        
        // --- PLAYER SETUP ---
        function createPlayer() {
            // Use a simple box as a placeholder
            const placeholder = new Mesh(new BoxGeometry(0.6, 1.8, 0.6), new MeshBasicMaterial({ color: 0x00ff00, wireframe: true }));
            placeholder.position.y = 0.9;
            scene.add(placeholder);
            player = placeholder;

            loadModel("explorer").then(model => {
                if (model) {
                    scene.remove(placeholder);
                    player = model;
                    player.scale.set(1, 1, 1);
                    player.position.y = 0;
                    scene.add(player);
                    
                    playerMixer = new AnimationMixer(player);
                    const idleClip = player.animations.find(a => /idle/i.test(a.name));
                    if (idleClip) playerMixer.clipAction(idleClip).play();
                }
            });
        }
        
        // --- PET & CUSTOMER SPAWNING ---
        function spawnPets() {
            const penPositions = [
                { pos: new Vector3(-10, 0.5, -10), type: "cat" }, { pos: new Vector3(-5, 0.5, -10), type: "dog" },
                { pos: new Vector3(0, 0.5, -10), type: "bird" }, { pos: new Vector3(5, 0.5, -10), type: "fish" },
                { pos: new Vector3(10, 0.5, -10), type: "snake" }, { pos: new Vector3(-10, 0.5, 0), type: "frog" },
                { pos: new Vector3(-5, 0.5, 0), type: "chicken" }, { pos: new Vector3(0, 0.5, 0), type: "bee" }
            ];

            penPositions.forEach(p => {
                const pen = new Mesh(new BoxGeometry(4, 1, 4), new MeshStandardMaterial({ color: 0xD2B48C, transparent: true, opacity: 0.5 }));
                pen.position.copy(p.pos);
                scene.add(pen);

                loadModel(p.type).then(model => {
                    if (model) {
                        model.scale.set(0.8, 0.8, 0.8);
                        // Make small pets bigger so they are easier to see
                        if (p.type === 'bird' || p.type === 'fish' || p.type === 'frog' || p.type === 'bee') {
                             model.scale.set(2, 2, 2);
                        }
                        model.position.copy(p.pos);
                        model.petType = p.type;
                        model.isAvailable = true;
                        scene.add(model);
                        pets.push(model);
                    }
                });
            });
        }
        
        function spawnCustomer() {
            if (customer) return; // Don't spawn if one is already there.

            // Use a placeholder box
            const placeholder = new Mesh(new BoxGeometry(0.8, 2, 0.8), new MeshBasicMaterial({ color: 0xff0000, wireframe: true }));
            placeholder.position.set(0, 1, 13);
            scene.add(placeholder);
            customer = placeholder;

            loadModel("plumber").then(model => {
                if (model) {
                    scene.remove(placeholder);
                    customer = model;
                    customer.scale.set(1.1, 1.1, 1.1);
                    customer.position.set(0, 0, 13);
                    customer.rotation.y = Math.PI;
                    scene.add(customer);
                }
            });
            
            const availablePets = pets.filter(p => p.isAvailable);
            if(availablePets.length === 0) {
                 // All pets are gone! Reset them.
                 pets.forEach(p => { p.isAvailable = true; p.visible = true; });
                 currentRequest = petTypes[Math.floor(Math.random() * petTypes.length)];
            } else {
                 currentRequest = availablePets[Math.floor(Math.random() * availablePets.length)].petType;
            }
            
            requestElement.innerText = `I'd like a ${currentRequest}, please!`;
            requestElement.style.visibility = 'visible';
        }

        // --- PLAYER MOVEMENT ---
        function updatePlayer(delta) {
            if (!player) return;

            let moveDirection = new Vector3(0, 0, 0);
            if (controls.forward) moveDirection.z = -1;
            if (controls.backward) moveDirection.z = 1;

            if (controls.left) player.rotation.y += turnSpeed * delta;
            if (controls.right) player.rotation.y -= turnSpeed * delta;
            
            const isMoving = controls.forward || controls.backward;

            if (isMoving) {
                // Get forward direction
                const forward = new Vector3(0, 0, -1).applyQuaternion(player.quaternion);
                player.position.addScaledVector(forward, playerSpeed * delta * (controls.forward ? 1 : -0.5));
            }
            
            // Clamp player position to stay inside the store
            player.position.x = Math.max(-14, Math.min(14, player.position.x));
            player.position.z = Math.max(-14, Math.min(14, player.position.z));
            
            // Animation
            if (playerMixer) {
                const runClip = player.animations.find(a => /sprint|run/i.test(a.name));
                const idleClip = player.animations.find(a => /idle/i.test(a.name));
                const activeAction = playerMixer.clipAction(isMoving ? runClip : idleClip);
                const inactiveAction = playerMixer.clipAction(isMoving ? idleClip : runClip);
                
                activeAction.reset().play();
                inactiveAction.fadeOut(0.2);
                playerMixer.update(delta);
            }
        }
        
        // --- GAME LOGIC ---
        function checkInteractions() {
            if (!player) return;

            // Pick up a pet
            if (!carriedPet) {
                for (const pet of pets) {
                    if (pet.isAvailable && player.position.distanceTo(pet.position) < 1.5) {
                        carriedPet = pet;
                        carriedPet.isAvailable = false;
                        playSound("coin_pickup");
                        break;
                    }
                }
            } else {
                // Follow the player
                const followOffset = new Vector3(0, 1, 1).applyQuaternion(player.quaternion);
                carriedPet.position.lerp(player.position.clone().add(followOffset), 0.2);
                carriedPet.quaternion.slerp(player.quaternion, 0.2);

                // Drop off pet at customer
                if (customer && player.position.distanceTo(customer.position) < 3) {
                    if (carriedPet.petType === currentRequest) {
                        // Correct pet!
                        score++;
                        scoreElement.innerText = score;
                        playSound("win");
                        
                        scene.remove(customer);
                        scene.remove(carriedPet);
                        customer = null;
                        carriedPet = null;
                        currentRequest = null;
                        requestElement.style.visibility = 'hidden';
                        
                        nextCustomerTime = clock.getElapsedTime() + 2; // Next customer in 2 seconds
                    } else {
                        // Wrong pet!
                        playSound("back");
                        carriedPet.isAvailable = true; // Put it back
                        carriedPet = null;
                        // The pet will pop back to its original spot on the next pet update
                    }
                }
            }
            
            // Reset pets that were not taken
            pets.forEach(p => {
                if (p.isAvailable && p.position.distanceTo(p.spawnPosition) > 0.1) {
                    p.position.lerp(p.spawnPosition, 0.1);
                    p.rotation.y += 0.01; // A little spin
                }
                 // Store original spawn positions after they are first loaded
                if (!p.spawnPosition) {
                    p.spawnPosition = p.position.clone();
                }
            });
        }
        
        function updateGame(delta) {
             // Customer spawning logic
            if (!customer && clock.getElapsedTime() > nextCustomerTime) {
                spawnCustomer();
            }
        }

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05);

            updatePlayer(delta);
            checkInteractions();
            updateGame(delta);
            
            renderer.render(scene, camera);
        }

        // --- EVENT HANDLERS ---
        function handleResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }

        function setupControls() {
            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') controls.forward = true;
                if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') controls.backward = true;
                if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') controls.left = true;
                if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') controls.right = true;
                // Prevent page scroll
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') controls.forward = false;
                if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') controls.backward = false;
                if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') controls.left = false;
                if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') controls.right = false;
            });

            // On-screen buttons (for touch and mouse)
            const btnFwd = document.getElementById('btn-fwd');
            const btnLeft = document.getElementById('btn-left');
            const btnRight = document.getElementById('btn-right');

            const startMove = (dir) => (e) => { e.preventDefault(); controls[dir] = true; };
            const endMove = (dir) => (e) => { e.preventDefault(); controls[dir] = false; };

            btnFwd.addEventListener('pointerdown', startMove('forward'));
            btnFwd.addEventListener('pointerup', endMove('forward'));
            btnFwd.addEventListener('pointerleave', endMove('forward'));
            
            btnLeft.addEventListener('pointerdown', startMove('left'));
            btnLeft.addEventListener('pointerup', endMove('left'));
            btnLeft.addEventListener('pointerleave', endMove('left'));
            
            btnRight.addEventListener('pointerdown', startMove('right'));
            btnRight.addEventListener('pointerup', endMove('right'));
            btnRight.addEventListener('pointerleave', endMove('right'));
        }

        // --- START EVERYTHING ---
        init();
    </script>
</body>
</html>

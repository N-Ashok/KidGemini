            pointer-events: auto;
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid #6c5ce7;
            border-radius: 10px;
            padding: 10px;
            margin: 10px;
            max-width: 280px;
            max-height: 50%;
            overflow-y: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            color: #333;
            font-size: clamp(10px, 2vw, 14px);
        }
        #inventory-panel {
            position: absolute;
            top: 10px;
            left: 10px;
        }
        #decorations-panel {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 5px;
        }
        .panel-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: clamp(10px, 2vw, 12px);
            text-align: center;
            position: relative;
        }
        .panel-item.selected {
            border-color: #6c5ce7;
            background-color: #e0dcfd;
        }
        .panel-item:active {
            background-color: #c9c0ff;
        }
        .item-cost {
            font-size: 0.8em;
            color: #4CAF50;
            margin-top: 2px;
        }
        .item-image {
            width: 40px;
            height: 40px;
            background-color: #eee; /* Placeholder for model images */
            border-radius: 3px;
            margin-bottom: 3px;
        }
        #controls {
            position: absolute;
            bottom: max(10px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-areas:
                ". up ."
                "left down right";
            gap: 10px;
            pointer-events: auto;
        }
        .control-button {
            width: 60px;
            height: 60px;
            background-color: rgba(108, 92, 231, 0.7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            color: white;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
        }
        .control-button:active {
            background-color: rgba(108, 92, 231, 1);
        }
        .control-button.up { grid-area: up; }
        .control-button.left { grid-area: left; }
        .control-button.down { grid-area: down; }
        .control-button.right { grid-area: right; }
        #interact-button {
            position: absolute;
            bottom: max(10px, env(safe-area-inset-bottom));
            right: 10px;
            width: 80px;
            height: 80px;
            background-color: rgba(255, 159, 67, 0.7);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            color: white;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            pointer-events: auto;
            text-align: center;
            line-height: 1.1;
            transition: background-color 0.2s;
        }
        #interact-button:active {
            background-color: rgba(255, 159, 67, 1);
        }
        #game-messages {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 25px 40px;
            border-radius: 15px;
            text-align: center;
            font-size: clamp(20px, 5vw, 40px);
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none; /* Hidden by default */
            pointer-events: auto;
        }
        #game-messages button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: clamp(16px, 3vw, 24px);
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #game-messages button:active {
            background-color: #5c4cd8;
        }

        /* Happiness Meter styles */
        .happiness-meter {
            position: absolute;
            bottom: 5px; /* Adjust as needed */
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 8px;
            background-color: #ccc;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.2);
        }
        .happiness-bar {
            height: 100%;
            width: 100%; /* Initial width, will be updated */
            background-color: limegreen; /* Default for high happiness */
            transition: width 0.1s linear, background-color 0.2s;
        }
        .happiness-meter-wrapper {
            position: absolute; /* Managed by JS for pet positions */
            pointer-events: none;
            transform: translate(-50%, -50%); /* Center based on JS position */
            width: 60px; /* Fixed width for the meter */
            height: 10px;
            z-index: 10; /* Above pets */
            display: none; /* Hide until pet is visible */
        }
        .customer-thought {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -100px); /* Above customer head */
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 5px 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
            display: none;
            font-size: clamp(10px, 2vw, 14px);
            color: #333;
        }
        .customer-thought::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid rgba(255, 255, 255, 0.9);
        }
        .customer-thought img {
            width: 30px;
            height: 30px;
            vertical-align: middle;
            margin-right: 5px;
        }

    </style>
</head>
<body>
    
    
    <canvas id="scene"></canvas>
    <div id="ui">
        <div id="top-bar">
            <div id="timer-display">Time: 900s</div>
            <div id="coins-display">Coins: 100</div>
            <div id="score">Adoptions: 0</div>
            <div id="sad-pets-display">Sad Pets: 0/3</div>
        </div>

        <div id="inventory-panel" class="ui-panel">
            <h3>Inventory (Drag & Drop)</h3>
            <div class="panel-grid" id="inventory-grid">
                <!-- Inventory items will be inserted here by JS -->
            </div>
        </div>

        <div id="decorations-panel" class="ui-panel">
            <h3>Decorations (Drag & Drop)</h3>
            <div class="panel-grid" id="decorations-grid">
                <!-- Decoration items will be inserted here by JS -->
            </div>
        </div>

        <div id="controls">
            <div class="control-button up" data-key="w" data-dir="forward">⬆️</div>
            <div class="control-button left" data-key="a" data-dir="left">⬅️</div>
            <div class="control-button down" data-key="s" data-dir="backward">⬇️</div>
            <div class="control-button right" data-key="d" data-dir="right">➡️</div>
        </div>

        <div id="interact-button">Interact</div>

        <div id="game-messages">
            <p id="message-text"></p>
            <button id="restart-button">Play Again!</button>
        </div>
    </div>

    <script type="module">
        import {
            Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, ConeGeometry, CylinderGeometry, PlaneGeometry, TorusGeometry, CapsuleGeometry, RingGeometry, Shape, ShapeGeometry, DoubleSide, MeshStandardMaterial, MeshBasicMaterial, Mesh, AmbientLight, DirectionalLight, PointLight, HemisphereLight, AnimationMixer, Quaternion, Euler, Matrix4, Vector2, MathUtils, Raycaster
        } from "three";

        // --- GLOBAL SETUP ---
        const scene = new Scene();
        const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // High-DPI support
        renderer.setSize(window.innerWidth, window.innerHeight);
        const clock = new Clock();
        const raycaster = new Raycaster();
        const mouse = new Vector2();
        let gameTimeRemaining = 900; // 15 minutes in seconds
        let coins = 100;
        let adoptionsCount = 0;
        let sadPetsCount = 0;
        let gameState = 'playing'; // 'playing', 'win', 'lose'

        // Store HTML elements for updates
        const timerDisplay = document.getElementById('timer-display');
        const coinsDisplay = document.getElementById('coins-display');
        const scoreDisplay = document.getElementById('score');
        const sadPetsDisplay = document.getElementById('sad-pets-display');
        const gameMessages = document.getElementById('game-messages');
        const messageText = document.getElementById('message-text');
        const restartButton = document.getElementById('restart-button');

        const INTERACT_DISTANCE = 3; // How close player needs to be to interact

        // --- CAMERA ---
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 1, 0);

        // --- SCENE LIGHTING ---
        const ambientLight = new AmbientLight(0xffffff, 0.7); // Soft fill light
        scene.add(ambientLight);

        const directionalLight = new DirectionalLight(0xffffff, 0.6); // Main light source
        directionalLight.position.set(5, 10, 7);
        directionalLight.target.position.set(0, 0, 0);
        scene.add(directionalLight);
        scene.add(directionalLight.target);

        scene.background = new Color(0xcce0ff); // Sky blue background
        scene.fog = new Fog(0xcce0ff, 0.1, 100);

        // --- PLAYER MOVEMENT ---
        let player;
        let playerMixer;
        let playerAnimations = {};
        let playerVelocity = new Vector3();
        const playerSpeed = 5;
        const rotationSpeed = Math.PI * 0.7; // Radians per second
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let isPlayerMoving = false;
        let playerDirection = new Vector3();

        const keyboardState = {};
        const controlButtons = {};
        let selectedItem = null; // Currently selected item from inventory/decorations

        // --- GAME CONTROLS ---
        window.addEventListener('keydown', (event) => {
            if (gameState !== 'playing') return;
            keyboardState[event.key.toLowerCase()] = true;
            updatePlayerMovementState();
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' ', 'w', 'a', 's', 'd'].includes(event.key.toLowerCase())) {
                event.preventDefault(); // Prevent page scrolling
            }
        });

        window.addEventListener('keyup', (event) => {
            if (gameState !== 'playing') return;
            keyboardState[event.key.toLowerCase()] = false;
            updatePlayerMovementState();
        });

        function updatePlayerMovementState() {
            moveForward = keyboardState['w'] || keyboardState['arrowup'];
            moveBackward = keyboardState['s'] || keyboardState['arrowdown'];
            moveLeft = keyboardState['a'] || keyboardState['arrowleft'];
            moveRight = keyboardState['d'] || keyboardState['arrowright'];
            isPlayerMoving = moveForward || moveBackward || moveLeft || moveRight;
        }

        // On-screen controls
        document.querySelectorAll('.control-button').forEach(button => {
            const dir = button.dataset.dir;
            controlButtons[dir] = false;

            button.addEventListener('pointerdown', (e) => {
                if (gameState !== 'playing') return;
                e.preventDefault();
                controlButtons[dir] = true;
                updatePlayerMovementStateFromControls();
            });
            button.addEventListener('pointerup', (e) => {
                if (gameState !== 'playing') return;
                e.preventDefault();
                controlButtons[dir] = false;
                updatePlayerMovementStateFromControls();
            });
            button.addEventListener('pointerleave', (e) => {
                if (gameState !== 'playing') return;
                // Only clear if pointer leaves while pressed
                if (e.buttons === 0) { // Check if no buttons are pressed
                    controlButtons[dir] = false;
                    updatePlayerMovementStateFromControls();
                }
            });
            button.addEventListener('touchend', (e) => {
                if (gameState !== 'playing') return;
                e.preventDefault();
                controlButtons[dir] = false;
                updatePlayerMovementStateFromControls();
            });
        });

        function updatePlayerMovementStateFromControls() {
            moveForward = controlButtons['forward'];
            moveBackward = controlButtons['backward'];
            moveLeft = controlButtons['left'];
            moveRight = controlButtons['right'];
            isPlayerMoving = moveForward || moveBackward || moveLeft || moveRight;
        }

        document.getElementById('interact-button').addEventListener('pointerdown', (e) => {
            if (gameState !== 'playing') return;
            e.preventDefault();
            handleInteraction();
        });

        restartButton.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            location.reload(); // Simple restart for now
        });

        // --- RAYCASTING FOR INTERACTION ---
        window.addEventListener('pointerdown', onPointerDown, false);

        function onPointerDown(event) {
            if (gameState !== 'playing') return;
            // Calculate mouse position in normalized device coordinates (-1 to +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check for clicks on UI elements (inventory/decorations) first
            const clickedInventoryItem = event.target.closest('.panel-item');
            if (clickedInventoryItem) {
                if (clickedInventoryItem.closest('#inventory-panel')) {
                    handleInventoryClick(clickedInventoryItem);
                } else if (clickedInventoryItem.closest('#decorations-panel')) {
                    handleDecorationClick(clickedInventoryItem);
                }
                return; // Stop here if UI element was clicked
            }

            // If an item is selected from inventory/decorations, try to place it
            if (selectedItem) {
                attemptPlaceItem();
                return;
            }
            // Otherwise, interact with pets
            handleInteraction();
        }

        function attemptPlaceItem() {
            if (!selectedItem || !player) return;

            const intersects = raycaster.intersectObjects([floor]); // Only allow placing on floor
            if (intersects.length > 0) {
                const intersection = intersects[0];
                const point = intersection.point;

                const distanceToPlayer = player.position.distanceTo(point);
                if (distanceToPlayer > 1 && distanceToPlayer < 10) { // Must be within reasonable range
                    const item = selectedItem;
                    if (item.type === 'decoration') {
                        if (coins >= item.cost) {
                            coins -= item.cost;
                            updateCoinsDisplay();
                            placeDecoration(item.modelName, point);
                            playSound('confirm');
                        } else {
                            playSound('error');
                            console.log("Not enough coins!");
                        }
                    } else if (item.type === 'food' || item.type === 'toy') {
                         // For food/toy, check if near a pet to auto-apply
                         let petFound = false;
                         for (const pet of pets) {
                             if (pet.mesh && pet.mesh.position.distanceTo(point) < 2) { // Near a pet enclosure
                                 interactWithPet(pet, item.name);
                                 petFound = true;
                                 playSound('pop'); // Success sound
                                 break;
                             }
                         }
                         if (!petFound) {
                            // If not near a pet, just deselect for now. Could add a "drop" animation later.
                             playSound('error');
                         }
                    }
                }
            }
            deselectItem();
        }

        // --- PET DATA ---
        const petTypes = [
            { name: "Puppy", modelName: "dog", animationNames: ["idle", "walk"], scale: 0.6, enclosure: null, htmlMeter: null },
            { name: "Kitten", modelName: "mascot", animationNames: ["idle", "walk"], scale: 0.4, enclosure: null, htmlMeter: null }, // Using mascot as placeholder for kitten
            { name: "Hamster", modelName: "capsule", animationNames: [], scale: 0.2, enclosure: null, htmlMeter: null }, // Primitive for hamster
            { name: "Parrot", modelName: "cone", animationNames: [], scale: 0.3, enclosure: null, htmlMeter: null }, // Primitive for parrot
            { name: "Goldfish", modelName: "fish", animationNames: [], scale: 0.3, enclosure: null, htmlMeter: null }
        ];

        // --- PET SHOP LAYOUT ---
        const shopSize = { width: 30, depth: 30, height: 8 };
        const wallThickness = 0.5;

        // Floor
        const floorGeometry = new PlaneGeometry(shopSize.width, shopSize.depth);
        const floorMaterial = new MeshStandardMaterial({ color: 0x8B4513, side: DoubleSide }); // Wood floor
        const floor = new Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01; // Slightly below ground to avoid z-fighting with other objects
        scene.add(floor);

        // Walls (using BoxGeometry for simplicity)
        function createWall(width, height, depth, x, y, z, rotationY = 0) {
            const geometry = new BoxGeometry(width, height, depth);
            const material = new MeshStandardMaterial({ color: 0xD3D3D3 }); // Light grey walls
            const wall = new Mesh(geometry, material);
            wall.position.set(x, y, z);
            wall.rotation.y = rotationY;
            scene.add(wall);
            return wall;
        }

        // Back wall
        createWall(shopSize.width, shopSize.height, wallThickness, 0, shopSize.height / 2, -shopSize.depth / 2);
        // Left wall
        createWall(shopSize.depth, shopSize.height, wallThickness, -shopSize.width / 2, shopSize.height / 2, 0, Math.PI / 2);
        // Right wall
        createWall(shopSize.depth, shopSize.height, wallThickness, shopSize.width / 2, shopSize.height / 2, 0, -Math.PI / 2);
        // Front wall (with opening for door)
        createWall(shopSize.width / 3, shopSize.height, wallThickness, -shopSize.width / 3, shopSize.height / 2, shopSize.depth / 2);
        createWall(shopSize.width / 3, shopSize.height, wallThickness, shopSize.width / 3, shopSize.height / 2, shopSize.depth / 2);
        createWall(shopSize.width / 3, shopSize.height / 3, wallThickness, 0, shopSize.height * 5 / 6, shopSize.depth / 2); // Top part of door frame

        // Counter
        const counterGeometry = new BoxGeometry(4, 1, 1.5);
        const counterMaterial = new MeshStandardMaterial({ color: 0x8B4513 });
        const counter = new Mesh(counterGeometry, counterMaterial);
        counter.position.set(0, 0.5, shopSize.depth / 2 - 3); // In front of the door
        scene.add(counter);

        // Enclosures (using simple boxes for now, will refine with models)
        const enclosures = [];
        function createEnclosure(width, height, depth, x, z, petType) {
            const geometry = new BoxGeometry(width, height, depth);
            const material = new MeshStandardMaterial({ color: 0xA9A9A9, transparent: true, opacity: 0.6 }); // Grey glass-like
            const enclosureMesh = new Mesh(geometry, material);
            enclosureMesh.position.set(x, height / 2, z);
            scene.add(enclosureMesh);
            enclosures.push({ mesh: enclosureMesh, petType: petType, bounds: new Box3().setFromObject(enclosureMesh) });
            return enclosureMesh;
        }

        // Enclosure positions
        const enclosureSpacing = 7;
        const startX = -shopSize.width / 2 + 5;
        const startZ = -shopSize.depth / 2 + 5;

        // Puppy pen (left side)
        const puppyPen = createEnclosure(5, 2, 5, startX, startZ, "Puppy");
        petTypes.find(p => p.name === "Puppy").enclosure = puppyPen;

        // Kitten area (left side, further back)
        const kittenEnclosure = createEnclosure(5, 2, 5, startX, startZ + enclosureSpacing, "Kitten");
        petTypes.find(p => p.name === "Kitten").enclosure = kittenEnclosure;

        // Hamster cages (right side)
        const hamsterEnclosure1 = createEnclosure(3, 1, 3, -startX, startZ, "Hamster");
        petTypes.find(p => p.name === "Hamster").enclosure = hamsterEnclosure1; // Hamsters share one enclosure for now

        // Parrot cage (right side)
        const parrotEnclosure = createEnclosure(3, 3, 3, -startX, startZ + enclosureSpacing, "Parrot");
        petTypes.find(p => p.name === "Parrot").enclosure = parrotEnclosure;

        // Fish tank (middle, back wall)
        const fishTank = createEnclosure(4, 2, 2, 0, startZ + enclosureSpacing * 2, "Goldfish");
        petTypes.find(p => p.name === "Goldfish").enclosure = fishTank;


        // --- PETS ---
        const pets = []; // Array to hold all pet objects
        const petHappinessMeters = new Map(); // Map pet object to its HTML meter element

        function createPet(typeData, position) {
            const pet = {
                id: Math.random().toString(36).substring(7),
                type: typeData.name,
                modelName: typeData.modelName,
                mesh: null,
                mixer: null,
                animations: {},
                happiness: 100,
                sadnessTimer: 0,
                isSad: false,
                htmlMeter: null,
                enclosure: typeData.enclosure // Reference to the enclosure mesh
            };

            // Create HTML happiness meter
            const meterWrapper = document.createElement('div');
            meterWrapper.className = 'happiness-meter-wrapper';
            meterWrapper.id = `pet-meter-${pet.id}`;
            const meter = document.createElement('div');
            meter.className = 'happiness-meter';
            const bar = document.createElement('div');
            bar.className = 'happiness-bar';
            meter.appendChild(bar);
            meterWrapper.appendChild(meter);
            document.getElementById('ui').appendChild(meterWrapper);
            pet.htmlMeter = { wrapper: meterWrapper, bar: bar };
            petHappinessMeters.set(pet, pet.htmlMeter);

            loadModel(typeData.modelName).then(model => {
                if (model) {
                    pet.mesh = model;
                    pet.mesh.scale.setScalar(typeData.scale);
                    pet.mesh.position.copy(position);
                    // Ensure pet is on the floor of its enclosure
                    if (pet.enclosure) {
                        const enclosureBounds = new Box3().setFromObject(pet.enclosure);
                        pet.mesh.position.y = enclosureBounds.min.y + (modelSize(typeData.modelName)?.y * typeData.scale / 2 || typeData.scale / 2); // Place on enclosure floor
                    } else {
                        pet.mesh.position.y = 0; // Default to ground if no enclosure specified
                    }


                    scene.add(pet.mesh);

                    if (model.animations && model.animations.length > 0) {
                        pet.mixer = new AnimationMixer(pet.mesh);
                        model.animations.forEach(clip => {
                            pet.animations[clip.name.toLowerCase()] = pet.mixer.clipAction(clip);
                        });
                        // Play a default animation if available
                        pet.animations['idle']?.play();
                        pet.animations['walk']?.play(); // If walk is the only non-idle, for motion
                    }
                    if (pet.type === "Goldfish") {
                         // Simple fish movement
                         pet.mesh.userData.swimDirection = new Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
                         pet.mesh.userData.swimSpeed = 0.5 + Math.random() * 0.5;
                         pet.mesh.userData.turnTimer = 0;
                    }
                } else {
                    // Placeholder if model fails to load
                    console.warn(`Failed to load model for ${typeData.name}, using primitive.`);
                    const geometry = typeData.name === "Hamster" ? new SphereGeometry(typeData.scale / 2) :
                                     typeData.name === "Parrot" ? new ConeGeometry(typeData.scale / 2, typeData.scale) :
                                     new BoxGeometry(typeData.scale, typeData.scale, typeData.scale);
                    const material = new MeshStandardMaterial({ color: 0x00ff00 });
                    pet.mesh = new Mesh(geometry, material);
                    pet.mesh.position.copy(position);
                    pet.mesh.position.y += typeData.scale / 2; // Lift off ground
                    scene.add(pet.mesh);
                }
            });
            pets.push(pet);
            return pet;
        }

        // Populate enclosures with pets
        function populatePets() {
            createPet(petTypes.find(p => p.name === "Puppy"), puppyPen.position.clone().add(new Vector3(0, 0.5, 0)));
            createPet(petTypes.find(p => p.name === "Kitten"), kittenEnclosure.position.clone().add(new Vector3(0, 0.5, 0)));
            createPet(petTypes.find(p => p.name === "Hamster"), hamsterEnclosure1.position.clone().add(new Vector3(0, 0.2, 0)));
            createPet(petTypes.find(p => p.name === "Parrot"), parrotEnclosure.position.clone().add(new Vector3(0, 1, 0)));
            createPet(petTypes.find(p => p.name === "Goldfish"), fishTank.position.clone().add(new Vector3(0, 0.5, 0)));
        }
        populatePets();


        // --- CUSTOMER DATA ---
        const customerTypes = [
            { name: "Scientist", modelName: "scientist", preferredPet: "Puppy", thoughtBubble: "A loyal friend!" },
            { name: "Police Officer", modelName: "police_officer", preferredPet: "Kitten", thoughtBubble: "A playful companion!" },
            { name: "Footballer", modelName: "footballer_blue", preferredPet: "Hamster", thoughtBubble: "Something small and active!" },
            { name: "Grandpa", modelName: "grandpa", preferredPet: "Goldfish", thoughtBubble: "A peaceful fish for my pond." },
            { name: "Girl", modelName: "girl", preferredPet: "Puppy", thoughtBubble: "A fluffy puppy!" },
            { name: "Woman", modelName: "woman", preferredPet: "Parrot", thoughtBubble: "A chatty bird!" },
            { name: "Man", modelName: "man", preferredPet: "Kitten", thoughtBubble: "A cuddly kitten!" },
            { name: "Plumber", modelName: "plumber", preferredPet: "Hamster", thoughtBubble: "Needs a wheel to run on!" },
            { name: "Mascot", modelName: "mascot", preferredPet: "Any", thoughtBubble: "Any happy pet!" }, // Generic customer
        ];
        const customers = [];
        let customerSpawnTimer = 0;
        const customerSpawnInterval = 10; // Every 10-20 seconds
        const customerMaxCount = 3; // Max customers in store at once

        function createCustomer() {
            if (customers.length >= customerMaxCount) return; // Limit customers

            const typeData = customerTypes[Math.floor(Math.random() * customerTypes.length)];
            const customer = {
                id: Math.random().toString(36).substring(7),
                type: typeData.name,
                modelName: typeData.modelName,
                preferredPet: typeData.preferredPet,
                thoughtBubbleText: typeData.thoughtBubble,
                mesh: null,
                mixer: null,
                animations: {},
                targetPet: null,
                state: 'entering', // 'entering', 'browsing', 'seeking_pet', 'adopting', 'leaving'
                speed: 1.5,
                htmlThoughtBubble: null,
            };

            const thoughtBubble = document.createElement('div');
            thoughtBubble.className = 'customer-thought';
            thoughtBubble.id = `customer-thought-${customer.id}`;
            thoughtBubble.innerHTML = `<img src="https://placehold.it/30x30?text=?" alt="Pet type"> ${customer.thoughtBubbleText}`;
            document.getElementById('ui').appendChild(thoughtBubble);
            customer.htmlThoughtBubble = thoughtBubble;

            loadModel(typeData.modelName).then(model => {
                if (model) {
                    customer.mesh = model;
                    customer.mesh.scale.setScalar(0.7);
                    customer.mesh.position.set(0, 0, shopSize.depth / 2 + 3); // Start outside door
                    customer.mesh.rotation.y = Math.PI; // Face inwards
                    scene.add(customer.mesh);

                    if (model.animations && model.animations.length > 0) {
                        customer.mixer = new AnimationMixer(customer.mesh);
                        model.animations.forEach(clip => {
                            customer.animations[clip.name.toLowerCase()] = customer.mixer.clipAction(clip);
                        });
                        customer.animations['walk']?.play(); // Start walking
                    }

                    customers.push(customer);
                }
            });
        }

        function updateCustomers(delta) {
            customerSpawnTimer -= delta;
            if (customerSpawnTimer <= 0) {
                createCustomer();
                customerSpawnTimer = customerSpawnInterval + Math.random() * 10; // Next spawn in 10-20s
            }

            for (let i = customers.length - 1; i >= 0; i--) {
                const customer = customers[i];
                if (!customer.mesh) continue;

                customer.mixer?.update(delta);

                let targetPosition;

                switch (customer.state) {
                    case 'entering':
                        targetPosition = new Vector3(0, 0, shopSize.depth / 2 - 2); // Just inside the door
                        customer.mesh.lookAt(targetPosition.x, customer.mesh.position.y, targetPosition.z);
                        customer.mesh.position.lerp(targetPosition, customer.speed * delta);
                        if (customer.mesh.position.distanceTo(targetPosition) < 0.5) {
                            customer.state = 'browsing';
                            customer.mesh.rotation.y = Math.random() * Math.PI * 2; // Look around
                            customer.animations['idle']?.play();
                            customer.animations['walk']?.stop();
                        }
                        break;

                    case 'browsing':
                        // Display thought bubble
                        updateHTMLObjectPosition(customer.mesh, customer.htmlThoughtBubble, 1.8);
                        customer.htmlThoughtBubble.style.display = 'block';

                        // Look for a suitable pet
                        customer.targetPet = pets.find(pet =>
                            pet.mesh &&
                            pet.happiness > 80 && // Pet must be happy
                            !pet.isSad &&
                            (customer.preferredPet === "Any" || pet.type === customer.preferredPet)
                        );

                        if (customer.targetPet) {
                            customer.state = 'seeking_pet';
                            customer.animations['walk']?.play();
                            customer.animations['idle']?.stop();
                        } else {
                            // If no pet found, customer might leave after some time
                            // For simplicity, they just browse indefinitely until a pet is happy enough
                            customer.mesh.rotation.y += delta * 0.2; // Slowly turn
                        }
                        break;

                    case 'seeking_pet':
                        if (!customer.targetPet || !customer.targetPet.mesh || customer.targetPet.happiness <= 80 || customer.targetPet.isSad) {
                            customer.state = 'browsing'; // Pet became unhappy or was adopted
                            customer.animations['idle']?.play();
                            customer.animations['walk']?.stop();
                            customer.targetPet = null;
                            continue;
                        }

                        targetPosition = customer.targetPet.enclosure.position.clone();
                        targetPosition.z += (customer.targetPet.enclosure.geometry.parameters.depth / 2) + 1; // Stand in front of enclosure
                        customer.mesh.lookAt(targetPosition.x, customer.mesh.position.y, targetPosition.z);
                        customer.mesh.position.lerp(targetPosition, customer.speed * delta);

                        if (customer.mesh.position.distanceTo(targetPosition) < 1) {
                            customer.state = 'adopting';
                            customer.animations['idle']?.play();
                            customer.animations['walk']?.stop();
                            adoptPet(customer, customer.targetPet);
                        }
                        break;

                    case 'leaving':
                        targetPosition = new Vector3(0, 0, shopSize.depth / 2 + 3); // Outside door
                        customer.mesh.lookAt(targetPosition.x, customer.mesh.position.y, targetPosition.z);
                        customer.mesh.position.lerp(targetPosition, customer.speed * delta);
                        customer.htmlThoughtBubble.style.display = 'none'; // Hide bubble when leaving
                        if (customer.mesh.position.distanceTo(targetPosition) < 0.5) {
                            scene.remove(customer.mesh);
                            customer.htmlThoughtBubble.remove();
                            customers.splice(i, 1);
                        }
                        break;
                }
            }
        }

        function adoptPet(customer, pet) {
            // Remove pet from available pets
            const petIndex = pets.findIndex(p => p.id === pet.id);
            if (petIndex > -1) {
                pets.splice(petIndex, 1); // Remove the pet object from the game's pets array
            }
            pet.htmlMeter.wrapper.remove(); // Remove its happiness meter

            // Parent the pet to the customer for a "leaving" animation
            customer.mesh.add(pet.mesh);
            pet.mesh.position.set(0.5, 0.5, 0.5); // Carry pet
            pet.mesh.rotation.y = Math.PI / 2; // Turn pet sideways

            adoptionsCount++;
            scoreDisplay.textContent = `Adoptions: ${adoptionsCount}`;
            coins += Math.floor(Math.random() * 150) + 50; // 50-200 coins
            updateCoinsDisplay();
            playSound('coins');

            customer.state = 'leaving';
            customer.animations['walk']?.play(); // Start walking again
            customer.animations['idle']?.stop();

            // Check win condition
            if (adoptionsCount >= 10) {
                endGame('win');
            }
        }

        // --- GAME LOOP ---
        let lastTimestamp = performance.now();
        let frameSkipper = 0; // For 60fps cap

        function animate() {
            if (!on) return; // Pause if tab is not active

            requestAnimationFrame(animate);

            const now = performance.now();
            if (now - lastTimestamp < 1000 / 60) { // Cap to 60fps
                return;
            }
            const delta = Math.min((now - lastTimestamp) / 1000, 0.05); // Cap delta to 50ms
            lastTimestamp = now;

            if (gameState !== 'playing') return;

            // --- TIMER ---
            gameTimeRemaining -= delta;
            if (gameTimeRemaining <= 0) {
                gameTimeRemaining = 0;
                endGame('lose');
            }
            timerDisplay.textContent = `Time: ${Math.max(0, Math.floor(gameTimeRemaining))}s`;

            // --- PLAYER MOVEMENT & ANIMATION ---
            if (player) {
                const actualPlayerSpeed = playerSpeed;
                playerDirection.set(0, 0, 0);

                if (moveForward) playerDirection.z -= 1;
                if (moveBackward) playerDirection.z += 1;
                if (moveLeft) playerDirection.x -= 1;
                if (moveRight) playerDirection.x += 1;

                if (playerDirection.lengthSq() > 0) {
                    playerDirection.normalize().multiplyScalar(actualPlayerSpeed * delta);
                    player.position.add(playerDirection.applyQuaternion(player.quaternion)); // Move relative to player's facing
                    // Keep player within shop boundaries
                    player.position.x = Math.max(-shopSize.width / 2 + 1, Math.min(shopSize.width / 2 - 1, player.position.x));
                    player.position.z = Math.max(-shopSize.depth / 2 + 1, Math.min(shopSize.depth / 2 + 1, player.position.z));

                    // Simple rotation to face direction of movement
                    const targetAngle = Math.atan2(playerDirection.x, playerDirection.z);
                    player.rotation.y = MathUtils.lerp(player.rotation.y, targetAngle, 0.1);

                    // Player animation
                    if (playerAnimations['walk'] && !playerAnimations['walk'].isRunning()) {
                        playerAnimations['walk'].play();
                        playerAnimations['idle']?.stop();
                    }
                } else {
                    if (playerAnimations['idle'] && !playerAnimations['idle'].isRunning()) {
                        playerAnimations['idle'].play();
                        playerAnimations['walk']?.stop();
                    }
                }
                playerMixer?.update(delta);

                // Camera follow
                camera.position.x = MathUtils.lerp(camera.position.x, player.position.x, 0.05);
                camera.position.z = MathUtils.lerp(camera.position.z, player.position.z + 5, 0.05);
                camera.lookAt(player.position.x, player.position.y + 1, player.position.z);
            }

            // --- PET UPDATES ---
            for (const pet of pets) {
                if (!pet.mesh) continue;

                pet.mixer?.update(delta);

                // Goldfish swimming
                if (pet.type === "Goldfish") {
                    const enclosureBounds = new Box3().setFromObject(pet.enclosure);
                    const meshBounds = new Box3().setFromObject(pet.mesh);
                    const meshSize = meshBounds.getSize(new Vector3());

                    pet.mesh.position.add(pet.mesh.userData.swimDirection.clone().multiplyScalar(pet.mesh.userData.swimSpeed * delta));

                    // Bounce off enclosure walls
                    if (pet.mesh.position.x < enclosureBounds.min.x + meshSize.x / 2 || pet.mesh.position.x > enclosureBounds.max.x - meshSize.x / 2) {
                        pet.mesh.userData.swimDirection.x *= -1;
                        playSound('pop');
                    }
                    if (pet.mesh.position.z < enclosureBounds.min.z + meshSize.z / 2 || pet.mesh.position.z > enclosureBounds.max.z - meshSize.z / 2) {
                        pet.mesh.userData.swimDirection.z *= -1;
                        playSound('pop');
                    }
                    // Prevent fish from going too high/low in tank
                    pet.mesh.position.y = Math.max(enclosureBounds.min.y + meshSize.y / 2, Math.min(enclosureBounds.max.y - meshSize.y / 2, pet.mesh.position.y));

                    // Smooth rotation towards swim direction
                    const targetQuaternion = new Quaternion().setFromUnitVectors(new Vector3(0, 0, 1), pet.mesh.userData.swimDirection);
                    pet.mesh.quaternion.slerp(targetQuaternion, 0.1);

                    // Random turn
                    pet.mesh.userData.turnTimer -= delta;
                    if (pet.mesh.userData.turnTimer <= 0) {
                        pet.mesh.userData.swimDirection.set(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
                        pet.mesh.userData.swimSpeed = 0.5 + Math.random() * 0.5;
                        pet.mesh.userData.turnTimer = 2 + Math.random() * 3; // Turn every 2-5 seconds
                    }
                }
                // Hamster/Parrot simple movement (placeholder)
                if (pet.type === "Hamster" || pet.type === "Parrot") {
                    pet.mesh.rotation.y += delta * 1.5;
                    pet.mesh.position.y = pet.enclosure.position.y + pet.enclosure.geometry.parameters.height / 2 + Math.sin(clock.elapsedTime * 5) * 0.1; // Bobbing
                }


                // Happiness decrease
                pet.happiness = Math.max(0, pet.happiness - (delta / 5) * 1); // Decrease by 1% every 5 seconds
                updateHappinessMeter(pet);

                // Sadness mechanic
                if (pet.happiness < 20) {
                    pet.sadnessTimer += delta;
                    if (pet.sadnessTimer >= 60 && !pet.isSad) {
                        pet.isSad = true;
                        sadPetsCount++;
                        sadPetsDisplay.textContent = `Sad Pets: ${sadPetsCount}/3`;
                        console.log(`${pet.type} is now sad! Total sad pets: ${sadPetsCount}`);
                        if (sadPetsCount >= 3) {
                            endGame('lose');
                        }
                    }
                    // Visual cue for sadness (e.g., color tint)
                    if (pet.isSad && pet.mesh.material.color) {
                        pet.mesh.material.color.set(0x888888); // Greyish for sad
                    }
                } else {
                    pet.sadnessTimer = 0;
                    if (pet.isSad) {
                        pet.isSad = false;
                        sadPetsCount--;
                        sadPetsDisplay.textContent = `Sad Pets: ${sadPetsCount}/3`;
                        // Restore original color
                        if (pet.mesh.material.color) {
                            pet.mesh.material.color.set(0xffffff); // Or whatever default color
                        }
                    }
                }

                // Update HTML meter position
                updateHTMLObjectPosition(pet.mesh, pet.htmlMeter.wrapper, 0.8); // Offset meter above pet
                pet.htmlMeter.wrapper.style.display = 'block'; // Ensure it's visible
            }

            // --- CUSTOMER UPDATES ---
            updateCustomers(delta);

            renderer.render(scene, camera);
        }

        // --- GAME STATE AND UI UPDATES ---
        let on = true; // Flag to control game loop
        const setOn = (v) => {
            if (v === on) return;
            on = v;
            if (v) {
                clock.getDelta(); // Reset clock delta on resume
                lastTimestamp = performance.now(); // Reset last timestamp too
                requestAnimationFrame(animate);
            }
        };
        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        addEventListener('blur', () => setOn(false));
        addEventListener('focus', () => setOn(true));

        function updateCoinsDisplay() {
            coinsDisplay.textContent = `Coins: ${coins}`;
        }

        function updateHappinessMeter(pet) {
            if (!pet.htmlMeter || !pet.htmlMeter.bar) return;

            const bar = pet.htmlMeter.bar;
            bar.style.width = `${pet.happiness}%`;

            if (pet.happiness > 70) {
                bar.style.backgroundColor = 'limegreen';
            } else if (pet.happiness > 30) {
                bar.style.backgroundColor = 'orange';
            } else {
                bar.style.backgroundColor = 'red';
            }
        }

        // Helper to position HTML elements over 3D objects
        function updateHTMLObjectPosition(object3D, htmlElement, offsetFactor = 1.0) {
            if (!object3D || !htmlElement) return;

            // Get the 3D position of the object (usually its center)
            const objectPosition = new Vector3();
            object3D.getWorldPosition(objectPosition);

            // Get the object's approximate height to place the meter above it
            const bbox = new Box3().setFromObject(object3D);
            const height = bbox.isEmpty() ? 1 : bbox.max.y - bbox.min.y; // Fallback height

            // Project 3D position to 2D screen coordinates
            const screenPosition = objectPosition.clone().add(new Vector3(0, height * offsetFactor, 0)).project(camera);

            const canvas = renderer.domElement;
            const x = (screenPosition.x + 1) / 2 * canvas.clientWidth;
            const y = (-screenPosition.y + 1) / 2 * canvas.clientHeight;

            htmlElement.style.left = `${x}px`;
            htmlElement.style.top = `${y}px`;
        }


        function handleInteraction() {
            if (!player) return;

            const playerPos = player.position;
            let closestPet = null;
            let minDistance = INTERACT_DISTANCE;

            for (const pet of pets) {
                if (pet.mesh) {
                    const dist = playerPos.distanceTo(pet.mesh.position);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestPet = pet;
                    }
                }
            }

            if (closestPet) {
                if (selectedItem) {
                    // Use selected item on pet
                    interactWithPet(closestPet, selectedItem.name);
                    deselectItem();
                } else {
                    // General interaction (e.g., petting, playing)
                    interactWithPet(closestPet, "Petting");
                }
            } else {
                playSound('error');
                console.log("No pet to interact with!");
            }
        }

        function interactWithPet(pet, action) {
            let happinessIncrease = 0;
            let sound = 'pop';

            if (action === "Petting") {
                happinessIncrease = 15;
                playSound('confirm');
            } else {
                const item = inventoryItemsData.find(i => i.name === action);
                if (item) {
                    if (coins >= item.cost) {
                        coins -= item.cost;
                        updateCoinsDisplay();
                        happinessIncrease = item.happinessBoost;
                        sound = 'coin_pickup'; // Sound for using an item
                        console.log(`Used ${action} on ${pet.type}. Happiness +${happinessIncrease}. Coins left: ${coins}`);
                    } else {
                        playSound('error');
                        console.log("Not enough coins to buy this item!");
                        return; // Don't increase happiness if cannot afford
                    }
                }
            }

            if (happinessIncrease > 0) {
                pet.happiness = Math.min(100, pet.happiness + happinessIncrease);
                updateHappinessMeter(pet);
                playSound(sound);
                console.log(`${pet.type} happiness: ${pet.happiness}`);
            }
        }


        // --- GAME OVER / WIN ---
        function endGame(result) {
            gameState = result;
            gameMessages.style.display = 'flex'; // Show message
            if (result === 'win') {
                messageText.textContent = `You Win! You adopted ${adoptionsCount} pets!`;
                playSound('jingle_win');
            } else {
                messageText.textContent = `Game Over! You adopted ${adoptionsCount} pets.`;
                playSound('game_over');
            }
            setOn(false); // Pause game loop
        }

            });

            updateCoinsDisplay();
            scoreDisplay.textContent = `Adoptions: ${adoptionsCount}`;
            sadPetsDisplay.textContent = `Sad Pets: ${sadPetsCount}/3`;

            // Start music (optional)
            playMusic('bg_loop_playful');

            animate(); // Start the game loop!
        }

        init();

        // --- WINDOW RESIZE HANDLING ---
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

    </script>
</body>
</html>

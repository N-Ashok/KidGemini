        matrix.compose(__arPos, __arQuat, __arScale);
        for (var m = 0; m < meshes.length; m++) {
          meshes[m].setMatrixAt(i, matrix);
          meshes[m].instanceMatrix.needsUpdate = true;
        }
      },
      boundsAt: function (i) {
        if (!parts.length) return new Box3();
        meshes[0].getMatrixAt(i, matrix);
        box.copy(parts[0].geometry.boundingBox).applyMatrix4(matrix);
        return box;
      },
    };
  } catch (e) {
    console.warn("[ariantra] loadModelBatch failed:", name, e);
    return null;
  }
};
</script><script>
(function () {
  var ctx = null, buffers = {}, currentMusic = null;
  function context() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      var resume = function () { if (ctx.state === "suspended") ctx.resume(); };
      addEventListener("pointerdown", resume, true);
      addEventListener("keydown", resume, true);
    }
    return ctx;
  }
  function load(name) {
    var url = (window.AR_ASSETS || {})[name];
    if (!url) { console.warn("[ariantra] unknown sound:", name); return Promise.resolve(null); }
    if (!buffers[name]) {
      buffers[name] = fetch(url)
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) {
          return new Promise(function (res, rej) { context().decodeAudioData(ab, res, rej); });
        })
        .catch(function (e) { console.warn("[ariantra] sound failed:", name, e); return null; });
    }
    return buffers[name];
  }
  function trimBounds(buf) {
    var d = buf.getChannelData(0), t = 0.001, s = 0, e = d.length - 1;
    while (s < e && Math.abs(d[s]) < t) s++;
    while (e > s && Math.abs(d[e]) < t) e--;
    return { start: s / buf.sampleRate, end: (e + 1) / buf.sampleRate };
  }
  window.playSound = function (name) {
    try {
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        src.connect(context().destination);
        src.start();
      });
    } catch (e) { /* a silent effect, never a broken game */ }
  };
  window.playMusic = function (name) {
    var handle = { stop: function () {} };
    try {
      if (currentMusic) { try { currentMusic.stop(); } catch (e2) {} currentMusic = null; }
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        var b = trimBounds(buf);
        src.loop = true;
        src.loopStart = b.start;
        src.loopEnd = b.end;
        var gain = context().createGain();
        gain.gain.value = 0.5;
        src.connect(gain);
        gain.connect(context().destination);
        src.start(0, b.start);
        currentMusic = src;
        handle.stop = function () { try { src.stop(); } catch (e3) {} if (currentMusic === src) currentMusic = null; };
      });
    } catch (e) { /* silent */ }
    return handle;
  };
})();

  <title>3D Helicopter City</title>
  <style>
    /* --- BASIC SETUP --- */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh; /* Use dynamic viewport height for mobile */
      overflow: hidden;
      background-color: #87ceeb; /* Sky blue */
    }
    #scene {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* --- UI & SCORE --- */
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      color: white;
      font-family: 'Arial', sans-serif;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      pointer-events: none; /* Let clicks pass through to the game */
      z-index: 10;
    }
    #score {
      font-size: 3em;
      font-weight: bold;
      padding: 20px;
    }
    #instructions {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1em;
      text-align: right;
    }
    #message {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2em;
        font-weight: bold;
        display: none;
    }
    /* --- ON-SCREEN CONTROLS --- */
    .controls {
      position: absolute;
      bottom: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 10px;
      padding-bottom: max(12px, env(safe-area-inset-bottom)); /* Safe area for phone notches */
      box-sizing: border-box;
      z-index: 10;
    }
    .control-group {
      display: flex;
      gap: 10px;
    }
    .control-button {
      width: 60px;
      height: 60px;
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.8);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      user-select: none; /* Prevents text selection on hold */
      cursor: pointer;
    }
    @media (min-width: 768px) {
      .control-button {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>
<body>
  
  
  

  <!-- SCORING -->
  <div id="ui">
    <div id="score">0</div>
    <div id="instructions">
      <b>Keyboard:</b><br>
      Arrows/WASD: Move<br>
      Space: Go Up<br>
      Shift: Go Down
    </div>
    <div id="message"></div>
  </div>

  <!-- GAME CANVAS -->
  <canvas id="scene"></canvas>

  <!-- ON-SCREEN CONTROLS -->
  <div class="controls">
    <div class="control-group">
      <div class="control-button" id="down-btn">&ndash;</div>
      <div class="control-button" id="up-btn">+</div>
    </div>
    <div class="control-group">
      <div class="control-button" id="left-btn">&larr;</div>
      <div class="control-button" id="right-btn">&rarr;</div>
      <div class="control-button" id="forward-btn">&uarr;</div>
    </div>
  </div>

  <script type="module">
    // --- 3D IMPORTS ---
    import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, Euler, Matrix4, InstancedMesh, CylinderGeometry, MathUtils } from "three";

    // --- GAME STATE & CONSTANTS ---
    const scoreElement = document.getElementById('score');
    let score = 0;
    const controls = {
      forward: false,
      left: false,
      right: false,
      up: false,
      down: false,
    };
    const keyMap = {
      ArrowUp: 'forward', w: 'forward',
      ArrowLeft: 'left', a: 'left',
      ArrowRight: 'right', d: 'right',
      ' ': 'up',
      Shift: 'down'
    };

    let player = null;
    let rotor = null;
    let mixer = null;
    let cityObjects = [];
    let stars = [];
    const starInstances = 100;
    const cityRadius = 400;
    const buildingTypes = ["skyscraper", "office_building", "house", "shop"];

    // --- PLAYER MOVEMENT PARAMETERS ---
    let velocity = new Vector3();
    let angularVelocity = 0;
    const maxSpeed = 30; // meters per second
    const acceleration = 20;
    const turnSpeed = 1.5; // radians per second
    const liftSpeed = 15;
    const friction = 0.98;
    const angularFriction = 0.95;

    // --- SETUP SCENE ---
    const scene = new Scene();
    scene.background = new Color(0x87ceeb);
    scene.fog = new Fog(0x87ceeb, cityRadius / 2, cityRadius * 1.5);
    const clock = new Clock();
    const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 25, 40);

    const renderer = new WebGLRenderer({
      canvas: document.getElementById('scene'),
      antialias: true,
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // --- LIGHTING ---
    const ambientLight = new AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(50, 100, 80);
    scene.add(dirLight);

    // --- GROUND ---
    const ground = new Mesh(
      new BoxGeometry(cityRadius * 2, 1, cityRadius * 2),
      new MeshStandardMaterial({ color: 0x555555 })
    );
    ground.position.y = -0.5;
    scene.add(ground);

    // --- PLAYER (HELICOPTER) ---
    function setupPlayer() {
        const placeholder = new Group();
        const body = new Mesh(new BoxGeometry(4, 2, 8), new MeshStandardMaterial({color: 0xff0000}));
        placeholder.add(body);
        scene.add(placeholder);
        player = placeholder;
        player.position.set(0, 10, 0); // Start safely in the air

        // Add a spinning rotor
        rotor = new Mesh(
            new BoxGeometry(6, 0.1, 0.5),
            new MeshStandardMaterial({color: 0x333333})
        );
        rotor.position.y = 1.2;
        player.add(rotor);

        loadModel("helicopter").then(model => {
            if (model) {
                scene.remove(placeholder);
                player = model;
                player.scale.set(1.5, 1.5, 1.5);
                player.position.set(0, 10, 0);
                scene.add(player);

                // Add rotor to the loaded model
                rotor.position.y = 1.3;
                player.add(rotor);
                playSound("whoosh");
            }
        });

        playMusic("bg_loop_playful");
    }

    // --- BUILDINGS (CITY) ---
    function setupCity() {
      buildingTypes.forEach(type => {
        loadModelBatch(type, 50).then(batch => {
          if (!batch) return;
          scene.add(batch.mesh);
          cityObjects.push(batch);

          const size = modelSize(type);
          if (!size) return;

          for (let i = 0; i < 50; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 20 + Math.random() * (cityRadius - 20);
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            const scale = 1 + Math.random();
            const rotationY = Math.random() * Math.PI * 2;

            batch.setInstance(i, {
              position: { x, y: (size.y * scale) / 2, z },
              scale: { x: scale, y: scale, z: scale },
              rotation: { x: 0, y: rotationY, z: 0 }
            });
          }
        });
      });
    }

    // --- COLLECTIBLES (STARS) ---
    function setupStars() {
        loadModel("star").then(model => {
            if (!model) return;
            const starGeometry = model.children[0].geometry.clone();
            const starMaterial = new MeshStandardMaterial({ color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.5 });
            const instancedStars = new InstancedMesh(starGeometry, starMaterial, starInstances);
            scene.add(instancedStars);

            const dummyMatrix = new Matrix4();
            for (let i = 0; i < starInstances; i++) {
                const x = MathUtils.randFloat(-cityRadius, cityRadius);
                const y = MathUtils.randFloat(5, 150);
                const z = MathUtils.randFloat(-cityRadius, cityRadius);
                dummyMatrix.setPosition(x, y, z);
                instancedStars.setMatrixAt(i, dummyMatrix);

                stars.push({
                    position: new Vector3(x, y, z),
                    active: true,
                    id: i
                });
            }
            instancedStars.instanceMatrix.needsUpdate = true;
        });
    }

    // --- CONTROLS ---
    function setupControls() {
        document.addEventListener('keydown', (e) => {
            const action = keyMap[e.key];
            if (action) {
                e.preventDefault();
                controls[action] = true;
            }
        });
        document.addEventListener('keyup', (e) => {
            const action = keyMap[e.key];
            if (action) controls[action] = false;
        });

        const buttons = {
            'forward-btn': 'forward', 'left-btn': 'left', 'right-btn': 'right',
            'up-btn': 'up', 'down-btn': 'down'
        };
        for (const [id, action] of Object.entries(buttons)) {
            const btn = document.getElementById(id);
            btn.addEventListener('pointerdown', () => { controls[action] = true; });
            btn.addEventListener('pointerup', () => { controls[action] = false; });
            btn.addEventListener('pointerleave', () => { controls[action] = false; });
        }
    }

    // --- PLAYER MOVEMENT ---
    function updatePlayer(delta) {
        if (!player) return;

        // --- Apply controls
        const forwardDirection = new Vector3(0, 0, -1).applyQuaternion(player.quaternion);

        if (controls.forward) {
            velocity.add(forwardDirection.multiplyScalar(acceleration * delta));
        }

        if (controls.up) {
            velocity.y += liftSpeed * delta;
        }
        if (controls.down) {
            velocity.y -= liftSpeed * delta;
        }

        if (controls.left) {
            angularVelocity += turnSpeed * delta;
        }
        if (controls.right) {
            angularVelocity -= turnSpeed * delta;
        }

        // --- Apply physics
        velocity.multiplyScalar(friction);
        velocity.y *= 0.9; // Extra vertical drag
        angularVelocity *= angularFriction;

        // Clamp speed
        const horizontalSpeed = new Vector3(velocity.x, 0, velocity.z).length();
        if (horizontalSpeed > maxSpeed) {
            const factor = maxSpeed / horizontalSpeed;
            velocity.x *= factor;
            velocity.z *= factor;
        }
        
        // --- Apply movement
        player.position.add(velocity.clone().multiplyScalar(delta));
        player.rotation.y += angularVelocity;

        // --- Ground collision
        if (player.position.y < 1) {
            player.position.y = 1;
            velocity.y = Math.max(0, velocity.y); // Stop falling, allow bouncing up
            
            // "Damage" effect if we hit the ground too hard
            if (velocity.y < -5) {
                playSound("pop");
            }
        }
        
        // --- Spin rotor
        if(rotor) rotor.rotation.y += 40 * delta;
    }

    // --- CAMERA ---
    function updateCamera() {
        if (!player) return;

        const offset = new Vector3(0, 8, 20); // Behind and above
        offset.applyQuaternion(player.quaternion);
        const targetPosition = player.position.clone().add(offset);
        
        camera.position.lerp(targetPosition, 0.1);
        
        const lookAtPosition = player.position.clone().add(new Vector3(0, 5, 0));
        camera.lookAt(lookAtPosition);
    }
    
    // --- COLLISION DETECTION ---
    function checkCollisions() {
        if (!player) return;

        const playerBox = new Box3().setFromObject(player);

        // Check star collisions
        const playerCenter = player.position;
        for (const star of stars) {
            if (star.active && playerCenter.distanceTo(star.position) < 5) {
                star.active = false;
                
                // Hide the collected star - find its InstancedMesh and scale it to 0
                const instancedMesh = scene.children.find(c => c.isInstancedMesh);
                if (instancedMesh) {
                    const matrix = new Matrix4().makeScale(0, 0, 0);
                    instancedMesh.setMatrixAt(star.id, matrix);
                    instancedMesh.instanceMatrix.needsUpdate = true;
                }
                
                // Update score
                score++;
                scoreElement.innerText = score;
                playSound("coin_pickup");
            }
        }
        
        // Check building collisions (simple bounce)
        for (const batch of cityObjects) {
            for (let i = 0; i < batch.count; i++) {
                const box = batch.boundsAt(i);
                if (box && playerBox.intersectsBox(box)) {
                    playSound("pop");
                    // Simple bounce back
                    velocity.multiplyScalar(-0.5);
                    player.position.add(velocity.clone().multiplyScalar(0.1)); // Nudge out
                    return; // Only one collision per frame
                }
            }
        }
    }

    // --- WINDOW RESIZE ---
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);

    // --- MAIN GAME LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.05); // Cap delta

      updatePlayer(delta);
      updateCamera();
      checkCollisions();

      renderer.render(scene, camera);
    }

    // --- START GAME ---
    setupControls();
    onWindowResize();
    setupPlayer();
    setupCity();
    setupStars();
    animate();
  </script>
</body>

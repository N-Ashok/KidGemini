        meshes[0].getMatrixAt(i, matrix);
        box.copy(parts[0].geometry.boundingBox).applyMatrix4(matrix);
        return box;
      },
    };
  } catch (e) {
    console.warn("[ariantra] loadModelBatch failed:", name, e);
    return null;
  }
};
</script><script>
(function () {
  var ctx = null, buffers = {}, currentMusic = null;
  function context() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      var resume = function () { if (ctx.state === "suspended") ctx.resume(); };
      addEventListener("pointerdown", resume, true);
      addEventListener("keydown", resume, true);
    }
    return ctx;
  }
  function load(name) {
    var url = (window.AR_ASSETS || {})[name];
    if (!url) { console.warn("[ariantra] unknown sound:", name); return Promise.resolve(null); }
    if (!buffers[name]) {
      buffers[name] = fetch(url)
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) {
          return new Promise(function (res, rej) { context().decodeAudioData(ab, res, rej); });
        })
        .catch(function (e) { console.warn("[ariantra] sound failed:", name, e); return null; });
    }
    return buffers[name];
  }
  function trimBounds(buf) {
    var d = buf.getChannelData(0), t = 0.001, s = 0, e = d.length - 1;
    while (s < e && Math.abs(d[s]) < t) s++;
    while (e > s && Math.abs(d[e]) < t) e--;
    return { start: s / buf.sampleRate, end: (e + 1) / buf.sampleRate };
  }
  window.playSound = function (name) {
    try {
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        src.connect(context().destination);
        src.start();
      });
    } catch (e) { /* a silent effect, never a broken game */ }
  };
  window.playMusic = function (name) {
    var handle = { stop: function () {} };
    try {
      if (currentMusic) { try { currentMusic.stop(); } catch (e2) {} currentMusic = null; }
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        var b = trimBounds(buf);
        src.loop = true;
        src.loopStart = b.start;
        src.loopEnd = b.end;
        var gain = context().createGain();
        gain.gain.value = 0.5;
        src.connect(gain);
        gain.connect(context().destination);
        src.start(0, b.start);
        currentMusic = src;
        handle.stop = function () { try { src.stop(); } catch (e3) {} if (currentMusic === src) currentMusic = null; };
      });
    } catch (e) { /* silent */ }
    return handle;
  };
})();
</script>
    <title>3D Dino World</title>
    <style>
        /* --- BASIC SETUP --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            color: #fff;
        }

        /* --- 3D SCENE --- */
        #scene {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- ON-SCREEN INFO --- */
        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            font-size: 18px;
            text-shadow: 2px 2px 4px #000;
        }
        #score {
            font-weight: bold;
            font-size: 22px;
            color: #FFD700; /* Gold */
        }

        /* --- ON-SCREEN CONTROLS --- */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            pointer-events: none;
        }
        .dpad {
            display: grid;
            grid-template-columns: 50px 50px 50px;
            grid-template-rows: 50px 50px 50px;
            gap: 5px;
            opacity: 0.7;
            pointer-events: all;
        }
        .dpad-button {
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            user-select: none;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        #up { grid-area: 1 / 2 / 2 / 3; }
        #left { grid-area: 2 / 1 / 3 / 2; }
        #right { grid-area: 2 / 3 / 3 / 4; }
        #down { grid-area: 3 / 2 / 4 / 3; }
    </style>
</head>
<body>




<canvas id="scene"></canvas>

<!-- SCORING -->
<div id="info-panel">
    Fruits Eaten: <span id="score">0</span><br>
    <small>Use Arrow Keys or WASD to move!</small>
</div>

<!-- ON-SCREEN CONTROLS -->
<div id="controls">
    <div class="dpad">
        <div id="up" class="dpad-button">⬆️</div>
        <div id="left" class="dpad-button">⬅️</div>
        <div id="right" class="dpad-button">➡️</div>
        <div id="down" class="dpad-button">⬇️</div>
    </div>
</div>

<script type="module">
    // --- IMPORTS ---
    import {
        Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3,
        Box3, SphereGeometry, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight,
        PlaneGeometry, MathUtils, AnimationMixer
    } from "three";

    // --- GAME SETUP ---
    const scene = new Scene();
    scene.background = new Color(0x87CEEB);
    scene.fog = new Fog(0x87CEEB, 50, 150);

    const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new WebGLRenderer({
        canvas: document.getElementById('scene'),
        antialias: true,
        preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const clock = new Clock();
    let score = 0;
    const scoreElement = document.getElementById('score');
    let gameIsReady = false;

    // --- LIGHTS ---
    const ambientLight = new AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const directionalLight = new DirectionalLight(0xffffff, 1.2);
    directionalLight.position.set(10, 20, 5);
    scene.add(directionalLight);

    // --- GROUND ---
    const groundGeometry = new PlaneGeometry(200, 200);
    const groundMaterial = new MeshStandardMaterial({ color: 0x228B22 }); // Forest green
    const ground = new Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // --- PLAYER (DINO) ---
    let player = null;
    let playerMixer = null;
    let playerAnimations = {};
    const playerSpeed = 5;
    const playerVelocity = new Vector3();
    const playerTargetRotation = new Vector3();
    const playerBoundingBox = new Box3();
    
    // Placeholder while model loads
    const placeholder = new Mesh(new SphereGeometry(0.5, 16, 16), new MeshStandardMaterial({ color: 0x00ff00 }));
    placeholder.position.y = 0.5;
    scene.add(placeholder);

    loadModel("dino").then(model => {
        if (model) {
            scene.remove(placeholder);
            player = model;
            player.scale.set(0.8, 0.8, 0.8);
            player.position.y = 0;
            scene.add(player);

            playerMixer = new AnimationMixer(player);
            const walkClip = model.animations.find(a => /walk/i.test(a.name));
            const idleClip = model.animations.find(a => /idle/i.test(a.name));
            
            if (walkClip) playerAnimations.walk = playerMixer.clipAction(walkClip);
            if (idleClip) {
                playerAnimations.idle = playerMixer.clipAction(idleClip);
                playerAnimations.idle.play();
            }

            // Safety start: ensure player is safe for 3 seconds
            setTimeout(() => { gameIsReady = true; }, 3000);
        } else {
            // Fallback if model fails
            player = placeholder;
            setTimeout(() => { gameIsReady = true; }, 3000);
        }
        playMusic("bg_loop_gentle");
    });
    
    function setAnimation(name) {
        if (!playerMixer || !playerAnimations[name]) return;
        for (const key in playerAnimations) {
            if (key !== name) playerAnimations[key].fadeOut(0.3);
        }
        playerAnimations[name].reset().fadeIn(0.3).play();
    }


    // --- SCENERY (TREES) ---
    const treeTypes = ["snow_pine", "snow_birch", "snow_dead_tree"];
    const treeContainer = new Group();
    scene.add(treeContainer);
    
    function createTrees(treeType, count) {
        loadModelBatch(treeType, count).then(instancedMesh => {
            if (!instancedMesh) return;
            for (let i = 0; i < count; i++) {
                const x = MathUtils.randFloatSpread(180);
                const z = MathUtils.randFloatSpread(180);
                if (Math.abs(x) < 10 && Math.abs(z) < 10) continue; // Don't block spawn area
                instancedMesh.setInstance(i, {
                    position: { x, y: 0, z },
                    scale: { x: 5, y: 5, z: 5 },
                    rotation: { x: 0, y: Math.random() * Math.PI * 2, z: 0 }
                });
            }
            treeContainer.add(instancedMesh.mesh);
        });
    }
    createTrees("snow_pine", 50);
    createTrees("snow_birch", 50);
    createTrees("snow_dead_tree", 30);


    // --- COLLECTIBLES (FRUITS) ---
    const fruits = [];
    const fruitGeometry = new SphereGeometry(0.3, 16, 16);
    const fruitMaterial = new MeshStandardMaterial({ color: 0xff4500 }); // OrangeRed
    const numFruits = 20;

    for (let i = 0; i < numFruits; i++) {
        const fruit = new Mesh(fruitGeometry, fruitMaterial);
        fruit.userData.boundingBox = new Box3().setFromObject(fruit);
        fruits.push(fruit);
        scene.add(fruit);
        respawnFruit(fruit);
    }
    
    function respawnFruit(fruit) {
        const x = MathUtils.randFloatSpread(180);
        const z = MathUtils.randFloatSpread(180);
        fruit.position.set(x, 1, z);
        fruit.visible = true;
    }


    // --- CONTROLS ---
    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

    function handleKeyDown(event) {
        if (event.key in keys) {
            keys[event.key] = true;
            if (event.key.includes("Arrow") || event.key === " ") event.preventDefault();
        }
    }
    function handleKeyUp(event) {
        if (event.key in keys) {
            keys[event.key] = false;
        }
    }
    document.addEventListener('keydown', handleKeyDown);
    document.addEventListener('keyup', handleKeyUp);
    
    const controlMap = { up: 'w', down: 's', left: 'a', right: 'd' };
    document.querySelectorAll('.dpad-button').forEach(button => {
        button.addEventListener('pointerdown', e => {
            e.preventDefault();
            keys[controlMap[e.currentTarget.id]] = true;
        }, { passive: false });
        button.addEventListener('pointerup', e => {
            keys[controlMap[e.currentTarget.id]] = false;
        });
        button.addEventListener('pointerleave', e => { // In case finger slides off
            keys[controlMap[e.currentTarget.id]] = false;
        });
    });

    // --- PLAYER MOVEMENT ---
    function updatePlayer(delta) {
        if (!player) return;

        playerVelocity.set(0, 0, 0);
        let isMoving = false;

        if (keys.w || keys.ArrowUp) { playerVelocity.z -= 1; isMoving = true; }
        if (keys.s || keys.ArrowDown) { playerVelocity.z += 1; isMoving = true; }
        if (keys.a || keys.ArrowLeft) { playerVelocity.x -= 1; isMoving = true; }
        if (keys.d || keys.ArrowRight) { playerVelocity.x += 1; isMoving = true; }

        if (isMoving) {
            setAnimation('walk');
            playerVelocity.normalize().multiplyScalar(playerSpeed * delta);
            player.position.add(playerVelocity);

            playerTargetRotation.y = Math.atan2(playerVelocity.x, playerVelocity.z);
            player.rotation.y = MathUtils.lerp(player.rotation.y, playerTargetRotation.y, 0.2);
        } else {
            setAnimation('idle');
        }

        // Keep player on the ground
        player.position.x = MathUtils.clamp(player.position.x, -98, 98);
        player.position.z = MathUtils.clamp(player.position.z, -98, 98);

        // Update player's bounding box
        playerBoundingBox.setFromObject(player);
    }
    
    // --- COLLISION DETECTION ---
    function checkCollisions() {
        if (!player || !gameIsReady) return;

        fruits.forEach(fruit => {
            if (fruit.visible) {
                fruit.userData.boundingBox.setFromObject(fruit);
                if (playerBoundingBox.intersectsBox(fruit.userData.boundingBox)) {
                    fruit.visible = false;
                    score++;
                    scoreElement.innerText = score;
                    playSound("coin_pickup");
                    // Respawn the fruit after a short delay
                    setTimeout(() => respawnFruit(fruit), 1000);
                }
            }
        });
    }

    // --- CAMERA FOLLOW ---
    const cameraOffset = new Vector3(0, 8, 12);
    function updateCamera() {
        if (!player) return;
        const targetPosition = player.position.clone().add(cameraOffset);
        camera.position.lerp(targetPosition, 0.1);
        camera.lookAt(player.position.clone().add(new Vector3(0, 2, 0)));
    }
    
    // --- RESIZE HANDLING ---
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);
    onWindowResize();
    
    // --- PAUSE ON UNFOCUSED ---
    let on = true;
    const setOn = (v) => { if (v === on) return; on = v; if(v) { clock.getDelta(); requestAnimationFrame(animate); } };
    document.addEventListener('visibilitychange', () => setOn(!document.hidden));
    window.addEventListener('blur', () => setOn(false));
    window.addEventListener('focus', () => setOn(true));

    // --- GAME LOOP ---
    function animate() {
        if (!on) return;
        requestAnimationFrame(animate);

        const delta = Math.min(clock.getDelta(), 0.05);

        updatePlayer(delta);
        checkCollisions();
        updateCamera();
        
        if (playerMixer) {
            playerMixer.update(delta);
        }

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>

      addEventListener("pointerdown", resume, true);
      addEventListener("keydown", resume, true);
    }
    return ctx;
  }
  function load(name) {
    var url = (window.AR_ASSETS || {})[name];
    if (!url) { console.warn("[ariantra] unknown sound:", name); return Promise.resolve(null); }
    if (!buffers[name]) {
      buffers[name] = fetch(url)
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) {
          return new Promise(function (res, rej) { context().decodeAudioData(ab, res, rej); });
        })
        .catch(function (e) { console.warn("[ariantra] sound failed:", name, e); return null; });
    }
    return buffers[name];
  }
  function trimBounds(buf) {
    var d = buf.getChannelData(0), t = 0.001, s = 0, e = d.length - 1;
    while (s < e && Math.abs(d[s]) < t) s++;
    while (e > s && Math.abs(d[e]) < t) e--;
    return { start: s / buf.sampleRate, end: (e + 1) / buf.sampleRate };
  }
  window.playSound = function (name) {
    try {
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        src.connect(context().destination);
        src.start();
      });
    } catch (e) { /* a silent effect, never a broken game */ }
  };
  window.playMusic = function (name) {
    var handle = { stop: function () {} };
    try {
      if (currentMusic) { try { currentMusic.stop(); } catch (e2) {} currentMusic = null; }
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        var b = trimBounds(buf);
        src.loop = true;
        src.loopStart = b.start;
        src.loopEnd = b.end;
        var gain = context().createGain();
        gain.gain.value = 0.5;
        src.connect(gain);
        gain.connect(context().destination);
        src.start(0, b.start);
        currentMusic = src;
        handle.stop = function () { try { src.stop(); } catch (e3) {} if (currentMusic === src) currentMusic = null; };
      });
    } catch (e) { /* silent */ }
    return handle;
  };
})();
</script>

<body>
    
    
    

    <div id="game-container">
        <canvas id="scene"></canvas>
        <div id="ui">
            <div id="score-display">Fruits Collected: <span id="score">0</span> / 50</div>

                <b>Zoom:</b> Mouse scroll<br>

            </div>
        </div>
        <div id="palette-container"></div>
        <div id="controls">
            <div class="control-group">
                <button class="control-button" id="move-left">◀</button>
                <button class="control-button" id="move-back">▼</button>
                <button class="control-button" id="move-right">▶</button>
            </div>
            <button class="control-button" id="move-forward">▲</button>
        </div>
    </div>

    <script type="module">
        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, ConeGeometry, CylinderGeometry, PlaneGeometry, MeshStandardMaterial, MeshBasicMaterial, Mesh, AmbientLight, DirectionalLight, Quaternion, Euler, Matrix4, Vector2, MathUtils, Raycaster, InstancedMesh } from "three";

        // --- GAME STATE ---
        let on = true;
        const setOn = (v) => {
            if (v === on) return;
            on = v;
            if (v) {
                clock.getDelta(); // Reset clock to prevent teleportation
                requestAnimationFrame(animate);
            }
        };
        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        addEventListener('blur', () => setOn(false));
        addEventListener('focus', () => setOn(true));

        const clock = new Clock();
        let lastFrameTime = performance.now();

        // --- SCENE SETUP ---
        const scene = new Scene();
        scene.background = new Color(0x87ceeb); // Sky blue
        scene.fog = new Fog(0x87ceeb, 50, 150);

        const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        // --- LIGHTS ---
        const ambientLight = new AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.target.position.set(0, 0, 0);
        scene.add(directionalLight);
        scene.add(directionalLight.target);

        // --- RESIZING ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);

        // --- PLAYER AVATAR ---
        let player;
        let playerMixer;
        let playerActions = {};
        const playerSpeed = 3; // units per second
        const playerRotationSpeed = Math.PI / 2; // radians per second
        const playerVelocity = new Vector3();
        let playerHeading = 0; // Y-axis rotation in radians

        // Placeholder for player while model loads
        const playerPlaceholderGeometry = new CapsuleGeometry(0.5, 1.5, 4, 8);
        const playerPlaceholderMaterial = new MeshStandardMaterial({ color: 0x00ff00 });
        const playerPlaceholder = new Mesh(playerPlaceholderGeometry, playerPlaceholderMaterial);
        playerPlaceholder.position.y = 1;
        scene.add(playerPlaceholder);
        player = playerPlaceholder; // Initialize player to placeholder

        loadModel("dino").then((model) => {
            if (model) {
                scene.remove(playerPlaceholder); // Remove placeholder
                player = model;
                player.scale.set(0.7, 0.7, 0.7);
                player.position.set(0, 0.5, 0); // Position player on ground
                scene.add(player);

                // Setup animation mixer
                playerMixer = new AnimationMixer(player);
                const walkClip = player.animations.find(a => /walk|sprint/i.test(a.name));
                const idleClip = player.animations.find(a => /idle/i.test(a.name));
                playerActions.walk = walkClip ? playerMixer.clipAction(walkClip) : null;
                playerActions.idle = idleClip ? playerMixer.clipAction(idleClip) : null;
                playerActions.idle?.play();
            }
        });

        // --- CAMERA CONTROL ---
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let cameraDistance = 5; // Initial distance
        const minCameraDistance = 1;
        const maxCameraDistance = 10; // Increased max for better view of built world
        const cameraOffset = new Vector3(0, 1.5, 0); // Camera looks slightly above player

        const euler = new Euler(0, 0, 0, 'YXZ'); // YXZ order for proper camera rotation
        const spherical = { radius: cameraDistance, phi: Math.PI / 2, theta: Math.PI / 4 }; // phi: vertical, theta: horizontal

        function updateCameraPosition() {
            if (!player) return;

            // Clamp phi to prevent camera from going upside down
            spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));

            camera.position.x = player.position.x + cameraOffset.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
            camera.position.y = player.position.y + cameraOffset.y + spherical.radius * Math.cos(spherical.phi);
            camera.position.z = player.position.z + cameraOffset.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);

            camera.lookAt(player.position.clone().add(cameraOffset));
        }

        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (event.button === 0) { // Left click for interaction, right click for camera drag
                 // Check if click was on UI element
                if (event.target.closest('#palette-container')) return;
                if (event.target.closest('#controls')) return;
                if (event.target.closest('#ui')) return;

                isDragging = true;
                previousMousePosition.x = event.clientX;
                previousMousePosition.y = event.clientY;
                renderer.domElement.setPointerCapture(event.pointerId);
            }
        });

        renderer.domElement.addEventListener('pointermove', (event) => {
            if (isDragging && event.buttons & 1) { // Check if left mouse button is pressed
                const deltaX = event.clientX - previousMousePosition.x;
                const deltaY = event.clientY - previousMousePosition.y;

                spherical.theta -= deltaX * 0.005; // Adjust rotation speed
                spherical.phi -= deltaY * 0.005;

                previousMousePosition.x = event.clientX;
                previousMousePosition.y = event.clientY;
                updateCameraPosition();
            }
        });

        renderer.domElement.addEventListener('pointerup', () => {
            isDragging = false;
        });

        renderer.domElement.addEventListener('wheel', (event) => {
            event.preventDefault(); // Prevent page scrolling
            cameraDistance -= event.deltaY * 0.01;
            cameraDistance = Math.max(minCameraDistance, Math.min(maxCameraDistance, cameraDistance));
            spherical.radius = cameraDistance;
            updateCameraPosition();
        });

        // --- PLAYER MOVEMENT ---
        const keys = {
            forward: false,
            backward: false,
            left: false,
            right: false
        };

        const onScreenControls = {
            forward: false, backward: false, left: false, right: false
        };

        function setMovementState(key, isPressed) {
            keys[key] = isPressed;
        }

        function setOnScreenMovementState(key, isPressed) {
            onScreenControls[key] = isPressed;
        }

        document.addEventListener('keydown', (event) => {
            switch (event.key) {
                case 'w':
                case 'W':
                case 'ArrowUp':
                    setMovementState('forward', true);
                    event.preventDefault();
                    break;
                case 's':
                case 'S':
                case 'ArrowDown':
                    setMovementState('backward', true);
                    event.preventDefault();
                    break;
                case 'a':
                case 'A':
                case 'ArrowLeft':
                    setMovementState('left', true);
                    event.preventDefault();
                    break;
                case 'd':
                case 'D':
                case 'ArrowRight':
                    setMovementState('right', true);
                    event.preventDefault();
                    break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch (event.key) {
                case 'w':
                case 'W':
                case 'ArrowUp':
                    setMovementState('forward', false);
                    break;
                case 's':
                case 'S':
                case 'ArrowDown':
                    setMovementState('backward', false);
                    break;
                case 'a':
                case 'A':
                case 'ArrowLeft':
                    setMovementState('left', false);
                    break;
                case 'd':
                case 'D':
                case 'ArrowRight':
                    setMovementState('right', false);
                    break;
            }
        });

        // On-screen controls
        document.getElementById('move-forward').addEventListener('pointerdown', () => setOnScreenMovementState('forward', true));
        document.getElementById('move-forward').addEventListener('pointerup', () => setOnScreenMovementState('forward', false));
        document.getElementById('move-forward').addEventListener('pointerleave', () => setOnScreenMovementState('forward', false)); // For drag off button

        document.getElementById('move-back').addEventListener('pointerdown', () => setOnScreenMovementState('backward', true));
        document.getElementById('move-back').addEventListener('pointerup', () => setOnScreenMovementState('backward', false));
        document.getElementById('move-back').addEventListener('pointerleave', () => setOnScreenMovementState('backward', false));

        document.getElementById('move-left').addEventListener('pointerdown', () => setOnScreenMovementState('left', true));
        document.getElementById('move-left').addEventListener('pointerup', () => setOnScreenMovementState('left', false));
        document.getElementById('move-left').addEventListener('pointerleave', () => setOnScreenMovementState('left', false));

        document.getElementById('move-right').addEventListener('pointerdown', () => setOnScreenMovementState('right', true));
        document.getElementById('move-right').addEventListener('pointerup', () => setOnScreenMovementState('right', false));
        document.getElementById('move-right').addEventListener('pointerleave', () => setOnScreenMovementState('right', false));

        function updatePlayerMovement(delta) {
            if (!player) return;

            let moving = false;
            let currentMoveSpeed = 0;

            const actualKeys = {
                forward: keys.forward || onScreenControls.forward,
                backward: keys.backward || onScreenControls.backward,
                left: keys.left || onScreenControls.left,
                right: keys.right || onScreenControls.right
            };

            if (actualKeys.forward) {
                playerVelocity.z = -playerSpeed;
                moving = true;
                currentMoveSpeed = playerSpeed;
            } else if (actualKeys.backward) {
                playerVelocity.z = playerSpeed;
                moving = true;
                currentMoveSpeed = -playerSpeed;
            } else {
                playerVelocity.z = 0;
            }

            if (actualKeys.left) {
                playerHeading += playerRotationSpeed * delta;
                player.rotation.y = playerHeading;
            }
            if (actualKeys.right) {
                playerHeading -= playerRotationSpeed * delta;
                player.rotation.y = playerHeading;
            }

            // Move player based on its local Z-axis (forward/backward)
            if (playerVelocity.z !== 0) {
                const forwardVector = new Vector3(0, 0, 1);
                forwardVector.applyQuaternion(player.quaternion); // Transform to world space
                player.position.add(forwardVector.multiplyScalar(playerVelocity.z * delta));
            }

            // Update animation
            if (playerMixer) {
                if (moving) {
                    if (playerActions.idle?.isRunning()) playerActions.idle.stop();
                    if (!playerActions.walk?.isRunning()) playerActions.actions?.walk?.play();
                } else {
                    if (playerActions.walk?.isRunning()) playerActions.walk.stop();
                    if (!playerActions.idle?.isRunning()) playerActions.idle?.play();
                }
                playerMixer.update(delta);
            }
        }

        // --- WORLD GENERATION ---
        const worldSize = 100; // Size of the playable world area
        const chunkSize = 10; // Size of each chunk for biome generation
        const terrainHeightScale = 5; // How tall the terrain features are
        const numChunks = worldSize / chunkSize;

        const terrainGroup = new Group();
        scene.add(terrainGroup);

        const groundMaterial = new MeshStandardMaterial({ color: 0x82a658, flatShading: true }); // Grassland
        const forestMaterial = new MeshStandardMaterial({ color: 0x567d46, flatShading: true }); // Forest
        const rockMaterial = new MeshStandardMaterial({ color: 0x8a8a8a, flatShading: true }); // Rocky

        function createTerrainPlane(x, z, material, height = 0) {
            const geometry = new PlaneGeometry(chunkSize, chunkSize, 10, 10);
            const mesh = new Mesh(geometry, material);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(x, height, z);
            mesh.receiveShadow = true;
            return mesh;
        }

        // Use a simple 2D noise for varying terrain (example: Perlin-like noise)
        function noise2D(x, y) {
            // A simple pseudo-random noise function for varying terrain.
            // In a real game, this would be a more complex noise algorithm (Perlin, Simplex).
            // For now, we'll use a basic seeded random that looks somewhat varied.
            const seed = 0.12345;
            const value = Math.sin(x * 0.5 + seed) + Math.cos(y * 0.5 + seed);
            return value * 0.5 + 0.5; // Scale to 0-1
        }

        const terrainTiles = [];

        function generateWorld() {
            // Clear existing terrain if any
            terrainTiles.forEach(tile => terrainGroup.remove(tile));
            terrainTiles.length = 0;

            for (let i = -numChunks / 2; i < numChunks / 2; i++) {
                for (let j = -numChunks / 2; j < numChunks / 2; j++) {
                    const x = i * chunkSize;
                    const z = j * chunkSize;

                    const biomeValue = noise2D(x / worldSize, z / worldSize); // Determine biome based on noise
                    let material;
                    let biomeType;
                    let height = 0;

                    if (biomeValue < 0.3) {
                        material = rockMaterial;
                        biomeType = 'rocky';
                        height = Math.sin(x * 0.1 + z * 0.05) * terrainHeightScale * 0.2 + 0.5; // Slightly elevated
                    } else if (biomeValue < 0.6) {
                        material = forestMaterial;
                        biomeType = 'forest';
                        height = Math.cos(x * 0.08 + z * 0.1) * terrainHeightScale * 0.1 + 0.1; // Slightly varied
                    } else {
                        material = groundMaterial;
                        biomeType = 'grassland';
                        height = 0;
                    }

                    const tile = createTerrainPlane(x + chunkSize / 2, z + chunkSize / 2, material, height);
                    tile.userData = { biome: biomeType }; // Store biome info
                    terrainGroup.add(tile);
                    terrainTiles.push(tile);
                }
            }
        }
        generateWorld(); // Initial world generation

        // --- INTERACTIVE FRUIT-BEARING PLANTS & FRUITS ---
        const fruitTypes = [
            { name: "apple", model: null, scale: 0.2 },
            { name: "banana", model: null, scale: 0.3 },
            { name: "burger", model: null, scale: 0.15 },
            { name: "chest", model: null, scale: 0.15 },
            { name: "chicken", model: null, scale: 0.2 },
            { name: "coin", model: null, scale: 0.1 },
            { name: "donut", model: null, scale: 0.15 },
            { name: "hotdog", model: null, scale: 0.15 },
            { name: "ice_cream", model: null, scale: 0.15 },
            { name: "pizza", model: null, scale: 0.15 }
        ];

        // Load fruit models
        fruitTypes.forEach(fruit => {
            loadModel(fruit.name).then(model => {
                if (model) {
                    model.scale.set(fruit.scale, fruit.scale, fruit.scale);
                    fruit.model = model;
                }
            });
        });

        class FruitPlant {
            constructor(position, fruitType, id) {
                this.id = id;
                this.position = position;
                this.fruitType = fruitType;
                this.fruitsRemaining = 5;
                this.replenishCooldown = 0; // seconds
                this.group = new Group();
                this.group.position.copy(position);
                scene.add(this.group);

                this.plantMesh = this.createPlantBase();
                this.group.add(this.plantMesh);

                this.fruitMeshes = [];
                this.spawnFruits();
            }

            createPlantBase() {
                const trunkGeometry = new CylinderGeometry(0.2, 0.3, 1.5, 8);
                const trunkMaterial = new MeshStandardMaterial({ color: 0x6b4a2e });
                const trunk = new Mesh(trunkGeometry, trunkMaterial);
                trunk.position.y = 0.75;

                const leavesGeometry = new SphereGeometry(0.8, 16, 12);
                const leavesMaterial = new MeshStandardMaterial({ color: 0x4caf50 });
                const leaves = new Mesh(leavesGeometry, leavesMaterial);
                leaves.position.y = 1.8;

                const plantBase = new Group();
                plantBase.add(trunk, leaves);
                return plantBase;
            }

            spawnFruits() {
                if (!this.fruitType.model) return; // Wait for model to load

                this.fruitMeshes.forEach(mesh => this.group.remove(mesh));
                this.fruitMeshes.length = 0;

                for (let i = 0; i < this.fruitsRemaining; i++) {
                    const fruitClone = this.fruitType.model.clone();
                    // Arrange fruits around the plant
                    const angle = (i / this.fruitsRemaining) * Math.PI * 2;
                    const radius = 0.5;
                    fruitClone.position.set(
                        radius * Math.cos(angle),
                        2.2 + (i * 0.1), // Slightly different heights
                        radius * Math.sin(angle)
                    );
                    this.group.add(fruitClone);
                    this.fruitMeshes.push(fruitClone);
                }
            }

            collectFruit() {
                if (this.fruitsRemaining > 0) {
                    this.fruitsRemaining--;
                    playSound("coin_pickup"); // Using coin_pickup for fruit
                    updateScore(this.fruitType.name); // Collect a unique fruit type
                    this.spawnFruits(); // Update visual fruits

                    if (this.fruitsRemaining === 0) {
                        this.replenishCooldown = 30; // Start cooldown
                    }
                    return true;
                }
                return false;
            }

            update(delta) {
                if (this.fruitsRemaining === 0 && this.replenishCooldown > 0) {
                    this.replenishCooldown -= delta;
                    if (this.replenishCooldown <= 0) {
                        this.fruitsRemaining = 5;
                        this.spawnFruits();
                    }
                }
            }
        }

        const fruitPlants = [];
        const numFruitPlants = 20; // More plants for variety

        // Place fruit plants randomly
        function placeFruitPlants() {
            for (let i = 0; i < numFruitPlants; i++) {
                const randomX = (Math.random() * worldSize) - (worldSize / 2);
                const randomZ = (Math.random() * worldSize) - (worldSize / 2);
                const randomFruitType = fruitTypes[Math.floor(Math.random() * fruitTypes.length)];
                fruitPlants.push(new FruitPlant(new Vector3(randomX, 0, randomZ), randomFruitType, `plant_${i}`));
            }
        }
        placeFruitPlants();


        // --- NON-PLAYER DINOSAURS ---
        const npcDinos = [];
        const numNpcDinos = 5; // Total NPCs
        const npcSpeed = 1; // units per second

        // Define a simple NPC structure to manage its state and model
        class NPCDino {
            constructor(position, color, id) {
                this.id = id;
                this.position = position;
                this.color = color;
                this.targetPosition = new Vector3();
                this.updateTarget();
                this.model = null;
                this.mixer = null;
                this.actions = {};

                // Placeholder mesh
                const placeholderGeo = new CapsuleGeometry(0.4, 1.2, 4, 8);
                const placeholderMat = new MeshStandardMaterial({ color: this.color });
                this.placeholder = new Mesh(placeholderGeo, placeholderMat);
                this.placeholder.position.copy(position);
                this.placeholder.position.y = 0.5;
                scene.add(this.placeholder);

                // Load model
                loadModel("dino").then((m) => {
                    if (m) {
                        scene.remove(this.placeholder);
                        this.model = m;
                        this.model.scale.set(0.6, 0.6, 0.6);
                        this.model.position.copy(position);
                        this.model.position.y = 0.5;
                        this.model.traverse((node) => {
                            if (node.isMesh) {
                                node.material = placeholderMat.clone(); // Apply unique color
                            }
                        });
                        scene.add(this.model);

                        this.mixer = new AnimationMixer(this.model);
                        const walkClip = this.model.animations.find(a => /walk|sprint/i.test(a.name));
                        const idleClip = this.model.animations.find(a => /idle/i.test(a.name));
                        this.actions.walk = walkClip ? this.mixer.clipAction(walkClip) : null;
                        this.actions.idle = idleClip ? this.mixer.clipAction(idleClip) : null;
                        this.actions.walk?.play();
                    } else {
                        this.model = this.placeholder; // Fallback to placeholder
                    }
                });
            }

            updateTarget() {
                this.targetPosition.set(
                    (Math.random() * worldSize) - (worldSize / 2),
                    this.position.y,
                    (Math.random() * worldSize) - (worldSize / 2)
                );
            }

            update(delta) {
                const currentMesh = this.model || this.placeholder;
                if (!currentMesh) return;

                const distanceToTarget = currentMesh.position.distanceTo(this.targetPosition);

                if (distanceToTarget < 1) { // Reached target, pick new one
                    this.updateTarget();
                }

                // Move towards target
                const direction = this.targetPosition.clone().sub(currentMesh.position).normalize();
                currentMesh.position.add(direction.multiplyScalar(npcSpeed * delta));

                // Make NPC face the direction it's moving
                const targetQuaternion = new Quaternion();
                targetQuaternion.setFromUnitVectors(new Vector3(0, 0, 1), direction);
                currentMesh.quaternion.slerp(targetQuaternion, 0.1); // Smooth rotation

                this.mixer?.update(delta);
            }
        }

        // Spawn NPCs
        const npcColors = [0x9acd32, 0xffa500]; // Green and Orange
        function placeNPCDinos() {
            for (let i = 0; i < numNpcDinos; i++) {
                const randomX = (Math.random() * worldSize) - (worldSize / 2);
                const randomZ = (Math.random() * worldSize) - (worldSize / 2);
                const color = npcColors[i % npcColors.length];
                npcDinos.push(new NPCDino(new Vector3(randomX, 0, randomZ), new Color(color), `npc_${i}`));
            }
        }
        placeNPCDinos();

        // --- DECORATIVE WORLD ELEMENTS & PALETTE ---
        const decorativeAssetsData = [
            { name: "tree", model: null, scale: 0.8 },
            { name: "mountain", model: null, scale: 0.5 },
            { name: "mountain_range", model: null, scale: 0.8 },
            { name: "mountain_small", model: null, scale: 0.5 },
            { name: "snow_birch", model: null, scale: 0.8 },
            { name: "snow_bush", model: null, scale: 0.8 },
            { name: "snow_dead_tree", model: null, scale: 0.8 },
            { name: "snow_mountain", model: null, scale: 0.5 },
            { name: "snow_pine", model: null, scale: 0.8 },
            // Primitive-based assets
            { name: "bush_round", model: null, scale: 1, create: () => {
                const geo = new SphereGeometry(0.7, 12, 10);
                const mat = new MeshStandardMaterial({ color: 0x689f38 });
                const mesh = new Mesh(geo, mat);
                mesh.position.y = 0.5;
                return mesh;
            }},
            { name: "rock_small", model: null, scale: 1, create: () => {
                const geo = new BoxGeometry(0.8, 0.5, 0.6);
                const mat = new MeshStandardMaterial({ color: 0x757575 });
                const mesh = new Mesh(geo, mat);
                mesh.position.y = 0.25;
                return mesh;
            }},
            { name: "rock_large", model: null, scale: 1, create: () => {
                const geo = new BoxGeometry(1.5, 0.8, 1.2);
                const mat = new MeshStandardMaterial({ color: 0x616161 });
                const mesh = new Mesh(geo, mat);
                mesh.position.y = 0.4;
                return mesh;
            }},
            { name: "mushroom_red", model: null, scale: 1, create: () => {
                const stem = new Mesh(new CylinderGeometry(0.2, 0.2, 0.8, 8), new MeshStandardMaterial({ color: 0xe0e0e0 }));
                stem.position.y = 0.4;
                const cap = new Mesh(new SphereGeometry(0.5, 12, 12, 0, Math.PI * 2, 0, Math.PI / 2), new MeshStandardMaterial({ color: 0xf44336 }));
                cap.position.y = 0.8;
                const group = new Group();
                group.add(stem, cap);
                return group;
            }},
            { name: "flower_yellow", model: null, scale: 1, create: () => {
                const stem = new Mesh(new CylinderGeometry(0.05, 0.05, 0.5, 4), new MeshStandardMaterial({ color: 0x8bc34a }));
                stem.position.y = 0.25;
                const head = new Mesh(new SphereGeometry(0.15, 8, 8), new MeshStandardMaterial({ color: 0xffeb3b }));
                head.position.y = 0.6;
                const group = new Group();
                group.add(stem, head);
                return group;
            }},
             { name: "flower_blue", model: null, scale: 1, create: () => {
                const stem = new Mesh(new CylinderGeometry(0.05, 0.05, 0.5, 4), new MeshStandardMaterial({ color: 0x8bc34a }));
                stem.position.y = 0.25;
                const head = new Mesh(new SphereGeometry(0.15, 8, 8), new MeshStandardMaterial({ color: 0x2196f3 }));
                head.position.y = 0.6;
                const group = new Group();
                group.add(stem, head);
                return group;
            }}
        ];

        // Load models for decorative assets
        decorativeAssetsData.forEach(asset => {
            if (asset.name.includes("bush") || asset.name.includes("rock") || asset.name.includes("mushroom") || asset.name.includes("flower")) {
                asset.model = asset.create(); // Create primitive model directly
                asset.model.scale.set(asset.scale, asset.scale, asset.scale);
                asset.model.traverse(child => { if (child.isMesh) child.castShadow = true; }); // Primitives can cast shadows
            } else {
                loadModel(asset.name).then(model => {
                    if (model) {
                        model.scale.set(asset.scale, asset.scale, asset.scale);
                        asset.model = model;
                        asset.model.traverse(child => { if (child.isMesh) child.castShadow = true; });
                    }
                });
            }
        });

        const placedDecorativeElements = [];
        let selectedPaletteItem = null;

        // --- PALETTE UI ---
        const paletteContainer = document.getElementById('palette-container');

        function setupPalette() {
            paletteContainer.innerHTML = ''; // Clear existing
            decorativeAssetsData.forEach((asset, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'palette-item';
                itemDiv.dataset.assetName = asset.name;

                // Create a small preview image/icon. For now, just text.
                itemDiv.textContent = asset.name.split('_')[0].substring(0, 3); // Shorten for display

                itemDiv.addEventListener('pointerdown', (event) => {
                    event.stopPropagation(); // Prevent click from triggering scene interaction
                    selectPaletteItem(index);
                });
                paletteContainer.appendChild(itemDiv);
            });
        }
        setupPalette();

        function selectPaletteItem(index) {
            decorativeAssetsData.forEach((asset, i) => {
                const itemDiv = paletteContainer.children[i];
                if (i === index) {
                    itemDiv.classList.add('selected');
                    selectedPaletteItem = asset;
                    playSound("select");
                } else {
                    itemDiv.classList.remove('selected');
                }
            });
        }

        // --- PLACING WORLD ELEMENTS ---
        const raycaster = new Raycaster();
        const mouse = new Vector2();

        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (isDragging || event.button !== 0) return; // Only left click and not dragging camera

            // Check if click was on UI element, if so, don't interact with scene
            if (event.target.closest('#palette-container')) return;
            if (event.target.closest('#controls')) return;
            if (event.target.closest('#ui')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // Check for fruit collection
            const intersectsFruits = raycaster.intersectObjects(fruitPlants.flatMap(p => p.fruitMeshes));
            if (intersectsFruits.length > 0) {
                const intersectedFruit = intersectsFruits[0].object;
                for (const plant of fruitPlants) {
                    if (plant.fruitMeshes.includes(intersectedFruit)) {
                        plant.collectFruit();
                        return; // Collected a fruit, don't place anything
                    }
                }
            }

            // If a palette item is selected, try to place it
            if (selectedPaletteItem && selectedPaletteItem.model) {
                const intersectsGround = raycaster.intersectObjects(terrainTiles);
                if (intersectsGround.length > 0) {
                    const point = intersectsGround[0].point;
                    const newElement = selectedPaletteItem.model.clone();
                    newElement.position.copy(point);
                    // Adjust Y position if model origin is not at the base
                    const bbox = new Box3().setFromObject(newElement);
                    newElement.position.y += (newElement.position.y - bbox.min.y);
                    scene.add(newElement);
                    placedDecorativeElements.push(newElement);
                    playSound("pop"); // Play sound for placing
                }
            }
        });


        // --- PLAYER AVATAR SHADOWS ---
        renderer.shadowMap.enabled = true;
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 1024;
        directionalLight.shadow.mapSize.height = 1024;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 100;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;

        // Ensure player and decorative objects cast shadows
        // This is handled in player loadModel and decorativeAssetsData setup.
        // For terrain, set receiveShadow = true in createTerrainPlane.

        // --- WIN CONDITION TRACKING ---
        const collectedFruits = new Set(); // Stores unique fruit names
        let totalFruitsCollected = 0;
        const scoreElement = document.getElementById('score');

        function updateScore(fruitName) {
            if (!collectedFruits.has(fruitName)) {
                collectedFruits.add(fruitName);
                totalFruitsCollected++;
                scoreElement.textContent = totalFruitsCollected;

                if (totalFruitsCollected >= 50) {
                    // Win condition met! (The game is open-ended, so this is just a milestone)
                    // You could add a celebratory message here!
                    console.log("Congratulations! You collected 50 unique fruits!");
                }
            }
        }

        // --- SKY ELEMENT (BIRDS) ---
        const birds = [];
        const numBirds = 10;
        const birdFlightRadius = worldSize / 2;
        const birdFlightHeight = 20;
        const birdSpeed = 5;

        class Bird {
            constructor(id) {
                this.id = id;
                this.model = null;
                this.mixer = null;
                this.position = new Vector3(
                    (Math.random() - 0.5) * worldSize,
                    birdFlightHeight + (Math.random() - 0.5) * 5,
                    (Math.random() - 0.5) * worldSize
                );
                this.targetAngle = Math.random() * Math.PI * 2;
                this.rotationSpeed = Math.random() * 0.5 + 0.5; // radians per second
                this.flightPatternSpeed = Math.random() * 0.5 + 0.5; // How fast it changes direction

                // Placeholder mesh
                const placeholderGeo = new ConeGeometry(0.3, 0.6, 4);
                const placeholderMat = new MeshBasicMaterial({ color: 0xffffff });
                this.placeholder = new Mesh(placeholderGeo, placeholderMat);
                this.placeholder.position.copy(this.position);
                scene.add(this.placeholder);

                loadModel("bird").then((m) => {
                    if (m) {
                        scene.remove(this.placeholder);
                        this.model = m;
                        this.model.scale.set(0.1, 0.1, 0.1);
                        this.model.position.copy(this.position);
                        this.model.rotation.y = this.targetAngle; // Initial rotation
                        scene.add(this.model);

                        this.mixer = new AnimationMixer(this.model);
                        const flyClip = this.model.animations.find(a => /fly/i.test(a.name) || a.name === "animation_0"); // Some models use generic name
                        if (flyClip) {
                            this.mixer.clipAction(flyClip).play();
                        }
                    } else {
                        this.model = this.placeholder; // Fallback to placeholder
                    }
                });
            }

            update(delta) {
                const currentMesh = this.model || this.placeholder;
                if (!currentMesh) return;

                // Simple circular flight pattern, with some randomness
                currentMesh.position.x += Math.sin(currentMesh.rotation.y) * birdSpeed * delta;
                currentMesh.position.z += Math.cos(currentMesh.rotation.y) * birdSpeed * delta;

                // Randomly change direction
                if (Math.random() < 0.005) { // Small chance to change target angle
                    this.targetAngle = Math.random() * Math.PI * 2;
                }

                // Smoothly rotate towards target angle
                let angleDiff = this.targetAngle - currentMesh.rotation.y;
                if (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                if (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                currentMesh.rotation.y += angleDiff * this.rotationSpeed * delta;

                // Keep birds within bounds
                if (Math.abs(currentMesh.position.x) > birdFlightRadius || Math.abs(currentMesh.position.z) > birdFlightRadius) {
                    // Turn back towards center
                    const directionToCenter = new Vector3(0, currentMesh.position.y, 0).sub(currentMesh.position).normalize();
                    this.targetAngle = Math.atan2(directionToCenter.x, directionToCenter.z);
                }

                this.mixer?.update(delta);
            }
        }

        function spawnBirds() {
            for (let i = 0; i < numBirds; i++) {
                birds.push(new Bird(`bird_${i}`));
            }
        }
        spawnBirds();


        // --- GAME LOOP ---
        playMusic("bg_loop_playful");

        function animate(time) {
            if (!on) return;

            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05); // Clamp delta

            // Update player
            updatePlayerMovement(delta);
            if (player) {
                // Keep player Y position at ground level, considering player model's pivot
                const playerBbox = new Box3().setFromObject(player);
                player.position.y -= (playerBbox.min.y - 0);
            }


            // Update camera
            updateCameraPosition();

            // Update fruit plants
            fruitPlants.forEach(plant => plant.update(delta));

            // Update NPCs
            npcDinos.forEach(npc => npc.update(delta));

            // Update birds
            birds.forEach(bird => bird.update(delta));

            renderer.render(scene, camera);
        }

        // Start the game!
        animate(performance.now());
    </script>
</body>
</html>

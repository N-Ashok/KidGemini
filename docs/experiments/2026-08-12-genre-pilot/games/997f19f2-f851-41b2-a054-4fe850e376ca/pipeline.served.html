        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, ConeGeometry, PlaneGeometry, MeshStandardMaterial, MeshBasicMaterial, Mesh, AmbientLight, DirectionalLight, Quaternion, Matrix4, MathUtils, InstancedMesh } from "three";

        // --- RIVER PATH GENERATION ---
        const riverPathPoints = [];
        const pathLength = 500; // How long the river is
        const segmentLength = 5; // Length of each straight segment
        const numSegments = pathLength / segmentLength;
        let currentPos = new Vector3(0, 0, 0);
        let currentDir = new Vector3(0, 0, -1); // Start moving along -Z
        let riverWidth = 10; // Starting width

        // Generate a winding path
        for (let i = 0; i < numSegments; i++) {
            riverPathPoints.push(currentPos.clone());

            // Randomly adjust direction for winding path
            const turnAngle = (Math.random() - 0.5) * 0.4; // Small random turn
            currentDir.applyAxisAngle(new Vector3(0, 1, 0), turnAngle);
            currentDir.normalize();

            // Vary river width gradually
            riverWidth = Math.max(8, Math.min(20, riverWidth + (Math.random() - 0.5) * 0.5));

        // --- RIVER AND BANKS MESH ---

        };
        const decorationTypes = ['tree', 'cactus', 'rock', 'mountain', 'mountain_small'];
        const instancedDecorations = {}; // Store InstancedMesh objects

        // Load decoration models and setup InstancedMesh
        async function setupDecorations() {
            for (const type of decorationTypes) {

                    const material = model.children[0].material.clone();
                    instancedDecorations[type] = new InstancedMesh(geometry, material, decorationCount);
                    instancedDecorations[type].name = type + "_instances";
                    scene.add(instancedDecorations[type]);
                } else {
                    console.warn(`Failed to load model: ${type}, using placeholder.`);
                    // Fallback to simple geometries if model fails to load
                    let geometry;
                    let material = new MeshStandardMaterial({ color: 0x8B4513 }); // Brown for tree trunk
                    if (type === 'tree') {
                        geometry = new ConeGeometry(1, 2, 8); material = new MeshStandardMaterial({ color: 0x228B22 }); // Green for tree top
                    } else if (type === 'cactus') {
                        geometry = new BoxGeometry(0.5, 2, 0.5); material = new MeshStandardMaterial({ color: 0x006400 });
                    } else if (type === 'rock') {
                        geometry = new SphereGeometry(0.8, 8, 8); material = new MeshStandardMaterial({ color: 0x808080 });
                    } else { // mountain, mountain_small
                        geometry = new ConeGeometry(5, 10, 8); material = new MeshStandardMaterial({ color: 0x556B2F });
                    }
                    instancedDecorations[type] = new InstancedMesh(geometry, material, decorationCount);
                    instancedDecorations[type].name = type + "_instances";
                    scene.add(instancedDecorations[type]);

            }
            placeDecorations(); // Place them after all are potentially loaded or fallbacked
        }

        function placeDecorations() {
            for (let i = 0; i < numSegments - 1; i++) {
                const p1 = riverPathPoints[i];
                const p2 = riverPathPoints[i + 1];

                // River Segment
                const riverSegment = new Mesh(riverGeometry, waterMaterial);
                riverSegment.position.lerpVectors(p1, p2, 0.5);
                riverSegment.lookAt(p2);
                riverSegment.rotation.x = -Math.PI / 2; // Make it flat
                const currentRiverWidth = MathUtils.lerp(8, 20, i / numSegments); // Simple width variation
                riverSegment.scale.set(currentRiverWidth, 1, 1); // Width, height, depth
                riverGroup.add(riverSegment);

                // Bank Segments
                const segmentDirection = new Vector3().subVectors(p2, p1).normalize();
                const perpendicular = new Vector3(0, 1, 0).cross(segmentDirection).normalize();

                const bankWidth = 10; // Width of each bank

                // Left bank
                const leftBankPos = p1.clone().add(perpendicular.clone().multiplyScalar(currentRiverWidth / 2 + bankWidth / 2));
                const leftBankMesh = new Mesh(bankGeometry, bankMaterial);
                leftBankMesh.position.lerpVectors(leftBankPos, leftBankPos.clone().add(segmentDirection.clone().multiplyScalar(segmentLength)), 0.5);
                leftBankMesh.position.y = -0.5; // Slightly lower than water
                leftBankMesh.lookAt(leftBankPos.clone().add(segmentDirection));
                leftBankMesh.rotation.x = -Math.PI / 2;
                leftBankMesh.scale.set(bankWidth, 1, 1);
                bankGroup.add(leftBankMesh);

                // Right bank
                const rightBankPos = p1.clone().add(perpendicular.clone().multiplyScalar(-(currentRiverWidth / 2 + bankWidth / 2)));
                const rightBankMesh = new Mesh(bankGeometry, bankMaterial);
                rightBankMesh.position.lerpVectors(rightBankPos, rightBankPos.clone().add(segmentDirection.clone().multiplyScalar(segmentLength)), 0.5);
                rightBankMesh.position.y = -0.5;
                rightBankMesh.lookAt(rightBankPos.clone().add(segmentDirection));
                rightBankMesh.rotation.x = -Math.PI / 2;
                rightBankMesh.scale.set(bankWidth, 1, 1);
                bankGroup.add(rightBankMesh);

                // Decorations on banks

                    const decType = decorationTypes[Math.floor(Math.random() * decorationTypes.length)];
                    const instancedMesh = instancedDecorations[decType];
                    if (instancedMesh) {
                        const randomOffset = (Math.random() - 0.5) * (bankWidth - 2); // Place within bank
                        const decX = perpendicular.x * (currentRiverWidth / 2 + bankWidth / 2 + randomOffset);
                        const decZ = perpendicular.z * (currentRiverWidth / 2 + bankWidth / 2 + randomOffset);

                        const pos = p1.clone().add(new Vector3(decX, 0, decZ));
                        pos.y = Math.random() * 0.5; // Slight height variation

                        const scale = 1 + Math.random() * 0.5;
                        const rotation = Math.random() * Math.PI * 2;

                        const matrix = new Matrix4();
                        matrix.compose(pos, new Quaternion().setFromAxisAngle(new Vector3(0, 1, 0), rotation), new Vector3(scale, scale, scale));

                        let instanceIndex = 0;
                        // Find an available instance index, or just use `i` if it's within bounds
                        // For simplicity in this example, we'll just set it.

                        if (instancedMesh.instanceMatrix.needsUpdate) { // Find an empty slot
                            for (let k = 0; k < instancedMesh.count; k++) {
                                // This is a bit of a hack: if matrix is default, it's empty. Not robust.
                                // For simplicity, we just use i as an index and hope we don't exceed count.
                                instanceIndex = k;
                                break;
                            }
                        } else {
                            instanceIndex = i; // Just use i for now
                        }
                        if (instanceIndex < instancedMesh.count) {
                             instancedMesh.setMatrixAt(instanceIndex, matrix);
                        }
                    }
                }
            }
             for (const type in instancedDecorations) {
                if (instancedDecorations[type]) {
                    instancedDecorations[type].instanceMatrix.needsUpdate = true;
                }
            }

        // --- PLAYER BOAT ---

        let boatForward = new Vector3(0, 0, -1); // Initial forward direction

                playerBoat = new Mesh(new BoxGeometry(2, 1, 4), new MeshStandardMaterial({ color: 0x8B4513 })); // Brown boat

            playerBoat.position.y = 0.5; // Start slightly above water

        // --- CROCODILES ---
        const activeCrocodiles = [];
        let crocodileModel;
        let crocodileModelLoaded = false;
        const crocodileSpeed = 5;
        let lastCrocodileSpawnTime = 0;

        let spawnDelay = 15000; // Max delay, will decrease with score

        loadModel("crocodile").then((model) => {
            if (model) {

        });

        function spawnCrocodile() {

            const playerSegmentIndex = Math.floor(Math.abs(playerBoat.position.z) / segmentLength);
            const spawnSegmentIndex = Math.min(numSegments - 1, playerSegmentIndex + Math.floor(Math.random() * 5) + 10); // Spawn 10-15 segments ahead
            if (spawnSegmentIndex >= numSegments - 1) return; // Don't spawn past the end

            const spawnPointCenter = riverPathPoints[spawnSegmentIndex];
            const segmentDir = new Vector3().subVectors(riverPathPoints[spawnSegmentIndex + 1], riverPathPoints[spawnSegmentIndex]).normalize();
            const perpendicular = new Vector3(0, 1, 0).cross(segmentDir).normalize();

            // Randomly choose left or right bank
            const side = Math.random() > 0.5 ? 1 : -1;
            const spawnDistance = MathUtils.lerp(8, 20, spawnSegmentIndex / numSegments) / 2 + 3; // Spawn on bank
            const spawnOffset = perpendicular.clone().multiplyScalar(side * spawnDistance);
            const spawnPos = spawnPointCenter.clone().add(spawnOffset);
            spawnPos.y = 0.2; // At water level

            let crocodile;
            if (crocodileModelLoaded) {
                crocodile = crocodileModel.clone();
            } else {
                crocodile = new Mesh(new BoxGeometry(1.5, 0.5, 3), new MeshStandardMaterial({ color: 0x006400 }));
            }
            crocodile.position.copy(spawnPos);
            crocodile.lookAt(playerBoat.position); // Look towards the player initially
            crocodile.rotation.x = 0; // Keep flat
            crocodile.userData.originalRotation = crocodile.rotation.clone(); // Store original rotation
            crocodile.userData.targetPosition = playerBoat.position.clone(); // Target player's current position
            crocodile.userData.spawnPoint = spawnPos.clone();
            crocodile.userData.hit = false; // To prevent multiple hits
            crocodile.name = "Crocodile";
            scene.add(crocodile);
            activeCrocodiles.push(crocodile);

            nextCrocodileSpawnInterval = Math.random() * (spawnDelay - 5000) + 5000; // 5 to 15 seconds
            lastCrocodileSpawnTime = Date.now();
        }

        const attackRange = 2 * 4; // 2 boat lengths (boat is 4 units long)
        let isAttacking = false;
        let attackTimer = 0;

            if (!playerBoat || isAttacking || gameState !== GAME_STATES.PLAYING) return;

                scene.remove(swishMesh);

            for (let i = activeCrocodiles.length - 1; i >= 0; i--) {
                const croco = activeCrocodiles[i];

            KeyD: false,
            Space: false,
            KeyJ: false // For joystick/touch push button
        };

        function handlePointerDown(event) {
            if (gameState !== GAME_STATES.PLAYING) return;
            if (event.target.closest('.control-button')) {
                // Handle button click directly
                if (event.target.id === 'left-button') keyState.ArrowLeft = true;
                if (event.target.id === 'right-button') keyState.ArrowRight = true;
                if (event.target.id === 'push-button') performStickAttack(); // Push on button press
                return; // Don't process as drag
            }
            if (event.button === 0 || event.pointerType === 'touch') { // Left click or touch
                pointerDown = true;
                startPointerX = event.clientX || event.touches[0].clientX;
                lastPointerX = startPointerX;
            }
        }

        function handlePointerMove(event) {
            if (!pointerDown || gameState !== GAME_STATES.PLAYING) return;
            const currentX = event.clientX || event.touches[0].clientX;
            const deltaX = currentX - lastPointerX;

            // Map deltaX to currentSteerAmount (-1 to 1)
            // A simple mapping: 200 pixels drag across screen width results in full steer
            const screenWidth = window.innerWidth;
            currentSteerAmount = MathUtils.clamp(deltaX / (screenWidth * 0.1), -1, 1); // Sensitivity
            lastPointerX = currentX;
        }

        function handlePointerUp(event) {
            if (gameState !== GAME_STATES.PLAYING) return;
            pointerDown = false;
            currentSteerAmount = 0; // Stop steering
            // Release key states for buttons
            keyState.ArrowLeft = false;
            keyState.ArrowRight = false;
        }

        function handleContextMenu(event) {
            if (gameState !== GAME_STATES.PLAYING) return;
            event.preventDefault(); // Prevent right-click context menu
            performStickAttack();
        }

        function handleKeyDown(event) {
            if (gameState !== GAME_STATES.PLAYING) return;
            if (keyState.hasOwnProperty(event.code)) {
                keyState[event.code] = true;
                if (event.code === 'ArrowLeft' || event.code === 'ArrowRight' || event.code === 'Space') {
                    event.preventDefault(); // Prevent page scrolling
                }
            }
            if (event.code === 'Space') {
                performStickAttack();
            }
        }

        function handleKeyUp(event) {
            if (gameState !== GAME_STATES.PLAYING) return;
            if (keyState.hasOwnProperty(event.code)) {
                keyState[event.code] = false;
            }
        }

        // On-screen control listeners (using pointerdown/up for responsiveness)
        document.getElementById('left-button').addEventListener('pointerdown', (e) => { e.preventDefault(); keyState.ArrowLeft = true; });
        document.getElementById('left-button').addEventListener('pointerup', () => { keyState.ArrowLeft = false; });
        document.getElementById('left-button').addEventListener('pointerleave', () => { keyState.ArrowLeft = false; }); // For when pointer leaves button while held

        document.getElementById('right-button').addEventListener('pointerdown', (e) => { e.preventDefault(); keyState.ArrowRight = true; });
        document.getElementById('right-button').addEventListener('pointerup', () => { keyState.ArrowRight = false; });
        document.getElementById('right-button').addEventListener('pointerleave', () => { keyState.ArrowRight = false; });

        document.getElementById('push-button').addEventListener('pointerdown', (e) => { e.preventDefault(); performStickAttack(); });


        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.addEventListener('pointerdown', handlePointerDown);
        document.addEventListener('pointermove', handlePointerMove);
        document.addEventListener('pointerup', handlePointerUp);
        document.addEventListener('contextmenu', handleContextMenu); // For right-click attack
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        // --- GAME LOOP ---
        let on = true;
        const setOn = (v) => {
            if (v === on) return;
            on = v;
            if (v) {
                clock.getDelta(); // Reset delta after pause
                animate();
            }
        };
        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        addEventListener('blur', () => setOn(false));
        addEventListener('focus', () => setOn(true));

        let lastFrameTime = 0;
        const maxFps = 60;
        const frameInterval = 1000 / maxFps;

        let currentMusic;

        function animate() {
            animationFrameId = requestAnimationFrame(animate);

            if (!on || gameState !== GAME_STATES.PLAYING) return;

            const now = performance.now();
            if (now - lastFrameTime < frameInterval) {
                return; // Skip frame to cap FPS
            }
            const delta = (now - lastFrameTime) / 1000; // Convert to seconds
            lastFrameTime = now;

            if (gameStartTime === 0) gameStartTime = now;
            const elapsedTime = now - gameStartTime;

            // --- PLAYER MOVEMENT ---
            if (playerBoat) {
                // Handle keyboard steering
                let keyboardSteer = 0;
                if (keyState.ArrowLeft || keyState.KeyA) keyboardSteer = 1;
                else if (keyState.ArrowRight || keyState.KeyD) keyboardSteer = -1;

                // Combine touch/mouse steering with keyboard (keyboard overrides if both)
                let actualSteer = keyboardSteer !== 0 ? keyboardSteer : currentSteerAmount;

                playerBoat.rotation.y += actualSteer * playerTurnSpeed * delta;

                // Update boat's forward direction based on its rotation
                boatForward.set(0, 0, -1).applyQuaternion(playerBoat.quaternion).normalize();

                // Move boat forward
                playerBoat.position.add(boatForward.clone().multiplyScalar(playerSpeed * delta));

                // Bobbing effect
                playerBoat.position.y = 0.5 + Math.sin(now * 0.005) * 0.1;

                // Collision detection (simple check with banks)
                const playerWidth = 2; // Approximate width of boat
                const playerZ = playerBoat.position.z;
                const playerX = playerBoat.position.x;

                const playerSegmentIndex = Math.floor(Math.abs(playerZ) / segmentLength);
                const currentPathPoint = riverPathPoints[Math.min(numSegments - 1, playerSegmentIndex)];
                const nextPathPoint = riverPathPoints[Math.min(numSegments - 1, playerSegmentIndex + 1)];

                if (currentPathPoint && nextPathPoint) {
                    const segmentCenter = new Vector3().lerpVectors(currentPathPoint, nextPathPoint, 0.5);
                    const segmentDir = new Vector3().subVectors(nextPathPoint, currentPathPoint).normalize();
                    const perpendicular = new Vector3(0, 1, 0).cross(segmentDir).normalize();
                    const currentRiverWidth = MathUtils.lerp(8, 20, playerSegmentIndex / numSegments);

                    // Project player position onto the segment line to find closest point on center path
                    const relativePlayerPos = new Vector3().subVectors(playerBoat.position, segmentCenter);
                    const distAlongSegment = relativePlayerPos.dot(segmentDir);
                    const closestPointOnPath = segmentCenter.clone().add(segmentDir.clone().multiplyScalar(distAlongSegment));

                    const distanceToPath = playerBoat.position.distanceTo(closestPointOnPath);

                    if (distanceToPath > currentRiverWidth / 2 - playerWidth / 2) {
                        // If outside river boundaries, push back towards center
                        const normal = new Vector3().subVectors(playerBoat.position, closestPointOnPath).normalize();
                        playerBoat.position.sub(normal.multiplyScalar(distanceToPath - (currentRiverWidth / 2 - playerWidth / 2)));
                    }
                }
            }

            // --- CROCODILE MOVEMENT AND SPWANING ---
            if (elapsedTime > initialSafeTime) {
                if (Date.now() - lastCrocodileSpawnTime > nextCrocodileSpawnInterval) {
                    spawnCrocodile();
                }
            }

            for (let i = activeCrocodiles.length - 1; i >= 0; i--) {
                const croco = activeCrocodiles[i];

                if (croco && playerBoat) {
                    // Make croco move towards the player
                    const targetDir = new Vector3().subVectors(playerBoat.position, croco.position).normalize();
                    croco.position.add(targetDir.multiplyScalar(crocodileSpeed * delta));

                    // Keep croco above water
                    croco.position.y = 0.2 + Math.sin(now * 0.007 + i) * 0.05;

                    // Croco collision with boat
                    const crocoBbox = new Box3().setFromObject(croco);
                    const playerBbox = new Box3().setFromObject(playerBoat);

                    if (crocoBbox.intersectsBox(playerBbox)) {
                        if (!croco.userData.hit) { // Only hit if not already processing a hit
                            croco.userData.hit = true;
                            playSound("water_splash");
                            loseLife();

                            // Bounce effect: move crocodile back away from player
                            const bounceDir = new Vector3().subVectors(croco.position, playerBoat.position).normalize();
                            croco.position.add(bounceDir.multiplyScalar(10)); // Push away forcefully

                            setTimeout(() => {
                                croco.userData.hit = false; // Allow it to hit again after a short delay
                            }, 1000); // 1 second invulnerability
                        }
                    }

                    // Remove crocodiles if they go too far behind or off course
                    if (croco.position.z > playerBoat.position.z + 20 || croco.position.distanceTo(playerBoat.position) > 100) {
                        scene.remove(croco);
                        activeCrocodiles.splice(i, 1);
                    }
                }
            }

            // --- ATTACK LOGIC ---
            if (isAttacking) {
                attackTimer += delta;
                if (attackTimer >= attackDuration) {
                    isAttacking = false;
                }
            }

            // --- CAMERA UPDATE ---
            if (playerBoat) {
                const cameraOffset = new Vector3(0, 15, 20); // Slightly behind and above
                cameraOffset.applyQuaternion(playerBoat.quaternion);
                camera.position.copy(playerBoat.position).add(cameraOffset);
                camera.lookAt(playerBoat.position.clone().add(boatForward.clone().multiplyScalar(5))); // Look slightly ahead of the boat
            }

            // Win condition: reach end of river path
            if (playerBoat && playerBoat.position.z < riverPathPoints[riverPathPoints.length - 1].z + 10) { // +10 buffer
                endGame(GAME_STATES.WIN);
            }

            renderer.render(scene, camera);
        }

        // --- INITIALIZE GAME ---
        updateScoreDisplay();
        updateLivesDisplay();
        currentMusic = playMusic("bg_loop_playful"); // Start background music
        setupDecorations().then(() => {
            // Wait for decorations to be set up before starting main animation
            // This prevents rendering an empty scene for a moment
            animate();
        });
    </script>
</body>

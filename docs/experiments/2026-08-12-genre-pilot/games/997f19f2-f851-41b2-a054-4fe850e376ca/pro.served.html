      btn.textContent = "\uD83C\uDFA8 art";
      btn.setAttribute("aria-label", "Art credits");
      btn.style.cssText = "border:0;border-radius:10px;padding:3px 8px;background:rgba(0,0,0,.45);color:#fff;cursor:pointer;font:inherit;";
      var panel = document.createElement("div");
      panel.style.cssText = "display:none;margin-top:4px;background:rgba(0,0,0,.75);color:#fff;border-radius:8px;padding:6px 10px;max-width:75vw;";
      for (var i = 0; i < credits.length; i++) {
        var c = credits[i], row = document.createElement("div");
        var a = document.createElement("a");
        a.href = c.sourceUrl; a.target = "_blank"; a.rel = "noopener";
        a.style.cssText = "color:#9cf;text-decoration:underline;";
        a.textContent = "\"" + c.name.replace(/_/g, " ") + "\" by " + c.author;
        row.appendChild(a);
        row.appendChild(document.createTextNode(" (CC BY 3.0)"));
        panel.appendChild(row);
      }
      btn.addEventListener("click", function () {
        panel.style.display = panel.style.display === "none" ? "block" : "none";
      });
      chip.appendChild(btn); chip.appendChild(panel);
      document.body.appendChild(chip);
    } catch (e) { /* credits must never break a game */ }
  }
  if (document.body) mount();
  else addEventListener("DOMContentLoaded", mount);
})();
</script>
  <title>River Adventure</title>
  <style>
    /* --- BASIC STYLING --- */

<body>




<div id="game-container">
  <canvas id="scene"></canvas>

  <!-- SCORING -->
  <div id="info-panel">
    Strength: <span id="score">0</span>
  </div>
  
  <div id="instructions">
      Use Arrow Keys or Buttons to Steer!
      <br>
      Press Space or Push Button to scare crocodiles!
  </div>

  <!-- GAME OVER SCREEN -->
  <div id="game-over-screen" class="ui-overlay">
    <h1>Game Over!</h1>
    <p>A crocodile got too close!</p>
    <p>Final Strength: <span id="final-score">0</span></p>
    <button onclick="location.reload()">Play Again</button>
  </div>

  <!-- ON-SCREEN CONTROLS -->
  <div id="controls">
    <div class="control-group">
      <div id="left-btn" class="control-btn">⬅️</div>
      <div id="right-btn" class="control-btn">➡️</div>
    </div>
    <div class="control-group">
      <div id="push-btn" class="control-btn">🖐️</div>
    </div>
  </div>
</div>

<script type="module">
  // --- IMPORTS ---
  import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, PlaneGeometry, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, Euler } from "three";

  // --- GAME SETUP ---
  const scene = new Scene();
  const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new WebGLRenderer({
    canvas: document.getElementById('scene'),
    antialias: true,
    preserveDrawingBuffer: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const clock = new Clock();
  let score = 0;
  let isGameOver = false;

  // --- LIGHTS AND FOG ---
  scene.background = new Color(0x87ceeb); // Sky blue
  scene.fog = new Fog(0x87ceeb, 50, 200);
  const ambientLight = new AmbientLight(0xffffff, 0.7);
  scene.add(ambientLight);
  const dirLight = new DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(50, 50, 20);
  scene.add(dirLight);

  // --- RIVER AND SCENERY ---
  const riverMaterial = new MeshStandardMaterial({ color: 0x2e86c1, metalness: 0.2, roughness: 0.6 });
  const bankMaterial = new MeshStandardMaterial({ color: 0x228B22 }); // Forest green
  const riverWidth = 30;
  const segmentLength = 200;

  for (let i = 0; i < 10; i++) {
    const riverSegment = new Mesh(new PlaneGeometry(riverWidth, segmentLength), riverMaterial);
    riverSegment.rotation.x = -Math.PI / 2;
    riverSegment.position.z = -i * segmentLength + segmentLength/2;
    scene.add(riverSegment);

    const leftBank = new Mesh(new PlaneGeometry(100, segmentLength), bankMaterial);
    leftBank.rotation.x = -Math.PI / 2;
    leftBank.position.x = -riverWidth / 2 - 50;
    leftBank.position.z = riverSegment.position.z;
    scene.add(leftBank);

    const rightBank = new Mesh(new PlaneGeometry(100, segmentLength), bankMaterial);
    rightBank.rotation.x = -Math.PI / 2;
    rightBank.position.x = riverWidth / 2 + 50;
    rightBank.position.z = riverSegment.position.z;
    scene.add(rightBank);
  }

  // --- PLAYER SETUP ---
  const player = new Group();
  scene.add(player);
  let playerModel = null;
  let oarModel = null; // This will be our "stick"
  player.position.y = 0.5;

  loadModel("canoe").then(model => {
    if (model) {
      model.scale.set(1.5, 1.5, 1.5);
      model.rotation.y = Math.PI;
      player.add(model);
      playerModel = model;

      // Add a simple stick/oar for the player to use
      const stickGeo = new CylinderGeometry(0.05, 0.05, 4, 8);
      const stickMat = new MeshStandardMaterial({ color: 0x8B4513 });
      oarModel = new Mesh(stickGeo, stickMat);
      oarModel.position.set(0, 1, -0.5);
      oarModel.rotation.z = Math.PI / 2;
      player.add(oarModel);
    }
  });

  const playerSpeed = 15;
  const turnSpeed = 1.5;
  let playerVelocityX = 0;
  
  // --- PLAYER CONTROLS ---
  const keys = { left: false, right: false, push: false };

  function handleKeyDown(e) {
    if (isGameOver) return;
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = true;
    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = true;
    if (e.key === " ") {
      keys.push = true;
      e.preventDefault();
    }
  }

  function handleKeyUp(e) {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") keys.left = false;
    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") keys.right = false;
    if (e.key === " ") keys.push = false;
  }
  
  document.addEventListener('keydown', handleKeyDown);
  document.addEventListener('keyup', handleKeyUp);

  const leftBtn = document.getElementById('left-btn');
  const rightBtn = document.getElementById('right-btn');
  const pushBtn = document.getElementById('push-btn');

  leftBtn.addEventListener('pointerdown', () => { keys.left = true; });
  leftBtn.addEventListener('pointerup', () => { keys.left = false; });
  leftBtn.addEventListener('pointerleave', () => { keys.left = false; });
  
  rightBtn.addEventListener('pointerdown', () => { keys.right = true; });
  rightBtn.addEventListener('pointerup', () => { keys.right = false; });
  rightBtn.addEventListener('pointerleave', () => { keys.right = false; });

  pushBtn.addEventListener('pointerdown', () => { keys.push = true; });
  pushBtn.addEventListener('pointerup', () => { keys.push = false; });
  pushBtn.addEventListener('pointerleave', () => { keys.push = false; });

  // --- ENEMY (CROCODILE) SETUP ---
  const crocodiles = [];
  let crocBaseModel = null;
  let crocSpawnTimer = 3; // Safe time at the start
  const crocPushDistance = 5;
  let pushCooldown = 0;
  
  loadModel("crocodile").then(model => {
      if(model) {
          crocBaseModel = model;
          crocBaseModel.scale.set(1.5, 1.5, 1.5);
      }
  });

  function spawnCrocodile() {
    if (!crocBaseModel || crocodiles.length > 5) return;

    playSound("whoosh");
    const croc = crocBaseModel.clone();
    
    croc.userData.mixer = new AnimationMixer(croc);
    const swimClip = croc.animations.find(a => a.name.toLowerCase().includes('swim'));
    if(swimClip) {
        croc.userData.mixer.clipAction(swimClip).play();
    }
    
    const side = Math.random() < 0.5 ? -1 : 1;
    croc.position.x = side * (riverWidth / 2 + 5);
    croc.position.z = player.position.z - 100;
    croc.position.y = -0.5; // Start in the water
    croc.lookAt(player.position);
    croc.userData.isPushed = false;

    scene.add(croc);
    crocodiles.push(croc);
  }

  // --- SCENERY (MOUNTAINS) ---
  let mountainModel = null;
  loadModel("mountain").then(model => {
      if(model){
          mountainModel = model;
          for(let i=0; i<20; i++){
              const m = mountainModel.clone();
              m.scale.set(10, 10, 10);
              const side = Math.random() < 0.5 ? -1 : 1;
              m.position.set(
                  side * (riverWidth + Math.random() * 80),
                  -10,
                  -i * 100 - Math.random() * 50
              );
              m.rotation.y = Math.random() * Math.PI * 2;
              scene.add(m);
          }
      }
  });

  // --- SCORING & UI UPDATES ---
  const scoreElement = document.getElementById('score');
  const instructionsElement = document.getElementById('instructions');
  function updateScore(newScore) {
    score = newScore;
    scoreElement.textContent = score;
  }
  setTimeout(() => {
      if(instructionsElement) instructionsElement.style.display = 'none';
  }, 7000);


  // --- GAME LOOP ---
  function animate() {
    if (isGameOver) return;
    requestAnimationFrame(animate);

    let delta = clock.getDelta();
    if(delta > 0.1) delta = 0.1; // prevent large jumps

    // --- PLAYER MOVEMENT ---
    player.position.z -= playerSpeed * delta;
    if (keys.left) playerVelocityX = -turnSpeed;
    if (keys.right) playerVelocityX = turnSpeed;

    player.position.x += playerVelocityX * delta;
    player.position.x = Math.max(-riverWidth/2 + 2, Math.min(riverWidth/2 - 2, player.position.x));

    if (playerModel) {
        playerModel.rotation.z = -playerVelocityX * 0.2;
    }
    playerVelocityX *= 0.9; // friction

    // --- CAMERA FOLLOW ---
    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 12;
    camera.position.y = 6;
    camera.lookAt(player.position.x, player.position.y, player.position.z - 5);
    
    // --- CROCODILE LOGIC ---
    crocSpawnTimer -= delta;
    if (crocSpawnTimer <= 0) {
      spawnCrocodile();
      const baseSpawnTime = 4;
      // Spawn faster as score increases
      crocSpawnTimer = Math.max(0.8, baseSpawnTime - score / 200);
    }
    
    for (let i = crocodiles.length - 1; i >= 0; i--) {
        const croc = crocodiles[i];
        if (croc.userData.mixer) {
            croc.userData.mixer.update(delta);
        }

        if (croc.userData.isPushed) {
            // Sink and fade if pushed
            croc.position.y -= 2 * delta;
            if (croc.position.y < -5) {
                scene.remove(croc);
                crocodiles.splice(i, 1);
            }
        } else {
            // Move towards player
            const crocSpeed = 8 + score / 100;
            const direction = new Vector3().subVectors(player.position, croc.position).normalize();
            croc.position.add(direction.multiplyScalar(crocSpeed * delta));
            croc.lookAt(player.position);

            // Check collision with player
            const distance = player.position.distanceTo(croc.position);
            if (distance < 2.5) {
                endGame();
            }
        }
    }

    // --- PUSH ACTION ---
    if(pushCooldown > 0) pushCooldown -= delta;
    if (keys.push && pushCooldown <= 0) {
        let pushedOne = false;
        if(oarModel) { // Animate the oar
            oarModel.rotation.x = Math.PI / 4;
        }

        for (const croc of crocodiles) {
            if (!croc.userData.isPushed) {
                const distance = player.position.distanceTo(croc.position);
                if (distance < crocPushDistance) {
                    croc.userData.isPushed = true;
                    updateScore(score + 50);
                    playSound("hit");
                    pushedOne = true;
                }
            }
        }
        if(pushedOne) {
          pushCooldown = 0.5; // Cooldown so one press doesn't clear all
        }
        keys.push = false; // consume the push action
    }

    // Reset oar animation
    if(oarModel && oarModel.rotation.x > 0) {
        oarModel.rotation.x -= 5 * delta;
        if(oarModel.rotation.x < 0) oarModel.rotation.x = 0;
    }


    renderer.render(scene, camera);
  }

  // --- RESIZE HANDLER ---
  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onWindowResize, false);
  
  // --- GAME STATE ---
  function endGame() {
    if (isGameOver) return;
    isGameOver = true;
    playSound("game_over");
    stopMusic();
    document.getElementById('final-score').textContent = score;
    document.getElementById('game-over-screen').style.display = 'flex';
  }
  
  // --- INITIALIZE & START ---
  onWindowResize();
  let music;
  setTimeout(() => {
    music = playMusic('bg_loop_gentle');
  }, 500); // Small delay to let things load
  
  function stopMusic() {
    if (music && music.stop) {
        music.stop();
    }
  }

  animate();
</script>
</body>

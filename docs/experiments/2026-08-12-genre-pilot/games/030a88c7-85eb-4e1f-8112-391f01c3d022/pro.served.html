        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            pointer-events: none; /* Let clicks pass through to the canvas */
        }
        
        /* --- INSTRUCTIONS AND SCORE --- */
        #instructions, #score-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px;
            font-size: 1.2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #score {
            font-weight: bold;
            font-size: 1.5em;
            color: #ffd700;
        }
        #score-container {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 1em;
        }

        /* --- GAME OVER SCREEN --- */
        #game-over {
            display: none; /* Hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            pointer-events: all;
            text-align: center;
        }
        #game-over h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
            text-shadow: 3px 3px 6px #000;
        }
        #restart-button {
            padding: 20px 40px;
            font-size: 1.5em;
            border-radius: 20px;
            background: #4CAF50;
            color: white;
            border: 3px solid white;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            pointer-events: all;
        }

        /* --- ON-SCREEN CONTROLS --- */
        .controls {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding-bottom: max(12px, env(safe-area-inset-bottom)); /* Safe area for phone notches */
            box-sizing: border-box;
            pointer-events: all; /* Allow clicks on buttons */
        }
        .control-button {
            background-color: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            color: white;
            user-select: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 0 10px;
        }
        #teleport-button {
            width: 90px;
            height: 90px;
            font-size: 20px;
            font-weight: bold;
            background-color: rgba(138, 43, 226, 0.6); /* Purple for teleport */
            position: relative;
            overflow: hidden;
        }
        #teleport-cooldown {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            transform-origin: bottom;
            transform: scaleY(1);
            transition: transform 0.1s linear;
        }
    </style>
</head>
<body>
    
    
    

    <canvas id="scene"></canvas>

    <!-- UI Elements -->
    <div id="score-container">
        Score: <span id="score">0</span>
    </div>

    <div class="ui-container" id="instructions">
        <p>Use Arrow Keys or Buttons to move.<br>Press SPACE or the middle button to Teleport!</p>
    </div>
    
    <div class="ui-container" id="game-over">
        <h1>Game Over</h1>
        <button id="restart-button">Play Again</button>
    </div>

    <!-- On-screen Controls -->
    <div class="controls">
        <div class="control-button" id="left-button">◀</div>
        <div class="control-button" id="teleport-button">
            TELEPORT
            <div id="teleport-cooldown"></div>
        </div>
        <div class="control-button" id="right-button">▶</div>
    </div>

    <script type="module">
        // --- 3D IMPORTS ---
        import {
            Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3,
            Box3, BoxGeometry, PlaneGeometry, MeshStandardMaterial, Mesh, AmbientLight,
            DirectionalLight, AnimationMixer, MathUtils
        } from "three";
        
        // --- GAME STATE ---
        let score = 0;
        let gameOver = false;
        let gameSpeed = 15;
        const baseSpeed = 15;
        let isTeleporting = false;
        let teleportCooldown = 0;
        const teleportDuration = 0.2;
        const teleportRechargeTime = 5.0;

        const lanes = [-3, 0, 3];
        let currentLane = 1;

        const obstacles = [];
        const coins = [];
        let player, playerMixer, playerPlaceholder;
        let clock = new Clock();
        let on = true;

        // --- DOM ELEMENTS ---
        const scoreEl = document.getElementById('score');
        const instructionsEl = document.getElementById('instructions');
        const gameOverEl = document.getElementById('game-over');
        const restartButton = document.getElementById('restart-button');
        const teleportCooldownEl = document.getElementById('teleport-cooldown');
        const canvas = document.getElementById('scene');
        
        // --- SCENE SETUP ---
        const scene = new Scene();
        scene.background = new Color(0x5ca4ff);
        scene.fog = new Fog(0x5ca4ff, 50, 150);

        const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 3, 0);

        const renderer = new WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- LIGHTING ---
        const ambientLight = new AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        // --- GROUND AND TRACK ---
        const groundGroup = new Group();
        const groundMaterial = new MeshStandardMaterial({ color: 0x86592d });
        const groundGeometry = new PlaneGeometry(12, 200);
        const ground = new Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        groundGroup.add(ground);
        
        const grassMaterial = new MeshStandardMaterial({ color: 0x4CAF50 });
        const grassGeometry = new PlaneGeometry(200, 200);
        const grass = new Mesh(grassGeometry, grassMaterial);
        grass.rotation.x = -Math.PI / 2;
        grass.position.y = -0.01;
        groundGroup.add(grass);
        scene.add(groundGroup);

        // --- PLAYER SETUP ---
        function setupPlayer() {
            playerPlaceholder = new Mesh(new BoxGeometry(1, 2, 1), new MeshStandardMaterial({ color: 0xff0000, visible: false }));
            playerPlaceholder.position.set(lanes[currentLane], 1, 3);
            scene.add(playerPlaceholder);
            player = playerPlaceholder;
            
            loadModel("explorer").then(model => {
                if (model) {
                    scene.remove(playerPlaceholder);
                    player = model;
                    player.scale.set(1.2, 1.2, 1.2);
                    player.rotation.y = Math.PI; // Face forward
                    scene.add(player);
                    
                    const runClip = model.animations.find(a => /sprint/i.test(a.name));
                    if (runClip) {
                        playerMixer = new AnimationMixer(model);
                        playerMixer.clipAction(runClip).play();
                    }
                }
            });
        }
        
        // --- OBSTACLE SETUP ---
        const obstacleGeometry = new BoxGeometry(2.5, 3, 2);
        const obstacleMaterial = new MeshStandardMaterial({ color: 0xcc0000 });
        
        function spawnObstacle() {
            if (gameOver) return;
            const obstacle = new Mesh(obstacleGeometry, obstacleMaterial);
            obstacle.position.set(lanes[Math.floor(Math.random() * 3)], 1.5, -150);
            obstacles.push(obstacle);
            scene.add(obstacle);
        }

        // --- COIN SETUP ---
        let coinModel = null;
        loadModel("coin").then(model => {
            if (model) {
                coinModel = model;
                coinModel.scale.set(0.6, 0.6, 0.6);
            }
        });
        
        function spawnCoin() {
            if (gameOver || !coinModel) return;
            
            // Spawn a line of 5 coins
            const lane = lanes[Math.floor(Math.random() * 3)];
            for (let i = 0; i < 5; i++) {
                const coin = coinModel.clone();
                coin.position.set(lane, 1.5, -150 - i * 3);
                coins.push(coin);
                scene.add(coin);
            }
        }
        
        // --- SCENERY SETUP ---
        const sceneryObjects = [];
        let treeModel = null;
        loadModel("tree").then(model => {
            if (model) treeModel = model;
        });

        function spawnScenery() {
            if (gameOver || !treeModel) return;
            
            const tree = treeModel.clone();
            const side = Math.random() < 0.5 ? -1 : 1;
            tree.position.set(side * (Math.random() * 20 + 10), 0, -150);
            tree.scale.setScalar(Math.random() * 2 + 2);
            sceneryObjects.push(tree);
            scene.add(tree);
        }
        
        // --- SPAWN TIMERS ---
        // Avoid spawning anything in the first few seconds
        setTimeout(() => {
            setInterval(spawnObstacle, 2000);
            setInterval(spawnCoin, 2500);
            setInterval(spawnScenery, 1000);
        }, 3000);


        // --- PLAYER CONTROLS ---
        function move(direction) {
            if (gameOver) return;
            currentLane = Math.max(0, Math.min(2, currentLane + direction));
        }
        
        function teleport() {
            if (gameOver || isTeleporting || teleportCooldown > 0) return;
            isTeleporting = true;
            teleportCooldown = teleportRechargeTime;
            gameSpeed = 100; // Big speed boost!
            playSound("whoosh");
            setTimeout(() => {
                isTeleporting = false;
                gameSpeed = baseSpeed + score / 200; // Return to normal speed
            }, teleportDuration * 1000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
                move(-1);
                e.preventDefault();
            } else if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
                move(1);
                e.preventDefault();
            } else if (e.key === ' ') {
                teleport();
                e.preventDefault();
            }
        });
        
        document.getElementById('left-button').addEventListener('pointerdown', () => move(-1));
        document.getElementById('right-button').addEventListener('pointerdown', () => move(1));
        document.getElementById('teleport-button').addEventListener('pointerdown', teleport);

        // --- GAME OVER LOGIC ---
        function triggerGameOver() {
            if (gameOver) return;
            gameOver = true;
            playSound("hit");
            playMusic("bg_loop_playful").stop();
            instructionsEl.style.display = 'none';
            gameOverEl.style.display = 'flex';
        }
        
        // --- RESTART LOGIC ---
        restartButton.addEventListener('click', () => {
            window.location.reload();
        });

        // --- RESIZE HANDLER ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);

        // --- VISIBILITY / PAUSE HANDLER ---
        const setOn = (v) => {
            if (v === on) return;
            on = v;
            if (v) {
                clock.getDelta(); // Clear the large delta from being paused
                requestAnimationFrame(animate);
            }
        };
        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        window.addEventListener('blur', () => setOn(false));
        window.addEventListener('focus', () => setOn(true));

        // --- MAIN GAME LOOP ---
        function animate() {
            if (!on) return; // Paused
            requestAnimationFrame(animate);

            let delta = clock.getDelta();
            delta = Math.min(delta, 0.05); // Cap delta to avoid large jumps

            if (gameOver) return;

            // --- SCORE AND SPEED ---
            score += Math.floor(gameSpeed * delta);
            scoreEl.textContent = score;
            if (!isTeleporting) {
                gameSpeed = baseSpeed + score / 200; // Gradually increase speed
            }
            
            // --- HIDE INSTRUCTIONS ---
            if(clock.getElapsedTime() > 5 && instructionsEl.style.display !== 'none'){
                instructionsEl.style.display = 'none';
            }

            // --- PLAYER MOVEMENT ---
            const targetX = lanes[currentLane];
            player.position.x = MathUtils.lerp(player.position.x, targetX, 0.2);
            if (playerMixer) {
                playerMixer.update(delta);
            }
            
            // --- TELEPORT COOLDOWN ---
            if (teleportCooldown > 0) {
                teleportCooldown -= delta;
                teleportCooldownEl.style.transform = `scaleY(${teleportCooldown / teleportRechargeTime})`;
            }

            // --- MOVE OBSTACLES & CHECK COLLISIONS ---
            const playerBox = new Box3().setFromObject(player);
            playerBox.expandByScalar(-0.5); // Make player hitbox a bit smaller
            
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                obstacle.position.z += gameSpeed * delta;

                if (obstacle.position.z > 20) {
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                } else {
                    const obstacleBox = new Box3().setFromObject(obstacle);
                    if (playerBox.intersectsBox(obstacleBox)) {
                        triggerGameOver();
                    }
                }
            }
            
            // --- MOVE COINS & CHECK COLLECTION ---
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                coin.position.z += gameSpeed * delta;
                coin.rotation.y += delta * 5; // Spin the coin

                if (coin.position.z > 20) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                } else {
                    const coinBox = new Box3().setFromObject(coin);
                    if (playerBox.intersectsBox(coinBox)) {
                        score += 50; // Bonus points!
                        playSound("coin_pickup");
                        scene.remove(coin);
                        coins.splice(i, 1);
                    }
                }
            }

            // --- MOVE SCENERY ---
             for (let i = sceneryObjects.length - 1; i >= 0; i--) {
                const obj = sceneryObjects[i];
                obj.position.z += gameSpeed * delta;
                if (obj.position.z > 20) {
                    scene.remove(obj);
                    sceneryObjects.splice(i, 1);
                }
            }

            // --- RENDER SCENE ---
            renderer.render(scene, camera);
        }

        // --- START GAME ---
        onWindowResize();
        setupPlayer();
        playMusic("bg_loop_playful");
        animate();

    </script>
</body>
</html>

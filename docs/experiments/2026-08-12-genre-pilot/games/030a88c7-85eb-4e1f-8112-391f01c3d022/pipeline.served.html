            justify-content: flex-end;
            background-color: #333;
            height: 100dvh;
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE10+/Edge */

        }
        #game-container {
            position: relative;
            width: 100%;

            flex-direction: column;

            flex-direction: column;

            align-items: center;
            text-align: center;
            font-size: clamp(1.5rem, 7vw, 4rem);
            font-weight: bold;
            z-index: 2;
            pointer-events: all;
            visibility: hidden; /* Hidden by default */
        }
        #game-over-screen.visible {
            visibility: visible;
        }
        #game-over-screen button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: clamp(1rem, 4vw, 2rem);
            font-weight: bold;
            border: none;
            border-radius: 15px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #388E3C;
            transition: all 0.1s ease;
        }
        #game-over-screen button:active {
            background-color: #388E3C;
            box-shadow: 0 2px 0 #2E7D32;
            transform: translateY(3px);
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 5px;
            width: 100%;
            max-width: 400px; /* Limit width on very wide screens */
            padding: 10px;
            box-sizing: border-box;
            align-items: end;
            pointer-events: all;
        }
        .control-button {
            background-color: rgba(0, 123, 255, 0.7);
            border: none;
            color: white;
            padding: clamp(15px, 6vw, 30px) 0;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: clamp(1rem, 4vw, 2rem);
            font-weight: bold;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 0 rgba(0, 86, 179, 0.7);
            transition: all 0.1s ease;
            touch-action: manipulation; /* Prevent scrolling/zooming */
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight */
        }
        .control-button.disabled {
            background-color: rgba(150, 150, 150, 0.7);
            box-shadow: 0 4px 0 rgba(100, 100, 100, 0.7);
            cursor: not-allowed;

        .control-button:active:not(.disabled) {
            background-color: rgba(0, 86, 179, 0.7);
            box-shadow: 0 2px 0 rgba(0, 50, 100, 0.7);
            transform: translateY(2px);
        }
        #left-btn, #right-btn { grid-row: 2; }
        #jump-btn { grid-row: 1; grid-column: 2; }
        #teleport-btn { grid-row: 1; grid-column: 3; }
        #slide-btn { grid-row: 2; grid-column: 1; } /* Placeholder for slide button */
        #left-btn { grid-column: 1; }
        #right-btn { grid-column: 3; }
        #teleport-btn {
            background-color: rgba(255, 165, 0, 0.8);
            box-shadow: 0 4px 0 rgba(200, 130, 0, 0.8);
        }
        #teleport-btn:active:not(.disabled) {
            background-color: rgba(200, 130, 0, 0.8);
            box-shadow: 0 2px 0 rgba(150, 90, 0, 0.8);
        }

        /* Adjust button grid for optimal layout */
        .controls {
            grid-template-areas:
                ". jump teleport"
                "left . right";
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto;
            align-items: center;
            justify-content: center;
            padding-bottom: max(12px, env(safe-area-inset-bottom)); /* Breathing room */
        }
        #left-btn { grid-area: left; }
        #right-btn { grid-area: right; }
        #jump-btn { grid-area: jump; }
        #teleport-btn { grid-area: teleport; }

        /* Small screen adjustments */
        @media (max-width: 480px) {
            .controls {
                grid-template-areas:
                    "left jump teleport"
                    ". . right";
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: auto auto;
            }
            #right-btn { grid-area: right; }
        }
    </style>
</head>
<body>
    
    
    

    <div id="game-container">
        <canvas id="scene"></canvas>
        <div id="game-ui">
            <div id="top-info">
                <div id="lives">Lives: 💖💖💖</div>
                <div id="score">Score: 0</div>
            </div>
            <div id="game-over-screen">
                <h2>Game Over!</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-button">Play Again!</button>
            </div>
            <div class="controls">
                <button id="left-btn" class="control-button">⬅️</button>
                <button id="jump-btn" class="control-button">⬆️ JUMP</button>
                <button id="teleport-btn" class="control-button">⚡ TELEPORT</button>
                <button id="right-btn" class="control-button">➡️</button>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3,
            BoxGeometry, CylinderGeometry, MeshStandardMaterial, Mesh,
            AmbientLight, DirectionalLight, AnimationMixer, Quaternion,
            Matrix4, Vector2, MathUtils
        } from "three";

        // --- GAME STATE ---
        let scene, camera, renderer, clock, mixer;
        let player, playerModel, playerCollider;
        let playerSpeed = 5.0; // meters per second
        let currentLaneIndex = 1; // 0: left, 1: center, 2: right
        const laneXPositions = [-2.5, 0, 2.5]; // X coordinates for each lane
        const laneSwitchDuration = 0.2; // seconds
        let laneSwitchTimer = 0;
        let targetLaneX = 0;
        let isSwitchingLane = false;

        let lives = 3;
        let score = 0;
        let distanceTraveled = 0;
        let lastScoreDistance = 0;

        let obstacles = [];
        let coins = [];
        let platforms = []; // For the ground segments
        const obstacleSpawnDistance = -50; // Z distance ahead of player to spawn obstacles
        const obstacleDespawnDistance = 10; // Z distance behind player to despawn
        let lastObstacleSpawnTime = 0;
        const obstacleSpawnIntervalMin = 1.0;
        const obstacleSpawnIntervalMax = 5.0;
        let nextObstacleSpawnAt = 0;

        let gameOver = false;
        let lastTimestamp = 0;

        // Teleport ability
        const teleportDistance = 5.0;
        const teleportCooldown = 3.0; // seconds
        let teleportCooldownTimer = 0;
        let canTeleport = true;
        let isTeleporting = false;
        const teleportEffectDuration = 0.3; // How long the visual effect lasts
        let teleportEffectTimer = 0;
        let teleportEffectMesh;

        // Player physics/animation state
        let velocityY = 0;
        const gravity = -20; // Increased for faster fall
        const jumpPower = 9;
        let isJumping = false;
        let isGrounded = true; // Player starts on the ground
        let coyoteTime = 0; // Small window to jump after leaving platform
        const coyoteTimeDuration = 0.1;

        const INVINCIBILITY_DURATION = 1.0; // seconds after a hit
        let invincibilityTimer = 0;
        let isInvincible = false;

        // UI Elements
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreElement = document.getElementById('final-score');
        const restartButton = document.getElementById('restart-button');
        const teleportButton = document.getElementById('teleport-btn');
        const jumpButton = document.getElementById('jump-btn');
        const leftButton = document.getElementById('left-btn');
        const rightButton = document.getElementById('right-btn');

        // --- INITIAL SETUP ---
        function init() {
            // Scene
            scene = new Scene();
            scene.background = new Color(0x87CEEB); // Sky blue
            scene.fog = new Fog(0x87CEEB, 1, 100);

            // Camera
            camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 10);
            camera.lookAt(0, 2, 0);

            // Renderer
            renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            window.addEventListener('resize', onWindowResize);

            // Clock
            clock = new Clock();

            // Lighting
            const ambientLight = new AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 10, 5);
            scene.add(directionalLight);

            // --- PLAYER ---
            const playerGeometry = new CylinderGeometry(0.8, 0.8, 1.8, 16);
            const playerMaterial = new MeshStandardMaterial({ color: 0x00ff00 });
            player = new Group();
            playerModel = new Mesh(playerGeometry, playerMaterial); // Placeholder
            playerModel.position.y = 0.9; // Base of cylinder at y=0
            player.add(playerModel);
            player.position.set(laneXPositions[currentLaneIndex], 0, 5);
            scene.add(player);

            playerCollider = new Box3().setFromObject(playerModel); // Initial bounding box

            // Load character model
            loadModel("explorer").then(model => {
                if (model) {
                    playerModel.visible = false; // Hide placeholder
                    model.scale.set(1.2, 1.2, 1.2);
                    model.position.y = -0.05; // Adjust model to stand on ground
                    player.add(model);
                    playerModel = model; // Replace placeholder with actual model
                    mixer = new AnimationMixer(playerModel);
                    playPlayerAnimation("walk", 0.5); // Start with a walk animation
                }
            });

            // Teleport effect mesh
            const teleportEffectGeo = new SphereGeometry(2, 32, 32);
            const teleportEffectMat = new MeshBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.5 });
            teleportEffectMesh = new Mesh(teleportEffectGeo, teleportEffectMat);
            teleportEffectMesh.visible = false;
            scene.add(teleportEffectMesh);

            // Initial track platforms
            for (let i = 0; i < 10; i++) {
                addPlatform(i * -10);
            }

            // Game loop
            restartGame();
            animate();
        }

        // --- ANIMATION MIXER HELPER ---
        let currentClipAction;
        function playPlayerAnimation(name, speed = 1.0) {
            if (!mixer || !playerModel.animations) return;

            let clip = playerModel.animations.find(a => a.name.toLowerCase().includes(name.toLowerCase()));
            // Fallback for run/walk/idle
            if (!clip) {
                if (name === "run" || name === "walk") {
                    clip = playerModel.animations.find(a => a.name.toLowerCase().includes("sprint"));
                }
                if (!clip) {
                    clip = playerModel.animations.find(a => a.name.toLowerCase().includes("idle"));
                }
            }

            if (clip) {
                const action = mixer.clipAction(clip);
                action.setEffectiveTimeScale(speed);
                action.loop = 2200; // THREE.LoopRepeat

                if (currentClipAction !== action) {
                    if (currentClipAction) {
                        currentClipAction.fadeOut(0.2);
                    }
                    action.reset().fadeIn(0.2).play();
                    currentClipAction = action;
                }
            }
        }


        // --- GAME LOOP ---
        function animate(timestamp) {
            if (!gameOver) {
                requestAnimationFrame(animate);
            } else {
                // Game over, stop requesting frames
                return;
            }

            const delta = Math.min(0.05, clock.getDelta()); // Clamp delta to avoid massive jumps

            // Update mixer for animations
            if (mixer) {
                mixer.update(delta);
            }

            // --- PLAYER MOVEMENT ---
            // Forward movement
            if (!isTeleporting) {
                 player.position.z -= playerSpeed * delta;
                 distanceTraveled += playerSpeed * delta;
            }


            // Lane switching animation
            if (isSwitchingLane) {
                laneSwitchTimer += delta;
                const progress = Math.min(1, laneSwitchTimer / laneSwitchDuration);
                player.position.x = MathUtils.lerp(player.position.x, targetLaneX, progress);
                if (progress >= 1) {
                    isSwitchingLane = false;
                    player.position.x = targetLaneX; // Ensure it snaps to target
                }
            }

            // Jumping/Falling
            if (!isGrounded) {
                velocityY += gravity * delta;
                // Variable jump height: if jump key released while rising, reduce jump power
                if (velocityY > 0 && !isJumping) {
                    velocityY *= 0.5; // Halve velocity if jump key released
                }
                // Fall faster than rise
                if (velocityY < 0) {
                    velocityY += gravity * delta * 0.8; // 1.8x gravity while falling
                }
            }
            player.position.y += velocityY * delta;

            // Ground collision (simple for now)
            if (player.position.y <= 0) {
                player.position.y = 0;
                if (!isGrounded) { // Just landed
                    isGrounded = true;
                    velocityY = 0;
                    playPlayerAnimation("run", 0.5 + score * 0.0005); // Resume run animation
                }
                coyoteTime = 0; // Reset coyote time on ground
            } else {
                if (isGrounded) { // Just left the ground
                    coyoteTime = coyoteTimeDuration;
                }
                isGrounded = false;
            }

            if (!isGrounded && coyoteTime > 0) {
                coyoteTime -= delta;
            }

            // Invincibility Timer
            if (isInvincible) {
                invincibilityTimer -= delta;
                // Flash player
                playerModel.traverse(child => {
                    if (child.isMesh) {
                        child.visible = Math.floor(invincibilityTimer * 10) % 2 === 0;
                    }
                });
                if (invincibilityTimer <= 0) {
                    isInvincible = false;
                    playerModel.traverse(child => { if (child.isMesh) child.visible = true; });
                }
            }

            // Teleport cooldown
            if (!canTeleport) {
                teleportCooldownTimer -= delta;
                if (teleportCooldownTimer <= 0) {
                    canTeleport = true;
                    teleportButton.classList.remove('disabled');
                }
            }

            // Teleport visual effect
            if (isTeleporting) {
                teleportEffectTimer -= delta;
                if (teleportEffectMesh) {
                    teleportEffectMesh.position.copy(player.position);
                    teleportEffectMesh.material.opacity = Math.max(0, teleportEffectTimer / teleportEffectDuration) * 0.5;
                    teleportEffectMesh.visible = teleportEffectTimer > 0;
                }
                if (teleportEffectTimer <= 0) {
                    isTeleporting = false;
                }
            }


            // Update camera position to follow player
            camera.position.z = player.position.z + 10;
            camera.lookAt(player.position.x, player.position.y + 2, player.position.z);


            // --- OBSTACLE / COIN LOGIC ---
            // Spawn new platforms
            while (platforms.length > 0 && platforms[0].position.z > player.position.z + obstacleDespawnDistance) {
                const oldPlatform = platforms.shift();
                scene.remove(oldPlatform);
                addPlatform(platforms[platforms.length - 1].position.z - 10);
            }

            // Spawn obstacles and coins
            const currentTime = clock.elapsedTime;
            if (currentTime - lastObstacleSpawnTime > nextObstacleSpawnAt) {
                spawnObstacle();
                spawnCoin();
                lastObstacleSpawnTime = currentTime;
                nextObstacleSpawnAt = MathUtils.randFloat(obstacleSpawnIntervalMin, obstacleSpawnIntervalMax);
            }

            // Update obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                if (obstacle.position.z > player.position.z + obstacleDespawnDistance) {
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                } else {
                    // Obstacle movement (if any, simple cubes are stationary)
                    // If obstacles were moving, update their position here
                }
            }

            // Update coins
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                // Make coins spin!
                if (coin.isMesh) {
                    coin.rotation.y += Math.PI * delta;
                }
                if (coin.position.z > player.position.z + obstacleDespawnDistance) {
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }

            // --- COLLISION DETECTION ---
            playerCollider.setFromObject(playerModel).expandByScalar(-0.3); // Shrink slightly for more forgiving collisions
            playerCollider.translate(player.position); // Move player collider with player group

            // Obstacle collision
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                const obstacleBox = new Box3().setFromObject(obstacle);
                obstacleBox.translate(obstacle.position); // Adjust obstacle's collider to its world position

                if (playerCollider.intersectsBox(obstacleBox)) {
                    if (!isInvincible) {
                        playSound("hit");
                        lives--;
                        updateLivesUI();
                        isInvincible = true;
                        invincibilityTimer = INVINCIBILITY_DURATION;

                        if (lives <= 0) {
                            endGame();
                            return; // Stop processing further frames
                        }
                    }
                    // Remove obstacle on collision
                    scene.remove(obstacle);
                    obstacles.splice(i, 1);
                }
            }

            // Coin collision
            for (let i = coins.length - 1; i >= 0; i--) {
                const coin = coins[i];
                const coinBox = new Box3().setFromObject(coin).expandByScalar(-0.1); // Make coin collider smaller
                coinBox.translate(coin.position);

                if (playerCollider.intersectsBox(coinBox)) {
                    playSound("coin_pickup");
                    score += 10;
                    updateScoreUI();
                    scene.remove(coin);
                    coins.splice(i, 1);
                }
            }


            // --- SCORING ---
            // Add score based on distance
            if (distanceTraveled - lastScoreDistance >= 10) {
                score += Math.floor((distanceTraveled - lastScoreDistance) / 10);
                lastScoreDistance = distanceTraveled;
                updateScoreUI();
            }

            // --- RENDERING ---
            renderer.render(scene, camera);
        }

        // --- GAME MANAGEMENT ---
        function startGame() {
            if (gameOver) {
                restartGame();
            }
            if (currentClipAction) {
                currentClipAction.stop(); // Stop any initial idle animation
            }
            playPlayerAnimation("run", 0.5 + score * 0.0005); // Start running animation
            playMusic("bg_loop_playful"); // Start background music
        }

        function restartGame() {
            gameOver = false;
            lives = 3;
            score = 0;
            distanceTraveled = 0;
            lastScoreDistance = 0;
            playerSpeed = 5.0; // Reset speed
            teleportCooldownTimer = 0;
            canTeleport = true;
            teleportButton.classList.remove('disabled');

            player.position.set(laneXPositions[1], 0, 5); // Reset player position
            currentLaneIndex = 1;
            isSwitchingLane = false;
            isJumping = false;
            isGrounded = true;
            velocityY = 0;
            coyoteTime = 0;
            isInvincible = false;
            invincibilityTimer = 0;
            playerModel.traverse(child => { if (child.isMesh) child.visible = true; });

            // Clear all obstacles and coins
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];
            coins.forEach(c => scene.remove(c));
            coins = [];

            // Clear platforms and regenerate
            platforms.forEach(p => scene.remove(p));
            platforms = [];
            for (let i = 0; i < 10; i++) {
                addPlatform(i * -10);
            }

            lastObstacleSpawnTime = clock.elapsedTime;
            nextObstacleSpawnAt = MathUtils.randFloat(obstacleSpawnIntervalMin, obstacleSpawnIntervalMax);

            updateLivesUI();
            updateScoreUI();
            gameOverScreen.classList.remove('visible');
            animate(); // Restart the animation loop
        }

        function endGame() {
            gameOver = true;
            playSound("game_over");
            finalScoreElement.textContent = score;
            gameOverScreen.classList.add('visible');
            if (currentClipAction) {
                currentClipAction.stop(); // Stop running animation
                playPlayerAnimation("idle", 0.5); // Play idle animation
            }
        }

        // --- UI UPDATES ---
        function updateLivesUI() {
            livesElement.textContent = `Lives: ${'💖'.repeat(lives)}`;
        }

        function updateScoreUI() {
            scoreElement.textContent = `Score: ${score}`;
        }

        // --- GAME OBJECTS ---
        function addPlatform(zPos) {
            const platformGeometry = new BoxGeometry(10, 0.1, 10);
            const platformMaterial = new MeshStandardMaterial({ color: 0x55aa55 }); // Green track
            const platform = new Mesh(platformGeometry, platformMaterial);
            platform.position.set(0, -0.05, zPos);
            scene.add(platform);
            platforms.push(platform);
        }

        function spawnObstacle() {
            // Ensure first 3 seconds are safe
            if (clock.elapsedTime < 3) return;

            const lane = Math.floor(Math.random() * 3);
            const xPos = laneXPositions[lane];
            const zPos = player.position.z + obstacleSpawnDistance;

            const obstacleType = Math.random();
            let obstacleMesh;

            if (obstacleType < 0.5) { // Simple box obstacle
                const obstacleGeometry = new BoxGeometry(1.5, 1.5, 1.5);
                const obstacleMaterial = new MeshStandardMaterial({ color: 0xff0000 });
                obstacleMesh = new Mesh(obstacleGeometry, obstacleMaterial);
                obstacleMesh.position.set(xPos, 0.75, zPos); // Half height for y
            } else { // Car obstacle
                loadModel("car").then(model => {
                    if (model) {
                        model.scale.set(0.8, 0.8, 0.8);
                        model.position.set(xPos, 0.1, zPos); // Adjust car to sit on track
                        model.rotation.y = Math.PI; // Face towards player
                        scene.add(model);
                        obstacles.push(model);
                    } else { // Fallback to box if model fails
                        const obstacleGeometry = new BoxGeometry(2, 1, 3);
                        const obstacleMaterial = new MeshStandardMaterial({ color: 0xffa500 }); // Orange
                        obstacleMesh = new Mesh(obstacleGeometry, obstacleMaterial);
                        obstacleMesh.position.set(xPos, 0.5, zPos);
                        scene.add(obstacleMesh);
                        obstacles.push(obstacleMesh);
                    }
                });
                return; // Car model will be added asynchronously
            }
            scene.add(obstacleMesh);
            obstacles.push(obstacleMesh);
        }

        function spawnCoin() {
             // Ensure first 3 seconds are safe
             if (clock.elapsedTime < 3) return;

            const lane = Math.floor(Math.random() * 3);
            const xPos = laneXPositions[lane];
            const zPos = player.position.z + obstacleSpawnDistance - MathUtils.randFloat(5, 15); // Spawn a bit further than obstacles

            // Only spawn if there's no obstacle nearby
            let tooCloseToObstacle = obstacles.some(obs =>
                Math.abs(obs.position.x - xPos) < 1.5 && Math.abs(obs.position.z - zPos) < 5
            );
            if (tooCloseToObstacle) return;

            loadModel("coin").then(model => {
                if (model) {
                    model.scale.set(0.5, 0.5, 0.5);
                    model.position.set(xPos, 1, zPos); // Float above the track
                    scene.add(model);
                    coins.push(model);
                } else { // Fallback to simple cylinder if model fails
                    const coinGeometry = new CylinderGeometry(0.5, 0.5, 0.1, 16);
                    const coinMaterial = new MeshStandardMaterial({ color: 0xffd700 }); // Gold
                    const coinMesh = new Mesh(coinGeometry, coinMaterial);
                    coinMesh.position.set(xPos, 1, zPos);
                    scene.add(coinMesh);
                    coins.push(coinMesh);
                }
            });
        }


        // --- CONTROLS ---
        function switchLane(direction) {
            if (gameOver || isSwitchingLane || !isGrounded) return; // Can't switch lanes mid-air

            let newLaneIndex = currentLaneIndex + direction;
            if (newLaneIndex >= 0 && newLaneIndex < laneXPositions.length) {
                currentLaneIndex = newLaneIndex;
                targetLaneX = laneXPositions[currentLaneIndex];
                isSwitchingLane = true;
                laneSwitchTimer = 0;
            }
        }

        function jump() {
            if (gameOver) return;

            if (isGrounded || coyoteTime > 0) { // Allow jump from ground or within coyote time
                playSound("jump");
                velocityY = jumpPower;
                isJumping = true;
                isGrounded = false; // Player is now airborne
                coyoteTime = 0; // Consume coyote time
                playPlayerAnimation("idle", 1.0); // Simple idle during jump for now
            }
        }

        function releaseJump() {
            isJumping = false;
        }

        function useTeleport() {
            if (gameOver || !canTeleport) return;

            playSound("whoosh");
            player.position.z -= teleportDistance;
            distanceTraveled += teleportDistance; // Count teleport distance towards score
            score += Math.floor(teleportDistance / 10); // Directly add teleport distance to score
            updateScoreUI();

            canTeleport = false;
            teleportCooldownTimer = teleportCooldown;
            teleportButton.classList.add('disabled');

            isTeleporting = true;
            teleportEffectTimer = teleportEffectDuration;
        }


        // --- EVENT LISTENERS ---
        // Keyboard controls
        window.addEventListener('keydown', (event) => {
            if (gameOver) {
                if (event.key === ' ' || event.key === 'Enter') {
                    restartGame();
                }
                return;
            }
            switch (event.key) {
                case 'ArrowLeft':
                case 'a':
                    switchLane(-1);
                    event.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                    switchLane(1);
                    event.preventDefault();
                    break;
                case 'ArrowUp':
                case 'w':
                case ' ': // Space bar for jump
                    jump();
                    event.preventDefault();
                    break;
                case 't': // 't' for teleport
                    useTeleport();
                    event.preventDefault();
                    break;
            }
        });

        window.addEventListener('keyup', (event) => {
            switch (event.key) {
                case 'ArrowUp':
                case 'w':
                case ' ':
                    releaseJump();
                    break;
            }
        });


        // On-screen buttons
        leftButton.addEventListener('pointerdown', (e) => { e.preventDefault(); switchLane(-1); });
        rightButton.addEventListener('pointerdown', (e) => { e.preventDefault(); switchLane(1); });
        jumpButton.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
        jumpButton.addEventListener('pointerup', (e) => { e.preventDefault(); releaseJump(); });
        teleportButton.addEventListener('pointerdown', (e) => { e.preventDefault(); useTeleport(); });
        restartButton.addEventListener('pointerdown', (e) => { e.preventDefault(); restartGame(); });


        // Swipe controls (for lane switching and jump)
        let touchStartX = 0;
        let touchStartY = 0;
        let touchMoveX = 0;
        let touchMoveY = 0;
        let isSwiping = false;

        window.addEventListener('touchstart', (event) => {
            if (event.touches.length === 1) {
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;
                isSwiping = true;
            }
        }, { passive: false }); // Passive false to allow preventDefault

        window.addEventListener('touchmove', (event) => {
            if (isSwiping && event.touches.length === 1) {
                touchMoveX = event.touches[0].clientX;
                touchMoveY = event.touches[0].clientY;
            }
        }, { passive: false });

        window.addEventListener('touchend', (event) => {
            if (isSwiping) {
                const deltaX = touchMoveX - touchStartX;
                const deltaY = touchMoveY - touchStartY;
                const swipeThreshold = 50; // Pixels

                if (Math.abs(deltaX) > swipeThreshold || Math.abs(deltaY) > swipeThreshold) {
                    if (Math.abs(deltaX) > Math.abs(deltaY)) { // Horizontal swipe
                        if (deltaX > 0) {
                            switchLane(1); // Swipe right
                        } else {
                            switchLane(-1); // Swipe left
                        }
                    } else { // Vertical swipe
                        if (deltaY < 0) {
                            jump(); // Swipe up for jump
                        }
                    }
                }
                isSwiping = false;
                // If jump was triggered by a swipe, release it now
                if (Math.abs(deltaY) > Math.abs(deltaX) && deltaY < 0) {
                    releaseJump();
                }
            }
            isSwiping = false; // Reset regardless
        });


        // --- WINDOW RESIZE ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- VISIBILITY / FOCUS HANDLING ---
        let gameOn = true;
        const setGameOn = (v) => {
            if (v === gameOn) return;
            gameOn = v;
            if (v) {
                clock.getDelta(); // Reset delta to prevent teleportation after pause
                if (!gameOver) animate();
                playMusic("bg_loop_playful"); // Resume music
            } else {
                 // Pause logic (handled by stopping requestAnimationFrame and checking gameOver)
            }
        };
        document.addEventListener('visibilitychange', () => setGameOn(!document.hidden));
        addEventListener('blur', () => setGameOn(false));
        addEventListener('focus', () => setGameOn(true));

        // Start everything!
        init();
        startGame(); // Start the game immediately

    </script>
</body>
</html>

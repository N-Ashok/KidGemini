            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to the canvas */
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        #instructions {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            font-size: 14px;
        }
        #score {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            font-weight: bold;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }
        /* --- ON-SCREEN CONTROLS --- */
        #controls-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            /* Add space for mobile phone home bars */
            padding-bottom: max(12px, env(safe-area-inset-bottom)); 
            pointer-events: auto; /* Re-enable pointer events for controls */
            touch-action: none; /* Prevent scrolling on mobile */
        }
        .control-button {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none; /* Prevent text selection */
            cursor: pointer;
        }
        #joystick {
            position: relative;
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        #joystick-thumb {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            left: 30px;
            top: 30px;
            transition: transform 0.1s;
        }
        #action-buttons {
            display: flex;
            gap: 15px;
        }
        #shoot-button {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 80, 80, 0.5);
            border-color: rgba(255, 120, 120, 0.8);
        }
        /* --- GAME OVER SCREEN --- */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            display: none; /* Hidden by default */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 2em;
            pointer-events: auto;
        }
        #game-over-screen h1 { margin-bottom: 0; }
        #game-over-screen p { margin-top: 10px; font-size: 0.7em; }
        #restart-button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 0.8em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    
    

    <canvas id="scene"></canvas>
    
    <!-- UI ELEMENTS -->
    <div class="ui-overlay">
        <div id="instructions">
            <b>PC:</b> WASD to move, Mouse to aim, Click to shoot.<br>
            <b>Mobile:</b> Use joystick and shoot button.
        </div>
        <div id="score">Score: 0</div>
    </div>
    
    <!-- ON-SCREEN CONTROLS -->
    <div id="controls-container">
        <div id="joystick">
            <div id="joystick-thumb"></div>
        </div>
        <div id="action-buttons">
            <div id="shoot-button" class="control-button">🔥</div>
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen">
        <h1>Game Over!</h1>
        <p id="final-score">Your Score: 0</p>
        <button id="restart-button">Play Again</button>
    </div>

    <script type="module">
        // --- THREE.JS IMPORTS ---
        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, CylinderGeometry, PlaneGeometry, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, MathUtils, Vector2, Raycaster } from "three";
        
        // --- GAME SETUP ---
        const scene = new Scene();
        scene.background = new Color(0x87CEEB); // Sky blue
        scene.fog = new Fog(0x87CEEB, 50, 150);

        const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 15, 20); // Set camera higher up
        camera.lookAt(0, 0, 0);

        const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const clock = new Clock();
        const scoreElement = document.getElementById('score');
        let score = 0;
        let isGameOver = false;

        playMusic("bg_loop_upbeat");

        // --- LIGHTING ---
        const ambientLight = new AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(10, 20, 5);
        scene.add(dirLight);

        // --- ARENA & SCENERY ---
        const arenaSize = 100;
        const ground = new Mesh(
            new PlaneGeometry(arenaSize, arenaSize),
            new MeshStandardMaterial({ color: 0x90ee90 }) // Grassy green
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = 0;
        scene.add(ground);
        
        const wallMaterial = new MeshStandardMaterial({ color: 0xaaaaaa });
        const wallHeight = 10;
        const wallThickness = 2;
        const walls = [
            { size: [arenaSize, wallHeight, wallThickness], pos: [0, wallHeight / 2, -arenaSize / 2] },
            { size: [arenaSize, wallHeight, wallThickness], pos: [0, wallHeight / 2, arenaSize / 2] },
            { size: [wallThickness, wallHeight, arenaSize], pos: [-arenaSize / 2, wallHeight / 2, 0] },
            { size: [wallThickness, wallHeight, arenaSize], pos: [arenaSize / 2, wallHeight / 2, 0] },
        ];
        walls.forEach(w => {
            const wall = new Mesh(new BoxGeometry(...w.size), wallMaterial);
            wall.position.set(...w.pos);
            scene.add(wall);
        });

        const treePositions = [
            new Vector3(20, 0, 20), new Vector3(-20, 0, -20), new Vector3(25, 0, -15),
            new Vector3(-15, 0, 25), new Vector3(0, 0, 30), new Vector3(30, 0, 0),
            new Vector3(-35, 0, 5)
        ];
        treePositions.forEach(pos => {
            loadModel("tree").then(model => {
                if(model) {
                    model.position.copy(pos);
                    model.scale.set(3, 3, 3);
                    scene.add(model);
                }
            });
        });

        // --- PLAYER SETUP ---
        const player = new Group();
        const playerSpeed = 15;
        player.position.set(0, 0, 10);
        scene.add(player);
        let playerModel = null;
        let playerMixer = null;
        let playerAnims = {};

        const placeholderPlayer = new Mesh(new CylinderGeometry(0.5, 0.5, 2, 8), new MeshStandardMaterial({ color: 0x0000ff }));
        placeholderPlayer.position.y = 1;
        player.add(placeholderPlayer);

        loadModel("gamer").then(model => {
            if (model) {
                player.remove(placeholderPlayer);
                playerModel = model;
                playerModel.scale.set(1.2, 1.2, 1.2);
                playerModel.position.y = 0;
                player.add(playerModel);
                playerMixer = new AnimationMixer(playerModel);
                model.animations.forEach(clip => {
                    if (/sprint/i.test(clip.name)) playerAnims.run = playerMixer.clipAction(clip);
                    if (/idle/i.test(clip.name)) playerAnims.idle = playerMixer.clipAction(clip);
                });
                if (playerAnims.idle) playerAnims.idle.play();
            }
        });

        // --- ENEMY SETUP ---
        const enemies = [];
        const numEnemies = 5;
        const enemySpeed = 8;

        for (let i = 0; i < numEnemies; i++) {
            const enemy = new Group();
            enemy.isEnemy = true;
            enemy.state = 'wandering';
            enemy.stateTimer = 0;
            enemy.wanderTarget = new Vector3();
            
            const placeholder = new Mesh(new CylinderGeometry(0.5, 0.5, 2, 8), new MeshStandardMaterial({ color: 0xff0000 }));
            placeholder.position.y = 1;
            enemy.add(placeholder);

            const spawnRadius = arenaSize / 2 - 10;
            const angle = Math.random() * Math.PI * 2;
            const radius = 20 + Math.random() * (spawnRadius - 20);
            enemy.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            scene.add(enemy);

            loadModel("zombie").then(model => {
                if (model) {
                    enemy.remove(placeholder);
                    model.scale.set(1.2, 1.2, 1.2);
                    enemy.add(model);
                    enemy.mixer = new AnimationMixer(model);
                    const runClip = model.animations.find(a => /sprint/i.test(a.name));
                    const idleClip = model.animations.find(a => /idle/i.test(a.name));
                    if (runClip) enemy.runAction = enemy.mixer.clipAction(runClip);
                    if (idleClip) enemy.idleAction = enemy.mixer.clipAction(idleClip);
                    if (enemy.idleAction) enemy.idleAction.play();
                }
            });
            enemies.push(enemy);
        }

        // --- PROJECTILE (BULLET) SETUP ---
        const projectiles = [];
        const projectileSpeed = 50;
        const projectileGeo = new SphereGeometry(0.2, 8, 8);
        const projectileMat = new MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00 });
        let canShoot = true;
        const shootCooldown = 300; // milliseconds

        function shoot() {
            if (!canShoot || isGameOver) return;
            
            playSound("laser");
            canShoot = false;
            setTimeout(() => { canShoot = true; }, shootCooldown);

            const projectile = new Mesh(projectileGeo, projectileMat);
            const direction = new Vector3();
            player.getWorldDirection(direction);

            projectile.position.copy(player.position).add(new Vector3(0, 1.5, 0)).add(direction.clone().multiplyScalar(1.5));
            projectile.velocity = direction.multiplyScalar(projectileSpeed);
            
            projectiles.push(projectile);
            scene.add(projectile);
        }

        // --- CONTROLS & MOVEMENT ---
        const keys = { w: false, a: false, s: false, d: false };
        const mouse = new Vector2();
        const raycaster = new Raycaster();
        
        // --- Keyboard Controls ---
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
            if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key)) {
                e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        // --- Mouse Controls ---
        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        window.addEventListener('mousedown', (e) => {
            if (e.button === 0) shoot();
        });

        // --- Touch Controls ---
        const joystick = document.getElementById('joystick');
        const joystickThumb = document.getElementById('joystick-thumb');
        const shootButton = document.getElementById('shoot-button');
        let joystickActive = false;
        let joystickCenter = new Vector2();
        let joystickVector = new Vector2();

        function getJoystickRect() {
            const rect = joystick.getBoundingClientRect();
            joystickCenter.set(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        getJoystickRect();
        
        joystick.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            joystickActive = true;
        }, { passive: false });
        
        window.addEventListener('pointermove', (e) => {
            if (joystickActive) {
                e.preventDefault();
                let dx = e.clientX - joystickCenter.x;
                let dy = e.clientY - joystickCenter.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                let radius = joystick.clientWidth / 2;

                if (distance > radius) {
                    dx *= radius / distance;
                    dy *= radius / distance;
                }
                
                joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVector.set(dx / radius, dy / radius);
                
                keys.w = -joystickVector.y > 0.2;
                keys.s = -joystickVector.y < -0.2;
                keys.a = joystickVector.x < -0.2;
                keys.d = joystickVector.x > 0.2;
            }
        }, { passive: false });

        window.addEventListener('pointerup', (e) => {
            if (joystickActive) {
                joystickActive = false;
                joystickThumb.style.transform = `translate(0px, 0px)`;
                joystickVector.set(0, 0);
                Object.keys(keys).forEach(k => keys[k] = false);
            }
        });
        
        shootButton.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            shoot();
        }, { passive: false });

        // --- GAME LOGIC ---
        function updatePlayer(delta) {
            if (isGameOver) return;
            
            // --- Aiming ---
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);
            if (intersects.length > 0) {
                const lookAtPoint = intersects[0].point;
                player.lookAt(lookAtPoint.x, player.position.y, lookAtPoint.z);
            }
            
            // --- Movement ---
            const moveVector = new Vector3();
            if (keys.w) moveVector.z -= 1;
            if (s.keys) moveVector.z += 1;
            if (keys.a) moveVector.x -= 1;
            if (keys.d) moveVector.x += 1;
            
            if (moveVector.length() > 0) {
                moveVector.normalize().multiplyScalar(playerSpeed * delta);
                player.position.add(moveVector);

                if (playerAnims.run && !playerAnims.run.isRunning()) {
                    if (playerAnims.idle) playerAnims.idle.fadeOut(0.2);
                    playerAnims.run.reset().fadeIn(0.2).play();
                }
            } else {
                 if (playerAnims.idle && !playerAnims.idle.isRunning()) {
                    if (playerAnims.run) playerAnims.run.fadeOut(0.2);
                    playerAnims.idle.reset().fadeIn(0.2).play();
                }
            }
            
            // Clamp position to arena
            const halfSize = arenaSize / 2 - 1;
            player.position.x = Math.max(-halfSize, Math.min(halfSize, player.position.x));
            player.position.z = Math.max(-halfSize, Math.min(halfSize, player.position.z));
            
            if (playerMixer) playerMixer.update(delta);

            // Follow camera
            const offset = new Vector3(0, 25, 15);
            camera.position.lerp(player.position.clone().add(offset), 0.05);
            camera.lookAt(player.position.clone().add(new Vector3(0, -5, 0)));
        }

        function updateEnemies(delta) {
            enemies.forEach(enemy => {
                if (!enemy.parent) return; // Skip if already removed
                
                enemy.stateTimer -= delta;
                if (enemy.stateTimer <= 0) {
                    const distanceToPlayer = enemy.position.distanceTo(player.position);
                    if (distanceToPlayer < 40) {
                        enemy.state = 'chasing';
                        enemy.stateTimer = Math.random() * 2 + 1; // Chase for 1-3 seconds
                    } else {
                        enemy.state = 'wandering';
                        enemy.stateTimer = Math.random() * 4 + 3; // Wander for 3-7 seconds
                        enemy.wanderTarget.set(
                            MathUtils.randFloat(-arenaSize/2, arenaSize/2),
                            0,
                            MathUtils.randFloat(-arenaSize/2, arenaSize/2)
                        );
                    }
                }
                
                let targetPos = (enemy.state === 'chasing' && !isGameOver) ? player.position : enemy.wanderTarget;
                const direction = targetPos.clone().sub(enemy.position).normalize();
                
                // Don't run into the player
                if (enemy.position.distanceTo(player.position) > 2) {
                     enemy.position.add(direction.multiplyScalar(enemySpeed * delta));
                }

                // Look at target
                enemy.lookAt(targetPos.x, enemy.position.y, targetPos.z);
                
                if (enemy.mixer) {
                    enemy.mixer.update(delta);
                     if (enemy.runAction && !enemy.runAction.isRunning()) {
                        if(enemy.idleAction) enemy.idleAction.fadeOut(0.2);
                        enemy.runAction.reset().fadeIn(0.2).play();
                     }
                }

                // Check collision with player
                if (!isGameOver && enemy.position.distanceTo(player.position) < 2) {
                    endGame();
                }
            });
        }
        
        function updateProjectiles(delta) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.position.add(p.velocity.clone().multiplyScalar(delta));

                // Check for collision with enemies
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (enemy.parent && p.position.distanceTo(enemy.position) < 2) {
                        playSound("hit");
                        playSound("explosion");
                        
                        // Remove enemy and add score
                        scene.remove(enemy);
                        enemies.splice(j, 1);
                        
                        score++;
                        scoreElement.textContent = `Score: ${score}`;
                        
                        hit = true;
                        break; 
                    }
                }

                // Remove projectile if it hit, or went too far
                if (hit || p.position.length() > arenaSize * 1.5) {
                    scene.remove(p);
                    projectiles.splice(i, 1);
                }
            }
        }
        
        // --- GAME STATE ---
        function endGame() {
            if (isGameOver) return;
            isGameOver = true;
            playSound("game_over");
            stopMusic();

            // Make player "fall"
            if (playerAnims.idle && playerAnims.idle.isRunning()) playerAnims.idle.fadeOut(0.1);
            if (playerAnims.run && playerAnims.run.isRunning()) playerAnims.run.fadeOut(0.1);

            document.getElementById('final-score').textContent = `Your Score: ${score}`;
            document.getElementById('game-over-screen').style.display = 'flex';
        }
        
        document.getElementById('restart-button').addEventListener('click', () => {
            location.reload();
        });

        // --- RESIZE HANDLER ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            getJoystickRect(); // Recalculate joystick position
        }
        window.addEventListener('resize', onWindowResize, false);
        onWindowResize();

        // --- MAIN GAME LOOP ---
        let on = true;
        const setOn = (v) => { if (v === on) return; on = v;
            if (v) { clock.getDelta(); requestAnimationFrame(animate); }
        };
        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        window.addEventListener('blur', () => setOn(false));
        window.addEventListener('focus', () => setOn(true));

        function animate() {
            if (!on) return;
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.05); // Cap delta to prevent jumps

            if (!isGameOver) {
                 updatePlayer(delta);
            }
            updateEnemies(delta);
            updateProjectiles(delta);
            
            if (enemies.length === 0 && !isGameOver) {
                isGameOver = true;
                playSound("jingle_win");
                stopMusic();
                document.getElementById('game-over-screen').querySelector('h1').textContent = "You Win!";
                document.getElementById('final-score').textContent = `Final Score: ${score}`;
                document.getElementById('game-over-screen').style.display = 'flex';
            }

            renderer.render(scene, camera);
        }
        
        // --- START GAME ---
        animate();
    </script>
</body>
</html>

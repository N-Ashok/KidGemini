    canvas#scene {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* --- ON-SCREEN UI --- */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Let clicks pass through to the canvas */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    /* --- SCORING --- */
    #score-ui {
      background: rgba(0, 0, 0, 0.4);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      margin-top: 10px;
      font-size: 24px;
      text-align: center;
    }
    #score {
      font-weight: bold;
    }
    #game-over-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        display: none; /* Hidden by default */
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 3em;
        pointer-events: all;
    }
    #game-over-screen button {
        font-size: 0.5em;
        padding: 15px 30px;
        border-radius: 20px;
        border: none;
        cursor: pointer;
        background: #4CAF50;
        color: white;
        margin-top: 20px;
    }
    /* --- CONTROLS --- */
    #controls {
      display: grid;
      grid-template-areas:
        ".  up  ."
        "left kick right"
        ". down .";
      gap: 10px;
      padding-bottom: max(12px, env(safe-area-inset-bottom)); /* Safe area for phone notches */
      pointer-events: all; /* Controls are clickable */
    }
    .control-button {
      width: 70px;
      height: 70px;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2em;
      user-select: none;
      cursor: pointer;
      border: 2px solid rgba(255, 255, 255, 0.5);
    }
    #up { grid-area: up; }
    #down { grid-area: down; }
    #left { grid-area: left; }
    #right { grid-area: right; }
    #kick-button { 
      grid-area: kick;
      background: rgba(255, 80, 80, 0.7);
      font-size: 1.5em;
      font-weight: bold;
    }
  </style>
</head>
<body>




<canvas id="scene"></canvas>

<!-- --- UI & SCORING --- -->
<div id="ui-container">
  <div id="score-ui">
    GOAL! &nbsp; <span id="score">0 - 0</span> &nbsp; First to 3 wins!
  </div>

  <div id="controls">
    <div id="up" class="control-button">▲</div>
    <div id="left" class="control-button">◄</div>
    <div id="kick-button" class="control-button">KICK</div>
    <div id="right" class="control-button">►</div>
    <div id="down" class="control-button">▼</div>
  </div>
</div>

<!-- --- GAME OVER SCREEN --- -->
<div id="game-over-screen">
    <div id="game-over-text">You Win!</div>
    <button onclick="window.location.reload()">Play Again</button>
</div>


<script type="module">
  // --- IMPORTS ---
  import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, PlaneGeometry, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, Euler, SphereGeometry } from "three";

  // --- GAME SETUP ---
  const scene = new Scene();
  scene.background = new Color(0x87CEEB); // Sky blue
  scene.fog = new Fog(0x87CEEB, 100, 150);

  const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 15, 25);
  camera.lookAt(0, 0, 0);

  const renderer = new WebGLRenderer({
    canvas: document.getElementById('scene'),
    antialias: true,
    preserveDrawingBuffer: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const clock = new Clock();

  // --- LIGHTING ---
  const ambientLight = new AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);
  const dirLight = new DirectionalLight(0xffffff, 1.2);
  dirLight.position.set(10, 20, 5);
  scene.add(dirLight);

  // --- CONSTANTS AND STATE ---
  const PITCH_WIDTH = 68;
  const PITCH_LENGTH = 105;
  const GOAL_WIDTH = 7.32;
  const WIN_SCORE = 3;
  
  let scores = { player: 0, opponent: 0 };
  let gameOver = false;

  let player, ball;
  const team1 = []; // Player's team (Red)
  const team2 = []; // Opponent's team (Blue)
  let ballVelocity = new Vector3();
  const playerVelocity = new Vector3();
  const playerSpeed = 10;
  const aiSpeed = 8;
  const ballFriction = 0.97;
  
  const mixers = []; // To update all animations

  // --- GROUND AND FIELD ---
  const groundMaterial = new MeshStandardMaterial({ color: 0x008000 });
  const ground = new Mesh(new PlaneGeometry(PITCH_WIDTH, PITCH_LENGTH), groundMaterial);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  
  const lineMaterial = new MeshStandardMaterial({ color: 0xffffff });
  function createLine(w, h, x, z) {
      const line = new Mesh(new PlaneGeometry(w, h), lineMaterial);
      line.position.set(x, 0.01, z);
      line.rotation.x = -Math.PI / 2;
      scene.add(line);
  }
  // Sidelines and goal lines
  createLine(PITCH_WIDTH, 0.2, 0, PITCH_LENGTH / 2);
  createLine(PITCH_WIDTH, 0.2, 0, -PITCH_LENGTH / 2);
  createLine(0.2, PITCH_LENGTH, PITCH_WIDTH / 2, 0);
  createLine(0.2, PITCH_LENGTH, -PITCH_WIDTH / 2, 0);
  // Center line and circle
  createLine(PITCH_WIDTH, 0.2, 0, 0);
  const centerCircle = new Mesh(new PlaneGeometry(18.3, 18.3), lineMaterial);
  centerCircle.position.y = 0.01;
  centerCircle.rotation.x = -Math.PI / 2;
  const centerCircleInner = new Mesh(new PlaneGeometry(18.1, 18.1), groundMaterial);
  centerCircleInner.position.y = 0.011;
  centerCircleInner.rotation.x = -Math.PI / 2;
  scene.add(centerCircle, centerCircleInner);


  // --- PLAYER & AI SETUP ---
  function setupTeams() {
    // Clear old teams if any
    [...team1, ...team2].forEach(p => {
        if (p.model) scene.remove(p.model);
    });
    team1.length = 0;
    team2.length = 0;

    // Player (Team 1)
    player = createPlayer('footballer', new Vector3(0, 0, 10), true);
    team1.push(player);
    
    // Team 1 (Red)
    team1.push(createPlayer('footballer', new Vector3(15, 0, 20), false));
    team1.push(createPlayer('footballer', new Vector3(-15, 0, 20), false));
    team1.push(createPlayer('footballer', new Vector3(0, 0, 35), false, true)); // Goalie
    
    // Team 2 (Blue)
    team2.push(createPlayer('footballer_blue', new Vector3(0, 0, -10), false));
    team2.push(createPlayer('footballer_blue', new Vector3(15, 0, -20), false));
    team2.push(createPlayer('footballer_blue', new Vector3(-15, 0, -20), false));
    team2.push(createPlayer('footballer_blue', new Vector3(0, 0, -45), false, true)); // Goalie
  }

  function createPlayer(modelName, startPos, isHuman, isGoalie = false) {
    const playerObj = {
        model: null,
        mixer: null,
        animations: {},
        startPosition: startPos.clone(),
        isHuman,
        isGoalie,
        chasing: false,
    };

    loadModel(modelName).then(m => {
        if (m) {
            playerObj.model = m;
            playerObj.model.position.copy(playerObj.startPosition);
            playerObj.model.scale.set(1.8, 1.8, 1.8);
            scene.add(playerObj.model);

            playerObj.mixer = new AnimationMixer(m);
            mixers.push(playerObj.mixer);

            const idleClip = m.animations.find(a => /idle/i.test(a.name));
            const runClip = m.animations.find(a => /sprint/i.test(a.name));
            const kickClip = m.animations.find(a => /attack/i.test(a.name));

            if(idleClip) playerObj.animations.idle = playerObj.mixer.clipAction(idleClip);
            if(runClip) playerObj.animations.run = playerObj.mixer.clipAction(runClip);
            if(kickClip) {
                playerObj.animations.kick = playerObj.mixer.clipAction(kickClip);
                playerObj.animations.kick.setLoop(2200, 1); // Play only once
                playerObj.animations.kick.clampWhenFinished = true;
            }
            
            playerObj.animations.idle?.play();
        }
    });

    return playerObj;
  }
  
  // --- BALL SETUP ---
  function setupBall() {
    if (ball) scene.remove(ball);
    loadModel('soccer_ball').then(m => {
        if(m) {
            ball = m;
            ball.scale.set(0.3, 0.3, 0.3);
            resetBall();
            scene.add(ball);
        }
    });
    // Placeholder while loading
    if (!ball) {
        ball = new Mesh(new SphereGeometry(0.22, 16, 16), new MeshStandardMaterial({color: 0xffffff}));
        resetBall();
        scene.add(ball);
    }
  }

  // --- GOAL SETUP ---
  loadModel('soccer_goal').then(m => {
      if(m) {
          const goal1 = m;
          goal1.scale.set(4, 4, 4);
          goal1.position.set(0, 0, -PITCH_LENGTH / 2 - 1);
          scene.add(goal1);

          const goal2 = m.clone();
          goal2.rotation.y = Math.PI;
          goal2.position.set(0, 0, PITCH_LENGTH / 2 + 1);
          scene.add(goal2);
      }
  });


  // --- GAME STATE MANAGEMENT ---
  function resetPositions() {
    [...team1, ...team2].forEach(p => {
        if (p.model) p.model.position.copy(p.startPosition);
    });
    resetBall();
    if (player.model) {
        player.model.rotation.set(0, 0, 0);
    }
  }

  function resetBall() {
    ballVelocity.set(0, 0, 0);
    if(ball) ball.position.set(0, 0.22, 0);
  }

  function updateScore() {
    document.getElementById('score').textContent = `${scores.player} - ${scores.opponent}`;
    if (scores.player >= WIN_SCORE || scores.opponent >= WIN_SCORE) {
        gameOver = true;
        const winnerText = scores.player >= WIN_SCORE ? "You Win!" : "Blue Team Wins!";
        document.getElementById('game-over-text').textContent = winnerText;
        document.getElementById('game-over-screen').style.display = 'flex';
        playSound("jingle_win");
    }
  }
  
  function handleGoal(team) {
    if (gameOver) return;
    playSound("confirm");
    if (team === 'player') {
        scores.opponent++;
    } else {
        scores.player++;
    }
    updateScore();
    if (!gameOver) {
        resetPositions();
    }
  }


  // --- CONTROLS ---
  const keys = { w: false, a: false, s: false, d: false, kick: false };
  function handleKeyDown(e) {
    switch (e.key.toLowerCase()) {
      case 'w': case 'arrowup': keys.w = true; break;
      case 'a': case 'arrowleft': keys.a = true; break;
      case 's': case 'arrowdown': keys.s = true; break;
      case 'd': case 'arrowright': keys.d = true; break;
      case ' ': keys.kick = true; e.preventDefault(); break;
    }
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key)) {
        e.preventDefault();
    }
  }
  function handleKeyUp(e) {
    switch (e.key.toLowerCase()) {
      case 'w': case 'arrowup': keys.w = false; break;
      case 'a': case 'arrowleft': keys.a = false; break;
      case 's': case 'arrowdown': keys.s = false; break;
      case 'd': case 'arrowright': keys.d = false; break;
      case ' ': keys.kick = false; break;
    }
  }
  window.addEventListener('keydown', handleKeyDown);
  window.addEventListener('keyup', handleKeyUp);

  // Touch controls
  const controlButtons = {
      up: document.getElementById('up'),
      down: document.getElementById('down'),
      left: document.getElementById('left'),
      right: document.getElementById('right'),
      kick: document.getElementById('kick-button'),
  };
  controlButtons.up.addEventListener('pointerdown', () => keys.w = true);
  controlButtons.up.addEventListener('pointerup', () => keys.w = false);
  controlButtons.down.addEventListener('pointerdown', () => keys.s = true);
  controlButtons.down.addEventListener('pointerup', () => keys.s = false);
  controlButtons.left.addEventListener('pointerdown', () => keys.a = true);
  controlButtons.left.addEventListener('pointerup', () => keys.a = false);
  controlButtons.right.addEventListener('pointerdown', () => keys.d = true);
  controlButtons.right.addEventListener('pointerup', () => keys.d = false);
  controlButtons.kick.addEventListener('pointerdown', () => keys.kick = true);
  controlButtons.kick.addEventListener('pointerup', () => keys.kick = false);
  // Also handle pointer leaving the button area
  Object.values(controlButtons).forEach(btn => {
      btn.addEventListener('pointerleave', () => {
          if (btn === controlButtons.up) keys.w = false;
          if (btn === controlButtons.down) keys.s = false;
          if (btn === controlButtons.left) keys.a = false;
          if (btn === controlButtons.right) keys.d = false;
          if (btn === controlButtons.kick) keys.kick = false;
      });
  });


  // --- PLAYER MOVEMENT ---
  function updatePlayer(delta) {
    if (!player || !player.model) return;
    
    playerVelocity.set(0, 0, 0);
    if (keys.w) playerVelocity.z -= 1;
    if (keys.s) playerVelocity.z += 1;
    if (keys.a) playerVelocity.x -= 1;
    if (keys.d) playerVelocity.x += 1;

    let isMoving = playerVelocity.lengthSq() > 0;

    if (isMoving) {
        playerVelocity.normalize().multiplyScalar(playerSpeed * delta);
        player.model.position.add(playerVelocity);

        // Face direction of movement
        player.model.rotation.y = Math.atan2(playerVelocity.x, playerVelocity.z);

        // Animation
        player.animations.idle?.fadeOut(0.2);
        player.animations.run?.reset().fadeIn(0.2).play();
    } else {
        player.animations.run?.fadeOut(0.2);
        player.animations.idle?.reset().fadeIn(0.2).play();
    }

    // Boundary checks
    player.model.position.x = Math.max(-PITCH_WIDTH / 2, Math.min(PITCH_WIDTH / 2, player.model.position.x));
    player.model.position.z = Math.max(-PITCH_LENGTH / 2, Math.min(PITCH_LENGTH / 2, player.model.position.z));
    
    // Kick logic
    const distToBall = player.model.position.distanceTo(ball.position);
    if (keys.kick && distToBall < 1.5) {
        kickBall(player.model, 20);
        player.animations.kick?.reset().play();
    }
  }
  
  // --- AI LOGIC ---
  function updateAI(delta) {
    if (!ball) return;
    
    const allPlayers = [...team1, ...team2].filter(p => p.model && !p.isHuman);

    // Find closest player on each team to the ball
    let closestTeam1 = null, closestTeam2 = null;
    let minDist1 = Infinity, minDist2 = Infinity;

    team1.forEach(p => p.chasing = false);
    team2.forEach(p => p.chasing = false);

    team1.filter(p => p.model && !p.isHuman && !p.isGoalie).forEach(p => {
        const dist = p.model.position.distanceTo(ball.position);
        if (dist < minDist1) {
            minDist1 = dist;
            closestTeam1 = p;
        }
    });
    if (closestTeam1) closestTeam1.chasing = true;
    
    team2.filter(p => p.model && !p.isHuman && !p.isGoalie).forEach(p => {
        const dist = p.model.position.distanceTo(ball.position);
        if (dist < minDist2) {
            minDist2 = dist;
            closestTeam2 = p;
        }
    });
    if (closestTeam2) closestTeam2.chasing = true;

    allPlayers.forEach(p => {
        const pModel = p.model;
        let isMoving = false;
        
        if (p.isGoalie) {
            // Goalie logic
            const targetX = Math.max(pModel.position.x - 5, Math.min(pModel.position.x + 5, ball.position.x));
            const targetZ = p.startPosition.z;
            const target = new Vector3(targetX, 0, targetZ);
            const direction = target.sub(pModel.position);
            
            if (direction.length() > 0.1) {
                 pModel.position.add(direction.normalize().multiplyScalar(aiSpeed * 0.5 * delta));
                 isMoving = true;
            }
        } else if (p.chasing) {
            // Chaser logic
            const direction = new Vector3().subVectors(ball.position, pModel.position);
            direction.y = 0;
            if (direction.length() > 1) { // Stop when close to ball
                pModel.position.add(direction.normalize().multiplyScalar(aiSpeed * delta));
                isMoving = true;
            }
        } else {
            // Return to position logic
            const target = p.startPosition.clone();
            const direction = target.sub(pModel.position);
            if(direction.length() > 2) {
                pModel.position.add(direction.normalize().multiplyScalar(aiSpeed * 0.3 * delta));
                isMoving = true;
            }
        }
        
        // Face the ball
        const lookTarget = p.isGoalie ? ball.position.clone() : (p.chasing ? ball.position.clone() : new Vector3().addVectors(pModel.position, new Vector3(0,0,-1)));
        lookTarget.y = pModel.position.y;
        pModel.lookAt(lookTarget);
        
        // AI animation
        if(isMoving) {
            p.animations.idle?.fadeOut(0.2);
            p.animations.run?.reset().fadeIn(0.2).play();
        } else {
            p.animations.run?.fadeOut(0.2);
            p.animations.idle?.reset().fadeIn(0.2).play();
        }
        
        // AI kicking
        const distToBall = pModel.position.distanceTo(ball.position);
        if (distToBall < 1.5) {
            kickBall(pModel, 15);
        }
    });
  }

  // --- BALL PHYSICS AND KICKING ---
  function updateBall(delta) {
    if (!ball) return;
    
    ball.position.add(ballVelocity.clone().multiplyScalar(delta));
    ball.rotation.x -= ballVelocity.z * delta * 2;
    ball.rotation.z += ballVelocity.x * delta * 2;
    ballVelocity.multiplyScalar(ballFriction);

    // Stop rolling
    if (ballVelocity.length() < 0.1) {
        ballVelocity.set(0, 0, 0);
    }
    
    // Boundary checks
    if (ball.position.x > PITCH_WIDTH / 2 || ball.position.x < -PITCH_WIDTH / 2) {
        ballVelocity.x *= -1;
        ball.position.x = Math.sign(ball.position.x) * PITCH_WIDTH / 2;
    }

    // Goal Check
    const goalLineZ = PITCH_LENGTH / 2;
    if (Math.abs(ball.position.z) > goalLineZ && Math.abs(ball.position.x) < GOAL_WIDTH / 2) {
        if (ball.position.z > goalLineZ) {
            handleGoal('player'); // Player scored on opponent's goal
        } else {
            handleGoal('opponent'); // Opponent scored on player's goal
        }
    } else if (Math.abs(ball.position.z) > goalLineZ + 2) { // Ball went past goal
        // simple out of bounds reset
        resetBall();
    }
  }
  
  function kickBall(kickerModel, power) {
      playSound("hit");
      const kickDirection = new Vector3();
      kickerModel.getWorldDirection(kickDirection);
      kickDirection.y = 0.1; // slight lift
      kickDirection.normalize();
      ballVelocity.add(kickDirection.multiplyScalar(power));
  }

  // --- CAMERA ---
  function updateCamera() {
    if (!player || !player.model) return;
    const targetPos = player.model.position.clone().add(new Vector3(0, 10, 18));
    camera.position.lerp(targetPos, 0.05);
    camera.lookAt(player.model.position);
  }

  // --- RESIZE ---
  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', onWindowResize);


  // --- GAME LOOP ---
  let on = true;
  const setOn = (v) => {
    if (v === on) return;
    on = v;
    if (v) {
      clock.getDelta(); // Reset clock on resume
      requestAnimationFrame(animate);
    }
  };
  document.addEventListener('visibilitychange', () => setOn(!document.hidden));
  window.addEventListener('blur', () => setOn(false));
  window.addEventListener('focus', () => setOn(true));

  function animate() {
    if (!on || gameOver) return;
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05); // Prevent large jumps
    
    updatePlayer(delta);
    updateAI(delta);
    updateBall(delta);
    updateCamera();
    
    mixers.forEach(mixer => mixer.update(delta));
    
    renderer.render(scene, camera);
  }
  
  // --- START GAME ---
  onWindowResize();
  setupTeams();
  setupBall();
  updateScore();
  playMusic("bg_loop_playful");
  animate();

</script>
</body>
</html>

        handle.stop = function () { try { src.stop(); } catch (e3) {} if (currentMusic === src) currentMusic = null; };
      });
    } catch (e) { /* silent */ }
    return handle;
  };
})();
</script>

    <canvas id="scene"></canvas>

    <div id="overlay">

                <div id="kick-button" class="control-button kick-button">KICK!</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, ConeGeometry, CylinderGeometry, PlaneGeometry, MeshStandardMaterial, MeshBasicMaterial, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, MathUtils, Matrix4 } from "three";
        import { World, Body, Vec3, Box, Sphere, Plane, Material, ContactMaterial } from "cannon-es";

        // --- CONSTANTS ---
        const PLAYER_SPEED = 5; // meters per second
        const PLAYER_ROTATION_SPEED = 1.5; // radians per second
        const KICK_POWER = 15; // impulse strength
        const BALL_MASS = 1;
        const PLAYER_MASS = 50;
        const FIELD_WIDTH = 50; // Z-axis for width
        const FIELD_LENGTH = 100; // X-axis for length
        const GOAL_WIDTH = 10;
        const GOAL_HEIGHT = 4;
        const GOAL_DEPTH = 2;
        const WINNING_SCORE = 3;
        const SPECTATOR_COUNT = 50; // Number of cheering fans
        const AI_PLAYER_DETECTION_RANGE = 20; // How close AI needs to be to ball
        const AI_PLAYER_KICK_RANGE = 2; // How close AI needs to be to kick ball

        // --- GAME STATE ---
        let scoreBlue = 0;
        let scoreRed = 0;
        let gameState = 'playing'; // 'playing', 'gameOver'
        let lastGoalScorer = null; // 'blue', 'red'
        let lastGoalTime = 0;
        const GAME_RESET_DELAY = 3000; // milliseconds
        const INITIAL_SAFE_TIME = 3000; // milliseconds for player to move freely

        // --- THREE.JS SETUP ---
        const scene = new Scene();
        scene.background = new Color(0x7ec0ee); // Sky blue background
        scene.fog = new Fog(0x7ec0ee, 100, 300);

        const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 20); // Initial camera position
        camera.lookAt(0, 0, 0);

        const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        // Responsive resizing
        const onWindowResize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', onWindowResize);

        const clock = new Clock();
        let animationMixers = [];

        // --- LIGHTING ---
        const ambientLight = new AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const directionalLight = new DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        directionalLight.target.position.set(0, 0, 0);
        scene.add(directionalLight);
        scene.add(directionalLight.target);

        // --- CANNON-ES PHYSICS SETUP ---
        const world = new World({
            gravity: new Vec3(0, -9.82, 0)
        });
        world.iterations = 10; // More iterations for better stability

        // Materials for physics
        const groundMaterial = new Material('ground');
        const ballMaterial = new Material('ball');
        const playerMaterial = new Material('player');
        const wallMaterial = new Material('wall');

        const ballGroundContact = new ContactMaterial(groundMaterial, ballMaterial, {
            friction: 0.6,
            restitution: 0.8 // Bounciness
        });
        const ballPlayerContact = new ContactMaterial(playerMaterial, ballMaterial, {
            friction: 0.3,
            restitution: 0.1
        });
        const playerGroundContact = new ContactMaterial(groundMaterial, playerMaterial, {
            friction: 0.8,
            restitution: 0.0
        });
        const ballWallContact = new ContactMaterial(wallMaterial, ballMaterial, {
            friction: 0.5,
            restitution: 0.7
        });
        const playerWallContact = new ContactMaterial(wallMaterial, playerMaterial, {
            friction: 0.5,
            restitution: 0.0
        });

        world.addContactMaterial(ballGroundContact);
        world.addContactMaterial(ballPlayerContact);
        world.addContactMaterial(playerGroundContact);
        world.addContactMaterial(ballWallContact);
        world.addContactMaterial(playerWallContact);

        // --- GAME OBJECTS ---
        let playerMesh, playerBody;
        let aiMesh, aiBody;
        let ballMesh, ballBody;
        let ballRadius = 0.5; // Will be updated by model size
        let playerHeight = 1.8; // Will be updated by model size

        const scoreBlueElement = document.getElementById('score-blue');
        const scoreRedElement = document.getElementById('score-red');
        const messageElement = document.getElementById('message');

        // Field and Boundaries
        const fieldMaterial = new MeshStandardMaterial({ color: 0x228B22 }); // ForestGreen
        const fieldGeometry = new BoxGeometry(FIELD_LENGTH + 20, 0.1, FIELD_WIDTH + 20); // Larger plane for full stadium
        const fieldMesh = new Mesh(fieldGeometry, fieldMaterial);
        fieldMesh.position.y = -0.05; // Slightly below y=0 for ball to sit on
        scene.add(fieldMesh);

        const groundBody = new Body({ mass: 0, material: groundMaterial });
        groundBody.addShape(new Plane());
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0); // Rotate to be horizontal
        world.addBody(groundBody);

        // Boundary Walls (invisible)
        const wallThickness = 1;
        const wallHeight = 5;

        // X-axis walls (length-wise)
        const wallXShape = new Box(new Vec3(wallThickness / 2, wallHeight / 2, (FIELD_WIDTH + wallThickness) / 2));
        const wallXLeftBody = new Body({ mass: 0, material: wallMaterial, position: new Vec3(-(FIELD_LENGTH / 2 + wallThickness / 2), wallHeight / 2, 0) });
        wallXLeftBody.addShape(wallXShape);
        world.addBody(wallXLeftBody);

        const wallXRightBody = new Body({ mass: 0, material: wallMaterial, position: new Vec3((FIELD_LENGTH / 2 + wallThickness / 2), wallHeight / 2, 0) });
        wallXRightBody.addShape(wallXShape);
        world.addBody(wallXRightBody);

        // Z-axis walls (width-wise, outside goal areas)
        const wallZShape = new Box(new Vec3((FIELD_LENGTH / 2 - GOAL_WIDTH / 2) / 2, wallHeight / 2, wallThickness / 2));
        const wallZFrontLeftBody = new Body({ mass: 0, material: wallMaterial, position: new Vec3(-(FIELD_LENGTH / 2 - GOAL_WIDTH / 4), wallHeight / 2, -(FIELD_WIDTH / 2 + wallThickness / 2)) });
        wallZFrontLeftBody.addShape(wallZShape);
        world.addBody(wallZFrontLeftBody);

        const wallZFrontRightBody = new Body({ mass: 0, material: wallMaterial, position: new Vec3((FIELD_LENGTH / 2 - GOAL_WIDTH / 4), wallHeight / 2, -(FIELD_WIDTH / 2 + wallThickness / 2)) });
        wallZFrontRightBody.addShape(wallZShape);
        world.addBody(wallZFrontRightBody);

        const wallZBackLeftBody = new Body({ mass: 0, material: wallMaterial, position: new Vec3(-(FIELD_LENGTH / 2 - GOAL_WIDTH / 4), wallHeight / 2, (FIELD_WIDTH / 2 + wallThickness / 2)) });
        wallZBackLeftBody.addShape(wallZShape);
        world.addBody(wallZBackLeftBody);

        const wallZBackRightBody = new Body({ mass: 0, material: wallMaterial, position: new Vec3((FIELD_LENGTH / 2 - GOAL_WIDTH / 4), wallHeight / 2, (FIELD_WIDTH / 2 + wallThickness / 2)) });
        wallZBackRightBody.addShape(wallZShape);
        world.addBody(wallZBackRightBody);


        // --- GOALS ---
        const goalPlaceholder = new BoxGeometry(GOAL_DEPTH, GOAL_HEIGHT, GOAL_WIDTH);
        const goalMaterial = new MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.1 });

        const blueGoalMesh = new Mesh(goalPlaceholder, goalMaterial);
        blueGoalMesh.position.set(-FIELD_LENGTH / 2 - GOAL_DEPTH / 2, GOAL_HEIGHT / 2, 0);
        blueGoalMesh.userData = { isGoal: true, team: 'red' }; // This goal scores for red player
        scene.add(blueGoalMesh);

        const redGoalMesh = new Mesh(goalPlaceholder, goalMaterial);
        redGoalMesh.position.set(FIELD_LENGTH / 2 + GOAL_DEPTH / 2, GOAL_HEIGHT / 2, 0);
        redGoalMesh.userData = { isGoal: true, team: 'blue' }; // This goal scores for blue player
        scene.add(redGoalMesh);

        // Load goal models and replace placeholders
        loadModel("soccer_goal").then(model => {
            if (model) {
                // Blue Goal
                const blueGoalModel = model.clone(); // Clone for second goal
                blueGoalModel.scale.set(1.5, 1.5, 1.5); // Adjust scale if needed
                blueGoalModel.position.set(blueGoalMesh.position.x, blueGoalMesh.position.y - GOAL_HEIGHT / 2, blueGoalMesh.position.z);
                scene.remove(blueGoalMesh);
                scene.add(blueGoalModel);

                // Red Goal
                const redGoalModel = model.clone();
                redGoalModel.scale.set(1.5, 1.5, 1.5);
                redGoalModel.position.set(redGoalMesh.position.x, redGoalMesh.position.y - GOAL_HEIGHT / 2, redGoalMesh.position.z);
                redGoalModel.rotation.y = Math.PI; // Rotate 180 degrees
                scene.remove(redGoalMesh);
                scene.add(redGoalModel);

                // Add physics bodies for goal posts (simplification, using boxes for posts)
                const postRadius = 0.5;
                const postShape = new Cylinder(postRadius, postRadius, GOAL_HEIGHT, 8);

                // Blue goal posts
                const bluePost1Body = new Body({ mass: 0, material: wallMaterial, position: new Vec3(blueGoalModel.position.x + GOAL_DEPTH / 2, GOAL_HEIGHT / 2, blueGoalModel.position.z - GOAL_WIDTH / 2) });
                bluePost1Body.addShape(postShape);
                world.addBody(bluePost1Body);

                const bluePost2Body = new Body({ mass: 0, material: wallMaterial, position: new Vec3(blueGoalModel.position.x + GOAL_DEPTH / 2, GOAL_HEIGHT / 2, blueGoalModel.position.z + GOAL_WIDTH / 2) });
                bluePost2Body.addShape(postShape);
                world.addBody(bluePost2Body);

                // Red goal posts
                const redPost1Body = new Body({ mass: 0, material: wallMaterial, position: new Vec3(redGoalModel.position.x - GOAL_DEPTH / 2, GOAL_HEIGHT / 2, redGoalModel.position.z - GOAL_WIDTH / 2) });
                redPost1Body.addShape(postShape);
                world.addBody(redPost1Body);

                const redPost2Body = new Body({ mass: 0, material: wallMaterial, position: new Vec3(redGoalModel.position.x - GOAL_DEPTH / 2, GOAL_HEIGHT / 2, redGoalModel.position.z + GOAL_WIDTH / 2) });
                redPost2Body.addShape(postShape);
                world.addBody(redPost2Body);

            }
        });


        // --- PLAYER CHARACTERS ---
        const playerPlaceholderGeometry = new CapsuleGeometry(0.5, 1);
        const playerBlueMaterial = new MeshStandardMaterial({ color: 0x0000ff });
        const playerRedMaterial = new MeshStandardMaterial({ color: 0xff0000 });

        playerMesh = new Mesh(playerPlaceholderGeometry, playerBlueMaterial);
        playerMesh.position.set(-FIELD_LENGTH / 4, playerHeight / 2, 0);
        scene.add(playerMesh);

        aiMesh = new Mesh(playerPlaceholderGeometry, playerRedMaterial);
        aiMesh.position.set(FIELD_LENGTH / 4, playerHeight / 2, 0);
        scene.add(aiMesh);

        // Player physics bodies
        const playerShape = new Capsule(0.5, 1); // Cannon.js Capsule (radius, height)
        playerBody = new Body({ mass: PLAYER_MASS, material: playerMaterial, fixedRotation: true });
        playerBody.addShape(playerShape, new Vec3(0, 0, 0)); // Offset for Capsule to be centered
        playerBody.position.copy(playerMesh.position);
        world.addBody(playerBody);

        aiBody = new Body({ mass: PLAYER_MASS, material: playerMaterial, fixedRotation: true });
        aiBody.addShape(playerShape, new Vec3(0, 0, 0));
        aiBody.position.copy(aiMesh.position);
        world.addBody(aiBody);

        let playerMixer, aiMixer;
        let playerWalkAction, aiWalkAction;
        let playerKickAction, aiKickAction;
        let playerRunning = false;
        let aiRunning = false;
        let playerKicking = false;
        let aiKicking = false;

        // Load player models
        loadModel("footballer_blue").then(model => {
            if (model) {
                playerMesh = model;
                playerMesh.scale.set(1.5, 1.5, 1.5);
                scene.add(playerMesh);
                playerMixer = new AnimationMixer(playerMesh);
                playerWalkAction = playerMixer.clipAction(playerMesh.animations.find(a => /sprint/i.test(a.name)));
                playerWalkAction.play();
                playerWalkAction.setEffectiveWeight(0); // Start not running
                playerKickAction = playerMixer.clipAction(playerMesh.animations.find(a => /attack-kick-right/i.test(a.name)));
                playerKickAction.setLoop(3, 1); // Play once
                playerKickAction.clampWhenFinished = true;
                playerKickAction.enable = false;

                // Update player height for physics body
                const box = new Box3().setFromObject(playerMesh);
                playerHeight = box.max.y - box.min.y;
                playerBody.shapes[0].height = playerHeight - 1; // Adjust for capsule
                playerBody.shapes[0].radius = Math.min(box.max.x - box.min.x, box.max.z - box.min.z) / 2 * 1.5; // Adjust radius
            }
        });

        loadModel("footballer").then(model => {
            if (model) {
                aiMesh = model;
                aiMesh.scale.set(1.5, 1.5, 1.5);
                scene.add(aiMesh);
                aiMixer = new AnimationMixer(aiMesh);
                aiWalkAction = aiMixer.clipAction(aiMesh.animations.find(a => /sprint/i.test(a.name)));
                aiWalkAction.play();
                aiWalkAction.setEffectiveWeight(0);
                aiKickAction = aiMixer.clipAction(aiMesh.animations.find(a => /attack-kick-right/i.test(a.name)));
                aiKickAction.setLoop(3, 1); // Play once
                aiKickAction.clampWhenFinished = true;
                aiKickAction.enable = false;

                // Update AI height for physics body
                const box = new Box3().setFromObject(aiMesh);
                aiBody.shapes[0].height = playerHeight - 1; // Use playerHeight for consistency
                aiBody.shapes[0].radius = Math.min(box.max.x - box.min.x, box.max.z - box.min.z) / 2 * 1.5;
            }
        });

        // --- SOCCER BALL ---
        const ballPlaceholder = new SphereGeometry(ballRadius, 32, 32);
        const ballMaterialMesh = new MeshStandardMaterial({ color: 0xff8800 });
        ballMesh = new Mesh(ballPlaceholder, ballMaterialMesh);
        ballMesh.position.y = ballRadius;
        scene.add(ballMesh);

        ballBody = new Body({ mass: BALL_MASS, material: ballMaterial });
        ballBody.addShape(new Sphere(ballRadius));
        ballBody.position.copy(ballMesh.position);
        world.addBody(ballBody);

        loadModel("soccer_ball").then(model => {
            if (model) {
                const box = new Box3().setFromObject(model);
                ballRadius = (box.max.y - box.min.y) / 2;
                ballMesh = model;
                ballMesh.scale.set(ballRadius / 0.5, ballRadius / 0.5, ballRadius / 0.5); // Adjust scale based on default placeholder radius
                scene.add(ballMesh);
                ballBody.shapes[0].radius = ballRadius;
            }
        });

        // --- STADIUM STANDS AND SPECTATORS ---
        const spectatorModels = ["girl", "man", "woman", "businessman"];
        const spectatorPositions = [];

        loadModel("grandstand").then(model => {
            if (model) {
                const standModel = model;
                const standHeight = modelSize("grandstand").y;
                const standWidth = modelSize("grandstand").z; // Width along Z

                // Place grandstands around the field
                const numStandsLong = Math.ceil(FIELD_LENGTH / standWidth); // Number of stands along length
                const numStandsWide = Math.ceil(FIELD_WIDTH / standWidth); // Number of stands along width

                // Side stands (along X-axis)
                for (let i = -numStandsLong / 2; i < numStandsLong / 2; i++) {
                    const xPos = i * standWidth + standWidth / 2;
                    // Front side
                    const stand1 = standModel.clone();
                    stand1.position.set(xPos, -standHeight / 2, -(FIELD_WIDTH / 2 + standWidth / 2 + 5));
                    scene.add(stand1);
                    // Back side
                    const stand2 = standModel.clone();
                    stand2.position.set(xPos, -standHeight / 2, FIELD_WIDTH / 2 + standWidth / 2 + 5);
                    stand2.rotation.y = Math.PI; // Rotate to face inwards
                    scene.add(stand2);
                }

                // End stands (along Z-axis) - filling gaps
                for (let i = -numStandsWide / 2; i < numStandsWide / 2; i++) {
                    const zPos = i * standWidth + standWidth / 2;
                    // Left end
                    const stand3 = standModel.clone();
                    stand3.position.set(-(FIELD_LENGTH / 2 + standWidth / 2 + 5), -standHeight / 2, zPos);
                    stand3.rotation.y = Math.PI / 2; // Rotate 90 degrees
                    scene.add(stand3);
                    // Right end
                    const stand4 = standModel.clone();
                    stand4.position.set(FIELD_LENGTH / 2 + standWidth / 2 + 5, -standHeight / 2, zPos);
                    stand4.rotation.y = -Math.PI / 2; // Rotate -90 degrees
                    scene.add(stand4);
                }
            }
        });

        // Populate stands with cheering spectators
        const spawnSpectators = async () => {
            const spectatorHeight = 1.7; // Approx height for people models
            const spectatorScale = 1.2;

            for (let i = 0; i < SPECTATOR_COUNT; i++) {
                const modelName = spectatorModels[Math.floor(Math.random() * spectatorModels.length)];
                const spectator = await loadModel(modelName);

                if (spectator) {
                    spectator.scale.set(spectatorScale, spectatorScale, spectatorScale);

                    // Random position on stands
                    let x = MathUtils.randFloatSpread(FIELD_LENGTH + 40); // Wider range
                    let z = MathUtils.randFloatSpread(FIELD_WIDTH + 40); // Wider range
                    let y = spectatorHeight / 2;

                    // Try to place them in rows on the grandstands
                    const row = Math.floor(Math.random() * 3); // 3 rows
                    const distanceX = FIELD_LENGTH / 2 + 10 + row * 2;
                    const distanceZ = FIELD_WIDTH / 2 + 10 + row * 2;

                    if (Math.random() < 0.5) { // Place on sides (X-axis)
                        x = MathUtils.randFloatSpread(FIELD_LENGTH);
                        z = Math.random() < 0.5 ? -distanceZ : distanceZ;
                    } else { // Place on ends (Z-axis)
                        x = Math.random() < 0.5 ? -distanceX : distanceX;
                        z = MathUtils.randFloatSpread(FIELD_WIDTH);
                    }

                    spectator.position.set(x, y, z);
                    spectator.rotation.y = Math.random() * Math.PI * 2; // Random direction

                    scene.add(spectator);

                    const mixer = new AnimationMixer(spectator);
                    animationMixers.push(mixer);
                    const cheerClip = spectator.animations.find(a => /emote-yes/i.test(a.name));
                    if (cheerClip) {
                        const action = mixer.clipAction(cheerClip);
                        action.play();
                    } else {
                        // Fallback if no cheer, just play first anim or do nothing
                        if (spectator.animations.length > 0) {
                            mixer.clipAction(spectator.animations[0]).play();
                        }
                    }
                }
            }
        };
        spawnSpectators();


        // --- PLAYER MOVEMENT AND CONTROLS ---
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let mouseLook = false;
        let lastMouseX = 0;

        window.addEventListener('keydown', (event) => {
            if (gameState === 'playing') {
                keys[event.key.toLowerCase()] = true;
                if (['w', 'a', 's', 'd', 'arrowup', 'arrowleft', 'arrowdown', 'arrowright', ' '].includes(event.key.toLowerCase())) {
                    event.preventDefault(); // Prevent page scrolling
                }
            }
        });
        window.addEventListener('keyup', (event) => {
            if (gameState === 'playing') {
                keys[event.key.toLowerCase()] = false;
            }
        });

        // Touch controls
        const controlButtons = {
            'move-up': false,
            'move-left': false,
            'move-down': false,
            'kick-button': false
        };

        const setupButtonListeners = () => {
            document.querySelectorAll('.control-button').forEach(button => {
                const action = button.id;
                button.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    if (gameState === 'playing') {
                        controlButtons[action] = true;
                        if (action === 'kick-button') {
                            keys['space'] = true;
                        } else {
                            if (action === 'move-up') keys['w'] = true;
                            if (action === 'move-left') keys['a'] = true;
                            if (action === 'move-down') keys['s'] = true;
                        }
                    }
                });
                button.addEventListener('pointerup', (e) => {
                    e.preventDefault();
                    if (gameState === 'playing') {
                        controlButtons[action] = false;
                        if (action === 'kick-button') {
                            keys['space'] = false;
                        } else {
                            if (action === 'move-up') keys['w'] = false;
                            if (action === 'move-left') keys['a'] = false;
                            if (action === 'move-down') keys['s'] = false;
                        }
                    }
                });
                button.addEventListener('pointerleave', (e) => { // Release if pointer leaves button area
                    if (e.pointerType === 'touch' && gameState === 'playing') {
                         controlButtons[action] = false;
                        if (action === 'kick-button') {
                            keys['space'] = false;
                        } else {
                            if (action === 'move-up') keys['w'] = false;
                            if (action === 'move-left') keys['a'] = false;
                            if (action === 'move-down') keys['s'] = false;
                        }
                    }
                });
            });
        };
        setupButtonListeners();


        // Mouse look
        renderer.domElement.addEventListener('pointerdown', (event) => {
            if (event.button === 0 && event.target === renderer.domElement && gameState === 'playing') { // Left click on canvas
                mouseLook = true;
                lastMouseX = event.clientX;
                renderer.domElement.setPointerCapture(event.pointerId);
            }
        });
        renderer.domElement.addEventListener('pointermove', (event) => {
            if (mouseLook && gameState === 'playing') {
                const deltaX = event.clientX - lastMouseX;
                playerMesh.rotation.y -= deltaX * 0.005; // Adjust sensitivity
                lastMouseX = event.clientX;
            }
        });
        renderer.domElement.addEventListener('pointerup', (event) => {
            if (mouseLook) {
                mouseLook = false;
                renderer.domElement.releasePointerCapture(event.pointerId);
            }
        });

        // --- GAME LOGIC ---
        const resetGame = () => {
            scoreBlue = 0;
            scoreRed = 0;
            updateScoreDisplay();
            lastGoalScorer = null;
            messageElement.textContent = '';
            startGame();
        };

        const startGame = () => {
            gameState = 'playing';
            messageElement.textContent = 'GO! First to 3 goals wins!';
            lastGoalTime = Date.now(); // Reset initial safe time
            resetBallAndPlayers();
        };

        const resetBallAndPlayers = () => {
            ballBody.position.set(0, ballRadius + 0.1, 0);
            ballBody.velocity.set(0, 0, 0);
            ballBody.angularVelocity.set(0, 0, 0);

            playerBody.position.set(-FIELD_LENGTH / 4, playerHeight / 2, 0);
            playerBody.velocity.set(0, 0, 0);
            playerBody.angularVelocity.set(0, 0, 0);
            if (playerMesh) playerMesh.rotation.y = 0; // Reset player rotation

            aiBody.position.set(FIELD_LENGTH / 4, playerHeight / 2, 0);
            aiBody.velocity.set(0, 0, 0);
            aiBody.angularVelocity.set(0, 0, 0);
            if (aiMesh) aiMesh.rotation.y = Math.PI; // AI faces towards player goal
        };

        const updateScoreDisplay = () => {
            scoreBlueElement.textContent = scoreBlue;
            scoreRedElement.textContent = scoreRed;
        };

        const checkGoals = () => {
            // Check if ball is inside blue goal (scores for red)
            if (ballBody.position.x < blueGoalMesh.position.x + GOAL_DEPTH / 2 &&
                ballBody.position.x > blueGoalMesh.position.x - GOAL_DEPTH / 2 &&
                ballBody.position.z > blueGoalMesh.position.z - GOAL_WIDTH / 2 &&
                ballBody.position.z < blueGoalMesh.position.z + GOAL_WIDTH / 2 &&
                ballBody.position.y < GOAL_HEIGHT) {
                if (Date.now() - lastGoalTime > GAME_RESET_DELAY) { // Prevent rapid scoring
                    scoreRed++;
                    lastGoalScorer = 'red';
                    handleGoal();
                }
            }

            // Check if ball is inside red goal (scores for blue)
            if (ballBody.position.x > redGoalMesh.position.x - GOAL_DEPTH / 2 &&
                ballBody.position.x < redGoalMesh.position.x + GOAL_DEPTH / 2 &&
                ballBody.position.z > redGoalMesh.position.z - GOAL_WIDTH / 2 &&
                ballBody.position.z < redGoalMesh.position.z + GOAL_WIDTH / 2 &&
                ballBody.position.y < GOAL_HEIGHT) {
                if (Date.now() - lastGoalTime > GAME_RESET_DELAY) {
                    scoreBlue++;
                    lastGoalScorer = 'blue';
                    handleGoal();
                }
            }
        };

        const handleGoal = () => {
            playSound('coin_pickup'); // Sound for goal scored
            updateScoreDisplay();
            gameState = 'gameOver'; // Temporarily set to prevent further actions
            messageElement.textContent = `${lastGoalScorer === 'blue' ? 'BLUE' : 'RED'} SCORED!`;

            if (scoreBlue >= WINNING_SCORE) {
                playSound('win');
                messageElement.textContent = 'BLUE WINS! Tap to play again!';
                document.getElementById('overlay').addEventListener('pointerdown', resetGame, { once: true });
            } else if (scoreRed >= WINNING_SCORE) {
                playSound('game_over');
                messageElement.textContent = 'RED WINS! Tap to play again!';
                document.getElementById('overlay').addEventListener('pointerdown', resetGame, { once: true });
            } else {
                setTimeout(() => {
                    messageElement.textContent = '';
                    startGame(); // Reset for next round
                }, GAME_RESET_DELAY);
            }
            lastGoalTime = Date.now();
        };


        // --- AI OPPONENT BEHAVIOR ---
        const updateAI = (delta) => {
            if (gameState !== 'playing' || Date.now() - lastGoalTime < INITIAL_SAFE_TIME) {
                // Stop AI movement and animation if game not playing or in safe time
                aiBody.velocity.set(0, aiBody.velocity.y, 0);
                if (aiWalkAction) aiWalkAction.setEffectiveWeight(0);
                aiRunning = false;
                return;
            }

            const aiPos = aiBody.position;
            const ballPos = ballBody.position;

            const targetPos = new Vec3(ballPos.x, aiPos.y, ballPos.z);
            let direction = new Vec3();
            targetPos.vsub(aiPos, direction);
            direction.y = 0; // Only move horizontally

            const distanceToBall = direction.length();

            if (distanceToBall > AI_PLAYER_DETECTION_RANGE) {
                // If ball is far, move towards player goal
                const aiGoal = blueGoalMesh.position; // AI's goal is player's goal
                aiBody.velocity.set(0, aiBody.velocity.y, 0);
                aiRunning = false;
                return;
            }

            // AI tries to get behind the ball relative to the player's goal
            const playerGoalPos = new Vec3(blueGoalMesh.position.x, aiPos.y, blueGoalMesh.position.z);
            let kickDirection = new Vec3();
            playerGoalPos.vsub(ballPos, kickDirection);
            kickDirection.normalize();

            // Calculate a target position that's slightly behind the ball in the direction of AI's goal
            let desiredApproachPos = new Vec3();
            ballPos.vadd(kickDirection.scale(1.5), desiredApproachPos); // 1.5m behind the ball

            // Clamp AI to its half of the field to prevent it from going too far
            desiredApproachPos.x = Math.max(0, desiredApproachPos.x); // AI stays in its half (+X)

            let aiMoveDirection = new Vec3();
            desiredApproachPos.vsub(aiPos, aiMoveDirection);
            aiMoveDirection.y = 0; // Keep AI on the ground
            aiMoveDirection.normalize();

            if (distanceToBall < AI_PLAYER_KICK_RANGE) {
                // Close enough to kick, attempt kick
                const kickVec = new Vec3();
                playerGoalPos.vsub(ballPos, kickVec);
                kickVec.normalize();
                kickVec.y = 0.1; // Slight upward angle
                kickBall(aiBody, kickVec.scale(KICK_POWER * 1.2)); // AI kicks harder

                if (aiKickAction && !aiKicking) {
                    aiKickAction.reset();
                    aiKickAction.play();
                    aiKicking = true;
                    // Listen for animation end to reset
                    aiMixer.addEventListener('finished', () => {
                        aiKicking = false;
                        aiKickAction.setEffectiveWeight(0);
                    }, { once: true });
                }
                aiBody.velocity.set(0, aiBody.velocity.y, 0); // Stop moving while kicking
                aiRunning = false;

            } else {
                // Move towards the ball
                aiBody.velocity.x = aiMoveDirection.x * PLAYER_SPEED;
                aiBody.velocity.z = aiMoveDirection.z * PLAYER_SPEED;
                aiBody.velocity.y = aiBody.velocity.y; // Maintain gravity

                // Rotate AI to face the ball
                const aiLookDirection = new Vector3(ballPos.x - aiPos.x, 0, ballPos.z - aiPos.z).normalize();
                if (aiLookDirection.lengthSq() > 0.001) {
                    const targetQuaternion = new Quaternion().setFromUnitVectors(new Vector3(0, 0, 1), aiLookDirection);
                    aiMesh.quaternion.slerp(targetQuaternion, delta * PLAYER_ROTATION_SPEED * 2); // Faster AI rotation
                }
                aiRunning = true;
            }

            // Update AI animation
            if (aiWalkAction) {
                if (aiRunning) {
                    aiWalkAction.setEffectiveWeight(1);
                    if (aiKickAction && aiKicking) aiKickAction.setEffectiveWeight(0); // If kicking, disable walk
                } else {
                    aiWalkAction.setEffectiveWeight(0);
                }
            }
        };

        const kickBall = (kickerBody, impulse) => {
            // Apply impulse to the ball based on kicker's position and direction
            // Get direction from kicker to ball
            const kickDir = new Vec3();
            ballBody.position.vsub(kickerBody.position, kickDir);
            kickDir.normalize();

            // Apply the impulse
            ballBody.applyImpulse(impulse, kickDir.scale(ballRadius)); // Apply at edge of ball for spin
            playSound('kick');
        };

        // --- GAME LOOP ---
        let lastTimestamp = performance.now();
        let gameOn = true;

        const setGameOn = (value) => {
            if (value === gameOn) return;
            gameOn = value;
            if (gameOn) {
                clock.getDelta(); // Reset clock delta on resume
                lastTimestamp = performance.now(); // Reset lastTimestamp
                animate();
            }
        };

        document.addEventListener('visibilitychange', () => setGameOn(!document.hidden));
        window.addEventListener('blur', () => setGameOn(false));
        window.addEventListener('focus', () => setGameOn(true));

        const animate = () => {
            if (!gameOn) return;

            requestAnimationFrame(animate);

            const now = performance.now();
            let delta = (now - lastTimestamp) / 1000;
            lastTimestamp = now;

            // Cap delta to prevent super fast movement after pause/lag
            delta = Math.min(delta, 0.05);

            if (gameState === 'playing') {
                const elapsedTime = Date.now() - lastGoalTime;
                if (elapsedTime > INITIAL_SAFE_TIME) {
                    // --- PLAYER MOVEMENT ---
                    let moveDirection = new Vector3(0, 0, 0);
                    if (keys.w) moveDirection.z = -1;
                    if (keys.s) moveDirection.z = 1;
                    if (keys.a) moveDirection.x = -1;
                    if (keys.d) moveDirection.x = 1;

                    moveDirection.normalize(); // Normalize for consistent speed when moving diagonally

                    if (moveDirection.lengthSq() > 0) {
                        // Convert player's local movement to world direction based on player's rotation
                        const playerQuaternion = new Quaternion().setFromEuler(playerMesh.rotation);
                        moveDirection.applyQuaternion(playerQuaternion);

                        playerBody.velocity.x = moveDirection.x * PLAYER_SPEED;
                        playerBody.velocity.z = moveDirection.z * PLAYER_SPEED;
                        playerBody.velocity.y = playerBody.velocity.y; // Maintain gravity

                        playerRunning = true;
                    } else {
                        playerBody.velocity.x = 0;
                        playerBody.velocity.z = 0;
                        playerRunning = false;
                    }

                    // Kick action
                    if (keys.space && !playerKicking) {
                        const distanceToBall = playerBody.position.distanceTo(ballBody.position);
                        if (distanceToBall < playerBody.shapes[0].radius + ballBody.shapes[0].radius + 0.5) { // Check if player is close enough to kick
                            const kickDir = new Vec3();
                            // Player kicks in the direction they are facing
                            const playerForward = new Vector3(0, 0, 1).applyQuaternion(playerMesh.quaternion);
                            kickDir.copy(playerForward);
                            kickDir.y = 0.1; // Give it a slight lift
                            kickDir.normalize();

                            kickBall(playerBody, kickDir.scale(KICK_POWER));

                            if (playerKickAction) {
                                playerKickAction.reset();
                                playerKickAction.play();
                                playerKicking = true;
                                playerMixer.addEventListener('finished', () => {
                                    playerKicking = false;
                                    playerKickAction.setEffectiveWeight(0);
                                }, { once: true });
                            }
                        }
                        keys.space = false; // Consume kick input
                    }

                    // Update player animation
                    if (playerMixer && playerWalkAction) {
                        if (playerRunning && !playerKicking) {
                            playerWalkAction.setEffectiveWeight(1);
                        } else {
                            playerWalkAction.setEffectiveWeight(0);
                        }
                    }

                    // --- AI OPPONENT BEHAVIOR ---
                    updateAI(delta);
                } else {
                    // During safe time, stop all player/AI movement
                    playerBody.velocity.set(0, playerBody.velocity.y, 0);
                    aiBody.velocity.set(0, aiBody.velocity.y, 0);
                    if (playerWalkAction) playerWalkAction.setEffectiveWeight(0);
                    if (aiWalkAction) aiWalkAction.setEffectiveWeight(0);
                }

                // --- PHYSICS UPDATE ---
                world.step(delta);

                // Update Three.js meshes from Cannon.js bodies
                playerMesh.position.copy(playerBody.position);
                aiMesh.position.copy(aiBody.position);
                ballMesh.position.copy(ballBody.position);
                ballMesh.quaternion.copy(ballBody.quaternion);

                // Make sure players are always upright
                playerBody.quaternion.copy(playerMesh.quaternion);
                aiBody.quaternion.copy(aiMesh.quaternion);

                // Keep camera following player, with an offset
                const cameraOffset = new Vector3(0, 15, 20); // Behind and above
                cameraOffset.applyQuaternion(playerMesh.quaternion); // Rotate offset with player
                camera.position.copy(playerMesh.position).add(cameraOffset);
                camera.lookAt(playerMesh.position.x, playerMesh.position.y + 2, playerMesh.position.z); // Look at player

                // --- GOAL DETECTION ---
                checkGoals();
            }

            // --- ANIMATION MIXER UPDATE ---
            const mixerDelta = clock.getDelta();
            animationMixers.forEach(mixer => mixer.update(mixerDelta));
            if (playerMixer) playerMixer.update(mixerDelta);
            if (aiMixer) aiMixer.update(mixerDelta);

            renderer.render(scene, camera);
        };

        // --- START GAME ---
        resetGame(); // Initial game setup and start
        playMusic('bg_loop_upbeat');
    </script>
</body>
</html>

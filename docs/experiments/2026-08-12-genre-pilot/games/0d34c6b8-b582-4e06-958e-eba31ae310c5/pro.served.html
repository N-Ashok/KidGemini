      });
    } catch (e) { /* silent */ }
    return handle;
  };
})();
</script>
    <title>Mars Neon Racer</title>
    <style>
        /* --- BASIC SETUP --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
        }
        #scene {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* --- UI AND INFO --- */
        .ui {
            position: absolute;
            top: 0;

             font-size: 24px;

        }
        .d-pad {

            grid-template-areas: ". up ." "left . right";

        }
        .control-button {

            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);

            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            user-select: none;
            cursor: pointer;
        }
        #up { grid-area: up; }
        #left { grid-area: left; }
        #right { grid-area: right; }
        #down {
            width: 70px;

            border: 2px solid rgba(255, 100, 100, 0.6);
        }
    </style>
</head>
<body>
    
    
    

    <canvas id="scene"></canvas>

    <div class="ui">
        <!-- --- INFO DISPLAY --- -->
        <div class="top-ui">
            <div id="score">Lap: 1 / 3</div>
            <div id="speed-display">0 KPH</div>
        </div>

        <div class="instructions">
            <p><strong>Welcome to Mars Neon Racer!</strong></p>
            <p>Arrow Keys or On-screen buttons to drive.</p>
            <p>Dodge the rocks and hit blue pads for a speed boost!</p>
            <p>Complete 3 laps to win!</p>
        </div>

        <!-- --- ON-SCREEN CONTROLS --- -->
        <div class="controls">
            <div class="d-pad">
                <div id="up" class="control-button">▲</div>
                <div id="left" class="control-button">◀</div>
                <div id="right" class="control-button">▶</div>
            </div>
            <div id="down" class="control-button">▼</div>
        </div>
    </div>

<script type="module">
import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Vector3, Box3, BoxGeometry, CylinderGeometry, PlaneGeometry, MeshStandardMaterial, MeshBasicMaterial, Mesh, AmbientLight, DirectionalLight, Quaternion, Euler, Matrix4, MathUtils } from "three";

// --- GLOBAL VARIABLES ---
const scene = new Scene();
const clock = new Clock();
let playerCar;
let carPlaceholder;
const maxSpeed = 300;
const turnRate = 1.5;
const acceleration = 60;
const drag = 0.985;
const brakePower = 150;
let speed = 0;
let steerValue = 0;
const boosterSpeed = 500;
let boosterTime = 0;
let crashTime = 0;

const lapsToWin = 3;
let currentLap = 1;
let checkpointPassed = false;

const controls = {
    up: false,
    down: false,
    left: false,
    right: false,
};

// --- RENDERER AND CAMERA SETUP ---
const renderer = new WebGLRenderer({
    canvas: document.getElementById('scene'),
    antialias: true,
    preserveDrawingBuffer: true
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, -10);

function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);
resize();

// --- SCENE AND LIGHTING ---
scene.background = new Color(0x3a0d3a);
scene.fog = new Fog(0xf08080, 50, 400);

const ambientLight = new AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const directionalLight = new DirectionalLight(0xffffff, 1.5);
directionalLight.position.set(50, 50, 25);
scene.add(directionalLight);

// --- GROUND AND SCENERY ---
const ground = new Mesh(
    new PlaneGeometry(2000, 2000),
    new MeshStandardMaterial({ color: 0x9b4d3f, roughness: 0.8 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const mountainPositions = [
    { x: -300, z: -200, s: 1 }, { x: 300, z: -250, s: 1.2 }, { x: 150, z: 400, s: 0.8 },
    { x: -200, z: 350, s: 1.1 }, { x: 400, z: 100, s: 1 }, { x: -450, z: 50, s: 1.3}
];
loadModel("mountain").then(m => {
    if(!m) return;
    mountainPositions.forEach(pos => {
        const mount = m.clone();
        mount.position.set(pos.x, 0, pos.z);
        mount.scale.multiplyScalar(pos.s * 2.5);
        mount.rotation.y = Math.random() * Math.PI * 2;
        scene.add(mount);
    });
});
loadModel("mountain_small").then(m => {
    if(!m) return;
    mountainPositions.forEach(pos => {
        const mount = m.clone();
        mount.position.set(pos.x + Math.random()*100-50, 0, pos.z + Math.random()*100-50);
        mount.scale.multiplyScalar(3);
        mount.rotation.y = Math.random() * Math.PI * 2;
        scene.add(mount);
    });
});

// --- PLAYER CAR ---
function setupPlayer() {
    carPlaceholder = new Mesh(new BoxGeometry(2, 1, 4), new MeshStandardMaterial({ color: 0x00ff00 }));
    carPlaceholder.position.y = 0.5;
    scene.add(carPlaceholder);
    playerCar = carPlaceholder;

    loadModel("future_car").then(model => {
        if (model) {
            scene.remove(carPlaceholder);
            playerCar = model;
            playerCar.scale.set(1.2, 1.2, 1.2);
            playerCar.position.y = 0.3;
            // The model faces +Z, let's turn it to face the camera at start
            playerCar.rotation.y = Math.PI; 
            scene.add(playerCar);
        }
    });
}
setupPlayer();


// --- TRACK LAYOUT ---
const track = [];
const trackLayout = [
    { type: "straight", length: 3 },
    { type: "curve" },
    { type: "straight", length: 2 },
    { type: "curve" },
    { type: "straight", length: 4 },
    { type: "curve" },
    { type: "straight", length: 2 },
    { type: "curve" },
];

const trackPieceModels = {};

Promise.all([
    loadModel("race_track_straight").then(m => trackPieceModels.straight = m),
    loadModel("race_track_curve").then(m => trackPieceModels.curve = m)
]).then(() => {
    let currentPos = new Vector3(0, 0.05, 10);
    let currentRot = 0; // Angle in radians

    const straightSize = modelSize("race_track_straight");
    const curveSize = modelSize("race_track_curve");
    
    // Add start/finish line
    const finishLine = new Mesh(
        new BoxGeometry(12, 0.1, 2),
        new MeshStandardMaterial({ color: 0xffffff })
    );
    finishLine.position.set(0, 0.1, 5);
    scene.add(finishLine);

    trackLayout.forEach(pieceInfo => {
        if (pieceInfo.type === "straight") {
            for (let i = 0; i < pieceInfo.length; i++) {
                const piece = trackPieceModels.straight.clone();
                piece.position.copy(currentPos);
                piece.rotation.y = currentRot;
                scene.add(piece);
                track.push({mesh: piece, box: new Box3().setFromObject(piece)});
                currentPos.x += Math.sin(currentRot) * straightSize.z;
                currentPos.z += Math.cos(currentRot) * straightSize.z;
            }
        } else if (pieceInfo.type === "curve") {
            const piece = trackPieceModels.curve.clone();
            const pivotOffset = new Vector3((curveSize.x / 2), 0, (curveSize.z / 2));
            const rotatedPivot = pivotOffset.clone().applyAxisAngle(new Vector3(0,1,0), currentRot);

            const cornerPivot = new Vector3().copy(currentPos)
                .add(rotatedPivot);
            
            piece.position.copy(cornerPivot);
            piece.rotation.y = currentRot;
            scene.add(piece);
            track.push({mesh: piece, box: new Box3().setFromObject(piece)});

            const moveVec = new Vector3(curveSize.x, 0, curveSize.z);
            const rotatedMoveVec = moveVec.clone().applyAxisAngle(new Vector3(0,1,0), currentRot);

            currentPos.add(rotatedMoveVec);
            currentRot += Math.PI / 2;
        }
    });
});


// --- OBSTACLES AND BOOSTERS ---
const obstacles = [];
const boosters = [];

function spawnItems() {
    // Rocks
    const rockMaterial = new MeshStandardMaterial({ color: 0x8B4513, roughness: 0.9, metalness: 0.1 });
    for (let i = 0; i < 50; i++) {
        const size = Math.random() * 2 + 1;
        const rock = new Mesh(
            new BoxGeometry(size, size, size),
            rockMaterial
        );
        const trackPiece = track[Math.floor(Math.random() * (track.length - 4)) + 2]; // Avoid start
        if(trackPiece) {
            rock.position.copy(trackPiece.mesh.position);
            rock.position.x += (Math.random() - 0.5) * 8;
            rock.position.z += (Math.random() - 0.5) * 8;
            rock.position.y = size / 2;
            rock.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            scene.add(rock);
            obstacles.push({ mesh: rock, box: new Box3().setFromObject(rock) });
        }
    }
    // Boosters
    const boosterMaterial = new MeshBasicMaterial({ color: 0x00BFFF });
    for (let i = 0; i < 10; i++) {
        const booster = new Mesh(
            new CylinderGeometry(2, 2, 0.2, 16),
            boosterMaterial
        );
        const trackPiece = track[Math.floor(Math.random() * track.length)];
        if(trackPiece) {
            booster.position.copy(trackPiece.mesh.position);
            booster.position.y = 0.2;
            scene.add(booster);
            boosters.push({ mesh: booster, box: new Box3().setFromObject(booster), active: true });
        }
    }
}
setTimeout(spawnItems, 1000); // Wait for track to generate

// --- CONTROLS HANDLING ---
function setupControls() {
    const keyMap = { ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right' };
    
    window.addEventListener('keydown', e => {
        if(e.key in keyMap) {
            controls[keyMap[e.key]] = true;
            e.preventDefault();
        }
    });
    window.addEventListener('keyup', e => {
        if(e.key in keyMap) controls[keyMap[e.key]] = false;
    });

    const buttons = { up: 'up', down: 'down', left: 'left', right: 'right' };
    for (const id in buttons) {
        const btn = document.getElementById(id);
        const key = buttons[id];
        btn.addEventListener('pointerdown', () => controls[key] = true);
        btn.addEventListener('pointerup', () => controls[key] = false);
        btn.addEventListener('pointerleave', () => controls[key] = false);
    }
}
setupControls();

// --- PLAYER MOVEMENT ---
function updatePlayer(delta) {
    if (!playerCar) return;

    if (crashTime > 0) {
        crashTime -= delta;
        speed *= 0.9;
        if (speed < 1) speed = 0;
    } else {
        // Steering
        let turnInput = (controls.left ? 1 : 0) + (controls.right ? -1 : 0);
        steerValue = MathUtils.lerp(steerValue, turnInput, delta * 5);

        // Acceleration and Braking
        if (controls.up) {
            speed += acceleration * delta;
        } else if (controls.down) {
            speed -= brakePower * delta;
        } else {
            speed *= drag;
        }
    }

    if (boosterTime > 0) {
        boosterTime -= delta;
        speed = MathUtils.lerp(speed, boosterSpeed, 0.1);
        if (boosterTime <= 0) {
           playSound("whoosh");
        }
    }
    
    speed = MathUtils.clamp(speed, -maxSpeed / 4, maxSpeed);
    if(Math.abs(speed) < 0.1) speed = 0;

    // Apply steering based on speed
    const steerAngle = steerValue * turnRate * (speed / maxSpeed) * delta;
    playerCar.rotation.y += steerAngle;

    // Move the car
    playerCar.position.x += Math.sin(playerCar.rotation.y) * speed * delta / 10;
    playerCar.position.z += Math.cos(playerCar.rotation.y) * speed * delta / 10;

    // Off-track slowdown
    let onTrack = false;
    const carBox = new Box3().setFromObject(playerCar);
    for(const piece of track){
        if(carBox.intersectsBox(piece.box)){
            onTrack = true;
            break;
        }
    }
    if(!onTrack && Math.abs(speed) > 50){
        speed *= 0.95; // Slow down on the red sand
    }
}

// --- CAMERA FOLLOW ---
function updateCamera() {
    if (!playerCar) return;
    const offset = new Vector3(0, 4, -8);
    offset.applyQuaternion(playerCar.quaternion);
    const targetPosition = playerCar.position.clone().add(offset);
    camera.position.lerp(targetPosition, 0.1);
    camera.lookAt(playerCar.position.clone().add(new Vector3(0, 2, 0)));
}

// --- COLLISION DETECTION ---
function checkCollisions() {
    if (!playerCar) return;
    const carBox = new Box3().setFromObject(playerCar);

    // Obstacles
    if (crashTime <= 0) {
        for (const obstacle of obstacles) {
            if (carBox.intersectsBox(obstacle.box)) {
                playSound("explosion");
                speed = -speed * 0.5; // Bounce back
                crashTime = 1.5; // Stunned for 1.5 seconds
                break;
            }
        }
    }

    // Boosters
    if (boosterTime <= 0) {
        for (const booster of boosters) {
            if (booster.active && carBox.intersectsBox(booster.box)) {
                playSound("powerup");
                boosterTime = 2; // 2 seconds of boost
                booster.mesh.visible = false;
                booster.active = false;
                setTimeout(() => {
                    booster.mesh.visible = true;
                    booster.active = true;
                }, 5000); // Booster respawns after 5 seconds
                break;
            }
        }
    }
}

// --- LAP AND WIN LOGIC ---
const lapCounterElem = document.getElementById('score');
const instructionsElem = document.querySelector('.instructions');
let gameStarted = false;
let gameOver = false;

function checkLaps() {
    if (gameOver || !playerCar) return;
    
    // Checkpoint at halfway point (approx - far side of track)
    if (playerCar.position.z > 200 && playerCar.position.x < -100) {
        checkpointPassed = true;
    }

    // Finish line
    if (playerCar.position.z > 0 && playerCar.position.z < 15 && Math.abs(playerCar.position.x) < 20 && checkpointPassed) {
        currentLap++;
        checkpointPassed = false;
        if (currentLap > lapsToWin) {
            lapCounterElem.innerText = `You Win!`;
            gameOver = true;
        } else {
            lapCounterElem.innerText = `Lap: ${currentLap} / ${lapsToWin}`;
            playSound("confirm");
        }
    }
}

// --- GAME LOOP ---
function animate() {
    if(gameOver) return;
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    if (playerCar) {
         if(!gameStarted && (controls.up || controls.down || controls.left || controls.right)){
             gameStarted = true;
             instructionsElem.classList.add('hidden');
             playMusic("bg_loop_upbeat");
         }
         
         // Start with a 3-second grace period
         if (clock.getElapsedTime() > 3) {
            checkCollisions();
         }
        
        updatePlayer(delta);
        updateCamera();
        checkLaps();
    }
    
    // Update Speed UI
    document.getElementById('speed-display').innerText = `${Math.floor(Math.abs(speed))} KPH`;

    renderer.render(scene, camera);
}

// --- START GAME ---
animate();

</script>

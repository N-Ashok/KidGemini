        src.loopEnd = b.end;
        var gain = context().createGain();
        gain.gain.value = 0.5;
        src.connect(gain);
        gain.connect(context().destination);
        src.start(0, b.start);
        currentMusic = src;
        handle.stop = function () { try { src.stop(); } catch (e3) {} if (currentMusic === src) currentMusic = null; };
      });
    } catch (e) { /* silent */ }
    return handle;
  };
})();
</script>

<body>
    
    
    

    <canvas id="scene"></canvas>
    <div id="game-ui">
        <div id="top-ui">
            <div id="score">Lap: 1/3</div>
            <div id="message"></div>
        </div>
        <div id="controls">
            <div id="up-button" class="control-button">⬆</div>
            <div id="down-button" class="control-button">⬇</div>
            <div id="left-button" class="control-button">⬅</div>
            <div id="right-button" class="control-button">➡</div>
        </div>
    </div>

    <script type="module">
        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, ConeGeometry, CylinderGeometry, PlaneGeometry, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight, Quaternion, Matrix4, MathUtils } from "three";

        // --- GAME STATE ---
        let gameActive = true;
        let currentLap = 1;
        const totalLaps = 3;
        let collisionCount = 0;
        const maxCollisions = 3;
        let lastMessageTime = 0;
        const messageDuration = 2000; // 2 seconds

        // --- THREE.JS SETUP ---
        const scene = new Scene();
        const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const clock = new Clock();
        let animationFrameId = null;

        // --- SCENE LIGHTING & ENVIRONMENT ---
        const ambientLight = new AmbientLight(0xffffff, 0.6); // Soft overall light
        scene.add(ambientLight);

        const directionalLight = new DirectionalLight(0xffffff, 0.8); // Sunlight
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Mars atmosphere colors
        const fogColor = new Color(0x6a2c70); // Darker purple for distant fog
        const clearColor = new Color(0x8a3a96); // Lighter purple for closer sky
        scene.fog = new Fog(fogColor, 50, 200); // start, end distance
        renderer.setClearColor(clearColor); // Background color

        // Mars ground
        const groundMaterial = new MeshStandardMaterial({ color: 0x8d4a4a, roughness: 0.9, metalness: 0.1 });
        const ground = new Mesh(new PlaneGeometry(500, 500), groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        scene.add(ground);

        // --- UI ELEMENTS ---
        const scoreElement = document.getElementById('score');
        const messageElement = document.getElementById('message');

        function updateScoreUI() {
            scoreElement.textContent = `Lap: ${currentLap}/${totalLaps}`;
        }

        function displayMessage(text, color = 'yellow') {
            messageElement.textContent = text;
            messageElement.style.color = color;
            messageElement.style.textShadow = `0 0 10px ${color}`;
            lastMessageTime = performance.now();
        }

        // --- PLAYER CAR ---
        let playerCar;
        const carSpeedBase = 20; // units per second
        let carCurrentSpeed = 0;
        const carMaxSpeed = 35;
        const carAcceleration = 25; // units/sec^2
        const carBraking = 40; // units/sec^2
        const carReverseSpeed = -10;
        const carTurnRate = Math.PI * 0.7; // radians per second
        let carHeading = 0; // Y-axis rotation
        let playerPosition = new Vector3(0, 0, 0);
        let playerVelocity = new Vector3(); // For collision reactions
        let playerCarCollider = new Box3(); // For collision detection

        let currentBoostSpeedModifier = 1.0;
        let boostTimer = 0;

        const carPlaceholderGeometry = new BoxGeometry(1.5, 0.5, 3);
        const carPlaceholderMaterial = new MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.8 });
        playerCar = new Mesh(carPlaceholderGeometry, carPlaceholderMaterial);
        scene.add(playerCar);
        playerCar.position.y = 0.5; // Lift off ground
        playerCar.name = "playerCar";

        loadModel("car").then((model) => {
            if (model) {
                scene.remove(playerCar); // Remove placeholder
                playerCar = model;
                playerCar.scale.set(0.015, 0.015, 0.015); // Adjust scale to fit the track
                playerCar.position.copy(playerPosition);
                playerCar.rotation.y = carHeading;
                playerCar.name = "playerCar";
                // Add a glowing material. If the model has existing materials, iterate or replace
                playerCar.traverse((child) => {
                    if (child.isMesh) {
                        child.material = new MeshStandardMaterial({
                            color: 0x00FFFF,       // Base color for the car
                            emissive: 0x00FFFF,    // Neon glow color
                            emissiveIntensity: 1.0, // How strong the glow is
                            roughness: 0.1,        // Shiny
                            metalness: 0.5         // Metallic look
                        });
                    }
                });
                scene.add(playerCar);
            }
        });

        // --- CONTROLS ---
        const keys = {
            forward: false,
            backward: false,
            left: false,
            right: false
        };

        function setKey(key, value) {
            switch (key) {
                case 'w':
                case 'ArrowUp':
                    keys.forward = value;
                    break;
                case 's':
                case 'ArrowDown':
                    keys.backward = value;
                    break;
                case 'a':
                case 'ArrowLeft':
                    keys.left = value;
                    break;
                case 'd':
                case 'ArrowRight':
                    keys.right = value;
                    break;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            setKey(e.key, true);
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'w', 'a', 's', 'd'].includes(e.key)) {
                e.preventDefault(); // Prevent scrolling
            }
        });

        window.addEventListener('keyup', (e) => {
            if (!gameActive) return;
            setKey(e.key, false);
        });

        // Mobile/Touch Controls
        const upButton = document.getElementById('up-button');
        const downButton = document.getElementById('down-button');
        const leftButton = document.getElementById('left-button');
        const rightButton = document.getElementById('right-button');

        function setupButtonListeners(button, keyProperty) {
            button.addEventListener('pointerdown', (e) => {
                if (!gameActive) return;
                keys[keyProperty] = true;
                button.setPointerCapture(e.pointerId);
            });
            button.addEventListener('pointerup', (e) => {
                if (!gameActive) return;
                keys[keyProperty] = false;
                button.releasePointerCapture(e.pointerId);
            });
            button.addEventListener('pointerleave', (e) => { // Release if pointer slides off
                if (e.buttons === 0 && keys[keyProperty]) { // Only if button was pressed and now pointer is released
                    keys[keyProperty] = false;
                }
            });
            button.addEventListener('contextmenu', (e) => e.preventDefault()); // Prevent long-press context menu
        }

        setupButtonListeners(upButton, 'forward');
        setupButtonListeners(downButton, 'backward');
        setupButtonListeners(leftButton, 'left');
        setupButtonListeners(rightButton, 'right');

        // --- RACE TRACK ---
        const trackGroup = new Group();
        scene.add(trackGroup);

        const trackPieces = []; // To store meshes and colliders
        const trackSegmentLength = 10; // Assuming track pieces are 10 units long for layout

        // Function to create a track piece and add to group
        async function createTrackPiece(modelName, position, rotationY, collisionDetect = true) {
            const placeholderGeometry = modelName === "race_track_straight" ? new BoxGeometry(10, 0.1, 5) : new BoxGeometry(5, 0.1, 5);
            const placeholderMaterial = new MeshStandardMaterial({ color: 0x555555 });
            let mesh = new Mesh(placeholderGeometry, placeholderMaterial);
            mesh.position.copy(position);
            mesh.rotation.y = rotationY;
            trackGroup.add(mesh);

            loadModel(modelName).then(m => {
                if (m) {
                    trackGroup.remove(mesh);
                    mesh = m;
                    mesh.position.copy(position);
                    mesh.rotation.y = rotationY;
                    trackGroup.add(mesh);
                }
                // Add to trackPieces for collision after model is loaded or placeholder remains
                if (collisionDetect) {
                    const box = new Box3().setFromObject(mesh);
                    trackPieces.push({ mesh: mesh, collider: box, type: modelName });
                }
            });
        }

        // --- TRACK LAYOUT --- (simple example, adjust for a winding track)
        // Road pieces are generally aligned along Z axis when loaded
        // car model faces +Z
        let currentPos = new Vector3(0, 0, 0);
        let currentRotY = 0;

        // Starting section
        await createTrackPiece("race_track_straight", currentPos.clone(), currentRotY);
        currentPos.z -= trackSegmentLength;

        await createTrackPiece("race_track_straight", currentPos.clone(), currentRotY);
        currentPos.z -= trackSegmentLength;

        await createTrackPiece("race_track_curve", currentPos.clone(), currentRotY);
        currentPos.x -= trackSegmentLength / 2; // Approximate curve
        currentPos.z -= trackSegmentLength / 2;
        currentRotY += Math.PI / 2; // Turn 90 degrees left

        await createTrackPiece("race_track_straight", currentPos.clone(), currentRotY);
        currentPos.x -= trackSegmentLength;

        await createTrackPiece("race_track_straight", currentPos.clone(), currentRotY);
        currentPos.x -= trackSegmentLength;

        await createTrackPiece("race_track_curve", currentPos.clone(), currentRotY);
        currentPos.x -= trackSegmentLength / 2;
        currentPos.z += trackSegmentLength / 2;
        currentRotY += Math.PI / 2; // Turn 90 degrees left

        await createTrackPiece("race_track_straight", currentPos.clone(), currentRotY);
        currentPos.z += trackSegmentLength;

        await createTrackPiece("race_track_straight", currentPos.clone(), currentRotY);
        currentPos.z += trackSegmentLength;

        await createTrackPiece("race_track_curve", currentPos.clone(), currentRotY);
        currentPos.x += trackSegmentLength / 2;
        currentPos.z += trackSegmentLength / 2;
        currentRotY += Math.PI / 2; // Turn 90 degrees left

        await createTrackPiece("race_track_straight", currentPos.clone(), currentRotY);
        currentPos.x += trackSegmentLength;

        await createTrackPiece("race_track_straight", currentPos.clone(), currentRotY);
        currentPos.x += trackSegmentLength;

        await createTrackPiece("race_track_curve", currentPos.clone(), currentRotY);
        currentPos.x += trackSegmentLength / 2;
        currentPos.z -= trackSegmentLength / 2;
        currentRotY += Math.PI / 2; // Turn 90 degrees left

        // Start/Finish Line
        let finishLineMesh;
        let finishLineCollider;
        let lastLapCrossZ = 0; // To detect passing in a specific direction

        const startLinePos = new Vector3(0, 0, 5); // Just before the first track piece
        const flagPos = startLinePos.clone();
        flagPos.x += 3;
        flagPos.y += 0.5;

        // Placeholder for finish line
        const finishLinePlaceholder = new Mesh(new BoxGeometry(10, 0.1, 1), new MeshStandardMaterial({ color: 0xff0000 }));
        finishLinePlaceholder.position.copy(startLinePos);
        finishLineMesh = finishLinePlaceholder;
        scene.add(finishLineMesh);
        finishLineCollider = new Box3().setFromObject(finishLineMesh);

        loadModel("finish_line").then(m => {
            if (m) {
                scene.remove(finishLineMesh);
                finishLineMesh = m;
                finishLineMesh.scale.set(0.02, 0.02, 0.02);
                finishLineMesh.rotation.y = Math.PI / 2; // Adjust rotation if needed
                finishLineMesh.position.copy(startLinePos);
                scene.add(finishLineMesh);
                finishLineCollider.setFromObject(finishLineMesh);
                // Initial player position should be right after the start line
                playerPosition.set(0, 0, startLinePos.z - 5);
            } else {
                playerPosition.set(0, 0, startLinePos.z - 5);
            }
        });

        loadModel("checkered_flag").then(m => {
            if (m) {
                m.scale.set(0.01, 0.01, 0.01);
                m.position.copy(flagPos);
                scene.add(m);
            }
        });

        // --- SPEED BOOSTERS ---
        const boosters = [];
        const boosterGeometry = new CylinderGeometry(0.8, 0.8, 0.5, 16);
        const boosterMaterialActive = new MeshStandardMaterial({ color: 0x0000ff, emissive: 0x0000ff, emissiveIntensity: 2.0 });
        const boosterMaterialInactive = new MeshStandardMaterial({ color: 0x0000cc, emissive: 0x0000cc, emissiveIntensity: 0.5 });

        function createBooster(x, z) {
            const boosterMesh = new Mesh(boosterGeometry, boosterMaterialInactive.clone());
            boosterMesh.position.set(x, 0.25, z);
            scene.add(boosterMesh);
            const boosterCollider = new Box3().setFromObject(boosterMesh);
            boosters.push({ mesh: boosterMesh, collider: boosterCollider, activeTimer: 0, originalMaterial: boosterMesh.material });
        }

        // Place at least 3 boosters
        createBooster(-10, 10);
        createBooster(-20, -10);
        createBooster(10, -20);
        createBooster(20, 0); // Added an extra for more fun!

        // --- OBSTACLES ---
        const obstacles = [];
        const obstacleCollisionCooldown = 1.0; // seconds
        let lastObstacleCollisionTime = 0;
        let collisionSlowdownTimer = 0;
        const obstacleSlowdownDuration = 1; // seconds
        const obstacleSlowdownAmount = 10; // units/sec

        function createObstacle(x, z, scale = 1.0) {
            const obstaclePlaceholderGeometry = new SphereGeometry(1 * scale, 16, 16);
            const obstaclePlaceholderMaterial = new MeshStandardMaterial({ color: 0x6b2e2e });
            let mesh = new Mesh(obstaclePlaceholderGeometry, obstaclePlaceholderMaterial);
            mesh.position.set(x, 0.5 * scale, z);
            scene.add(mesh);

            loadModel("rock").then(m => {
                if (m) {
                    scene.remove(mesh);
                    mesh = m;
                    mesh.scale.set(0.01 * scale, 0.01 * scale, 0.01 * scale); // Scale the rock model
                    mesh.position.set(x, 0.5 * scale, z);
                    scene.add(mesh);
                }
                const obstacleCollider = new Box3().setFromObject(mesh);
                obstacles.push({ mesh: mesh, collider: obstacleCollider });
            });
        }

        // Place at least 5 obstacles
        createObstacle(5, 0, 1.5);
        createObstacle(-5, -15, 1.2);
        createObstacle(15, 5, 1.0);
        createObstacle(-15, 15, 1.8);
        createObstacle(0, -25, 1.3);
        createObstacle(25, -5, 1.1);

        // --- CAMERA ---
        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0, 0);

        // --- GAME LOOP ---
        let on = true;
        const setOn = (v) => {
            if (v === on) return;
            on = v;
            if (v) {
                clock.getDelta(); // Reset delta after pause
                animate();
            } else if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        };

        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        window.addEventListener('blur', () => setOn(false));
        window.addEventListener('focus', () => setOn(true));

        // Initial background music
        playMusic("bg_loop_upbeat");

        function animate() {
            if (!on) return;

            animationFrameId = requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.05); // Clamp delta for consistent speed

            if (!gameActive) {
                renderer.render(scene, camera);
                if (performance.now() - lastMessageTime > messageDuration) {
                    messageElement.textContent = ''; // Clear message after duration
                }
                return;
            }

            // --- CAR MOVEMENT ---
            let targetSpeed = carSpeedBase;
            if (currentBoostSpeedModifier > 1) {
                targetSpeed *= currentBoostSpeedModifier;
            }

            // Accelerate/Brake
            if (keys.forward) {
                carCurrentSpeed += carAcceleration * delta;
            } else if (keys.backward) {
                carCurrentSpeed -= carBraking * delta;
            } else {
                // Apply drag if no input
                carCurrentSpeed *= (1 - 0.5 * delta); // Simple drag
            }

            // Apply slowdown from obstacle
            if (collisionSlowdownTimer > 0) {
                carCurrentSpeed = Math.max(carCurrentSpeed - obstacleSlowdownAmount * delta, 0); // Don't go negative
                collisionSlowdownTimer -= delta;
            }

            // Clamp speed
            carCurrentSpeed = MathUtils.clamp(carCurrentSpeed, carReverseSpeed, targetSpeed);

            // Steering
            const steerAngle = carTurnRate * delta;
            if (keys.left) {
                carHeading += steerAngle * (carCurrentSpeed / carMaxSpeed); // Turn rate scales with speed
            }
            if (keys.right) {
                carHeading -= steerAngle * (carCurrentSpeed / carMaxSpeed);
            }

            // Update position
            const moveDistance = carCurrentSpeed * delta;
            playerPosition.x += Math.sin(carHeading) * moveDistance;
            playerPosition.z += Math.cos(carHeading) * moveDistance;

            // Apply player position to car model
            playerCar.position.copy(playerPosition);
            playerCar.rotation.y = carHeading;

            // Update car collider
            playerCar.updateMatrixWorld(); // Ensure world matrix is up-to-date
            playerCarCollider.setFromObject(playerCar);

            // --- CAMERA FOLLOW ---
            const cameraOffset = new Vector3(
                -Math.sin(carHeading) * 8, // Behind the car
                6, // Above the car
                -Math.cos(carHeading) * 8
            );
            camera.position.copy(playerPosition).add(cameraOffset);
            camera.lookAt(playerPosition.x, playerPosition.y + 0.5, playerPosition.z);


            // --- BOOSTERS LOGIC ---
            boosters.forEach(booster => {
                if (playerCarCollider.intersectsBox(booster.collider)) {
                    if (booster.activeTimer <= 0) { // Only activate if not already boosted
                        currentBoostSpeedModifier = 1.5; // 50% speed increase
                        boostTimer = 3; // 3 seconds boost
                        booster.activeTimer = 0.1; // Small value to prevent immediate re-trigger
                        booster.mesh.material = boosterMaterialActive;
                        playSound("coin_pickup"); // Sound for pickup
                        displayMessage("SPEED BOOST!", "lightgreen");
                    }
                }

                if (booster.activeTimer > 0) {
                    booster.activeTimer -= delta;
                    if (booster.activeTimer <= 0) {
                        booster.mesh.material = boosterMaterialInactive;
                    }
                }
            });

            if (boostTimer > 0) {
                boostTimer -= delta;
                if (boostTimer <= 0) {
                    currentBoostSpeedModifier = 1.0; // Reset speed
                    displayMessage("Boost Faded", "orange");
                }
            }


            // --- OBSTACLE COLLISION ---
            const currentTime = clock.getElapsedTime();
            obstacles.forEach(obstacle => {
                if (playerCarCollider.intersectsBox(obstacle.collider)) {
                    if (currentTime - lastObstacleCollisionTime > obstacleCollisionCooldown) {
                        playSound("hit"); // Sound for hit
                        displayMessage("Ouch! Rock Hit!", "red");

                        // Briefly stop and reduce speed
                        carCurrentSpeed = 0;
                        collisionSlowdownTimer = obstacleSlowdownDuration;

                        collisionCount++;
                        lastObstacleCollisionTime = currentTime;

                        if (collisionCount >= maxCollisions) {
                            gameActive = false;
                            displayMessage("GAME OVER! Too many collisions!", "red");
                            playSound("game_over");
                        }
                    }
                }
            });


            // --- LAP COUNTER LOGIC ---
            if (finishLineCollider && playerCarCollider.intersectsBox(finishLineCollider)) {
                // Check if moving in the correct direction (forward over the line, assuming +Z is start dir)
                if (playerPosition.z > finishLineMesh.position.z && lastLapCrossZ < finishLineMesh.position.z) {
                    // Passed forward
                    currentLap++;
                    if (currentLap > totalLaps) {
                        currentLap = totalLaps; // Cap at total laps for display
                        gameActive = false;
                        displayMessage("YOU WIN! All Laps Completed!", "gold");
                        playSound("win");
                    } else {
                        displayMessage(`Lap ${currentLap -1 } Completed!`, "yellow");
                    }
                    updateScoreUI();
                }
                // Reset this to player's current Z after collision check to avoid re-triggering immediately
                // This simple method assumes the car moves clearly past the line.
                // For a more robust check, a flag for "has_crossed_line_this_frame" or checking car's Z position relative to line's Z for entry/exit points would be better.
                // For now, only allow a lap increase if player Z is *greater* than line Z and *was less* than line Z before.
            }
            lastLapCrossZ = playerPosition.z;


            // --- RENDER ---
            renderer.render(scene, camera);

            if (performance.now() - lastMessageTime > messageDuration) {
                messageElement.textContent = ''; // Clear message after duration
            }
        }

        // --- WINDOW RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start the game loop
        updateScoreUI();
        animate();
    </script>
</body>

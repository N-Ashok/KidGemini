    <script type="module">
        import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, CylinderGeometry, PlaneGeometry, MeshStandardMaterial, MeshBasicMaterial, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, MathUtils, Matrix4 } from "three";

        // --- GLOBAL GAME STATE ---
        const game = {
            playerRole: null, // "batsman" or "bowler"
            playerTeamScore: 0,
            playerTeamWickets: 0,
            aiTeamScore: 0,
            aiTeamWickets: 0,
            currentOver: 0,
            currentBall: 0,
            maxOvers: 10,
            ballsPerOver: 6,
            currentPhase: 'role_selection', // role_selection, waiting_for_bowl, ball_in_play, waiting_for_bat, outcome, next_ball
            isPlayerTurnToBowl: false,
            isPlayerTurnToBat: false,

            bowlingData: {
                aimX: 0, // -1 to 1 horizontal aim

            },

        };

        // --- SCENE SETUP ---
        const scene = new Scene();

        const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        scene.background = new Color(0xadd8e6); // Light blue sky
        scene.fog = new Fog(0xadd8e6, 50, 150); // Light fog for depth

        // --- LIGHTING ---
        const ambientLight = new AmbientLight(0xffffff, 0.6);

        directionalLight.position.set(50, 70, 50); // Sunlight from top-right
        directionalLight.target.position.set(0, 0, 0);

        scene.add(directionalLight.target);

        // --- UI ELEMENTS ---
        const uiContainer = document.getElementById('ui-container');

        const batLeftBtn = document.getElementById('bat-left-btn');
        const batRightBtn = document.getElementById('bat-right-btn');
        const roleSelectionScreen = document.getElementById('role-selection');
        const selectBatsmanBtn = document.getElementById('select-batsman-btn');
        const selectBowlerBtn = document.getElementById('select-bowler-btn');

        function updateScoreUI() {
            scoreElement.textContent = `Player Runs: ${game.playerTeamScore} / Wickets: ${game.playerTeamWickets}`;
            aiScoreElement.textContent = `AI Runs: ${game.aiTeamScore} / Wickets: ${game.aiTeamWickets}`;
            currentOverBallElement.textContent = `Over ${game.currentOver}, Ball ${game.currentBall}`;
        }

        function showGameMessage(message, duration = 3000) {
            clearTimeout(game.messageTimer);
            gameMessages.textContent = message;
            gameMessages.style.display = 'block';
            game.messageTimer = setTimeout(() => {
                gameMessages.style.display = 'none';
            }, duration);
        }

        // --- GAME OBJECTS ---
        let playerChar, aiChar;
        let batsmanChar, bowlerChar;
        let batsmanMixer, bowlerMixer;
        let playerBatMesh;
        let ball;
        let wicketsPlayer, wicketsAI; // The actual 3D wicket models
        const fielders = []; // Static fielder models

        // --- GEOMETRIES AND MATERIALS ---
        const grassMaterial = new MeshStandardMaterial({ color: 0x7CFC00 }); // Lawn green
        const pitchMaterial = new MeshStandardMaterial({ color: 0xD2B48C }); // Tan/brown for pitch
        const boundaryMaterial = new MeshStandardMaterial({ color: 0x8B4513 }); // Brown for fence posts
        const ballMaterial = new MeshStandardMaterial({ color: 0xFF0000 }); // Red cricket ball
        const aimLineMaterial = new MeshBasicMaterial({ color: 0xffff00, transparent: true, opacity: 0.5 }); // Yellow aim line
        const ballIndicatorMaterial = new MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3 }); // Cyan for ball target

        // --- WORLD GEOMETRY ---
        function createGround() {
            const groundGeometry = new PlaneGeometry(200, 200);
            groundGeometry.rotateX(-Math.PI / 2);
            const ground = new Mesh(groundGeometry, grassMaterial);
            ground.position.y = -0.05; // Slightly below 0 to avoid Z-fighting with other objects
            scene.add(ground);
        }

        function createPitch() {
            const pitchLength = 20; // Standard pitch length
            const pitchWidth = 3;
            const pitchGeometry = new BoxGeometry(pitchWidth, 0.05, pitchLength);
            const pitch = new Mesh(pitchGeometry, pitchMaterial);
            pitch.position.set(0, 0, 0); // Centered at origin for now
            scene.add(pitch);

            // Stumps markings (simple white lines)
            const lineMaterial = new MeshBasicMaterial({ color: 0xffffff });
            const lineThickness = 0.1;
            const lineLength = pitchWidth;
            const lineGeometry = new BoxGeometry(lineLength, 0.01, lineThickness);

            // Batting crease (player's end)
            const battingCrease = new Mesh(lineGeometry, lineMaterial);
            battingCrease.position.set(0, 0.02, pitchLength / 2 - 2); // 2m from stumps
            scene.add(battingCrease);

            // Bowling crease (AI's end)
            const bowlingCrease = new Mesh(lineGeometry, lineMaterial);
            bowlingCrease.position.set(0, 0.02, -(pitchLength / 2 - 2));
            scene.add(bowlingCrease);
        }

        async function createBoundary() {
            const fenceModelName = "fence";
            const fenceSize = modelSize(fenceModelName);
            const segmentLength = fenceSize ? fenceSize.x : 1; // Default to 1m if size not available
            const radius = 60; // Circular boundary

            const numSegments = Math.ceil(2 * Math.PI * radius / segmentLength);
            const angleIncrement = (2 * Math.PI) / numSegments;

            const instancedFence = await loadModelBatch(fenceModelName, numSegments);
            if (instancedFence) {
                instancedFence.mesh.position.y = 0.5; // Lift off the ground a bit
                scene.add(instancedFence.mesh);

                for (let i = 0; i < numSegments; i++) {
                    const angle = i * angleIncrement;
                    const x = radius * Math.sin(angle);
                    const z = radius * Math.cos(angle);

                    instancedFence.setInstance(i, {
                        position: new Vector3(x, 0, z),
                        rotation: new Vector3(0, -angle, 0), // Rotate to face outward
                        scale: new Vector3(1, 1, 1)
                    });
                }
            } else {
                // Fallback to simple cylinders if model fails to load
                console.warn("Failed to load fence model, using primitive cylinders for boundary.");
                const cylinderGeometry = new CylinderGeometry(0.5, 0.5, 2, 8);
                const boundaryGroup = new Group();
                for (let i = 0; i < numSegments; i++) {
                    const angle = i * angleIncrement;
                    const x = radius * Math.sin(angle);
                    const z = radius * Math.cos(angle);
                    const cylinder = new Mesh(cylinderGeometry, boundaryMaterial);
                    cylinder.position.set(x, 1, z);
                    boundaryGroup.add(cylinder);
                }
                scene.add(boundaryGroup);
            }
        }

        async function createStumps() {
            const wicketModel = await loadModel("wicket");
            if (wicketModel) {
                // Player's end (batsman's end)
                wicketsPlayer = wicketModel.clone();
                wicketsPlayer.position.set(0, 0.4, 10); // End of the pitch
                wicketsPlayer.scale.set(0.7, 0.7, 0.7); // Adjust size
                scene.add(wicketsPlayer);

                // AI's end (bowler's end)
                wicketsAI = wicketModel.clone();
                wicketsAI.position.set(0, 0.4, -10);
                wicketsAI.scale.set(0.7, 0.7, 0.7);
                wicketsAI.rotation.y = Math.PI; // Face the other way
                scene.add(wicketsAI);
            } else {
                // Fallback to primitive cylinders if model fails
                console.warn("Failed to load wicket model, using primitive cylinders.");
                const stumpGeometry = new CylinderGeometry(0.1, 0.1, 1, 8);
                const stumpMaterial = new MeshStandardMaterial({ color: 0x8B4513 });

                const createPrimitiveStumps = (zPos) => {
                    const stumpsGroup = new Group();
                    for (let i = -1; i <= 1; i++) {
                        const stump = new Mesh(stumpGeometry, stumpMaterial);
                        stump.position.set(i * 0.3, 0.5, 0);
                        stumpsGroup.add(stump);
                    }
                    stumpsGroup.position.set(0, 0, zPos);
                    return stumpsGroup;
                };
                wicketsPlayer = createPrimitiveStumps(10);
                wicketsAI = createPrimitiveStumps(-10);
                scene.add(wicketsPlayer);
                scene.add(wicketsAI);

        }

        async function createFielders() {
            const fielderNames = ["cricketer", "man", "woman", "girl", "footballer"]; // Some variety for fielders
            const numFielders = 5;
            const boundaryRadius = 60; // Same as fence radius
            const fielderDistance = boundaryRadius - 5; // A bit inside the boundary

            for (let i = 0; i < numFielders; i++) {
                const angle = (i / numFielders) * Math.PI * 0.7 + Math.PI * 0.15; // Place in a wide arc behind batsman
                const x = fielderDistance * Math.sin(angle);
                const z = fielderDistance * Math.cos(angle);

                const randomFielderName = fielderNames[Math.floor(Math.random() * fielderNames.length)];
                const fielderModel = await loadModel(randomFielderName);
                if (fielderModel) {
                    fielderModel.position.set(x, 0, z);
                    fielderModel.rotation.y = angle + Math.PI; // Face towards the pitch
                    fielderModel.scale.set(0.8, 0.8, 0.8);
                    scene.add(fielderModel);
                    fielders.push({ mesh: fielderModel, bounds: new Box3().setFromObject(fielderModel), catcher: false }); // Add a bounding box
                } else {
                    console.warn(`Failed to load fielder model: ${randomFielderName}`);
                    // Fallback to simple box if model fails
                    const box = new Mesh(new BoxGeometry(0.5, 1.5, 0.5), new MeshStandardMaterial({ color: 0x008000 }));
                    box.position.set(x, 0.75, z);
                    box.rotation.y = angle + Math.PI;
                    scene.add(box);
                    fielders.push({ mesh: box, bounds: new Box3().setFromObject(box), catcher: false });
                }
            }
        }

        function createBall() {
            const ballGeometry = new SphereGeometry(0.2, 16, 16);
            ball = new Mesh(ballGeometry, ballMaterial);
            ball.visible = false;
            scene.add(ball);
            ball.userData.velocity = new Vector3();
            ball.userData.spin = new Vector3(); // For spin ball effect
        }

        async function createMountainBackground() {
            const mountainModels = ["mountain", "mountain_range", "mountain_small"];
            const numMountains = 5;
            const mountainDistance = 100; // Far behind the play area

            for (let i = 0; i < numMountains; i++) {
                const modelName = mountainModels[Math.floor(Math.random() * mountainModels.length)];
                const mountain = await loadModel(modelName);
                if (mountain) {
                    const angle = (i / numMountains) * Math.PI * 0.8 - Math.PI * 0.4; // Arc behind the field
                    const x = mountainDistance * Math.sin(angle);
                    const z = mountainDistance * Math.cos(angle);

                    mountain.position.set(x, Math.random() * 5 - 2, z); // Random height variation
                    mountain.rotation.y = Math.random() * Math.PI * 2;
                    const scale = Math.random() * 10 + 10;
                    mountain.scale.set(scale, scale, scale);
                    scene.add(mountain);
                }
            }
        }

        // --- GAME LOGIC ---
        const clock = new Clock();
        let animationMixers = [];

        function resetBall() {
            ball.visible = false;
            ball.userData.velocity.set(0, 0, 0);
            ball.userData.spin.set(0, 0, 0);
            game.ballInPlay = false;
            game.ballHitGround = false;
            game.ballHitBat = false;
            game.ballHitWickets = false;
            game.ballLandedInCatchZone = false;
        }

        function startNewBall() {
            if (game.gameEnded) return;

            resetBall();
            game.currentBall++;
            if (game.currentBall > game.ballsPerOver) {
                game.currentBall = 1;
                game.currentOver++;
                switchRoles(); // Switch roles every over
            }

            if (game.currentOver > game.maxOvers) {
                endGame();
                return;
            }

            // Reset difficulty for AI after a few overs if it's too high
            if (game.currentOver > 0 && game.currentOver % 3 === 0) {
                 game.difficultyMultiplier = Math.max(1.0, game.difficultyMultiplier - 0.1);
            }
            game.difficultyMultiplier += 0.05; // Gradually increase difficulty

            updateScoreUI();
            setControlsForCurrentRole();
            clearGameMessages();

            if (game.isPlayerTurnToBowl) {
                game.currentPhase = 'waiting_for_bowl';
                showGameMessage("Your turn to Bowl! Aim and select ball type.", 2000);
            } else if (game.isPlayerTurnToBat) {
                game.currentPhase = 'waiting_for_bat';
                showGameMessage("Your turn to Bat! Get ready to SWING!", 2000);
                setTimeout(aiBowl, 2000); // AI bowls after a brief pause
            }
        }

        function switchRoles() {
            game.isPlayerTurnToBowl = !game.isPlayerTurnToBowl;
            game.isPlayerTurnToBat = !game.isPlayerTurnToBat;

            // Update player and AI characters' roles
            if (game.isPlayerTurnToBowl) {
                bowlerChar = playerChar;
                batsmanChar = aiChar;
            } else {
                bowlerChar = aiChar;
                batsmanChar = playerChar;
            }

            showGameMessage(`New Over! Now playing as ${game.isPlayerTurnToBowl ? 'Bowler' : 'Batsman'}`, 3000);
        }

        function setupCameraForRole() {
            if (game.playerRole === null) return;

            if (game.isPlayerTurnToBowl) {
                camera.position.set(0, 3, -15); // Behind bowler
                camera.lookAt(0, 1, 10); // Look at batsman's wickets
            } else if (game.isPlayerTurnToBat) {
                camera.position.set(0, 3, 13); // Behind batsman
                camera.lookAt(0, 1, -10); // Look at bowler's wickets
            }

        // --- BOWLER MECHANICS ---
        let currentAimVisual; // Represents the ball's projected landing spot
        let mouseX = 0, mouseY = 0;
        let isDraggingAim = false;

        function updateAimVisual() {
            if (!currentAimVisual) {
                const indicatorGeometry = new RingGeometry(0.5, 0.7, 32);
                currentAimVisual = new Mesh(indicatorGeometry, aimLineMaterial);
                currentAimVisual.rotation.x = -Math.PI / 2;
                scene.add(currentAimVisual);
            }

            // Map mouseX/Y to a target point on the pitch
            const targetZ = MathUtils.lerp(5, 8, game.bowlingData.aimY); // From just before wickets to halfway up pitch
            const targetX = MathUtils.lerp(-2, 2, (game.bowlingData.aimX + 1) / 2); // Across pitch width
            currentAimVisual.position.set(targetX, 0.05, targetZ);
            currentAimVisual.visible = game.currentPhase === 'waiting_for_bowl';
        }

        function handlePointerDownAim(event) {
            if (game.currentPhase === 'waiting_for_bowl' && game.isPlayerTurnToBowl) {
                isDraggingAim = true;
                renderer.domElement.style.cursor = 'grabbing';
            }
        }

        function handlePointerMoveAim(event) {
            if (isDraggingAim && game.isPlayerTurnToBowl) {
                const deltaX = event.movementX || (event.touches ? event.touches[0].clientX - mouseX : 0);
                const deltaY = event.movementY || (event.touches ? event.touches[0].clientY - mouseY : 0);

                game.bowlingData.aimX = Math.max(-1, Math.min(1, game.bowlingData.aimX + deltaX * 0.005));
                game.bowlingData.aimY = Math.max(0, Math.min(1, game.bowlingData.aimY - deltaY * 0.005));

                mouseX = event.touches ? event.touches[0].clientX : event.clientX;
                mouseY = event.touches ? event.touches[0].clientY : event.clientY;
                updateAimVisual();
            }
        }

        function handlePointerUpAim() {
            isDraggingAim = false;
            renderer.domElement.style.cursor = 'grab';
        }

        async function bowlBall() {
            if (game.currentPhase !== 'waiting_for_bowl' || game.ballInPlay) return;
            playSound("whoosh");

            game.currentPhase = 'ball_in_play';
            ball.visible = true;
            ball.position.set(bowlerChar.position.x, bowlerChar.position.y + 1, bowlerChar.position.z + 1); // Start slightly in front of bowler
            currentAimVisual.visible = false; // Hide aim indicator

            // Bowler animation
            playCharacterAnimation(bowlerChar, bowlerMixer, 'sprint', 0.5); // Short run-up

            // Calculate initial velocity based on aim and ball type
            const speed = game.bowlingData.ballType === 'fast' ? 80 / 3.6 : 60 / 3.6; // km/h to m/s
            const initialAngleY = MathUtils.lerp(-0.1, 0.1, (game.bowlingData.aimX + 1) / 2); // Horizontal direction
            const initialAngleX = MathUtils.lerp(-0.05, 0.05, game.bowlingData.aimY); // Vertical curve

            ball.userData.velocity.set(
                Math.sin(initialAngleY) * speed,
                3, // Initial upward push
                Math.cos(initialAngleY) * speed
            ).multiplyScalar(-1); // Bowl towards positive Z (batsman)

            if (game.bowlingData.ballType === 'spin') {
                ball.userData.spin.set(Math.random() > 0.5 ? 1 : -1, Math.random() * 2 - 1, 0); // Random spin axis
                ball.userData.spin.normalize().multiplyScalar(0.2); // Spin strength
            }

            ball.userData.initialSpeed = speed; // Store for bat interaction
            ball.userData.spinEffect = game.bowlingData.ballType === 'spin' ? 0.01 : 0; // Curve magnitude
        }

        // --- BATSMAN MECHANICS ---
        function aiBowl() {
            if (game.currentPhase !== 'waiting_for_bat' || game.ballInPlay) return;

            game.currentPhase = 'ball_in_play';
            ball.visible = true;
            ball.position.set(bowlerChar.position.x, bowlerChar.position.y + 1, bowlerChar.position.z - 1); // Start slightly in front of bowler
            playSound("whoosh");

            playCharacterAnimation(bowlerChar, bowlerMixer, 'sprint', 0.5); // Short run-up for AI

            // AI aiming - simple: aim towards stumps, sometimes slightly off
            let aiAimX = (Math.random() - 0.5) * 0.5; // Slightly varied
            let aiAimY = 0.5 + (Math.random() - 0.5) * 0.3; // Mid-pitch

            let aiBallType = Math.random() < 0.7 ? 'fast' : 'spin'; // Mostly fast balls

            const speed = aiBallType === 'fast' ? 70 / 3.6 * game.difficultyMultiplier : 55 / 3.6 * game.difficultyMultiplier;
            const initialAngleY = MathUtils.lerp(-0.05, 0.05, (aiAimX + 1) / 2);
            const initialAngleX = MathUtils.lerp(-0.03, 0.03, aiAimY);

            ball.userData.velocity.set(
                Math.sin(initialAngleY) * speed,
                3,
                Math.cos(initialAngleY) * speed
            ).multiplyScalar(-1); // Bowl towards positive Z (batsman)

            if (aiBallType === 'spin') {
                ball.userData.spin.set(Math.random() > 0.5 ? 1 : -1, Math.random() * 2 - 1, 0);
                ball.userData.spin.normalize().multiplyScalar(0.2);
            }
            ball.userData.initialSpeed = speed;
            ball.userData.spinEffect = aiBallType === 'spin' ? 0.01 : 0;
        }

        function swingBat(direction = 0) {
            if (game.currentPhase !== 'ball_in_play' || !game.isPlayerTurnToBat) return;

            game.batsmanInput.swingTime = performance.now();
            game.batsmanInput.swingDirection = direction;
            playSound("hit");

            // Play batsman swing animation
            let swingClipName = 'interact-right'; // Default swing
            if (direction === -1) swingClipName = 'attack-kick-left'; // Using kick as a swing for left
            if (direction === 1) swingClipName = 'attack-kick-right'; // Using kick as a swing for right

            playCharacterAnimation(batsmanChar, batsmanMixer, swingClipName, 0.3); // Short swing anim
        }

        function aiBat() {
            if (game.currentPhase !== 'ball_in_play' || !game.isPlayerTurnToBowl || ball.position.z < -5) return; // Only AI bats when player bowls, and ball is close

            // Simple AI: Decide to swing if ball is near the wickets (z > 8)
            const ballToWicketsDist = 10 - ball.position.z; // Distance to player wickets
            const ballSpeedZ = Math.abs(ball.userData.velocity.z);

            if (ballSpeedZ > 0.1 && ballToWicketsDist > 0 && ballToWicketsDist < 3) { // Ball is in batting range
                // Calculate ideal swing time based on ball's speed and position
                const timeToImpact = ballToWicketsDist / ballSpeedZ;
                const idealSwingTime = performance.now() + timeToImpact * 1000; // In ms

                // AI aims for a good timing within a window
                const swingWindow = 50 + Math.random() * 50; // Randomize AI's perfect timing slightly
                if (performance.now() >= idealSwingTime - swingWindow / 2 && performance.now() <= idealSwingTime + swingWindow / 2) {
                    // AI swings!
                    const aiSwingDirection = (Math.random() > 0.5 ? 1 : -1) * (Math.random() > 0.7 ? 1 : 0); // Sometimes straight, sometimes side
                    game.batsmanInput.swingTime = performance.now(); // Simulate a swing
                    game.batsmanInput.swingDirection = aiSwingDirection;
                    playSound("hit");
                    let swingClipName = 'interact-right';
                    if (aiSwingDirection === -1) swingClipName = 'attack-kick-left';
                    if (aiSwingDirection === 1) swingClipName = 'attack-kick-right';
                    playCharacterAnimation(batsmanChar, batsmanMixer, swingClipName, 0.3);
                }
            }
        }


        // --- ANIMATION ---
        function playCharacterAnimation(character, mixer, clipName, duration = 1.0) {
            if (!mixer || !character.animations) return;

            const clip = character.animations.find(a => a.name.toLowerCase().includes(clipName.toLowerCase()));
            if (clip) {
                mixer.stopAllAction();
                const action = mixer.clipAction(clip);
                action.setDuration(duration).play();
                action.setLoop(0, 1); // Play once
                // Reset to idle after animation
                setTimeout(() => {
                    playCharacterAnimation(character, mixer, 'idle');
                }, duration * 1000);
            } else {
                console.warn(`Animation clip "${clipName}" not found for character.`);
                const idleClip = character.animations.find(a => a.name.toLowerCase().includes('idle'));
                if (idleClip) {
                    mixer.stopAllAction();
                    mixer.clipAction(idleClip).play();
                }
            }
        }

        // --- COLLISION DETECTION & PHYSICS ---
        const ballBounds = new Box3();
        const batBounds = new Box3();
        const wicketsPlayerBounds = new Box3();
        const wicketsAIBounds = new Box3();

        function checkCollisions(delta) {
            if (!game.ballInPlay || !ball.visible) return;

            ballBounds.setFromObject(ball);

            // Ball-Ground collision
            if (ball.position.y < 0.2 && ball.userData.velocity.y < 0) { // If ball is below ground and moving down
                ball.position.y = 0.2; // Keep it above ground
                ball.userData.velocity.y *= -0.6; // Bounce with energy loss
                ball.userData.velocity.x *= 0.9; // Friction
                ball.userData.velocity.z *= 0.9;
                if (ball.userData.velocity.length() < 0.5) { // Stop if too slow
                    ball.userData.velocity.set(0, 0, 0);
                }
                game.ballHitGround = true;
            }

            // Ball-Stumps collision (player's wickets)
            if (game.isPlayerTurnToBat && wicketsPlayer && wicketsPlayerBounds.setFromObject(wicketsPlayer).intersectsBox(ballBounds)) {
                if (!game.ballHitBat) {
                    game.ballHitWickets = true;
                    processOutcome(); // Wicket!
                    return;
                }
            }
            // Ball-Stumps collision (AI's wickets)
            if (game.isPlayerTurnToBowl && wicketsAI && wicketsAIBounds.setFromObject(wicketsAI).intersectsBox(ballBounds)) {
                if (!game.ballHitBat) {
                    game.ballHitWickets = true;
                    processOutcome(); // Wicket!
                    return;
                }
            }

            // Ball-Bat collision (Player's turn to bat)
            if (game.isPlayerTurnToBat && batsmanChar && playerBatMesh && !game.ballHitBat) {
                batBounds.setFromObject(playerBatMesh);
                if (batBounds.intersectsBox(ballBounds)) {
                    const currentTime = performance.now();
                    const swingReactionTime = currentTime - game.batsmanInput.swingTime; // How long since swing input
                    const idealReactionTime = 100; // Milliseconds for optimal timing
                    const timingWindow = 150; // Total window for a "hit"

                    if (Math.abs(swingReactionTime) < timingWindow) { // Hit within the window
                        game.ballHitBat = true;
                        playSound("coin_pickup"); // Sound for successful hit

                        // Calculate hit force based on timing
                        const timingFactor = 1 - (Math.abs(swingReactionTime) / timingWindow); // 1 for perfect, 0 for edge
                        let hitForce = 15 + timingFactor * 15; // More force for better timing

                        // Direction of hit based on swing input and ball velocity
                        const ballVelMagnitude = ball.userData.initialSpeed || 20; // Use initial speed as base
                        const hitDirection = new Vector3();
                        if (game.batsmanInput.swingDirection === -1) { // Left swing
                            hitDirection.set(-1, 0.5, -1);
                        } else if (game.batsmanInput.swingDirection === 1) { // Right swing
                            hitDirection.set(1, 0.5, -1);
                        } else { // Straight swing (defend or straight hit)
                            hitDirection.set(0, 0.2, -1); // Upward and forward
                        }
                        hitDirection.normalize();

                        // Apply new velocity to ball
                        ball.userData.velocity.copy(hitDirection).multiplyScalar(hitForce);

                        if (timingFactor > 0.5) { // Good timing = strong hit
                            ball.userData.velocity.y += 5; // Lift the ball
                            showGameMessage("SIX! Well hit!", 1000); // Exaggerated message
                        } else { // Defend/weak hit
                            ball.userData.velocity.y += 2;
                            showGameMessage("Defended!", 1000);
                        }
                    } else {
                        // Swing missed or mistimed significantly
                        showGameMessage("Too early/late!", 1000);
                    }
                    game.batsmanInput.swingTime = 0; // Reset swing input
                }
            }

            // Ball-Bat collision (AI's turn to bat)
            if (game.isPlayerTurnToBowl && batsmanChar && batsmanChar.userData.batMesh && !game.ballHitBat) {
                batBounds.setFromObject(batsmanChar.userData.batMesh);
                if (batBounds.intersectsBox(ballBounds)) {
                    const currentTime = performance.now();
                    const swingReactionTime = currentTime - game.batsmanInput.swingTime;
                    const idealReactionTime = 100; // AI tries to be perfect
                    const timingWindow = 200; // AI's timing window

                    if (Math.abs(swingReactionTime) < timingWindow) {
                        game.ballHitBat = true;
                        playSound("coin_pickup");

                        const timingFactor = 1 - (Math.abs(swingReactionTime) / timingWindow);
                        let hitForce = 10 + timingFactor * 10 * game.difficultyMultiplier; // AI gets stronger with difficulty

                        const hitDirection = new Vector3();
                        const aiSwingDirection = game.batsmanInput.swingDirection;
                        if (aiSwingDirection === -1) { hitDirection.set(-1, 0.5, 1); }
                        else if (aiSwingDirection === 1) { hitDirection.set(1, 0.5, 1); }
                        else { hitDirection.set(0, 0.2, 1); } // Upward and forward

                        hitDirection.normalize();
                        ball.userData.velocity.copy(hitDirection).multiplyScalar(hitForce);
                        ball.userData.velocity.y += 5; // AI lifts the ball

                        showGameMessage("AI Hits!", 1000);
                    }
                    game.batsmanInput.swingTime = 0;
                }
            }


            // Ball-Boundary check
            const distanceToCenter = ball.position.distanceTo(new Vector3(0, 0, 0));
            const boundaryRadius = 60; // Same as fence radius
            if (distanceToCenter >= boundaryRadius && ball.position.y > 0.5) { // Must be in the air past boundary
                if (game.ballHitBat) {
                    processOutcome("boundary_four");
                    return;
                }
            }

            // Ball-Fielder Catch check
            if (ball.position.y > 1 && game.ballHitBat) { // Only check for catches if ball is in the air after being hit
                for (const fielder of fielders) {
                    const fielderBounds = fielder.bounds.clone();
                    fielderBounds.expandByScalar(0.5); // Give fielders a bigger catch zone

                    if (fielderBounds.intersectsBox(ballBounds) && !game.ballLandedInCatchZone) {
                        // Simulate a catch chance
                        if (Math.random() < 0.7 - game.difficultyMultiplier * 0.1) { // Player's fielders catch less often at higher difficulty
                            game.ballLandedInCatchZone = true;
                            processOutcome("caught");
                            return;
                        }
                    }
                }
            }
        }

        function processOutcome(specificOutcome = null) {
            if (game.currentPhase === 'outcome') return; // Prevent multiple outcomes

            game.currentPhase = 'outcome';
            let message = "";
            let scored = 0;
            let wicket = false;

            if (specificOutcome === "boundary_four") {
                message = "FOUR! Amazing shot!";
                scored = 4;
            } else if (specificOutcome === "caught") {
                message = "OUT! Caught!";
                wicket = true;
            } else if (game.ballHitWickets) {
                message = "OUT! Bowled!";
                wicket = true;
            } else if (game.ballHitBat) {
                // If ball hit bat but no boundary/catch/wicket, assume 1 run
                message = "Single run!";
                scored = 1;
            } else {
                message = "Missed!";
            }

            if (game.isPlayerTurnToBat) {
                game.playerTeamScore += scored;
                if (wicket) {
                    game.playerTeamWickets++;
                    playSound("game_over"); // Sound for wicket
                } else if (scored > 0) {
                    playSound("pop"); // Sound for score
                }
            } else if (game.isPlayerTurnToBowl) {
                game.aiTeamScore += scored;
                if (wicket) {
                    game.aiTeamWickets++;
                    playSound("pop"); // Sound for wicket for AI
                } else if (scored > 0) {
                    playSound("pop");
                }
            }

            showGameMessage(message, 2500);

            // Stop ball movement and prepare for next ball
            ball.userData.velocity.set(0, 0, 0);
            ball.userData.spin.set(0, 0, 0);

            // Wait for message to clear, then start next ball
            setTimeout(startNewBall, 3000);
        }

        function endGame() {
            game.gameEnded = true;
            let finalMessage = "";
            if (game.playerTeamScore > game.aiTeamScore) {
                finalMessage = `GAME OVER!\nPlayer Wins!\nPlayer: ${game.playerTeamScore}/${game.playerTeamWickets}\nAI: ${game.aiTeamScore}/${game.aiTeamWickets}`;
                playSound("jingle_win"); // Assuming a win jingle is available
            } else if (game.playerTeamScore < game.aiTeamScore) {
                finalMessage = `GAME OVER!\nAI Wins!\nPlayer: ${game.playerTeamScore}/${game.playerTeamWickets}\nAI: ${game.aiTeamScore}/${game.aiTeamWickets}`;
                playSound("game_over");
            } else {
                finalMessage = `GAME OVER!\nIt's a TIE!\nPlayer: ${game.playerTeamScore}/${game.playerTeamWickets}\nAI: ${game.aiTeamScore}/${game.aiTeamWickets}`;
            }
            showGameMessage(finalMessage, 10000); // Show for longer
            // Disable all controls
            bowlerControlsDiv.style.display = 'none';
            batsmanControlsDiv.style.display = 'none';
        }

        // --- GAME LOOP ---
        let lastTimestamp = 0;
        const maxFps = 60;
        const frameInterval = 1000 / maxFps;
        let on = true; // For pausing when tab is not active

        const setOn = (v) => {
            if (v === on) return;
            on = v;
            if (v) {
                clock.getDelta(); // Reset clock delta on resume
                lastTimestamp = performance.now(); // Reset lastTimestamp
                requestAnimationFrame(animate);
            }
        };
        document.addEventListener('visibilitychange', () => setOn(!document.hidden));
        addEventListener('blur', () => setOn(false));
        addEventListener('focus', () => setOn(true));

        function animate(timestamp) {
            if (!on) return;
            requestAnimationFrame(animate);

            const delta = clock.getDelta(); // Time since last frame in seconds

            // Cap FPS
            if (timestamp - lastTimestamp < frameInterval) {
                return;
            }
            lastTimestamp = timestamp;


            // Update mixers for character animations
            animationMixers.forEach(mixer => mixer.update(delta));

            // Ball physics update
            if (game.ballInPlay) {
                ball.userData.velocity.y -= 9.8 * delta; // Gravity
                ball.position.add(ball.userData.velocity.clone().multiplyScalar(delta));

                // Apply spin (simple rotation)
                ball.rotation.x += ball.userData.spin.x * ball.userData.velocity.length() * delta;
                ball.rotation.y += ball.userData.spin.y * ball.userData.velocity.length() * delta;
                ball.rotation.z += ball.userData.spin.z * ball.userData.velocity.length() * delta;

                // Simple spin curve (adjust horizontal velocity slightly)
                if (ball.userData.spinEffect > 0) {
                    ball.userData.velocity.x += ball.userData.spin.x * ball.userData.spinEffect;
                    ball.userData.velocity.z += ball.userData.spin.z * ball.userData.spinEffect;
                }

                // If ball goes too far or too high/low without hitting anything, reset
                if (ball.position.y < -5 || ball.position.y > 50 || Math.abs(ball.position.x) > 100 || ball.position.z > 100 || ball.position.z < -100) {
                    if (game.currentPhase === 'ball_in_play') {
                        processOutcome("ball_out_of_play"); // Treat as a dot ball or wide
                    }
                }
            }

            // AI batsman decision for batting
            if (!game.isPlayerTurnToBat && game.currentPhase === 'ball_in_play') {
                aiBat();
            }

            checkCollisions(delta);

            renderer.render(scene, camera);
        }

        // --- EVENT LISTENERS ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Bowler Controls
        fastBallBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); game.bowlingData.ballType = 'fast'; showGameMessage("Fast Ball selected!", 500); });
        spinBallBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); game.bowlingData.ballType = 'spin'; showGameMessage("Spin Ball selected!", 500); });
        bowlBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); bowlBall(); });

        // Batsman Controls
        swingBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); swingBat(game.batsmanInput.swingDirection); });
        batLeftBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); game.batsmanInput.swingDirection = -1; showGameMessage("Aiming Left!", 500); });
        batRightBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); game.batsmanInput.swingDirection = 1; showGameMessage("Aiming Right!", 500); });

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (game.gameEnded) return;
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                if (game.isPlayerTurnToBowl && game.currentPhase === 'waiting_for_bowl') bowlBall();
                if (game.isPlayerTurnToBat && game.currentPhase === 'ball_in_play') swingBat(game.batsmanInput.swingDirection);
            }
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') {
                e.preventDefault();
                if (game.isPlayerTurnToBat) {
                    game.batsmanInput.swingDirection = -1;
                    showGameMessage("Aiming Left!", 500);
                }
                if (game.isPlayerTurnToBowl) {
                    game.bowlingData.aimX = Math.max(-1, game.bowlingData.aimX - 0.1);
                    updateAimVisual();
                }
            }
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
                e.preventDefault();
                if (game.isPlayerTurnToBat) {
                    game.batsmanInput.swingDirection = 1;
                    showGameMessage("Aiming Right!", 500);
                }
                if (game.isPlayerTurnToBowl) {
                    game.bowlingData.aimX = Math.min(1, game.bowlingData.aimX + 0.1);
                    updateAimVisual();
                }
            }
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
                e.preventDefault();
                if (game.isPlayerTurnToBowl) {
                    game.bowlingData.aimY = Math.min(1, game.bowlingData.aimY + 0.1);
                    updateAimVisual();
                }
            }
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {
                e.preventDefault();
                if (game.isPlayerTurnToBowl) {
                    game.bowlingData.aimY = Math.max(0, game.bowlingData.aimY - 0.1);
                    updateAimVisual();
                }
            }
            if (e.key.toLowerCase() === 'f') { // Fast Ball shortcut
                e.preventDefault();
                if (game.isPlayerTurnToBowl) {
                    game.bowlingData.ballType = 'fast';
                    showGameMessage("Fast Ball selected!", 500);
                }
            }
            if (e.key.toLowerCase() === 'r') { // Spin Ball shortcut (R for Revolutions!)
                e.preventDefault();
                if (game.isPlayerTurnToBowl) {
                    game.bowlingData.ballType = 'spin';
                    showGameMessage("Spin Ball selected!", 500);
                }
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key.toLowerCase() === 'a' || e.key.toLowerCase() === 'd') {
                if (game.isPlayerTurnToBat) game.batsmanInput.swingDirection = 0; // Reset swing direction for display purposes
            }
        });

        // Mouse/Touch Aiming for Bowler
        renderer.domElement.addEventListener('pointerdown', handlePointerDownAim);
        renderer.domElement.addEventListener('pointermove', handlePointerMoveAim);
        renderer.domElement.addEventListener('pointerup', handlePointerUpAim);
        renderer.domElement.addEventListener('pointerleave', handlePointerUpAim); // End drag if pointer leaves canvas

        // --- CHARACTER LOADING ---
        async function setupCharacters() {
            const playerCharModel = await loadModel("cricketer");
            const aiCharModel = await loadModel("cricketer");
            const batModel = await loadModel("bat");

            if (playerCharModel && aiCharModel && batModel) {
                // Player character setup
                playerChar = playerCharModel;
                playerChar.scale.set(0.8, 0.8, 0.8);
                playerChar.position.y = 0; // Ground level
                scene.add(playerChar);
                batsmanMixer = new AnimationMixer(playerChar);
                animationMixers.push(batsmanMixer);
                playCharacterAnimation(playerChar, batsmanMixer, 'idle');

                // AI character setup
                aiChar = aiCharModel;
                aiChar.scale.set(0.8, 0.8, 0.8);
                aiChar.position.y = 0; // Ground level
                scene.add(aiChar);
                bowlerMixer = new AnimationMixer(aiChar);
                animationMixers.push(bowlerMixer);
                playCharacterAnimation(aiChar, bowlerMixer, 'idle');

                // Bat setup (attached to playerChar for now, will move to active batsman)
                playerBatMesh = batModel;
                playerBatMesh.scale.set(0.5, 0.5, 0.5); // Adjust bat size
                // Position relative to character's hand - need to find hand bone or approximate
                const rightArm = playerChar.getObjectByName("arm-right"); // Or similar bone name
                if (rightArm) {
                    rightArm.add(playerBatMesh);
                    playerBatMesh.position.set(0.1, -0.4, 0.0); // Adjust as needed
                    playerBatMesh.rotation.set(Math.PI / 2, 0, Math.PI / 2); // Rotate to hold
                } else {
                    // Fallback if no specific arm bone
                    playerChar.add(playerBatMesh);
                    playerBatMesh.position.set(0.5, 1, 0); // Approx position next to character
                    playerBatMesh.rotation.set(0, Math.PI / 2, 0);
                }
                playerChar.userData.batMesh = playerBatMesh; // Store reference to bat

                // Store AI's bat
                const aiBatMesh = batModel.clone();
                aiBatMesh.scale.set(0.5, 0.5, 0.5);
                const aiRightArm = aiChar.getObjectByName("arm-right");
                if (aiRightArm) {
                    aiRightArm.add(aiBatMesh);
                    aiBatMesh.position.set(0.1, -0.4, 0.0);
                    aiBatMesh.rotation.set(Math.PI / 2, 0, Math.PI / 2);
                } else {
                    aiChar.add(aiBatMesh);
                    aiBatMesh.position.set(0.5, 1, 0);
                    aiBatMesh.rotation.set(0, Math.PI / 2, 0);
                }
                aiChar.userData.batMesh = aiBatMesh;


                // Initialize player and AI positions
                playerChar.position.set(0, 0, 10); // Player at batsman's end
                playerChar.rotation.y = Math.PI; // Face the bowler

                aiChar.position.set(0, 0, -10); // AI at bowler's end
                aiChar.rotation.y = 0; // Face the batsman

            } else {
                console.error("Failed to load character or bat models. Using placeholders.");
                // Fallback to simple box characters
                playerChar = new Mesh(new BoxGeometry(0.8, 1.8, 0.8), new MeshStandardMaterial({ color: 0x0000ff }));
                playerChar.position.set(0, 0.9, 10);
                scene.add(playerChar);

                aiChar = new Mesh(new BoxGeometry(0.8, 1.8, 0.8), new MeshStandardMaterial({ color: 0xff0000 }));
                aiChar.position.set(0, 0.9, -10);
                scene.add(aiChar);

                playerBatMesh = new Mesh(new BoxGeometry(0.1, 0.1, 1.0), new MeshStandardMaterial({ color: 0x8B4513 }));
                playerChar.add(playerBatMesh);
                playerBatMesh.position.set(0.5, 0.5, 0);
                playerChar.userData.batMesh = playerBatMesh;
            }
        }

        function setControlsForCurrentRole() {
            bowlerControlsDiv.style.display = 'none';
            batsmanControlsDiv.style.display = 'none';

            if (game.currentPhase === 'role_selection') {
                roleSelectionScreen.style.display = 'flex';
                uiContainer.style.pointerEvents = 'auto';
                gameMessages.style.display = 'none';
            } else {
                roleSelectionScreen.style.display = 'none';
                uiContainer.style.pointerEvents = 'none'; // Default to no pointer events
                clearGameMessages(); // Clear messages initially

                if (game.isPlayerTurnToBowl) {
                    bowlerControlsDiv.style.display = 'flex';
                    uiContainer.style.pointerEvents = 'auto'; // Re-enable for buttons
                } else if (game.isPlayerTurnToBat) {
                    batsmanControlsDiv.style.display = 'flex';
                    uiContainer.style.pointerEvents = 'auto'; // Re-enable for buttons
                }
            }
        }

        function clearGameMessages() {
            gameMessages.style.display = 'none';
            clearTimeout(game.messageTimer);
        }

        // --- INITIALIZATION ---
        async function initGame() {
            createGround();
            createPitch();
            createBall();
            await createStumps();
            await createBoundary();
            await createFielders();
            await createMountainBackground();
            await setupCharacters(); // Characters loaded last, so they are ready for role setup

            updateScoreUI();
            setControlsForCurrentRole(); // Show role selection

            // Initialize mouse coordinates for aiming
            renderer.domElement.addEventListener('mousemove', (event) => {
                mouseX = event.clientX;
                mouseY = event.clientY;
            });
            renderer.domElement.addEventListener('touchmove', (event) => {
                if (event.touches.length > 0) {
                    mouseX = event.touches[0].clientX;
                    mouseY = event.touches[0].clientY;
                }
            });

            // Start animation loop
            animate();
        }

        // Role selection
        selectBatsmanBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            game.playerRole = "batsman";
            game.isPlayerTurnToBat = true;
            game.isPlayerTurnToBowl = false;
            batsmanChar = playerChar;
            bowlerChar = aiChar;
            game.currentPhase = 'waiting_for_bat';
            playMusic("bg_loop_playful"); // Start background music
            startNewBall();
            setControlsForCurrentRole();
            setupCameraForRole();
            renderer.domElement.style.cursor = 'default';
        });

        selectBowlerBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            game.playerRole = "bowler";
            game.isPlayerTurnToBowl = true;
            game.isPlayerTurnToBat = false;
            batsmanChar = aiChar;
            bowlerChar = playerChar;
            game.currentPhase = 'waiting_for_bowl';
            playMusic("bg_loop_playful"); // Start background music
            startNewBall();
            setControlsForCurrentRole();
            setupCameraForRole();
            renderer.domElement.style.cursor = 'grab'; // Show grab cursor for aiming
        });

        initGame();

    </script>
</body>
</html>

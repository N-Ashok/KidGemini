        return box;
      },
    };
  } catch (e) {
    console.warn("[ariantra] loadModelBatch failed:", name, e);
    return null;
  }
};
</script><script>
(function () {
  var ctx = null, buffers = {}, currentMusic = null;
  function context() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      var resume = function () { if (ctx.state === "suspended") ctx.resume(); };
      addEventListener("pointerdown", resume, true);
      addEventListener("keydown", resume, true);
    }
    return ctx;
  }
  function load(name) {
    var url = (window.AR_ASSETS || {})[name];
    if (!url) { console.warn("[ariantra] unknown sound:", name); return Promise.resolve(null); }
    if (!buffers[name]) {
      buffers[name] = fetch(url)
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) {
          return new Promise(function (res, rej) { context().decodeAudioData(ab, res, rej); });
        })
        .catch(function (e) { console.warn("[ariantra] sound failed:", name, e); return null; });
    }
    return buffers[name];
  }
  function trimBounds(buf) {
    var d = buf.getChannelData(0), t = 0.001, s = 0, e = d.length - 1;
    while (s < e && Math.abs(d[s]) < t) s++;
    while (e > s && Math.abs(d[e]) < t) e--;
    return { start: s / buf.sampleRate, end: (e + 1) / buf.sampleRate };
  }
  window.playSound = function (name) {
    try {
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        src.connect(context().destination);
        src.start();
      });
    } catch (e) { /* a silent effect, never a broken game */ }
  };
  window.playMusic = function (name) {
    var handle = { stop: function () {} };
    try {
      if (currentMusic) { try { currentMusic.stop(); } catch (e2) {} currentMusic = null; }
      load(name).then(function (buf) {
        if (!buf) return;
        var src = context().createBufferSource();
        src.buffer = buf;
        var b = trimBounds(buf);
        src.loop = true;
        src.loopStart = b.start;
        src.loopEnd = b.end;
        var gain = context().createGain();
        gain.gain.value = 0.5;
        src.connect(gain);
        gain.connect(context().destination);
        src.start(0, b.start);
        currentMusic = src;
        handle.stop = function () { try { src.stop(); } catch (e3) {} if (currentMusic === src) currentMusic = null; };
      });
    } catch (e) { /* silent */ }
    return handle;
  };
})();
</script>

<body>
    
    
    

    <!-- SCENE CANVAS -->
    <canvas id="scene"></canvas>

    <!-- UI ELEMENTS -->
    <div class="ui-overlay" id="score-container">
        <div id="score">Runs: 0</div>
    </div>
    <div class="ui-overlay" id="instructions-container">
        <div id="instructions"></div>
    </div>
    
    <!-- START MENU -->
    <div class="ui-overlay" id="start-menu">
        <h1>3D Cricket Fun!</h1>
        <p>Choose your role:</p>
        <div>
            <button class="choice-button" id="play-batsman">Play as Batsman</button>
            <button class="choice-button" id="play-bowler">Play as Bowler</button>
        </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div class="ui-overlay" id="game-over-screen">
        <h2 id="game-over-title">Game Over!</h2>
        <p id="game-over-message">You scored X runs!</p>
        <button class="choice-button" onclick="window.location.reload()">Play Again</button>
    </div>

    <!-- ON-SCREEN CONTROLS -->
    <div id="controls">
        <button class="control-button" id="action-button">Ready!</button>
    </div>

<script type="module">
// --- THREE.JS SETUP ---
import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, SphereGeometry, CylinderGeometry, PlaneGeometry, DoubleSide, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, MathUtils } from "three";

const scene = new Scene();
const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const clock = new Clock();
let on = true; // For pausing when tab is not visible

// --- GAME STATE ---
let playerRole = null; // 'batsman' or 'bowler'
let gameState = 'MENU'; // MENU, READY, PLAYING, BOWLED, HIT, GAMEOVER
let score = 0;
let wicketsLeft = 3;
let ballsLeft = 6;
let bowlerRunUp = 0; // 0 to 1
let ball = null;
let bat = null;
let batsman, bowler;
let batsmanMixer, bowlerMixer;
const ballStartPos = new Vector3(0, 0.5, 12);
const ballVelocity = new Vector3();
const gravity = new Vector3(0, -9.8, 0);
const pitchLength = 20;

// --- UI ELEMENTS ---
const scoreElement = document.getElementById('score');
const instructionsElement = document.getElementById('instructions');
const startMenu = document.getElementById('start-menu');
const actionButton = document.getElementById('action-button');
const gameOverScreen = document.getElementById('game-over-screen');
const gameOverTitle = document.getElementById('game-over-title');
const gameOverMessage = document.getElementById('game-over-message');

// --- SCENE & WORLD BUILDING ---
scene.background = new Color(0x87CEEB); // Sky blue
scene.fog = new Fog(0x87CEEB, 50, 150);

const ambientLight = new AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

const dirLight = new DirectionalLight(0xffffff, 1.2);
dirLight.position.set(20, 30, 20);
scene.add(dirLight);

// Cricket Pitch
const pitchMaterial = new MeshStandardMaterial({ color: 0x5a8b4b });
const pitchGeometry = new PlaneGeometry(40, 200);
const pitch = new Mesh(pitchGeometry, pitchMaterial);
pitch.rotation.x = -Math.PI / 2;
pitch.position.y = -0.01;
scene.add(pitch);

const pitchStripeMaterial = new MeshStandardMaterial({ color: 0xb5a68d });
const pitchStripeGeometry = new PlaneGeometry(4, pitchLength + 4);
const pitchStripe = new Mesh(pitchStripeGeometry, pitchStripeMaterial);
pitchStripe.rotation.x = -Math.PI / 2;
scene.add(pitchStripe);


// --- WICKETS SETUP ---
function createWicket() {
    const wicketGroup = new Group();
    const stumpMaterial = new MeshStandardMaterial({ color: 0xdeb887 });
    const stumpGeo = new CylinderGeometry(0.05, 0.05, 0.7, 8);
    
    const stump1 = new Mesh(stumpGeo, stumpMaterial);
    stump1.position.set(-0.11, 0.35, 0);
    const stump2 = new Mesh(stumpGeo, stumpMaterial);
    stump2.position.set(0, 0.35, 0);
    const stump3 = new Mesh(stumpGeo, stumpMaterial);
    stump3.position.set(0.11, 0.35, 0);
    
    const bailGeo = new CylinderGeometry(0.03, 0.03, 0.11, 6);
    const bailMaterial = new MeshStandardMaterial({ color: 0xcaab78 });
    const bail1 = new Mesh(bailGeo, bailMaterial);
    bail1.rotation.z = Math.PI / 2;
    bail1.position.set(-0.055, 0.73, 0);
    const bail2 = new Mesh(bailGeo, bailMaterial);
    bail2.rotation.z = Math.PI / 2;
    bail2.position.set(0.055, 0.73, 0);
    
    wicketGroup.add(stump1, stump2, stump3, bail1, bail2);
    return wicketGroup;
}
const batsmanWicket = createWicket();
batsmanWicket.position.z = -pitchLength / 2;
scene.add(batsmanWicket);

const bowlerWicket = createWicket();
bowlerWicket.position.z = pitchLength / 2;
scene.add(bowlerWicket);


// --- BALL SETUP ---
const ballMaterial = new MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3, metalness: 0.2 });
const ballGeometry = new SphereGeometry(0.07, 16, 16);
ball = new Mesh(ballGeometry, ballMaterial);


// --- MODEL LOADING ---
async function loadGameModels() {
    // Player models
    const [batsmanModel, bowlerModel] = await Promise.all([
        loadModel("cricketer"),
        loadModel("cricketer")
    ]);
    
    if (batsmanModel) {
        batsman = batsmanModel;
        batsman.position.z = -pitchLength / 2 - 0.5;
        batsman.rotation.y = Math.PI; // Face the bowler
        batsman.scale.set(0.7, 0.7, 0.7);
        scene.add(batsman);
        batsmanMixer = new AnimationMixer(batsman);
        
        // Add a bat
        const batGeom = new BoxGeometry(0.1, 0.8, 0.04);
        const batMat = new MeshStandardMaterial({ color: 0x8B4513 });
        bat = new Mesh(batGeom, batMat);
        bat.position.set(0.3, 0.8, 0.3);
        bat.rotation.y = -0.5;
        bat.rotation.z = 0.2;
        const rightHand = batsman.getObjectByName("arm-right") || batsman;
        rightHand.add(bat);
    }
    
    if (bowlerModel) {
        bowler = bowlerModel;
        bowler.position.z = pitchLength / 2 + 2;
        bowler.scale.set(0.7, 0.7, 0.7);
        scene.add(bowler);
        bowlerMixer = new AnimationMixer(bowler);
    }
    
    // Stadium
    loadModelBatch("grandstand", 4).then(batch => {
        if (!batch) return;
        scene.add(batch.mesh);
        const size = modelSize("grandstand");
        if (!size) return;
        
        batch.setInstance(0, { position: { x: -size.x/2 - 20, y: 0, z: 0 }, rotation: { y: Math.PI / 2 } });
        batch.setInstance(1, { position: { x: size.x/2 + 20, y: 0, z: 0 }, rotation: { y: -Math.PI / 2 } });
        batch.setInstance(2, { position: { x: 0, y: 0, z: 60 }, rotation: { y: Math.PI } });
        batch.setInstance(3, { position: { x: 0, y: 0, z: -60 } });
    });
}

// --- PLAYER ANIMATIONS ---
function playAnimation(mixer, model, animationName, loop = true) {
    if (!mixer || !model) return;
    const clip = model.animations.find(a => a.name.toLowerCase().includes(animationName.toLowerCase()));
    if (clip) {
        mixer.stopAllAction();
        const action = mixer.clipAction(clip);
        action.loop = loop ? 2200 : 2201; // THREE.LoopRepeat : THREE.LoopOnce
        action.reset().play();
    }
}


// --- GAME LOGIC ---
function startGame(role) {
    playSound("click");
    playerRole = role;
    gameState = 'READY';
    startMenu.style.display = 'none';
    scoreElement.style.display = 'block';
    instructionsElement.style.display = 'block';
    
    if (role === 'batsman') {
        instructions.innerText = "Get ready! Tap 'Swing' when the ball gets close!";
        actionButton.innerText = "Swing";
    } else { // bowler
        instructions.innerText = "Hold 'Bowl' to run up, release to bowl!";
        actionButton.innerText = "Bowl";
        scoreElement.textContent = `Wickets: 0 / ${wicketsLeft}`;
    }
    
    // Start music after user interaction
    playMusic("bg_loop_playful");
    
    resetRound();
}

function resetRound() {
    if (playerRole === 'bowler' && wicketsLeft <= 0) return gameOver('win');
    if (playerRole === 'batsman' && ballsLeft <= 0) return gameOver('lose');

    gameState = 'READY';
    scene.remove(ball);
    ball.position.copy(ballStartPos);
    ballVelocity.set(0, 0, 0);
    bowlerRunUp = 0;

    if (bowler) {
        bowler.position.set(0, 0, pitchLength / 2 + 2);
        playAnimation(bowlerMixer, bowler, 'idle');
    }
    if (batsman) {
        playAnimation(batsmanMixer, batsman, 'idle');
    }

    if (playerRole === 'batsman') {
        ballsLeft--;
        // AI bowler starts its action
        setTimeout(() => startBowlingSequence(), 1000);
    }
}

function startBowlingSequence() {
    if (gameState !== 'READY') return;
    gameState = 'PLAYING';
    playAnimation(bowlerMixer, bowler, 'sprint');
}

function bowlBall() {
    if (gameState !== 'PLAYING') return;
    
    playAnimation(bowlerMixer, bowler, 'interact-right', false);
    
    setTimeout(() => {
        scene.add(ball);
        ball.position.copy(bowler.position).add(new Vector3(0, 1, -1));

        const targetVariance = 0.15;
        const targetPos = new Vector3(
            MathUtils.randFloat(-targetVariance, targetVariance), 
            0.35, 
            batsmanWicket.position.z
        );
        const distance = ball.position.distanceTo(targetPos);
        const travelTime = 0.5; // seconds
        
        ballVelocity.subVectors(targetPos, ball.position).normalize().multiplyScalar(distance / travelTime);
        gameState = 'BOWLED';
    }, 200); // Delay to sync with animation
}

// --- PLAYER CONTROLS ---
let actionHeld = false;

function handleActionStart(e) {
    e.preventDefault();
    if (gameState === 'GAMEOVER') return;
    
    if (playerRole === 'bowler' && gameState === 'READY') {
        gameState = 'PLAYING';
        playAnimation(bowlerMixer, bowler, 'sprint');
        actionHeld = true;
    }
}

function handleActionEnd(e) {
    e.preventDefault();
    if (gameState === 'GAMEOVER') return;
    
    if (playerRole === 'batsman' && gameState === 'BOWLED') {
        swingBat();
    }
    
    if (playerRole === 'bowler' && gameState === 'PLAYING') {
        actionHeld = false;
        bowlBall();
    }
}

actionButton.addEventListener('pointerdown', handleActionStart);
actionButton.addEventListener('pointerup', handleActionEnd);
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !actionHeld) {
        actionHeld = true;
        handleActionStart(e);
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') {
        actionHeld = false;
        handleActionEnd(e);
    }
});


function swingBat() {
    if (gameState !== 'BOWLED') return;
    gameState = 'HIT';
    playAnimation(batsmanMixer, batsman, 'interact-right', false);

    const batWorldPos = new Vector3();
    bat.getWorldPosition(batWorldPos);

    const distanceToBall = batWorldPos.distanceTo(ball.position);

    if (distanceToBall < 1.5) { // Close enough for a hit
        playSound("hit");
        const hitStrength = 40 + Math.random() * 20; // 40-60
        const hitDirection = new Vector3(
             Math.random() * 2 - 1, // Sideways
             Math.random() * 0.5 + 0.5, // Upwards
            -1 // Forwards
        ).normalize();
        
        ballVelocity.copy(hitDirection).multiplyScalar(hitStrength);
        
        const runs = Math.floor(4 + Math.random() * 3); // 4 or 6
        score += runs;
        scoreElement.textContent = `Runs: ${score}`;
        instructionsElement.innerText = `WOW! You hit a ${runs}!`;

    } else {
        // A miss
        instructionsElement.innerText = "Missed! Too early/late.";
    }

    setTimeout(resetRound, 3000);
}


function gameOver(result) {
    gameState = 'GAMEOVER';
    gameOverScreen.style.display = 'flex';
    
    if (playerRole === 'batsman') {
        playSound('jingle_win');
        gameOverTitle.innerText = "Innings Over!";
        gameOverMessage.innerText = `You scored ${score} runs!`;
    } else { // bowler
        if (result === 'win') {
            playSound('jingle_win');
            gameOverTitle.innerText = "You Win!";
            gameOverMessage.innerText = `You took all 3 wickets!`;
        } else {
            playSound('explosion');
            gameOverTitle.innerText = "You Lost!";
            gameOverMessage.innerText = `The batsman survived your over!`;
        }
    }
}

// --- MAIN GAME LOOP (animate) ---
function animate() {
    if (!on) return;
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);

    // Update animations
    if (batsmanMixer) batsmanMixer.update(delta);
    if (bowlerMixer) bowlerMixer.update(delta);

    // --- Batsman AI / Bowler Player Logic ---
    if (playerRole === 'bowler' && gameState === 'PLAYING' && actionHeld) {
        bowlerRunUp = Math.min(1, bowlerRunUp + delta * 1.5); // Takes ~0.66s to max
        bowler.position.z = (pitchLength / 2 + 2) - (bowlerRunUp * 2);
    }
    
    // --- Bowler AI Logic ---
    if (playerRole === 'batsman' && gameState === 'PLAYING') {
         bowlerRunUp = Math.min(1, bowlerRunUp + delta * 1.5);
         bowler.position.z = (pitchLength / 2 + 2) - (bowlerRunUp * 2);
         if (bowlerRunUp >= 1) {
            bowlBall();
         }
    }

    // --- Ball Physics ---
    if (gameState === 'BOWLED' || gameState === 'HIT') {
        ballVelocity.add(gravity.clone().multiplyScalar(delta));
        ball.position.add(ballVelocity.clone().multiplyScalar(delta));
        
        // Check for hitting the ground
        if (ball.position.y < 0.07) {
            ball.position.y = 0.07;
            ballVelocity.y *= -0.7; // Bounce
        }

        if (gameState === 'BOWLED') {
             const wicketBox = new Box3().setFromObject(batsmanWicket);
             if (wicketBox.containsPoint(ball.position)) {
                 playSound('explosion');
                 instructionsElement.innerText = "OUT! Bowled 'em!";
                 gameState = 'GAMEOVER';
                 wicketsLeft--;
                 if (playerRole === 'bowler') {
                    scoreElement.textContent = `Wickets: ${3 - wicketsLeft} / 3`;
                 }
                 setTimeout(resetRound, 3000);
             } else if (ball.position.z < batsmanWicket.position.z - 2) {
                // Ball passed the batsman
                instructionsElement.innerText = "They missed! Try again.";
                gameState = 'GAMEOVER'; // End of this ball
                setTimeout(resetRound, 3000);
             }
        }
    }
    
    // --- CAMERA ---
    if (playerRole === 'batsman') {
        camera.position.set(0, 1.8, -pitchLength / 2 + 1.5);
        camera.lookAt(0, 1, 0);
    } else if (playerRole === 'bowler') {
        if(bowler) {
            camera.position.set(bowler.position.x, bowler.position.y + 1.8, bowler.position.z + 2.5);
            camera.lookAt(bowler.position.x, bowler.position.y + 1, bowler.position.z);
        }
    } else { // Menu view
        camera.position.set(10, 5, 20);
        camera.lookAt(0, 1, 0);
    }


    renderer.render(scene, camera);
}

// --- RESIZE HANDLING ---
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onWindowResize, false);

// --- PAUSE/RESUME HANDLING ---
function setOn(v) {
    if (v === on) return;
    on = v;
    if (v) {
        clock.getDelta(); // reset delta on resume
        requestAnimationFrame(animate);
    }
}
document.addEventListener('visibilitychange', () => setOn(!document.hidden));
window.addEventListener('blur', () => setOn(false));
window.addEventListener('focus', () => setOn(true));

// --- INITIALIZATION ---
scoreElement.style.display = 'none';
instructionsElement.style.display = 'none';
actionButton.style.display = 'none'; // Will be shown when game starts

document.getElementById('play-batsman').addEventListener('click', () => {
    actionButton.style.display = 'flex';
    startGame('batsman');
});
document.getElementById('play-bowler').addEventListener('click', () => {
    actionButton.style.display = 'flex';
    startGame('bowler');
});

// Load models and start the game loop
onWindowResize();
loadGameModels();
animate();

</script>

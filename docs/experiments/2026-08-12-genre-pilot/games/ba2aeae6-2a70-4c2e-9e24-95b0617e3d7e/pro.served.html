            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: white;
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px #000000;
        }
        .top-ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #score {
            font-size: 24px;
            font-weight: bold;
            background-color: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 12px;
        }
        .instructions {
            background-color: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 16px;
            text-align: right;
        }
        .action-button {
            position: absolute;
            bottom: 80px; /* Position above movement controls */
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #4CAF50; /* Green */
            border: 2px solid white;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: auto;
            display: none; /* Hidden by default */
            z-index: 10;
        }
        /* --- ON-SCREEN CONTROLS --- */
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            pointer-events: auto;
        }
        .control-button {
            width: 50px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid white;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        #controls-move {
            display: grid;
            grid-template-areas: ". up ." "left . right";
            grid-gap: 10px;
            position: absolute;
            left: 20px;
            bottom: 20px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        #btn-up { grid-area: up; }
        #btn-left { grid-area: left; }
        #btn-right { grid-area: right; }
        /* --- UPGRADE MENU --- */
        #upgrade-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 50, 100, 0.9);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            width: 80%;
            max-width: 350px;
            z-index: 20;
            pointer-events: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #upgrade-menu h2 {
            margin: 0 0 15px 0;
            color: #ffd700;
        }
        #upgrade-menu button {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #upgrade-menu button.close {
            background-color: #f44336;
            margin-top: 15px;
        }
        #upgrade-menu button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>




<canvas id="scene"></canvas>

<div id="ui">
    <!-- TOP UI -->
    <div class="top-ui">
        <div id="score">$0</div>
        <div class="instructions">
            Use WASD/Arrows to move<br>
            Walk to zones to work
        </div>
    </div>
    
    <!-- ACTION BUTTON -->
    <button id="action-btn" class="action-button">Action</button>

    <!-- UPGRADE MENU -->
    <div id="upgrade-menu">
        <h2>Upgrades</h2>
        <button id="upgrade-player-speed" data-cost="50">Faster movement (Cost: $50)</button>
        <button id="upgrade-customer-rate" data-cost="100">More customers (Cost: $100)</button>
        <button id="upgrade-capacity" data-cost="75">Bigger Basket (Cost: $75)</button>
        <button class="close" onclick="document.getElementById('upgrade-menu').style.display = 'none';">Close</button>
    </div>
    
    <!-- ON-SCREEN CONTROLS -->
    <div id="controls">
        <div id="controls-move">
            <div id="btn-up" class="control-button">▲</div>
            <div id="btn-left" class="control-button">◀</div>
            <div id="btn-right" class="control-button">▶</div>
        </div>
    </div>
</div>

<script type="module">
// --- IMPORTS AND SETUP ---
import { Scene, PerspectiveCamera, WebGLRenderer, Clock, Color, Fog, Group, Vector3, Box3, BoxGeometry, MeshStandardMaterial, Mesh, AmbientLight, DirectionalLight, AnimationMixer, Quaternion, PlaneGeometry, CylinderGeometry } from "three";
const scene = new Scene();
const camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const clock = new Clock();
scene.fog = new Fog(0x87CEEB, 20, 50);
scene.background = new Color(0x87CEEB);

// --- LIGHTING ---
const ambientLight = new AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const dirLight = new DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// --- GAME STATE ---
let score = 0;
let player = null;
let playerMixer = null;
const playerVelocity = new Vector3();
const moveState = { forward: false, backward: false, left: false, right: false };
let playerSpeed = 3.5;
let playerCapacity = 5;
let tomatoCount = 0;
let eggCount = 0;
let jamCount = 0;
const customers = [];
let nextCustomerTime = 5; // First customer in 5 seconds
const customerSpawnRate = 15;
let customerSpeed = 1;
const chickens = [];
let actionZone = null;
const zones = {};

// --- SCORE AND UI ---
const scoreEl = document.getElementById('score');
const actionBtn = document.getElementById('action-btn');
const upgradeMenu = document.getElementById('upgrade-menu');

function updateScore(amount) {
    score += amount;
    scoreEl.textContent = '$' + score;
    updateUpgradeButtons();
    if (amount > 0) playSound("coin_pickup");
}

function updateUpgradeButtons() {
    document.querySelectorAll('#upgrade-menu button[data-cost]').forEach(btn => {
        const cost = parseInt(btn.dataset.cost);
        btn.disabled = score < cost;
    });
}

function showAction(text, callback) {
    actionBtn.textContent = text;
    actionBtn.style.display = 'block';
    actionBtn.onclick = callback;
}
function hideAction() {
    actionBtn.style.display = 'none';
}

// --- PLAYER AND CONTROLS ---
loadModel("explorer").then((model) => {
    if (model) {
        player = model;
        player.scale.set(0.7, 0.7, 0.7);
        player.position.set(0, 0, 8);
        scene.add(player);

        const walkClip = model.animations.find(a => /walk/i.test(a.name));
        const idleClip = model.animations.find(a => /idle/i.test(a.name));
        if (walkClip && idleClip) {
            playerMixer = new AnimationMixer(player);
            playerMixer.idleAction = playerMixer.clipAction(idleClip);
            playerMixer.walkAction = playerMixer.clipAction(walkClip);
            playerMixer.idleAction.play();
        }
    }
});

function updatePlayerAnimation() {
    if (!playerMixer) return;
    const isMoving = moveState.forward || moveState.backward || moveState.left || moveState.right;
    if (isMoving && !playerMixer.walkAction.isRunning()) {
        playerMixer.walkAction.reset().play();
        playerMixer.idleAction.stop();
    } else if (!isMoving && !playerMixer.idleAction.isRunning()) {
        playerMixer.idleAction.reset().play();
        playerMixer.walkAction.stop();
    }
}

document.addEventListener('keydown', (e) => {
    switch(e.code) {
        case 'ArrowUp': case 'KeyW': moveState.forward = true; break;
        case 'ArrowDown': case 'KeyS': moveState.backward = true; break;
        case 'ArrowLeft': case 'KeyA': moveState.left = true; break;
        case 'ArrowRight': case 'KeyD': moveState.right = true; break;
    }
    updatePlayerAnimation();
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
    }
});
document.addEventListener('keyup', (e) => {
    switch(e.code) {
        case 'ArrowUp': case 'KeyW': moveState.forward = false; break;
        case 'ArrowDown': case 'KeyS': moveState.backward = false; break;
        case 'ArrowLeft': case 'KeyA': moveState.left = false; break;
        case 'ArrowRight': case 'KeyD': moveState.right = false; break;
    }
    updatePlayerAnimation();
});

// --- ON-SCREEN BUTTONS ---
function handlePointerDown(e) {
    const id = e.target.id;
    if (id === 'btn-up') moveState.forward = true;
    if (id === 'btn-left') moveState.left = true;
    if (id === 'btn-right') moveState.right = true;
    updatePlayerAnimation();
    e.preventDefault();
}
function handlePointerUp(e) {
    moveState.forward = false; moveState.left = false; moveState.right = false;
    updatePlayerAnimation();
}

['btn-up', 'btn-left', 'btn-right'].forEach(id => {
    const btn = document.getElementById(id);
    btn.addEventListener('pointerdown', handlePointerDown, {passive: false});
    btn.addEventListener('touchstart', handlePointerDown, {passive: false});
});
document.addEventListener('pointerup', handlePointerUp);
document.addEventListener('touchend', handlePointerUp);

// --- WORLD CREATION ---
// Ground
const groundGeo = new PlaneGeometry(100, 100);
const groundMat = new MeshStandardMaterial({ color: 0x55aa55 });
const ground = new Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Market Stall
const stall = new Group();
const counterGeo = new BoxGeometry(5, 1, 1);
const counterMat = new MeshStandardMaterial({ color: 0x8B4513 });
const counter = new Mesh(counterGeo, counterMat);
counter.position.y = 0.5;
stall.add(counter);

const roofSupportGeo = new CylinderGeometry(0.1, 0.1, 2.5);
const roofSupportMat = new MeshStandardMaterial({ color: 0x5C3317 });
const support1 = new Mesh(roofSupportGeo, roofSupportMat);
support1.position.set(-2.3, 1.25, -0.3);
stall.add(support1);
const support2 = support1.clone();
support2.position.x = 2.3;
stall.add(support2);

const roofGeo = new BoxGeometry(5.2, 0.2, 1.5);
const roofMat = new MeshStandardMaterial({ color: 0xD2691E });
const roof = new Mesh(roofGeo, roofMat);
roof.position.y = 2.5;
stall.add(roof);

stall.position.set(0, 0, 0);
scene.add(stall);

// --- ACTION ZONES ---
function createZone(name, position, size, color) {
    const geo = new CylinderGeometry(size, size, 0.1, 16);
    const mat = new MeshStandardMaterial({ color: color, transparent: true, opacity: 0.4 });
    const mesh = new Mesh(geo, mat);
    mesh.position.copy(position);
    scene.add(mesh);
    zones[name] = { mesh, name };
}
createZone('tomatoPatch', new Vector3(-8, 0.05, 5), 2, 0xff0000);
createZone('chickenCoop', new Vector3(8, 0.05, 5), 2, 0xffff00);
createZone('jamMachine', new Vector3(-3, 0.05, -2), 1.5, 0xff00ff);
createZone('upgradeStation', new Vector3(3, 0.05, -2), 1.5, 0x00ffff);

// --- ASSETS AND ITEMS ---
// Tomato plants
for (let i = 0; i < 5; i++) {
    const bushGeo = new BoxGeometry(0.5, 1, 0.5);
    const bushMat = new MeshStandardMaterial({ color: 0x228B22 });
    const bush = new Mesh(bushGeo, bushMat);
    const angle = (i/5) * Math.PI * 2;
    bush.position.set(-8 + Math.sin(angle) * 1.5, 0.5, 5 + Math.cos(angle) * 1.5);
    scene.add(bush);
}

// Chicken Coop
const coop = new Group();
const coopBox = new Mesh(new BoxGeometry(2,2,2), new MeshStandardMaterial({color: 0xD2B48C}));
coopBox.position.y = 1;
coop.add(coopBox);
coop.position.set(8, 0, 5);
scene.add(coop);

// Chickens
for(let i = 0; i < 3; i++) {
    loadModel("chicken").then(model => {
        if(model){
            const chicken = model;
            chicken.scale.set(0.4, 0.4, 0.4);
            const angle = (i/3) * Math.PI * 2 + Math.random();
            chicken.position.set(8 + Math.sin(angle) * 1.5, 0, 5 + Math.cos(angle) * 1.5);
            chicken.rotation.y = Math.random() * Math.PI * 2;
            scene.add(chicken);
            chickens.push(chicken);
        }
    });
}
// Jam Machine
const jamMachine = new Group();
const machineBase = new Mesh(new CylinderGeometry(0.7, 0.7, 1, 16), new MeshStandardMaterial({color: 0x808080}));
machineBase.position.y = 0.5;
jamMachine.add(machineBase);
jamMachine.position.set(-3, 0, -2);
scene.add(jamMachine);

// --- CUSTOMERS ---
function createCustomer() {
    loadModel("explorer").then(model => {
        if (model) {
            const customer = model;
            customer.scale.set(0.7, 0.7, 0.7);
            const side = Math.random() < 0.5 ? -1 : 1;
            customer.position.set(side * 20, 0, 15); // Start off-screen
            customer.lookAt(0, 0, 1); // Look towards the stall
            customer.targetPos = new Vector3(Math.random() * 4 - 2, 0, 1);
            customer.state = 'approaching';
            scene.add(customer);
            customers.push(customer);
        }
    });
}

function updateCustomers(delta) {
    nextCustomerTime -= delta;
    if (nextCustomerTime <= 0) {
        createCustomer();
        nextCustomerTime = customerSpawnRate / customerSpeed + Math.random() * 5;
    }

    customers.forEach((customer, index) => {
        if (customer.state === 'approaching') {
            const dir = customer.targetPos.clone().sub(customer.position).normalize();
            customer.position.add(dir.multiplyScalar(customerSpeed * delta));
            if (customer.position.distanceTo(customer.targetPos) < 0.1) {
                customer.state = 'waiting';
                customer.waitTime = 5 + Math.random() * 5; // Wait 5-10 seconds
            }
        } else if (customer.state === 'waiting') {
            customer.waitTime -= delta;
            // Try to buy something
            if (jamCount > 0) {
                jamCount--;
                updateScore(15);
                customer.state = 'leaving';
            } else if (tomatoCount > 0) {
                tomatoCount--;
                updateScore(5);
                customer.state = 'leaving';
            } else if (eggCount > 0) {
                eggCount--;
                updateScore(8);
                customer.state = 'leaving';
            }
            if (customer.waitTime <= 0) { // Leave if they waited too long
                customer.state = 'leaving';
            }
        }
        
        if (customer.state === 'leaving') {
            customer.position.z += 2 * delta; // Move away
            if (customer.position.z > 20) {
                scene.remove(customer);
                customers.splice(index, 1);
            }
        }
    });
}

// --- UPGRADE LOGIC ---
document.getElementById('upgrade-player-speed').addEventListener('click', () => {
    const cost = 50;
    if (score >= cost) {
        updateScore(-cost);
        playerSpeed *= 1.2;
        playSound("powerup");
        upgradeMenu.style.display = 'none';
    }
});
document.getElementById('upgrade-customer-rate').addEventListener('click', () => {
    const cost = 100;
    if (score >= cost) {
        updateScore(-cost);
        customerSpeed *= 1.25;
        playSound("powerup");
        upgradeMenu.style.display = 'none';
    }
});
document.getElementById('upgrade-capacity').addEventListener('click', () => {
    const cost = 75;
    if (score >= cost) {
        updateScore(-cost);
        playerCapacity += 5;
        playSound("powerup");
        upgradeMenu.style.display = 'none';
    }
});

// --- GAME LOOP ---
function animate() {
    requestAnimationFrame(animate);
    const delta = Math.min(clock.getDelta(), 0.05);

    if (player) {
        // Player movement
        const moveDirection = new Vector3();
        if (moveState.forward) moveDirection.z -= 1;
        if (moveState.left) moveDirection.x -= 1;
        if (moveState.right) moveDirection.x += 1;
        
        if(moveDirection.lengthSq() > 0) {
            moveDirection.normalize();
            const targetRotation = Math.atan2(moveDirection.x, moveDirection.z);
            player.rotation.y += (targetRotation - player.rotation.y) * 0.1;
            player.position.add(moveDirection.multiplyScalar(playerSpeed * delta));
        }

        // Camera follow
        const idealOffset = new Vector3(0, 5, 10);
        const idealLookat = new Vector3(0, 2, 0);
        const cameraPos = player.position.clone().add(idealOffset);
        const lookatPos = player.position.clone().add(idealLookat);
        camera.position.lerp(cameraPos, 0.05);
        camera.lookAt(lookatPos);
        
        // Player animation
        if (playerMixer) playerMixer.update(delta);

        // Zone interaction
        let inZone = false;
        for (const zoneName in zones) {
            const zone = zones[zoneName];
            if (player.position.distanceTo(zone.mesh.position) < zone.mesh.geometry.parameters.radiusTop) {
                inZone = true;
                if (actionZone !== zone) {
                    actionZone = zone;
                    handleZoneEntry(zone.name);
                }
                break;
            }
        }
        if (!inZone) {
            if (actionZone) {
                hideAction();
                actionZone = null;
            }
        }
    }
    
    updateCustomers(delta);

    renderer.render(scene, camera);
}

// --- ZONE ACTIONS ---
function handleZoneEntry(zoneName) {
    if (zoneName === 'tomatoPatch') {
        const canPick = tomatoCount + eggCount + jamCount < playerCapacity;
        if (canPick) {
            showAction('Pick Tomatoes', () => {
                tomatoCount++;
                playSound("pop");
                hideAction(); // One action per entry
                actionZone = null;
            });
        }
    } else if (zoneName === 'chickenCoop') {
        const canPick = tomatoCount + eggCount + jamCount < playerCapacity;
        if (canPick) {
            showAction('Collect Eggs', () => {
                eggCount++;
                playSound("pop");
                hideAction();
                actionZone = null;
            });
        }
    } else if (zoneName === 'jamMachine') {
        if (tomatoCount > 0) {
            showAction('Make Jam', () => {
                tomatoCount--;
                jamCount++;
                playSound("whoosh");
                hideAction();
                actionZone = null;
            });
        }
    } else if (zoneName === 'upgradeStation') {
        showAction('Open Upgrades', () => {
            playSound("click");
            upgradeMenu.style.display = 'flex';
            updateUpgradeButtons();
            hideAction();
            actionZone = null;
        });
    }
}

// --- RESIZE ---
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onWindowResize);

// --- START ---
onWindowResize();
playMusic("bg_loop_playful");
animate();
updateScore(0); // Initialize score display and upgrade buttons
</script>
</body>
</html>

    <script type="module">
        import {

        const PLATFORM_MOVE_SPEED = 1; // meters per second

        const PARTICLE_COUNT_HIT = 20;
        const PLAYER_HEIGHT = 1; // meters
        const PLAYER_RADIUS = 0.4; // for collision
        const CHARACTER_COLORS = {
            sora: 0x00FFFF, // Cyan
            brutus: 0xFF4500, // OrangeRed
            zara: 0x32CD32, // LimeGreen
            pip: 0xBA55D3 // MediumOrchid
        };
        const PLAYER_MODELS = {
            sora: "man", // Placeholder for Sora
            brutus: "zombie", // Placeholder for Brutus
            zara: "mascot", // Placeholder for Zara
            pip: "explorer" // Placeholder for Pip
        };
        const WEAPON_MODELS = {
            sora: "sword",
            brutus: null, // Brutus uses a hammer, will make from primitives or assign a different model if available
            zara: null, // Zara uses bow
            pip: null // Pip uses staff
        };
        const ENEMY_MODEL = "robot";
        const STAR_MODEL = "star";
        const HEART_MODEL = "heart";
        const WORLD_THEMES = {
            "Candy Meadow": {
                groundColor: 0x8FBC8F, // DarkSeaGreen
                platformColor: 0x98FB98, // PaleGreen
                fogColor: 0xAACCAA,
                skyColor: 0xADD8E6 // LightBlue
            },
            "Robot Desert": {
                groundColor: 0xB8860B, // DarkGoldenRod
                platformColor: 0xD2B48C, // Tan
                fogColor: 0xC0C0C0,

            },
            "Lava Castle": {
                groundColor: 0x5C4033, // Dark Brown
                platformColor: 0x8B0000, // DarkRed
                fogColor: 0x663333,
                skyColor: 0x4B0082 // Indigo
            }
        };

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, clock;
        let ambientLight, directionalLight;
        let mixer; // AnimationMixer for player characters
        let on = true; // Game loop active flag

        let gameMode = 'menu'; // 'menu', 'options', 'char_select', 'player_count_select', 'game', 'results'
        let selectedWorld = "Candy Meadow"; // Default
        let _inMemoryCumulativeStars = 0; // Fallback for localStorage
        try {
            _inMemoryCumulativeStars = parseInt(localStorage.getItem('cumulativeStars') || '0', 10);
        } catch (e) {
            console.warn("Failed to read 'cumulativeStars' from localStorage, using 0. Error:", e);
        }
        let totalStarsCollected = _inMemoryCumulativeStars; // This variable seems unused, but keeping for consistency.

        let players = [];
        let numPlayers = 1; // Default for single player
        let currentPlayerSelecting = 0; // For character select

        let enemies = [];
        let staticStars = [];
        let superStar = null;
        let platforms = [];
        let projectiles = [];
        let particles = [];

        let currentMatchTime = MATCH_DURATION;
        let superStarTimer = SUPER_STAR_SPAWN_INTERVAL;
        let gameOver = false;

        let keyboardState = {};
        let mobileControls = {
            up: false, down: false, left: false, right: false, jump: false, attack: false, dash: false
        };

        // --- GAME ASSETS ---
        const playerGeometries = {
            sora: new CapsuleGeometry(PLAYER_RADIUS, PLAYER_HEIGHT - PLAYER_RADIUS * 2, 8, 16),
            brutus: new CapsuleGeometry(PLAYER_RADIUS + 0.1, PLAYER_HEIGHT - PLAYER_RADIUS * 2, 8, 16),
            zara: new CapsuleGeometry(PLAYER_RADIUS - 0.1, PLAYER_HEIGHT - PLAYER_RADIUS * 2, 8, 16),
            pip: new CapsuleGeometry(PLAYER_RADIUS, PLAYER_HEIGHT - PLAYER_RADIUS * 2, 8, 16),
        };
        const weaponGeometries = {
            sora: new BoxGeometry(0.1, 0.1, 1), // Sword
            brutus: new BoxGeometry(0.2, 0.2, 0.5), // Hammer head
            zara: new CylinderGeometry(0.05, 0.05, 0.8, 8), // Bow
            pip: new CylinderGeometry(0.08, 0.08, 1.2, 8), // Staff
        };
        const heartGeometry = new ConeGeometry(0.3, 0.5, 3); // Simple triangle for heart placeholder
        const starGeometry = new DodecahedronGeometry(0.4); // Simple star placeholder
        const enemyGeometry = new CylinderGeometry(0.4, 0.4, 0.8, 16); // Simple robot placeholder

        // --- DOM ELEMENTS ---
        const hudLeft = document.getElementById('hud-left');
        const hudRight = document.getElementById('hud-right');
        const timerDisplay = document.getElementById('timer');
        const scoreTracker = document.getElementById('score');

        const mainMenu = document.getElementById('main-menu');
        const singlePlayerBtn = document.getElementById('single-player-btn');
        const localMultiplayerBtn = document.getElementById('local-multiplayer-btn');
        const optionsBtn = document.getElementById('options-btn');

        const optionsMenu = document.getElementById('options-menu');
        const worldCandyMeadowBtn = document.getElementById('world-candy-meadow');
        const worldRobotDesertBtn = document.getElementById('world-robot-desert');
        const worldLavaCastleBtn = document.getElementById('world-lava-castle');
        const backToMainBtn = document.getElementById('back-to-main-btn');

        const playerCountSelect = document.getElementById('player-count-select');
        const playerCountButtons = document.querySelectorAll('#player-count-select .player-count-button');
        const backToCharSelectFromCountBtn = document.getElementById('back-to-char-select-from-count-btn');

        const characterSelect = document.getElementById('character-select');
        const charSelectTitle = document.getElementById('char-select-title');
        const charOptions = document.querySelectorAll('.char-option');
        const currentPlayerSelectionLabel = document.getElementById('current-player-selection-label');
        const confirmCharBtn = document.getElementById('confirm-char-btn');
        const startGameBtn = document.getElementById('start-game-btn');
        const backToMainFromCharSelectBtn = document.getElementById('back-to-main-from-char-select-btn');

        const resultsScreen = document.getElementById('results-screen');
        const resultsMessage = document.getElementById('results-message');
        const backToMainFromResultsBtn = document.getElementById('back-to-main-from-results-btn');

        const mobileControlsDiv = document.getElementById('mobile-controls');
        const mobileButtons = {
            up: document.getElementById('btn-up'),
            down: document.getElementById('btn-down'),
            left: document.getElementById('btn-left'),
            right: document.getElementById('btn-right'),
            jump: document.getElementById('btn-jump'),
            attack: document.getElementById('btn-attack'),
            dash: document.getElementById('btn-dash')
        };

        // --- UTILITY FUNCTIONS ---
        function setVisibility(element, isVisible) {
            element.style.display = isVisible ? 'flex' : 'none';
        }

        function playSoundSafe(name) {
            try {
                playSound(name);
            } catch (e) {
                console.warn("Sound playback failed (might be normal if not implemented or browser blocks):", name);
            }
        }

        function playMusicSafe(name) {
            try {
                return playMusic(name);
            } catch (e) {
                console.warn("Music playback failed:", name);
                return null;
            }
        }

        function getPlayerKey(playerIndex) {
            return `player-${playerIndex}-character`;
        }

        function loadCumulativeStars() {
            return _inMemoryCumulativeStars;
        }

        function saveCumulativeStars(stars) {
            _inMemoryCumulativeStars = stars; // Always update in-memory
            try {
                localStorage.setItem('cumulativeStars', stars.toString());
            } catch (e) {
                console.warn("Failed to write 'cumulativeStars' to localStorage. Error:", e);
            }
        }

        // --- GAME STATE TRANSITIONS ---
        function setGameState(newState) {
            gameMode = newState;
            setVisibility(mainMenu, false);
            setVisibility(optionsMenu, false);
            setVisibility(characterSelect, false);
            setVisibility(playerCountSelect, false);
            setVisibility(resultsScreen, false);
            setVisibility(hudLeft.parentElement, false); // Hide HUD
            setVisibility(mobileControlsDiv, false);

            if (newState === 'menu') {
                setVisibility(mainMenu, true);
                if (currentMusic) {
                    currentMusic.stop();
                    currentMusic = null;
                }
                currentMusic = playMusicSafe("bg_loop_chill");
            } else if (newState === 'options') {
                setVisibility(optionsMenu, true);
                updateWorldUnlockStatus();
            } else if (newState === 'player_count_select') {
                setVisibility(playerCountSelect, true);
            } else if (newState === 'char_select') {
                setVisibility(characterSelect, true);
                resetCharacterSelection();
                confirmCharBtn.style.display = 'block';
                startGameBtn.style.display = 'none';
                updateCharacterSelectUI();
            } else if (newState === 'game') {
                setVisibility(hudLeft.parentElement, true); // Show HUD
                if (isMobileDevice()) {
                    setVisibility(mobileControlsDiv, true);
                }
                startGame();
            } else if (newState === 'results') {
                setVisibility(resultsScreen, true);
                if (currentMusic) {
                    currentMusic.stop();
                    currentMusic = null;
                }
            }
        }

        let currentMusic = null;

        function updateWorldUnlockStatus() {
            const currentTotalStars = loadCumulativeStars();
            worldCandyMeadowBtn.disabled = false;
            worldCandyMeadowBtn.querySelector('span').textContent = '(Unlocked)';

            const robotDesertStarsNeeded = parseInt(worldRobotDesertBtn.dataset.stars);
            if (currentTotalStars >= robotDesertStarsNeeded) {
                worldRobotDesertBtn.disabled = false;
                worldRobotDesertBtn.querySelector('span').textContent = '(Unlocked)';
            } else {
                worldRobotDesertBtn.disabled = true;
                worldRobotDesertBtn.querySelector('span').textContent = `(Unlock: ${robotDesertStarsNeeded} stars)`;
            }

            const lavaCastleStarsNeeded = parseInt(worldLavaCastleBtn.dataset.stars);
            if (currentTotalStars >= lavaCastleStarsNeeded) {
                worldLavaCastleBtn.disabled = false;
                worldLavaCastleBtn.querySelector('span').textContent = '(Unlocked)';
            } else {
                worldLavaCastleBtn.disabled = true;
                worldLavaCastleBtn.querySelector('span').textContent = `(Unlock: ${lavaCastleStarsNeeded} stars)`;
            }

            // Visually select the currently selected world
            document.querySelectorAll('.world-button').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`world-${selectedWorld.toLowerCase().replace(/\s/g, '-')}`).classList.add('selected');
        }

        // --- INITIAL SETUP ---
        function init() {
            // Scene
            scene = new Scene();
            scene.fog = new Fog(0xffffff, 1, 100); // Default fog, updated by world theme

            // Camera
            camera = new PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, CAMERA_DEFAULT_DISTANCE);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new WebGLRenderer({
                canvas: document.getElementById('scene'),
                antialias: true,
                preserveDrawingBuffer: true
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Lights
            ambientLight = new AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            directionalLight = new DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.target.position.set(0, 0, 0);
            scene.add(directionalLight);
            scene.add(directionalLight.target);

            // Clock
            clock = new Clock();

            // Set initial game state
            setGameState('menu');

            // --- EVENT LISTENERS ---
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            singlePlayerBtn.addEventListener('pointerdown', () => {
                numPlayers = 1;
                setGameState('char_select');
            });
            localMultiplayerBtn.addEventListener('pointerdown', () => setGameState('player_count_select'));
            optionsBtn.addEventListener('pointerdown', () => setGameState('options'));

            // Player Count Select Listeners
            playerCountButtons.forEach(button => {
                button.addEventListener('pointerdown', () => {
                    numPlayers = parseInt(button.dataset.count);
                    setGameState('char_select');
                });
            });
            backToCharSelectFromCountBtn.addEventListener('pointerdown', () => {
                numPlayers = 1; // Reset to default if backing out
                setGameState('menu');
            });

            // Options Menu Listeners
            worldCandyMeadowBtn.addEventListener('pointerdown', () => selectWorld("Candy Meadow"));
            worldRobotDesertBtn.addEventListener('pointerdown', () => selectWorld("Robot Desert"));
            worldLavaCastleBtn.addEventListener('pointerdown', () => selectWorld("Lava Castle"));
            backToMainBtn.addEventListener('pointerdown', () => setGameState('menu'));

            // Character Select Listeners
            charOptions.forEach(option => {
                option.addEventListener('pointerdown', () => {
                    if (gameMode !== 'char_select') return;
                    const charName = option.dataset.char;
                    const color = option.dataset.color;
                    const isTaken = players.some(p => p.character === charName);

                    if (!isTaken) {
                        selectCharacter(charName, color);
                    } else {
                        // Optionally provide feedback that character is taken
                        console.log(`${charName} is already taken!`);
                    }
                });
            });
            confirmCharBtn.addEventListener('pointerdown', confirmCharacterSelection);
            startGameBtn.addEventListener('pointerdown', () => setGameState('game'));
            backToMainFromCharSelectBtn.addEventListener('pointerdown', () => setGameState('menu'));

            // Results Screen Listener
            backToMainFromResultsBtn.addEventListener('pointerdown', () => setGameState('menu'));

            // Mobile control event listeners
            setupMobileControls();

            // Visibility API for pausing game
            let lastFocusTime = 0;
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    on = false;
                } else {
                    on = true;
                    // Reset clock delta after being hidden
                    clock.getDelta();
                    if (gameMode === 'game') {
                        // Ensure animation loop resumes
                        requestAnimationFrame(animate);
                    }
                }
            });
            window.addEventListener('blur', () => { on = false; });
            window.addEventListener('focus', () => {
                on = true;
                clock.getDelta(); // Reset delta to prevent teleportation
                if (gameMode === 'game') {
                    requestAnimationFrame(animate);
                }
            });

            animate(); // Start the animation loop
        }

        // --- MOBILE CONTROL SETUP ---
        function isMobileDevice() {
            return /Mobi|Android/i.test(navigator.userAgent);
        }

        function setupMobileControls() {
            const controlMap = {
                'btn-up': 'up', 'btn-down': 'down', 'btn-left': 'left', 'btn-right': 'right',
                'btn-jump': 'jump', 'btn-attack': 'attack', 'btn-dash': 'dash'
            };

            for (const btnId in mobileButtons) {
                const button = mobileButtons[btnId];
                if (button) {
                    const control = controlMap[btnId];
                    button.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        mobileControls[control] = true;
                    });
                    button.addEventListener('pointerup', (e) => {
                        e.preventDefault();
                        mobileControls[control] = false;
                    });
                    button.addEventListener('pointerleave', (e) => {
                        // Reset if pointer leaves the button area while pressed
                        mobileControls[control] = false;
                    });
                }
            }
        }

        // --- CHARACTER SELECTION ---
        function resetCharacterSelection() {
            players = [];
            currentPlayerSelecting = 0;
            charOptions.forEach(option => {
                option.classList.remove('selected', 'taken');
                option.style.backgroundColor = ''; // Reset background
                const charPreview = option.querySelector('.char-preview');
                charPreview.style.backgroundColor = CHARACTER_COLORS[option.dataset.char];
            });
        }

        function updateCharacterSelectUI() {
            charSelectTitle.textContent = numPlayers === 1 ? "Choose Your Character!" : `Player ${currentPlayerSelecting + 1}: Select Character`;
            currentPlayerSelectionLabel.textContent = `Player ${currentPlayerSelecting + 1}: Select Character`;

            charOptions.forEach(option => {
                const charName = option.dataset.char;
                const isTaken = players.some(p => p.character === charName);
                option.classList.toggle('taken', isTaken);
                option.style.pointerEvents = isTaken ? 'none' : 'auto';

                // Check if this option is currently selected by the active player
                const isCurrentPlayerSelected = players[currentPlayerSelecting] && players[currentPlayerSelecting].character === charName;
                option.classList.toggle('selected', isCurrentPlayerSelected);
            });

            if (players.length === numPlayers) {
                confirmCharBtn.style.display = 'none';
                startGameBtn.style.display = 'block';
            } else {
                confirmCharBtn.style.display = 'block';
                startGameBtn.style.display = 'none';
            }
        }

        function selectCharacter(charName, color) {
            // Remove previous selection for current player if any
            if (players[currentPlayerSelecting]) {
                const prevCharOption = document.querySelector(`.char-option[data-char="${players[currentPlayerSelecting].character}"]`);
                if (prevCharOption) prevCharOption.classList.remove('selected');
            }

            // Create or update player entry
            players[currentPlayerSelecting] = {
                id: currentPlayerSelecting,
                character: charName,
                color: parseInt(color),
                model: null, // Placeholder, will be loaded
                weaponModel: null,
                position: new Vector3(),
                velocity: new Vector3(),
                rotationY: 0,
                hearts: INITIAL_HEARTS,
                stars: 0,
                isGrounded: false,
                lastJumpTime: 0,
                coyoteTimeActive: false,
                dashCooldown: 0,
                dashActive: false,
                dashDirection: new Vector3(),
                dashTimer: 0,
                invincibilityTimer: 0,
                respawnTimer: 0,
                isDead: false,
                input: {
                    up: false, down: false, left: false, right: false,
                    jump: false, attack: false, dash: false
                }
            };

            const currentOption = document.querySelector(`.char-option[data-char="${charName}"]`);

        // --- GAME START / RESET ---
        function startGame() {
            gameOver = false;
            currentMatchTime = MATCH_DURATION;
            superStarTimer = SUPER_STAR_SPAWN_INTERVAL;
            enemies = [];
            staticStars = [];
            projectiles = [];
            particles = [];
            if (superStar) {
                scene.remove(superStar);
                superStar = null;
            }

            // Clear existing elements in scene
            while (scene.children.length > 0) {
                const obj = scene.children[0];
                if (obj !== camera && obj !== ambientLight && obj !== directionalLight && obj !== directionalLight.target) {
                    scene.remove(obj);
                    if (obj.dispose) obj.dispose(); // Release geometry/material
                }
            }

            // Reset player states for the match
            players.forEach(player => {
                player.hearts = INITIAL_HEARTS;
                player.stars = 0;
                player.isDead = false;
                player.respawnTimer = 0;
                player.invincibilityTimer = 0;
                player.dashCooldown = 0;
                player.dashActive = false;
                player.dashTimer = 0;
                player.velocity.set(0, 0, 0);
                player.input = { up: false, down: false, left: false, right: false, jump: false, attack: false, dash: false };
                if (player.model) scene.remove(player.model);
                player.model = null; // Ensure re-creation for new world
                if (player.weaponModel) scene.remove(player.weaponModel);
                player.weaponModel = null;
            });

            buildWorld(selectedWorld);
            initHUD();

            if (currentMusic) currentMusic.stop();
            currentMusic = playMusicSafe("bg_loop_upbeat");
        }

        function resetMatchFull() {
            // This is for simultaneous death reset
            console.log("Match reset due to simultaneous death!");
            playSoundSafe("game_over");
            startGame(); // Just restart the game as if new game
        }

        // --- WORLD GENERATION ---
        async function buildWorld(worldName) {
            const theme = WORLD_THEMES[worldName];
            scene.fog.color.set(theme.fogColor);
            scene.background = new Color(theme.skyColor);

            // Ground plane
            const groundMaterial = new MeshStandardMaterial({
                color: theme.groundColor,
                roughness: 0.8,
                metalness: 0.1
            });
            const ground = new Mesh(new PlaneGeometry(100, 100), groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            scene.add(ground);

            // Platforms
            platforms = [];
            const platformMaterial = new MeshStandardMaterial({
                color: theme.platformColor,
                roughness: 0.8,
                metalness: 0.1
            });
            const platformBaseSize = new Vector3(3, 0.5, 3);

            // Central arena platform
            const centralPlatform = new Mesh(new BoxGeometry(10, 0.5, 10), platformMaterial);
            centralPlatform.position.set(0, 0, 0);
            centralPlatform.isMoving = false;
            centralPlatform.bounds = new Box3().setFromObject(centralPlatform);
            platforms.push(centralPlatform);
            scene.add(centralPlatform);

            const platformPositions = [
                new Vector3(8, 2, 0), new Vector3(-8, 2, 0), new Vector3(0, 2, 8), new Vector3(0, 2, -8),
                new Vector3(12, 4, 12), new Vector3(-12, 4, 12), new Vector3(12, 4, -12), new Vector3(-12, 4, -12),
                new Vector3(18, 6, 0), new Vector3(-18, 6, 0), new Vector3(0, 6, 18), new Vector3(0, 6, -18),
                new Vector3(22, 8, 22), new Vector3(-22, 8, -22),
            ];

            let movingPlatformCount = 0;
            const movingPlatformsIndices = new Set();
            while (movingPlatformsIndices.size < 5) {
                movingPlatformsIndices.add(Math.floor(Math.random() * platformPositions.length));
            }

            for (let i = 0; i < platformPositions.length; i++) {
                const pos = platformPositions[i];
                const platform = new Mesh(new BoxGeometry(platformBaseSize.x, platformBaseSize.y, platformBaseSize.z), platformMaterial);
                platform.position.copy(pos);

                platform.isMoving = movingPlatformsIndices.has(i);
                if (platform.isMoving) {
                    platform.travelDistance = PLATFORM_MOVE_DISTANCE;
                    platform.moveDirection = Math.random() > 0.5 ? 1 : -1; // -1 for Z, 1 for X
                    platform.initialPosition = pos.clone();
                    platform.axis = Math.random() > 0.5 ? 'x' : 'z'; // Random axis
                    movingPlatformCount++;
                }
                platform.bounds = new Box3().setFromObject(platform);
                platforms.push(platform);
                scene.add(platform);
            }

            // Spawn points (around central platform)
            const spawnPoints = [
                new Vector3(0, PLAYER_HEIGHT / 2, 0),
                new Vector3(3, PLAYER_HEIGHT / 2, 3),
                new Vector3(-3, PLAYER_HEIGHT / 2, 3),
                new Vector3(3, PLAYER_HEIGHT / 2, -3),
                new Vector3(-3, PLAYER_HEIGHT / 2, -3)
            ];

            // Player character models
            for (let i = 0; i < players.length; i++) {
                const player = players[i];
                // Spawn position (ensure safe distance)
                let spawnOffset = 0;
                if (i === 0) spawnOffset = 0;
                else if (i === 1) spawnOffset = 5;
                else if (i === 2) spawnOffset = -5;
                else if (i === 3) spawnOffset = 10;
                player.position.set(spawnOffset, PLAYER_HEIGHT / 2 + 0.1, 0); // Give a slight offset to be on platform

                // Character Model (placeholder first)
                const material = new MeshStandardMaterial({
                    color: player.color,
                    emissive: player.color,
                    emissiveIntensity: 0.3
                });
                const playerMesh = new Mesh(playerGeometries[player.character], material);
                playerMesh.position.copy(player.position);
                player.model = new Group();
                player.model.add(playerMesh); // Add capsule to the group for easier rotation of the group

                // Head (oversized)
                const head = new Mesh(new SphereGeometry(0.5, 16, 16), material);
                head.position.y = PLAYER_HEIGHT / 2 + 0.3;
                player.model.add(head);

                // In-world heart display
                const heartGroup = new Group();
                heartGroup.position.y = PLAYER_HEIGHT + 0.8;
                player.model.heartGroup = heartGroup;
                player.model.add(heartGroup);
                updateInWorldHearts(player);

                scene.add(player.model);

                // Load real model if available
                loadModel(PLAYER_MODELS[player.character]).then((m) => {
                    if (m) {
                        // Remove placeholder
                        player.model.remove(playerMesh);
                        player.model.remove(head);

                        m.scale.set(0.7, 0.7, 0.7); // Adjust scale to fit 1m height
                        m.position.y = -0.5; // Adjust position to sit on the capsule base
                        player.model.add(m);
                        player.animations = m.animations;
                        if (player.animations && player.animations.length > 0) {
                            player.mixer = new AnimationMixer(m);
                            const clip = player.animations.find(a => /sprint|run|walk/i.test(a.name)) || player.animations[0];
                            if (clip) player.action = player.mixer.clipAction(clip);
                            player.action.play();
                            player.action.setEffectiveWeight(0); // Start as idle
                        }
                    }
                });

                // Weapon Model
                if (WEAPON_MODELS[player.character]) {
                    loadModel(WEAPON_MODELS[player.character]).then((m) => {
                        if (m) {
                            m.scale.set(0.5, 0.5, 0.5); // Example scale
                            m.rotation.y = -Math.PI / 2;
                            m.position.set(0.4, 0.2, 0.2); // Position relative to player
                            player.weaponModel = m;
                            player.model.add(m);
                        }
                    });
                } else {
                    // Primitive weapon if no model
                    let weaponMesh;
                    if (player.character === 'brutus') {
                        weaponMesh = new Mesh(weaponGeometries.brutus, new MeshStandardMaterial({ color: 0x808080, emissive: 0x808080, emissiveIntensity: 0.5 }));
                        const handle = new Mesh(new CylinderGeometry(0.05, 0.05, 0.5, 8), new MeshStandardMaterial({ color: 0x5C4033 }));
                        handle.position.y = -0.25;
                        weaponMesh.add(handle);
                        weaponMesh.position.set(0.4, 0.2, 0.2);
                        weaponMesh.rotation.z = Math.PI / 2;
                    } else if (player.character === 'zara') {
                        weaponMesh = new Mesh(weaponGeometries.zara, new MeshStandardMaterial({ color: 0xA52A2A, emissive: 0xA52A2A, emissiveIntensity: 0.5 }));
                        weaponMesh.position.set(0.4, 0.2, 0.2);
                        weaponMesh.rotation.y = -Math.PI / 2;
                    } else if (player.character === 'pip') {
                        weaponMesh = new Mesh(weaponGeometries.pip, new MeshStandardMaterial({ color: 0x800080, emissive: 0x800080, emissiveIntensity: 0.5 }));
                        weaponMesh.position.set(0.4, 0.2, 0.2);
                        weaponMesh.rotation.z = -Math.PI / 4;
                    }
                    if (weaponMesh) {
                        player.weaponModel = weaponMesh;
                        player.model.add(weaponMesh);
                    }
                }
            }

            // Enemies (15 per world)
            const enemySpawnPoints = [
                new Vector3(10, 0.5, 10), new Vector3(-10, 0.5, 10), new Vector3(10, 0.5, -10), new Vector3(-10, 0.5, -10),
                new Vector3(15, 2.5, 0), new Vector3(-15, 2.5, 0), new Vector3(0, 2.5, 15), new Vector3(0, 2.5, -15),
                new Vector3(20, 4.5, 20), new Vector3(-20, 4.5, 20), new Vector3(20, 4.5, -20), new Vector3(-20, 4.5, -20),
                new Vector3(25, 6.5, 0), new Vector3(-25, 6.5, 0), new Vector3(0, 6.5, 25),
            ];

            for (let i = 0; i < 15; i++) {
                const pos = enemySpawnPoints[i % enemySpawnPoints.length];
                const enemyColor = new Color().setHSL(Math.random(), 1, 0.5);
                const material = new MeshStandardMaterial({
                    color: enemyColor,
                    emissive: enemyColor,
                    emissiveIntensity: 0.5
                });
                const enemyMesh = new Mesh(enemyGeometry, material);
                enemyMesh.position.copy(pos);
                enemyMesh.rotation.y = Math.random() * Math.PI * 2;
                enemyMesh.initialPosition = pos.clone();
                enemyMesh.patrolDirection = (Math.random() > 0.5 ? 1 : -1); // 1 for +X, -1 for -X
                enemyMesh.patrolAxis = Math.random() > 0.5 ? 'x' : 'z';

                const enemy = {
                    model: enemyMesh,
                    position: enemyMesh.position,
                    initialPosition: enemyMesh.initialPosition.clone(),
                    patrolDirection: enemyMesh.patrolDirection,
                    patrolAxis: enemyMesh.patrolAxis,
                    speed: ENEMY_SPEED,
                    bounds: new Box3().setFromObject(enemyMesh),
                    alive: true
                };
                enemies.push(enemy);
                scene.add(enemy.model);

                // Load real robot model
                loadModel(ENEMY_MODEL).then((m) => {
                    if (m && enemy.model) {
                        scene.remove(enemy.model); // Remove placeholder
                        m.position.copy(enemy.model.position);
                        m.rotation.copy(enemy.model.rotation);
                        m.scale.set(0.6, 0.6, 0.6);
                        enemy.model = m;
                        enemy.bounds.setFromObject(m); // Update bounds
                        scene.add(enemy.model);
                        enemy.mixer = new AnimationMixer(m);
                        const runClip = m.animations.find(a => a.name.includes('Run'));
                        if (runClip) {
                            enemy.action = enemy.mixer.clipAction(runClip);
                            enemy.action.play();
                        }
                    }
                });
            }

            // Static Stars (10 per world)
            const staticStarPositions = [
                new Vector3(5, 1, 5), new Vector3(-5, 1, 5), new Vector3(5, 1, -5), new Vector3(-5, 1, -5),
                new Vector3(10, 3, 0), new Vector3(-10, 3, 0), new Vector3(0, 3, 10), new Vector3(0, 3, -10),
                new Vector3(15, 5, 15), new Vector3(-15, 5, -15),
            ];

            for (let i = 0; i < 10; i++) {
                const pos = staticStarPositions[i % staticStarPositions.length];
                createStaticStar(pos.x, pos.y, pos.z, i);
            }

            // Background elements (clouds, hills)
            const numClouds = 10;
            const cloudGeometry = new SphereGeometry(2, 8, 8);
            const cloudMaterial = new MeshBasicMaterial({ color: 0xF0F8FF, transparent: true, opacity: 0.8 }); // AliceBlue
            for (let i = 0; i < numClouds; i++) {
                const cloud = new Mesh(cloudGeometry, cloudMaterial);
                cloud.position.set(
                    Math.random() * 100 - 50,
                    15 + Math.random() * 5,
                    Math.random() * 100 - 50
                );
                cloud.scale.set(Math.random() * 2 + 1, Math.random() * 1 + 0.5, Math.random() * 2 + 1);
                cloud.userData.speed = 0.5 + Math.random() * 0.5;
                scene.add(cloud);
            }

            // Hills/Mountains (theme-specific)
            const mountainMaterial = new MeshStandardMaterial({ color: theme.groundColor.clone().multiplyScalar(0.8), roughness: 0.8 });
            for (let i = 0; i < 5; i++) {
                const mountain = new Mesh(new ConeGeometry(10 + Math.random() * 10, 10 + Math.random() * 15, 16), mountainMaterial);
                mountain.position.set(
                    Math.random() * 100 - 50,
                    mountain.geometry.parameters.height / 2 - 0.5, // Rest on ground
                    Math.random() * 100 - 50
                );
                scene.add(mountain);
            }
        }

        // --- PLATFORM CARRYING LOGIC ---
        function getPlatformUnderPlayer(player) {
            for (const platform of platforms) {
                const playerBase = new Box3().setFromCenterAndSize(
                    new Vector3(player.position.x, player.position.y - PLAYER_HEIGHT / 2, player.position.z),
                    new Vector3(PLAYER_RADIUS * 2, 0.1, PLAYER_RADIUS * 2) // Thin slice at player's feet
                );
                if (playerBase.intersectsBox(platform.bounds)) {
                    return platform;
                }
            }
            return null;
        }

        // --- STARS & SUPER STAR ---
        class Star {
            constructor(x, y, z, id, isSuper = false) {
                this.id = id;
                this.isSuper = isSuper;
                this.position = new Vector3(x, y, z);
                this.respawnTimer = 0;
                this.isCollected = false;

                const baseColor = isSuper ? 0xFFD700 : 0xFFEC8B; // Gold / Light Yellow
                const emissiveColor = isSuper ? 0xFFEC8B : 0xF0E68C; // YellowGreen / Khaki

                const starMat = new MeshStandardMaterial({
                    color: baseColor,
                    emissive: emissiveColor,
                    emissiveIntensity: isSuper ? 1.5 : 0.8,
                    metalness: 0.9,
                    roughness: 0.1
                });
                this.model = new Mesh(starGeometry, starMat);
                this.model.position.copy(this.position);
                this.model.scale.set(isSuper ? 0.8 : 0.4, isSuper ? 0.8 : 0.4, isSuper ? 0.8 : 0.4);
                this.model.userData.isSuperStar = isSuper;
                this.model.userData.starId = id;
                scene.add(this.model);

                // Load real star model
                loadModel(STAR_MODEL).then((m) => {
                    if (m && this.model) {
                        scene.remove(this.model); // Remove placeholder
                        m.position.copy(this.position);
                        m.scale.set(isSuper ? 0.05 : 0.03, isSuper ? 0.05 : 0.03, isSuper ? 0.05 : 0.03); // Adjust scale
                        this.model = m; // Replace with loaded model
                        this.model.userData.isSuperStar = isSuper;
                        this.model.userData.starId = id;
                        scene.add(this.model);
                    }
                });
            }

            collect() {
                this.isCollected = true;
                this.model.visible = false;
                scene.remove(this.model); // Remove from scene immediately
                if (!this.isSuper) {
                    this.respawnTimer = STATIC_STAR_RESPAWN_TIME; // Start respawn timer for static stars
                }
                playSoundSafe("coin_pickup");
            }

            respawn() {
                this.isCollected = false;
                this.model.visible = true;
                scene.add(this.model);
            }

            update(delta) {
                if (this.isCollected && this.respawnTimer > 0) {
                    this.respawnTimer -= delta;
                    if (this.respawnTimer <= 0) {
                        this.respawn();
                    }
                }
                if (this.model && this.model.visible) {
                    this.model.rotation.y += Math.PI * delta; // Spin
                    if (this.isSuper) {
                        this.model.scale.x = this.model.scale.y = this.model.scale.z = 0.05 + Math.sin(clock.getElapsedTime() * 5) * 0.01; // Pulse
                    }
                }
            }
        }

        function createStaticStar(x, y, z, id) {
            staticStars.push(new Star(x, y + 0.5, z, id)); // Lift slightly above platform
        }

        function createSuperStar(x, y, z) {
            if (superStar) {
                scene.remove(superStar.model);
            }
            superStar = new Star(x, y + 0.5, z, -1, true); // -1 for super star ID
        }

        // --- PARTICLE EFFECT (CONFETTI) ---
        class Particle {
            constructor(position, velocity, color, lifetime) {
                this.position = position.clone();
                this.velocity = velocity.clone();
                this.color = new Color(color);
                this.lifetime = lifetime;
                this.age = 0;

                this.mesh = new Mesh(new SphereGeometry(0.05, 4, 4), new MeshBasicMaterial({ color: this.color }));
                this.mesh.position.copy(this.position);
                scene.add(this.mesh);
            }

            update(delta) {
                this.age += delta;
                if (this.age >= this.lifetime) {
                    scene.remove(this.mesh);
                    return false; // Indicate particle is dead
                }
                this.velocity.y += GRAVITY * 0.5 * delta; // Lighter gravity for confetti
                this.position.add(this.velocity.clone().multiplyScalar(delta));
                this.mesh.position.copy(this.position);
                this.mesh.material.opacity = 1 - (this.age / this.lifetime);
                this.mesh.material.transparent = true;
                return true; // Indicate particle is alive
            }
        }

        function spawnConfetti(position, count, colors) {
            playSoundSafe("pop");
            for (let i = 0; i < count; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                const velocity = new Vector3(
                    (Math.random() - 0.5) * 5, // Random X speed
                    3 + Math.random() * 4, // Upwards Y speed
                    (Math.random() - 0.5) * 5 // Random Z speed
                );
                particles.push(new Particle(position, velocity, color, PARTICLE_LIFETIME));
            }
        }

        // --- IN-WORLD HEART DISPLAY ---
        function updateInWorldHearts(player) {
            if (!player.model || !player.model.heartGroup) return;

            player.model.heartGroup.children.forEach(child => scene.remove(child)); // Remove old hearts
            player.model.heartGroup.children = [];

            const heartScale = 0.3;
            const heartSpacing = 0.4;
            const heartWidth = heartGeometry.parameters.radius * heartScale;

            const heartsLoaded = []; // To keep track of heart models that are loading

            for (let i = 0; i < INITIAL_HEARTS; i++) {
                const heartColor = i < player.hearts ? 0xFF0000 : 0x808080; // Red for full, gray for empty
                const heartMesh = new Mesh(heartGeometry, new MeshStandardMaterial({ color: heartColor, emissive: heartColor, emissiveIntensity: 0.5 }));
                heartMesh.scale.set(heartScale, heartScale, heartScale);
                heartMesh.position.x = (i - (INITIAL_HEARTS - 1) / 2) * heartSpacing;
                heartMesh.rotation.x = Math.PI / 2; // Point up

                player.model.heartGroup.add(heartMesh);

                // Load real heart model
                const currentHeartIndex = i;
                heartsLoaded[currentHeartIndex] = false; // Mark as not loaded yet
                loadModel(HEART_MODEL).then((m) => {
                    if (m && player.model && player.model.heartGroup) {
                        const existingPlaceholder = player.model.heartGroup.children.find(h => h === heartMesh);
                        if (existingPlaceholder) {
                            player.model.heartGroup.remove(existingPlaceholder); // Remove placeholder
                        }

                        m.scale.set(0.015, 0.015, 0.015); // Adjust scale for model
                        m.rotation.x = Math.PI / 2; // Adjust rotation
                        m.position.x = (currentHeartIndex - (INITIAL_HEARTS - 1) / 2) * heartSpacing;
                        m.traverse((child) => {
                            if (child.isMesh) {
                                // Only change material if heart is 'full'
                                if (currentHeartIndex < player.hearts) {
                                    child.material = new MeshStandardMaterial({
                                        color: 0xFF0000,
                                        emissive: 0xFF0000,
                                        emissiveIntensity: 0.8
                                    });
                                } else {
                                    child.material = new MeshStandardMaterial({
                                        color: 0x808080,
                                        emissive: 0x404040,
                                        emissiveIntensity: 0.5
                                    });
                                }
                            }
                        });
                        player.model.heartGroup.add(m);
                        heartsLoaded[currentHeartIndex] = true;
                    }
                });
            }
        }


        // --- MAIN GAME LOOP ---
        let lastFrameTime = 0;
        function animate(now) {
            if (!on) {
                // If game is paused, still render the current state
                renderer.render(scene, camera);
                requestAnimationFrame(animate);
                return;
            }

            // Cap to 60fps
            const minFrameTime = 1000 / 60; // 16.67ms
            if (now - lastFrameTime < minFrameTime) {
                requestAnimationFrame(animate);
                return;
            }
            const delta = Math.min(0.05, clock.getDelta()); // Cap delta to prevent huge jumps

            lastFrameTime = now;

            if (gameMode === 'game') {
                updateGame(delta);
            } else if (gameMode === 'menu' || gameMode === 'options' || gameMode === 'char_select' || gameMode === 'player_count_select' || gameMode === 'results') {
                // Animate background elements in menus
                scene.children.forEach(obj => {
                    if (obj.isMesh && obj.geometry.type === 'SphereGeometry' && obj.material.color.equals(new Color(0xF0F8FF))) { // It's a cloud
                        obj.position.x += obj.userData.speed * delta;
                        if (obj.position.x > 50) obj.position.x = -50;
                    }
                });
                renderer.render(scene, camera);
            }

            requestAnimationFrame(animate);
        }

        function updateGame(delta) {
            if (gameOver) return;

            updatePlayerInput();

            // --- PLAYER MOVEMENT ---
            players.forEach(player => {
                if (player.isDead) {
                    player.respawnTimer -= delta;
                    if (player.respawnTimer <= 0) {
                        player.isDead = false;
                        player.hearts = 2; // Respawn with 2 hearts
                        player.velocity.set(0, 0, 0);
                        player.invincibilityTimer = INVINCIBILITY_DURATION * 2; // Brief invincibility after respawn
                        // Find a safe spawn point
                        const spawnPlatform = platforms[0]; // Central platform
                        player.position.set(spawnPlatform.position.x, spawnPlatform.position.y + PLAYER_HEIGHT / 2 + 0.1, spawnPlatform.position.z);
                        player.model.position.copy(player.position);
                        player.model.visible = true;
                        updatePlayerHeartsDisplay(player);
                        updateInWorldHearts(player);
                        playSoundSafe("confirm");
                    }
                    return; // Skip movement for dead players
                }

                // Invincibility flicker
                if (player.invincibilityTimer > 0) {
                    player.invincibilityTimer -= delta;
                    player.model.visible = Math.floor(player.invincibilityTimer * 10) % 2 === 0; // Blink effect
                } else {
                    player.model.visible = true;
                }

                // Super Star effect
                let currentSpeed = PLAYER_SPEED;
                if (player.superStarEffectTimer > 0) {
                    player.superStarEffectTimer -= delta;
                    currentSpeed *= SUPER_STAR_SPEED_MULTIPLIER;
                    // Pulse player model color slightly
                    player.model.traverse((child) => {
                        if (child.isMesh && child.material.isMeshStandardMaterial) {
                            child.material.emissiveIntensity = 0.5 + Math.sin(clock.getElapsedTime() * 10) * 0.2;
                        }
                    });
                } else {
                    player.model.traverse((child) => {
                        if (child.isMesh && child.material.isMeshStandardMaterial) {
                            child.material.emissiveIntensity = 0.3; // Reset
                        }
                    });
                }


                const moveDirection = new Vector3();
                if (player.input.up) moveDirection.z -= 1;
                if (player.input.down) moveDirection.z += 1;
                if (player.input.left) moveDirection.x -= 1;
                if (player.input.right) moveDirection.x += 1;
                moveDirection.normalize(); // Ensure consistent speed diagonally

                // Dash
                if (player.input.dash && player.dashCooldown <= 0 && moveDirection.lengthSq() > 0) {
                    player.dashActive = true;
                    player.dashDirection.copy(moveDirection);
                    player.dashTimer = DASH_DURATION;
                    player.dashCooldown = DASH_COOLDOWN; // Start cooldown
                    playSoundSafe("whoosh");
                }

                if (player.dashActive) {
                    player.dashTimer -= delta;
                    if (player.dashTimer > 0) {
                        player.position.add(player.dashDirection.clone().multiplyScalar(DASH_DISTANCE / DASH_DURATION * delta));
                    } else {
                        player.dashActive = false;
                    }
                } else {
                    // Normal movement
                    if (moveDirection.lengthSq() > 0) {
                        const targetRotation = Math.atan2(moveDirection.x, moveDirection.z);
                        player.rotationY = targetRotation;
                        player.velocity.x = moveDirection.x * currentSpeed;
                        player.velocity.z = moveDirection.z * currentSpeed;
                        if (player.action) player.action.setEffectiveWeight(1); // Play walk/run animation
                    } else {
                        player.velocity.x = 0;
                        player.velocity.z = 0;
                        if (player.action) player.action.setEffectiveWeight(0); // Stop walk/run animation
                    }
                }

                // Apply platform velocity if standing on one
                const platformUnder = getPlatformUnderPlayer(player);
                if (platformUnder && platformUnder.isMoving && player.isGrounded) {
                    const platformVel = new Vector3();
                    if (platformUnder.axis === 'x') {
                        platformVel.x = platformUnder.moveDirection * PLATFORM_MOVE_SPEED;
                    } else {
                        platformVel.z = platformUnder.moveDirection * PLATFORM_MOVE_SPEED;
                    }
                    player.position.add(platformVel.multiplyScalar(delta));
                    player.velocity.add(platformVel); // Player retains velocity when jumping off
                }


                // Apply gravity
                player.velocity.y += GRAVITY * delta;
                if (player.velocity.y < 0) {
                    player.velocity.y *= FALL_MULTIPLIER; // Fall faster
                }

                // Jumping
                if (player.input.jump && (player.isGrounded || player.coyoteTimeActive)) {
                    player.velocity.y = JUMP_VELOCITY;
                    player.isGrounded = false;
                    player.coyoteTimeActive = false;
                    playSoundSafe("jump");
                } else if (!player.input.jump && player.velocity.y > 0) {
                    player.velocity.y *= 0.5; // Variable jump height
                }


                player.position.add(player.velocity.clone().multiplyScalar(delta));

                // Ground collision detection
                let onSolidGround = false;
                let landingPlatform = null;
                const playerBottomY = player.position.y - PLAYER_HEIGHT / 2;

                for (const platform of platforms) {
                    const platformTopY = platform.position.y + platform.geometry.parameters.height / 2;
                    const platformHalfWidthX = platform.geometry.parameters.width / 2;
                    const platformHalfWidthZ = platform.geometry.parameters.depth / 2;

                    // Check if player is above the platform
                    if (player.position.y > platformTopY) {
                        // Check if player's XZ falls within platform's XZ
                        if (player.position.x + PLAYER_RADIUS > platform.position.x - platformHalfWidthX &&
                            player.position.x - PLAYER_RADIUS < platform.position.x + platformHalfWidthX &&
                            player.position.z + PLAYER_RADIUS > platform.position.z - platformHalfWidthZ &&
                            player.position.z - PLAYER_RADIUS < platform.position.z + platformHalfWidthZ) {
                            // Check for landing
                            if (playerBottomY <= platformTopY && player.velocity.y < 0) {
                                player.position.y = platformTopY + PLAYER_HEIGHT / 2; // Snap to top
                                player.velocity.y = 0;
                                onSolidGround = true;
                                landingPlatform = platform;
                                break;
                            }
                        }
                    }
                }

                if (onSolidGround) {
                    if (!player.isGrounded) { // Just landed
                        player.isGrounded = true;
                        player.coyoteTimeActive = false;
                    }
                } else {
                    if (player.isGrounded) { // Just left ground
                        player.isGrounded = false;
                        player.lastJumpTime = clock.getElapsedTime(); // Record time of leaving ground
                    }
                    if (!player.isGrounded && (clock.getElapsedTime() - player.lastJumpTime < COYOTE_TIME)) {
                        player.coyoteTimeActive = true;
                    } else {
                        player.coyoteTimeActive = false;
                    }
                }

                // Fall off world detection
                if (player.position.y < -10) {
                    player.hearts = 0; // Instantly lose all hearts
                    handlePlayerHit(player, null); // Trigger respawn logic
                }

                player.model.position.copy(player.position);
                player.model.rotation.y = player.rotationY; // Update model rotation
                if (player.mixer) player.mixer.update(delta); // Update character animations

                // Dash cooldown
                if (player.dashCooldown > 0) {
                    player.dashCooldown -= delta;
                }

                // Attack
                if (player.input.attack) {
                    // Implement attack logic based on character type
                    // For now, simple melee-like attack
                    if (player.character === 'sora' || player.character === 'brutus') {
                        // Melee attack
                        handleMeleeAttack(player);
                    } else if (player.character === 'zara' || player.character === 'pip') {
                        // Projectile attack
                        handleProjectileAttack(player);
                    }
                    player.input.attack = false; // Consume attack input
                }
            });

            // --- PLATFORM MOVEMENT ---
            platforms.forEach(platform => {
                if (platform.isMoving) {
                    const travelOffset = platform.axis === 'x' ? platform.position.x - platform.initialPosition.x : platform.position.z - platform.initialPosition.z;

                    if (travelOffset * platform.moveDirection >= platform.travelDistance / 2) {
                        platform.moveDirection *= -1; // Reverse direction
                    } else if (travelOffset * platform.moveDirection <= -platform.travelDistance / 2) {
                        platform.moveDirection *= -1; // Reverse direction
                    }

                    if (platform.axis === 'x') {
                        platform.position.x += platform.moveDirection * PLATFORM_MOVE_SPEED * delta;
                    } else {
                        platform.position.z += platform.moveDirection * PLATFORM_MOVE_SPEED * delta;
                    }
                    platform.updateMatrixWorld(); // Important for bounds and children
                    platform.bounds.setFromObject(platform); // Update bounds
                }
            });

            // --- ENEMY MOVEMENT ---
            enemies.forEach(enemy => {
                if (!enemy.alive) return;

                const travelOffset = enemy.patrolAxis === 'x' ? enemy.position.x - enemy.initialPosition.x : enemy.position.z - enemy.initialPosition.z;

                if (travelOffset * enemy.patrolDirection >= ENEMY_PATROL_DISTANCE / 2) {
                    enemy.patrolDirection *= -1; // Reverse direction
                    enemy.model.rotation.y += Math.PI; // Turn around
                } else if (travelOffset * enemy.patrolDirection <= -ENEMY_PATROL_DISTANCE / 2) {
                    enemy.patrolDirection *= -1; // Reverse direction
                    enemy.model.rotation.y += Math.PI; // Turn around
                }

                if (enemy.patrolAxis === 'x') {
                    enemy.position.x += enemy.patrolDirection * enemy.speed * delta;
                } else {
                    enemy.position.z += enemy.patrolDirection * enemy.speed * delta;
                }
                enemy.model.position.copy(enemy.position);
                enemy.bounds.setFromObject(enemy.model);
                if (enemy.mixer) enemy.mixer.update(delta);
            });

            // --- PROJECTILE MOVEMENT ---
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const proj = projectiles[i];
                proj.position.add(proj.velocity.clone().multiplyScalar(delta));
                proj.model.position.copy(proj.position);

                let hitSomething = false;
                // Check collision with enemies
                for (const enemy of enemies) {
                    if (enemy.alive && proj.position.distanceTo(enemy.position) < PLAYER_RADIUS + 0.5) { // Simple sphere collision
                        hitSomething = true;
                        handleEnemyHit(enemy, proj.owner);
                        break;
                    }
                }

                // Check collision with platforms (simple ground collision)
                if (proj.position.y < -0.2) { // Goes below ground
                    hitSomething = true;
                }

                if (hitSomething) {
                    scene.remove(proj.model);
                    projectiles.splice(i, 1);
                }
            }

            // --- STAR & SUPER STAR UPDATE ---
            staticStars.forEach(star => star.update(delta));
            if (superStar) superStar.update(delta);

            superStarTimer -= delta;
            if (superStarTimer <= 0) {
                createSuperStar(platforms[0].position.x, platforms[0].position.y + platforms[0].geometry.parameters.height / 2, platforms[0].position.z);
                superStarTimer = SUPER_STAR_SPAWN_INTERVAL;
            }

            // --- COLLECTING STARS ---
            players.forEach(player => {
                if (player.isDead) return;

                // Collect static stars
                for (let i = staticStars.length - 1; i >= 0; i--) {
                    const star = staticStars[i];
                    if (!star.isCollected && player.position.distanceTo(star.position) < PLAYER_RADIUS + star.model.scale.x) {
                        player.stars++;
                        updatePlayerStarsDisplay(player);
                        star.collect();
                        if (player.stars >= MAX_STARS_TO_WIN) {
                            endMatch(player);
                            return;
                        }
                    }
                }

                // Collect enemy-dropped stars (simple, they stay until collected)
                const droppedStars = scene.children.filter(obj => obj.userData.isDroppedStar);
                for (let i = droppedStars.length - 1; i >= 0; i--) {
                    const droppedStar = droppedStars[i];
                    if (player.position.distanceTo(droppedStar.position) < PLAYER_RADIUS + droppedStar.scale.x) {
                        player.stars++;
                        updatePlayerStarsDisplay(player);
                        scene.remove(droppedStar);
                        droppedStars.splice(i, 1); // Remove from temp list
                        playSoundSafe("coin_pickup");
                        if (player.stars >= MAX_STARS_TO_WIN) {
                            endMatch(player);
                            return;
                        }
                    }
                }

                // Collect Super Star
                if (superStar && superStar.model.visible && player.position.distanceTo(superStar.position) < PLAYER_RADIUS + superStar.model.scale.x) {
                    player.superStarEffectTimer = SUPER_STAR_EFFECT_DURATION; // Reset duration
                    superStar.collect(); // Make it disappear
                    superStar = null; // Mark as collected
                    superStarTimer = SUPER_STAR_SPAWN_INTERVAL; // Reset super star spawn timer
                    playSoundSafe("powerup");
                }
            });

            // --- PARTICLE UPDATE ---
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update(delta)) {
                    particles.splice(i, 1);
                }
            }

            // --- TIMER ---
            currentMatchTime -= delta;
            if (currentMatchTime <= 0) {
                currentMatchTime = 0;
                endMatch(null); // Time's up
            }
            const minutes = Math.floor(currentMatchTime / 60);
            const seconds = Math.floor(currentMatchTime % 60);
            timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            // --- CAMERA FOLLOW ---
            let leader = players[0];
            let maxStars = -1;
            let leaders = [];

            if (numPlayers > 0) {
                // Determine leader(s)
                players.forEach(p => {
                    if (p.stars > maxStars) {
                        maxStars = p.stars;
                        leader = p;
                        leaders = [p];
                    } else if (p.stars === maxStars && maxStars !== -1) {
                        leaders.push(p);
                    }
                });

                let targetPosition;
                if (leaders.length > 1) { // Average position for tied leaders
                    targetPosition = new Vector3();
                    leaders.forEach(p => targetPosition.add(p.position));
                    targetPosition.divideScalar(leaders.length);
                } else {
                    targetPosition = leader.position;
                }

                let maxDistance = 0;
                for (let i = 0; i < players.length; i++) {
                    for (let j = i + 1; j < players.length; j++) {
                        const dist = players[i].position.distanceTo(players[j].position);
                        if (dist > maxDistance) maxDistance = dist;
                    }
                }

                let zoomFactor = 1;
                if (maxDistance > CAMERA_ZOOM_THRESHOLD) {
                    zoomFactor = Math.min(CAMERA_MAX_ZOOM_OUT, maxDistance / CAMERA_ZOOM_THRESHOLD);
                }

                const cameraDistance = CAMERA_DEFAULT_DISTANCE * zoomFactor;

                camera.position.x = MathUtils.lerp(camera.position.x, targetPosition.x, 0.1);
                camera.position.y = MathUtils.lerp(camera.position.y, targetPosition.y + 10, 0.1); // Keep camera above
                camera.position.z = MathUtils.lerp(camera.position.z, targetPosition.z + cameraDistance, 0.1);
                camera.lookAt(targetPosition.x, targetPosition.y + 2, targetPosition.z); // Look slightly above target
            }

            // Render the scene
            renderer.render(scene, camera);
        }

        // --- ATTACK MECHANICS ---
        function handleMeleeAttack(attacker) {
            const attackRange = 1.5; // distance for melee
            const attackArc = Math.PI / 2; // 90 degree forward arc

            // Calculate attack direction vector
            const attackDir = new Vector3(Math.sin(attacker.rotationY), 0, Math.cos(attacker.rotationY));

            enemies.forEach(enemy => {
                if (!enemy.alive || enemy.isDead) return;

                const enemyToAttacker = new Vector3().subVectors(enemy.position, attacker.position);
                const distance = enemyToAttacker.length();

                if (distance < attackRange + PLAYER_RADIUS) { // Check radial distance
                    const angle = Math.abs(attackDir.angleTo(enemyToAttacker.normalize()));
                    if (angle < attackArc / 2) { // Check if within forward arc
                        handleEnemyHit(enemy, attacker);
                        // Melee attack animation feedback
                        if (attacker.weaponModel) {
                            // Simple rotation for sword/hammer swing
                            attacker.weaponModel.rotation.x = Math.PI / 2;
                            setTimeout(() => attacker.weaponModel.rotation.x = 0, 100);
                        }
                    }
                }
            });
        }

        function handleProjectileAttack(attacker) {
            const projectileSpeed = 20; // meters per second
            const projectileLifetime = 2; // seconds

            const projectileColor = new Color(attacker.color);
            const projectileGeometry = new SphereGeometry(0.2, 8, 8);
            const projectileMaterial = new MeshStandardMaterial({
                color: projectileColor,
                emissive: projectileColor,
                emissiveIntensity: 2
            });
            const projectileMesh = new Mesh(projectileGeometry, projectileMaterial);

            // Projectile initial position slightly in front of player
            const spawnOffset = new Vector3(Math.sin(attacker.rotationY) * (PLAYER_RADIUS + 0.5), 0.5, Math.cos(attacker.rotationY) * (PLAYER_RADIUS + 0.5));
            projectileMesh.position.copy(attacker.position).add(spawnOffset);

            const projectileVelocity = new Vector3(
                Math.sin(attacker.rotationY) * projectileSpeed,
                2, // Shoot slightly upwards
                Math.cos(attacker.rotationY) * projectileSpeed
            );

            const projectile = {
                model: projectileMesh,
                position: projectileMesh.position,
                velocity: projectileVelocity,
                owner: attacker,
                lifetime: projectileLifetime,
                age: 0
            };
            projectiles.push(projectile);
            scene.add(projectileMesh);
            playSoundSafe("laser");
        }

        function handleEnemyHit(enemy, attacker) {
            if (!enemy.alive) return; // Already defeated

            enemy.alive = false; // Defeat enemy
            scene.remove(enemy.model);

            // Spawn star pickup at enemy death location
            const droppedStarColor = new Color(0xFFEC8B);
            const droppedStarMesh = new Mesh(starGeometry, new MeshStandardMaterial({
                color: droppedStarColor,
                emissive: droppedStarColor,
                emissiveIntensity: 1
            }));
            droppedStarMesh.position.copy(enemy.position);
            droppedStarMesh.scale.set(0.4, 0.4, 0.4);
            droppedStarMesh.userData.isDroppedStar = true; // Custom flag
            scene.add(droppedStarMesh);

            // Load real star model
            loadModel(STAR_MODEL).then((m) => {
                if (m && droppedStarMesh) {
                    scene.remove(droppedStarMesh); // Remove placeholder
                    m.position.copy(droppedStarMesh.position);
                    m.scale.set(0.03, 0.03, 0.03); // Adjust scale
                    m.userData.isDroppedStar = true;
                    droppedStarMesh = m; // Replace reference for update logic
                    scene.add(droppedStarMesh);
                }
            });


            // Confetti effect
            spawnConfetti(enemy.position, PARTICLE_COUNT_HIT, [0xFF0000, 0x00FF00, 0x0000FF, 0xFFFF00, 0xFF00FF]); // Bright colors
            playSoundSafe("hit");
        }

        function handlePlayerHit(player, attacker) {
            if (player.invincibilityTimer > 0) return;

            player.hearts--;
            updatePlayerHeartsDisplay(player);
            updateInWorldHearts(player);
            playSoundSafe("hit");

            if (player.hearts <= 0) {
                player.isDead = true;
                player.model.visible = false;
                player.respawnTimer = RESPAWN_TIME;
                // Confetti burst for player "poof"
                spawnConfetti(player.position, PARTICLE_COUNT_HIT * 2, [
                    (new Color(player.color)).getHex(),
                    (new Color(player.color)).offsetHSL(0.1, 0, 0).getHex(),
                    (new Color(player.color)).offsetHSL(-0.1, 0, 0).getHex(),
                ]);
            } else {
                player.invincibilityTimer = INVINCIBILITY_DURATION;
                // Knockback
                if (attacker && attacker.position) {
                    const knockbackDir = new Vector3().subVectors(player.position, attacker.position).normalize();
                    player.velocity.add(knockbackDir.multiplyScalar(5)); // Apply knockback force
                    player.velocity.y += 3; // Slight upward knockback
                }
            }

            // Check for simultaneous death
            if (numPlayers > 1) {
                const alivePlayers = players.filter(p => !p.isDead);
                if (alivePlayers.length === 0) {
                    resetMatchFull();
                }
            } else if (numPlayers === 1 && player.hearts <= 0) {
                endMatch(null); // Single player defeat
            }
        }


        // --- MATCH ENDING ---
        function endMatch(winner) {
            gameOver = true;
            let message = "";
            let newCumulativeStars = loadCumulativeStars();

            if (winner) {
                message = `${winner.character} wins with ${winner.stars} stars!`;
                // Add stars to cumulative total for unlocks
                players.forEach(p => newCumulativeStars += p.stars);
                saveCumulativeStars(newCumulativeStars);
                playSoundSafe("jingle_win");
            } else if (currentMatchTime <= 0) {
                if (numPlayers === 1) {
                    if (players[0].stars >= MAX_STARS_TO_WIN) {
                        message = `${players[0].character} wins with ${players[0].stars} stars!`;
                        newCumulativeStars += players[0].stars;
                        saveCumulativeStars(newCumulativeStars);
                        playSoundSafe("jingle_win");
                    } else {
                        message = "Time's up! You needed 10 stars to win in Single Player. Game Over!";
                        playSoundSafe("game_over");
                    }
                } else {
                    // Multiplayer, time's up logic
                    let maxStars = 0;
                    players.forEach(p => {
                        if (p.stars > maxStars) maxStars = p.stars;
                    });
                    const topScorers = players.filter(p => p.stars === maxStars);

                    if (topScorers.length === 1) {
                        message = `${topScorers[0].character} wins with ${topScorers[0].stars} stars!`;
                        topScorers.forEach(p => newCumulativeStars += p.stars);
                        saveCumulativeStars(newCumulativeStars);
                        playSoundSafe("jingle_win");
                    } else {
                        message = "Time's up! It's a draw!";
                        playSoundSafe("game_over");
                    }
                }
            } else { // Fallback, e.g. single player defeat without time running out (like falling out of world)
                message = "Game Over!";
                playSoundSafe("game_over");
            }

            resultsMessage.textContent = message;
            setGameState('results');
        }

        // --- WINDOW RESIZE ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start everything!
        init();
    </script>
</body>
</html>
